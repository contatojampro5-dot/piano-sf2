POL.STORIES={
p1:{conf:"explicar a diferença entre esquerda e direita",
 mis:"Pergunte a alguém da sua família: “Você acha que o ser humano é bom por natureza?” Ouça a resposta e depois conte de onde vêm os nomes esquerda e direita.",
 s:[
 {k:"mentor",t:"Shalom! Eu sou Samuel. Deus me chamou quando eu ainda era menino (1 Sm 3). Quando o povo pediu um rei, avisei de tudo o que um governo poderoso tomaria das famílias (1 Sm 8). Vamos começar pelo começo?"},
 {k:"txt",tag:"1789",h:"Uma questão de lugar",p:"Na Assembleia da Revolução Francesa, quem queria mudanças radicais sentava à **esquerda**. Quem defendia a monarquia, a religião e as instituições sentava à **direita**. Os nomes pegaram."},
 {k:"txt",h:"Mais fundo que um partido",p:"O economista Thomas Sowell mostrou que a diferença vem de duas **visões do ser humano**. Quase toda briga política nasce daí."},
 {k:"match",h:"Ligue cada visão ao que ela pensa",pairs:[["Visão restrita","o ser humano é limitado e falho"],["Visão irrestrita","a sociedade pode ser refeita do zero"],["Por isso, a direita","quer freios ao poder"],["Por isso, a esquerda","quer planejar a sociedade"]]},
 {k:"txt",h:"A Bíblia tem algo a dizer",p:"Somos feitos à imagem de Deus, mas caídos (Rm 3.23). Por isso **ninguém merece poder sem limites**, nem o rei, nem o povo, nem você."},
 {k:"tf",q:"Esquerda e direita surgiram como nomes de partidos no Brasil.",a:false,e:"Os nomes vêm de onde os deputados sentavam na França, em 1789."},
 {k:"pick",q:"Por que a visão restrita desconfia de quem promete criar o paraíso na terra?",o:["Porque quem manda também é humano e falho","Porque não gosta de mudanças","Porque prefere os ricos"],c:0,e:"Quem promete o paraíso costuma pedir poder total para construí-lo."},
 {k:"verse"},
 {k:"chat",who:"Bia",c:"#D6336C",q:"Esquerda é quem se importa com os pobres e direita é quem só pensa em dinheiro, né?",o:[
  {t:"Os dois lados dizem querer o bem dos pobres. A diferença é o caminho: a direita acha que trabalho, família e liberdade tiram mais gente da pobreza do que o governo controlando tudo.",v:2,r:"Hm, nunca tinha pensado que era uma briga de caminho, não de intenção.",tip:"Ótimo: você discutiu ideias sem acusar ninguém de maldade."},
  {t:"Não é bem assim, tem gente boa nos dois lados.",v:1,r:"Tá, mas então qual é a diferença?",tip:"Verdade, mas faltou explicar a diferença de fato: as duas visões do ser humano."},
  {t:"Esquerda é tudo comunista e pronto.",v:0,r:"Nossa, que agressivo 😬",tip:"Rótulo fecha a conversa. Explique a ideia."}]},
 {k:"mentor",t:"Grave isto: a pergunta “o ser humano é bom ou falho?” está por trás de quase tudo. Quem entende isso entende a política."}
 ]},

p2:{conf:"explicar o que um conservador quer conservar",
 mis:"Escolha uma tradição da sua família ou da sua igreja e descubra com alguém mais velho por que ela começou.",
 s:[
 {k:"txt",h:"Conservar o quê?",p:"Conservador não é quem odeia tudo o que é novo. É quem quer **guardar o que funciona** enquanto melhora o resto, com prudência."},
 {k:"txt",tag:"1790",h:"Edmund Burke",p:"Deputado irlandês no Parlamento britânico. Em 1790, logo no início da Revolução Francesa, previu que ela acabaria em terror e tirania. Acertou: veio o Terror e depois Napoleão."},
 {k:"quote",t:"A sociedade é um contrato entre os que estão vivos, os que já morreram e os que ainda vão nascer.",by:"Edmund Burke, Reflexões sobre a Revolução na França (1790), em resumo"},
 {k:"txt",h:"A cerca de Chesterton",p:"Você acha uma cerca no meio da estrada e quer tirá-la. O sábio diz: **antes descubra por que ela foi posta ali**. Depois, se ainda fizer sentido, derrube."},
 {k:"pick",q:"Diante de uma tradição que parece sem sentido, o conservador:",o:["Derruba na hora","Primeiro entende por que ela existe","Proíbe qualquer discussão"],c:1,e:"É a lição da cerca: entender antes de mudar."},
 {k:"list",h:"Os pequenos pelotões",items:["Família","Igreja","Vizinhança","Escola e associações"]},
 {k:"txt",h:"Onde se aprende a amar",p:"Burke dizia que é nesses pequenos grupos que aprendemos a amar a sociedade. Quando o Estado toma o lugar deles, as pessoas ficam **sozinhas diante do governo**."},
 {k:"tf",q:"Para o conservador, nenhuma mudança é bem-vinda.",a:false,e:"Burke defendeu reformas. O que ele rejeitava era a revolução que derruba tudo de uma vez."},
 {k:"verse"},
 {k:"chat",who:"Rafa",c:"#1C7ED6",q:"Conservador é quem quer voltar para o passado, né? Tipo, parar no tempo.",o:[
  {t:"Não. É quem quer mudar com cuidado, sem jogar fora o que gerações levaram séculos para acertar, como a família e a liberdade de crença.",v:2,r:"Faz sentido. É tipo não reformar a casa derrubando os pilares.",tip:"Isso! Mudança prudente, não parada no tempo."},
  {t:"Ah, mas o passado era melhor mesmo.",v:1,r:"Até a escravidão era melhor? 🤨",tip:"Cuidado: o passado teve males graves. Conservar é escolher o que deu certo."},
  {t:"Você não entende nada, deixa pra lá.",v:0,r:"Beleza, então.",tip:"Desprezo encerra a conversa e não convence ninguém."}]},
 {k:"mentor",t:"Eu ergui uma pedra e dei a ela o nome de Ebenézer: “até aqui nos ajudou o Senhor” (1 Sm 7.12). Lembrar o caminho é o que ajuda a seguir em frente."}
 ]},

p3:{conf:"explicar por que a liberdade econômica tira pessoas da pobreza",
 mis:"Pegue um objeto da sua casa, como um lápis ou um celular, e conte para alguém quantas pessoas, de quantos países, ajudaram a fazê-lo sem se conhecerem.",
 s:[
 {k:"txt",tag:"1776",h:"Adam Smith",p:"Professor escocês de filosofia moral. Em A riqueza das nações, mostrou que, quando as pessoas trocam livremente, cada uma buscando servir o outro para ganhar o seu, **a sociedade toda enriquece**."},
 {k:"txt",h:"A mão invisível",p:"O padeiro não faz pão por caridade, mas por trabalho. Mesmo assim, você toma café da manhã. Ninguém planejou tudo, e funciona."},
 {k:"big",n:"38% → 9%",p:"Queda da extrema pobreza no mundo de 1990 a 2019, segundo o Banco Mundial, com a abertura econômica de países como China e Índia."},
 {k:"txt",h:"Hayek e o conhecimento",p:"Nenhum governo sabe o que milhões de pessoas sabem sobre suas vidas. Os **preços** passam essa informação. Quando o governo manda nos preços, a informação some."},
 {k:"verse"},
 {k:"txt",h:"A propriedade na Bíblia",p:"“Não furtarás” só faz sentido se existe aquilo que é seu. Quando o rei Acabe tomou a vinha de Nabote, Deus mandou Elias condená-lo (1 Rs 21)."},
 {k:"tf",q:"Defender o mercado livre é defender que não haja nenhuma regra.",a:false,e:"Mercado livre precisa de leis: contratos cumpridos, propriedade protegida e punição para a fraude."},
 {k:"order",h:"Do trabalho à prosperidade",items:["Alguém tem uma ideia e trabalha","Troca livremente com outros","Lucra servindo bem","Investe e cria empregos"],e:"O lucro honesto é o sinal de que você serviu alguém."},
 {k:"chat",who:"Duda",c:"#7048E8",q:"Capitalismo só deixa o rico mais rico e o pobre mais pobre.",o:[
  {t:"Os dados dizem o contrário: a extrema pobreza caiu de 38% para menos de 9% em 30 anos, justamente onde houve mais liberdade econômica. O problema é o rico que se aproveita do governo, não o que cria empresa.",v:2,r:"Eu não sabia desse número. Vou pesquisar.",tip:"Dado com fonte e distinção justa. Excelente!"},
  {t:"Quem é pobre é porque não trabalha.",v:0,r:"Que absurdo, minha mãe trabalha 12 horas por dia!",tip:"Isso é falso e cruel. Muita gente pobre trabalha muito."},
  {t:"Ah, mas o socialismo é pior.",v:1,r:"Tá, mas isso não responde o que eu falei.",tip:"Pode ser verdade, mas responda primeiro o argumento dela, com dados."}]},
 {k:"mentor",t:"Liberdade com trabalho honesto foi o que tirou bilhões da pobreza. Defenda isso com números, não só com opinião."}
 ]},

p4:{conf:"explicar por que o governo precisa de limites",
 mis:"Leia 1 Samuel 8.10-18 com alguém e conversem: quais desses avisos ainda acontecem hoje?",
 s:[
 {k:"mentor",t:"Eu avisei o povo: um rei vai tomar seus filhos, seus campos e a décima parte de tudo, e vocês vão clamar (1 Sm 8.11-18). Eles insistiram mesmo assim. Vamos entender por quê?"},
 {k:"txt",h:"O governo não é o inimigo",p:"A Bíblia diz que a autoridade é **ministra de Deus para o bem**: punir o mal e proteger o inocente (Rm 13.4). O problema é quando ela quer ser tudo."},
 {k:"verse"},
 {k:"txt",tag:"1748",h:"Montesquieu",p:"Em O espírito das leis, o pensador francês defendeu dividir o poder: quem faz as leis, quem as executa e quem julga. Assim **o poder freia o poder**."},
 {k:"txt",h:"Subsidiariedade",p:"O que a família pode fazer, o governo não deve tomar. O que a cidade resolve, o país não deve centralizar. Ajuda de cima só quando de baixo não dá."},
 {k:"order",h:"Do menor para o maior",items:["Pessoa","Família","Comunidade e igreja","Município","Estado","União"],e:"Cada nível ajuda o de baixo, mas não toma o lugar dele."},
 {k:"bug",h:"Toque no trecho errado",parts:["O Estado deve proteger a vida,","punir o crime","e decidir o que as famílias devem crer."],w:2,e:"Crença é assunto da consciência e da família, não do governo."},
 {k:"tf",q:"Quanto maior o governo, mais liberdade as pessoas têm.",a:false,e:"Cada função que o governo assume é uma decisão que sai das mãos das pessoas."},
 {k:"chat",who:"Gui",c:"#0CA678",q:"Se o governo tivesse mais poder, ia resolver os problemas mais rápido, não?",o:[
  {t:"Talvez mais rápido, mas quem garante que o poder vai ser usado para o bem? Os governos com poder total do século XX mataram milhões. Por isso o poder é dividido: para ninguém mandar sozinho.",v:2,r:"É, se cair na mão errada, ninguém segura depois.",tip:"Perfeito: você mostrou o risco do poder sem freio."},
  {t:"Governo nenhum presta.",v:1,r:"Mas aí quem cuida da polícia e da justiça?",tip:"A Bíblia diz que a autoridade tem função legítima. O ponto é ter limites."},
  {t:"Isso é coisa de comunista.",v:0,r:"Eu só fiz uma pergunta…",tip:"Ele perguntou de boa-fé. Responda a ideia, não rotule a pessoa."}]},
 {k:"mentor",t:"Poder com limites protege até de nós mesmos. Defenda o governo que serve, não o que manda em tudo."}
 ]},

h1:{conf:"explicar de onde vêm as ideias de Marx",
 mis:"Pergunte a um amigo se ele já ouviu falar de “luta de classes”. Explique em 1 minuto o que Marx quis dizer, sem ironia e sem exagero.",
 s:[
 {k:"mentor",t:"Eu sou Elias. Enfrentei os 450 profetas de Baal no monte Carmelo e perguntei: “Até quando coxeareis entre dois pensamentos?” (1 Rs 18.21). Para não ser enganado, é preciso conhecer bem a ideia do outro."},
 {k:"txt",tag:"1762",h:"Rousseau",p:"O filósofo de Genebra ensinava que o homem **nasce bom** e é corrompido pela sociedade, pela propriedade e pela desigualdade. Era só refazer a sociedade que o ser humano voltaria a ser bom."},
 {k:"txt",tag:"1793",h:"O Terror",p:"Na Revolução Francesa, quem prometia a sociedade perfeita usou a guilhotina contra milhares de adversários. Primeira lição: **a promessa do paraíso justifica qualquer violência**."},
 {k:"txt",tag:"1848",h:"Karl Marx",p:"Com Engels, escreveu o Manifesto Comunista. Para ele, a história é uma **luta de classes**: patrões contra trabalhadores. O fim seria a revolução e uma sociedade sem classes e sem propriedade privada."},
 {k:"match",h:"Ligue o conceito ao que Marx dizia",pairs:[["Luta de classes","a história é a briga entre opressores e oprimidos"],["Mais-valia","a parte do trabalho que o patrão não pagaria"],["Ditadura do proletariado","o governo dos trabalhadores após a revolução"]]},
 {k:"txt",h:"Onde está o erro",p:"Marx reduz a pessoa à sua classe. A Bíblia diz que o mal está no coração de **todos**, ricos e pobres (Jr 17.9). Trocar quem manda não muda o coração humano."},
 {k:"tf",q:"Para Rousseau, o ser humano nasce mau e precisa de limites.",a:false,e:"Era o contrário: nasce bom e a sociedade o corrompe. É a visão irrestrita."},
 {k:"verse"},
 {k:"chat",who:"Lia",c:"#E8590C",q:"Mas Marx não estava certo de que os trabalhadores eram explorados naquela época?",o:[
  {t:"Muitos trabalhavam em condições terríveis, isso é verdade. Mas o remédio dele, tirar a propriedade e dar todo o poder ao Estado, piorou muito a vida de quem ele queria ajudar. As condições melhoraram foi com leis, crescimento e liberdade.",v:2,r:"Então o diagnóstico tinha algo de verdade, mas o remédio não.",tip:"Justo com o fato e firme na conclusão. Assim se debate."},
  {t:"Não, ninguém era explorado.",v:0,r:"Crianças trabalhavam 14 horas em fábricas…",tip:"Negar fatos reais te faz perder a credibilidade."},
  {t:"Não sei, nunca li Marx.",v:1,r:"Então como você critica?",tip:"Conhecer o outro lado é o objetivo deste nível. Agora você já sabe o básico."}]},
 {k:"mentor",t:"Conhecer a ideia não é concordar com ela. É poder mostrar, com justiça, onde ela erra."}
 ]},

h2:{conf:"contar o que aconteceu quando o comunismo chegou ao poder",
 mis:"Pesquise com sua família se alguém conhece um imigrante de Cuba, Venezuela ou do Leste Europeu. Se puder, ouça a história dele com respeito.",
 s:[
 {k:"txt",h:"Do papel para a realidade",p:"Ideias têm consequências. No século XX, o comunismo saiu dos livros e governou um terço da humanidade. Pelos frutos se conhece a árvore."},
 {k:"verse"},
 {k:"order",h:"Coloque em ordem",items:["Revolução Russa (1917)","Holodomor na Ucrânia (1932)","Revolução Chinesa (1949)","Revolução Cubana (1959)","Khmer Vermelho no Camboja (1975)"],e:"Em todos os casos, partido único, fim das liberdades e perseguição."},
 {k:"txt",tag:"1932",h:"O Holodomor",p:"Stalin tomou as terras e as colheitas dos camponeses ucranianos. Milhões morreram de fome em uma das regiões mais férteis do mundo."},
 {k:"txt",h:"O Grande Salto",p:"Na China, o plano de Mao (1958-1962) para industrializar à força causou uma das piores fomes da história, com dezenas de milhões de mortos."},
 {k:"big",n:"≈ 1/4",p:"da população do Camboja morreu sob o Khmer Vermelho, entre 1975 e 1979."},
 {k:"txt",h:"Por que sempre dá nisso?",p:"Hayek explicou em O caminho da servidão (1944): **planejar toda a economia exige controlar todas as pessoas**. Quem discorda vira obstáculo."},
 {k:"quote",t:"A linha que separa o bem e o mal não passa entre Estados, nem entre classes, nem entre partidos, mas atravessa cada coração humano.",by:"Alexander Soljenítsin, Arquipélago Gulag"},
 {k:"pick",q:"O que os regimes comunistas tiveram em comum?",o:["Partido único e perseguição aos que discordavam","Eleições livres e imprensa livre","Respeito à religião"],c:0,e:"Igrejas foram fechadas e cristãos presos em quase todos eles."},
 {k:"chat",who:"Theo",c:"#1971C2",q:"Mas aquilo não era comunismo de verdade. O comunismo de verdade nunca foi testado.",o:[
  {t:"Foi testado em dezenas de países, com culturas e povos diferentes, e o resultado foi parecido em todos. Quando o erro se repete em tudo, o problema é a ideia, não a aplicação.",v:2,r:"Hm. É estranho mesmo dar errado em todo lugar.",tip:"Ótimo argumento: a repetição mostra que o problema é a ideia."},
  {t:"Você é a favor de matar milhões então?",v:0,r:"Claro que não! Você está distorcendo.",tip:"Isso é espantalho. Responda o argumento dele."},
  {t:"Ah, sei lá.",v:1,r:"Viu? Não tem resposta.",tip:"Tem, sim: o teste aconteceu em vários países, com o mesmo resultado."}]},
 {k:"mentor",t:"Lembrar das vítimas é um dever. Quem esquece a história abre a porta para repeti-la."}
 ]},

h3:{conf:"explicar a estratégia cultural de Gramsci",
 mis:"Observe uma série, música ou conteúdo que você consome nesta semana e pergunte-se: que ideia de certo e errado isso está ensinando?",
 s:[
 {k:"txt",tag:"1926",h:"Antonio Gramsci",p:"Comunista italiano preso por Mussolini. Na prisão, escreveu os Cadernos do cárcere, perguntando: **por que a revolução não aconteceu no Ocidente?**"},
 {k:"txt",h:"A resposta dele",p:"No Ocidente, o povo era sustentado pela fé cristã, pela família e pela cultura. Antes de tomar o governo, seria preciso **conquistar a cultura**."},
 {k:"match",h:"Ligue o termo ao significado",pairs:[["Hegemonia","as ideias de um grupo viram o “normal”"],["Guerra de posição","ocupar escolas, imprensa e artes aos poucos"],["Guerra de movimento","o ataque direto, como a revolução russa"],["Intelectual orgânico","quem espalha as ideias do grupo"]]},
 {k:"txt",tag:"1923",h:"A Escola de Frankfurt",p:"Pensadores marxistas alemães, como Horkheimer, Adorno e Marcuse, criaram a **teoria crítica**: questionar a família, a religião e a cultura ocidental como formas de opressão."},
 {k:"txt",h:"E no Brasil",p:"Paulo Freire, em Pedagogia do oprimido (escrita em 1968), propôs uma educação para “conscientizar” o aluno da luta entre opressores e oprimidos. É o autor brasileiro mais citado em universidades."},
 {k:"tf",q:"Gramsci defendia que a revolução devia começar pela tomada do quartel.",a:false,e:"Era o contrário: primeiro a cultura, depois o poder."},
 {k:"verse"},
 {k:"bug",h:"Toque no trecho errado",parts:["Gramsci explica por que","a cultura importa tanto,","então todo professor é um agente comunista."],w:2,e:"Generalizar é injusto e falso. Conheça a estratégia sem acusar pessoas."},
 {k:"chat",who:"Nina",c:"#AE3EC9",q:"Isso de “marxismo cultural” não é teoria da conspiração?",o:[
  {t:"Gramsci e a Escola de Frankfurt existiram e escreveram abertamente sobre conquistar a cultura. Não é conspiração secreta, é estratégia publicada. O que seria exagero é achar que tudo de ruim vem disso.",v:2,r:"Ah, então dá pra ler os próprios autores.",tip:"Equilíbrio perfeito: fatos com fonte, sem exagero."},
  {t:"Não é, eles controlam tudo, a mídia, as escolas, tudo.",v:0,r:"Aí parece mesmo teoria da conspiração 😅",tip:"Exagero tira a força do que é verdade."},
  {t:"Pesquisa aí que você vai ver.",v:1,r:"Pesquisar o quê, exatamente?",tip:"Dê a fonte: os Cadernos do cárcere de Gramsci."}]},
 {k:"mentor",t:"A disputa é pela cultura. Por isso não basta reclamar: é preciso criar coisas boas, verdadeiras e belas."}
 ]},

h4:{conf:"explicar o que mudou na esquerda depois da queda do Muro",
 mis:"Converse com alguém que tinha mais de 15 anos em 1989 e pergunte o que lembra da queda do Muro de Berlim.",
 s:[
 {k:"txt",tag:"1989",h:"O Muro cai",p:"Em 9 de novembro de 1989, os alemães derrubaram o Muro de Berlim. Em 1991, a União Soviética acabou. Muitos acharam que o comunismo tinha morrido."},
 {k:"txt",tag:"1990",h:"O Foro de São Paulo",p:"Em 1990, a convite do PT e do Partido Comunista de Cuba, partidos de esquerda da América Latina se reuniram para **reorganizar a esquerda** no continente."},
 {k:"txt",h:"Nova luta, mesma lógica",p:"Com o fim da economia socialista, a luta de classes ganhou novas formas: a sociedade passou a ser dividida em grupos de **opressores e oprimidos** por raça, sexo e outras identidades."},
 {k:"pick",q:"O que a política identitária mantém da lógica de Marx?",o:["Dividir as pessoas entre opressores e oprimidos","O fim da propriedade privada","A ditadura do proletariado"],c:0,e:"Muda o grupo, mas fica a divisão."},
 {k:"quote",t:"Eu tenho um sonho: que meus quatro filhos um dia vivam numa nação onde não serão julgados pela cor da sua pele, mas pelo conteúdo do seu caráter.",by:"Martin Luther King Jr., pastor batista (1963)"},
 {k:"txt",h:"A resposta cristã",p:"Combater o racismo é dever de todo cristão. Mas a Bíblia une as pessoas em Cristo: **não há judeu nem grego** (Gl 3.28). Sua identidade principal não é seu grupo."},
 {k:"tf",q:"Rejeitar a política identitária significa negar que o racismo existe.",a:false,e:"O racismo existe e deve ser combatido. O que se rejeita é reduzir a pessoa ao grupo."},
 {k:"verse"},
 {k:"chat",who:"Caio",c:"#2F9E44",q:"Se você é contra cota racial, você é racista.",o:[
  {t:"Dá para ser contra o racismo e discordar do método. Eu acho que ajudar por renda alcança os pobres de todas as cores. Podemos discutir qual funciona melhor, sem acusar ninguém.",v:2,r:"Tá, isso é uma discordância de método mesmo.",tip:"Você separou a pessoa da ideia e propôs uma alternativa."},
  {t:"Racismo nem existe mais no Brasil.",v:0,r:"Sério? Você nunca viu nada?",tip:"Negar o problema destrói sua credibilidade e não é verdade."},
  {t:"Sou nada, você que é.",v:0,r:"Que maturidade…",tip:"Devolver o rótulo só deixa a conversa pior."}]},
 {k:"mentor",t:"Conhecer o outro lado do começo ao fim te deixa firme. Agora vamos aprender a se posicionar."}
 ]},

s1:{conf:"argumentar sem cair em armadilhas",
 mis:"Na próxima discussão que você vir nas redes, identifique uma falácia (espantalho, ataque pessoal ou falso dilema). Só identifique, sem comentar.",
 s:[
 {k:"mentor",t:"Eu sou Ester. Órfã, virei rainha da Pérsia e tive que falar com o rei para salvar meu povo. Tive medo, jejuei e falei na hora certa (Et 4.16). Vamos aprender a falar com sabedoria?"},
 {k:"txt",h:"Ganhar a discussão não é o objetivo",p:"O objetivo é a verdade e a pessoa. Quem humilha o outro pode até ganhar a briga, mas perde a chance de convencer."},
 {k:"match",h:"Ligue a falácia ao exemplo",pairs:[["Ataque pessoal","“Você é rico, então não pode falar de pobreza.”"],["Espantalho","“Você quer o Estado mínimo? Então quer acabar com hospitais!”"],["Falso dilema","“Ou você apoia este político, ou é comunista.”"],["Apelo à multidão","“Todo mundo pensa assim, então é verdade.”"]]},
 {k:"txt",h:"O homem de aço",p:"O contrário do espantalho: antes de responder, apresente a ideia do outro **na melhor versão possível**. Se ele disser “é isso mesmo”, aí você responde."},
 {k:"txt",h:"Três perguntas de Sowell",p:"Diante de qualquer proposta: **comparado com quê? A que custo? Que evidência temos?**"},
 {k:"tf",q:"Usar um dado é sempre melhor que usar um argumento.",a:false,e:"Dado sem fonte ou fora de contexto é pior do que nenhum. Diga de onde vem."},
 {k:"verse"},
 {k:"bug",h:"Toque no trecho com falácia",parts:["A proposta custa caro,","não tem evidência de que funcione","e quem defende é tudo idiota."],w:2,e:"Os dois primeiros são argumentos. O terceiro é ataque pessoal."},
 {k:"chat",who:"Léo",c:"#1C7ED6",q:"Você é de direita porque seus pais são. Nem pensa por conta própria.",o:[
  {t:"Pode ser que eu tenha aprendido com eles, assim como você aprendeu com alguém. Mas o que importa é se o argumento é bom. Quer que eu te explique um?",v:2,r:"Justo… manda aí.",tip:"Você não caiu no ataque pessoal e voltou para as ideias."},
  {t:"E você é de esquerda porque o professor mandou.",v:0,r:"Ah, então tá.",tip:"Devolver a falácia não ajuda. Volte para o argumento."},
  {t:"Não é verdade!",v:1,r:"Prova.",tip:"Melhor do que negar é mostrar que você conhece os argumentos."}]},
 {k:"mentor",t:"Firmeza sem arrogância. Antes de responder, entenda; depois, fale com mansidão (Pv 15.1)."}
 ]},

s2:{conf:"se posicionar com respeito na escola ou na faculdade",
 mis:"Nesta semana, faça uma pergunta educada em sala sobre um tema polêmico, pedindo a fonte de alguma afirmação. Depois conte como foi.",
 s:[
 {k:"txt",h:"Sala de aula não é ringue",p:"Você não está lá para derrotar o professor, mas para aprender e ser exemplo. Quem estuda bem conquista o direito de ser ouvido."},
 {k:"txt",tag:"Art. 206",h:"Seus direitos",p:"A Constituição garante no ensino o **pluralismo de ideias** e a liberdade de aprender. Ter uma opinião diferente não é crime nem motivo para nota baixa."},
 {k:"txt",h:"O exemplo de Daniel",p:"Na Babilônia, Daniel estudou a cultura do império, não comeu o que contrariava sua consciência e foi achado **dez vezes mais sábio** que os outros (Dn 1.20)."},
 {k:"pick",q:"O professor disse algo que você acha falso. Qual a melhor reação?",o:["Perguntar com respeito: “Qual é a fonte disso?”","Gravar escondido e postar","Ficar calado e reclamar depois"],c:0,e:"Pergunta educada mostra que você pensa, sem criar guerra."},
 {k:"order",h:"Como agir diante de doutrinação",items:["Ouça até o fim","Pergunte a fonte com respeito","Apresente outro ponto de vista","Se houver abuso, fale com seus pais e a coordenação"],e:"Primeiro o diálogo. Os canais formais vêm depois."},
 {k:"tf",q:"Tirar notas boas ajuda a ser respeitado quando você discorda.",a:true,e:"Excelência abre portas. Daniel é o exemplo."},
 {k:"verse"},
 {k:"chat",who:"Professora Sílvia",c:"#C2255C",q:"Alguém aqui discorda que o Estado deveria controlar mais a economia?",o:[
  {t:"Eu discordo, professora, com todo respeito. Países que deram mais liberdade econômica reduziram a pobreza mais rápido, segundo o Banco Mundial. Mas gostaria de ouvir o outro lado também.",v:2,r:"Interessante. Traga esse dado na próxima aula para a gente discutir.",tip:"Respeito, dado e abertura: você ganhou a sala."},
  {t:"Isso é doutrinação, professora!",v:0,r:"Eu só fiz uma pergunta. Por que você está tão bravo?",tip:"Acusar logo de cara te faz parecer o agressivo."},
  {t:"(Ficar calado.)",v:1,r:"Ninguém? Então seguimos.",tip:"Calar às vezes é sábio, mas aqui ela pediu opinião. Era sua chance."}]},
 {k:"mentor",t:"Ninguém despreze a sua mocidade (1 Tm 4.12). Seja tão bom aluno que até quem discorda de você te respeite."}
 ]},

s3:{conf:"falar de política sem destruir relações",
 mis:"Antes de postar ou comentar algo sobre política hoje, passe pelas três perguntas: é verdade? É necessário? Edifica?",
 s:[
 {k:"txt",h:"Política divide famílias",p:"Muita gente parou de falar com tio, primo ou amigo por causa de eleição. Ter razão não vale perder as pessoas."},
 {k:"verse"},
 {k:"list",h:"Antes de postar, pergunte",items:["É verdade?","É necessário?","Edifica quem vai ler?"]},
 {k:"txt",h:"Inimigos no mesmo grupo",p:"Entre os 12 discípulos de Jesus estavam Mateus, que **cobrava impostos para Roma**, e Simão, o **zelote**, que lutava contra Roma (Mt 10.3-4). Jesus os uniu."},
 {k:"tf",q:"Compartilhar uma notícia sem conferir é aceitável se ela for contra o adversário.",a:false,e:"Notícia falsa é mentira, não importa contra quem. E mancha o seu testemunho."},
 {k:"pick",q:"No almoço de família, seu tio começa a falar mal do seu candidato. O que fazer?",o:["Ouvir, perguntar o porquê e responder com calma","Levantar da mesa","Começar a falar mal do candidato dele"],c:0,e:"Perguntar antes de responder desarma qualquer conversa."},
 {k:"txt",h:"Escolha suas batalhas",p:"Nem todo comentário precisa de resposta. Às vezes o mais sábio é **orar pela pessoa e continuar amando**."},
 {k:"chat",who:"Tia Sônia",c:"#E67700",q:"Ai, meu filho, você é muito novo para entender de política. Isso é coisa de gente grande!",o:[
  {t:"Tia, eu sei que tenho muito a aprender, por isso estudo. Posso te contar o que eu li? E quero ouvir o que a senhora viveu, porque a senhora viu coisas que eu não vi.",v:2,r:"Ah, que menino educado. Senta aqui, vou te contar da época da inflação…",tip:"Humildade e interesse genuíno: a conversa virou encontro."},
  {t:"Tia, a senhora que não entende nada.",v:0,r:"Que falta de respeito!",tip:"Vencer a tia não vale perder a tia."},
  {t:"Tá bom, tia.",v:1,r:"Isso, deixa que os adultos resolvem.",tip:"Evitar briga é bom, mas você pode participar com respeito."}]},
 {k:"mentor",t:"A pessoa vale mais do que a discussão. Fale a verdade, mas fale em amor (Ef 4.15)."}
 ]},

s4:{conf:"responder quando te chamarem de fascista ou extremista",
 mis:"Escreva em um papel, com suas palavras, o que é fascismo segundo esta lição. Guarde para a próxima vez que ouvir a palavra.",
 s:[
 {k:"txt",h:"O rótulo encerra o debate",p:"Chamar alguém de “fascista” muitas vezes serve para não precisar responder o que ele disse. Sua tarefa é voltar a conversa para as ideias."},
 {k:"quote",t:"Tudo no Estado, nada fora do Estado, nada contra o Estado.",by:"Benito Mussolini, criador do fascismo (1925)"},
 {k:"txt",h:"O que é fascismo de verdade",p:"Fascismo é Estado total, partido único, culto ao líder e violência contra quem discorda. É o oposto de quem defende **Estado limitado, família e liberdade**."},
 {k:"txt",tag:"1951",h:"Hannah Arendt",p:"A filósofa judia, que fugiu dos nazistas, mostrou em Origens do totalitarismo que nazismo e stalinismo tinham a **mesma estrutura**: controle total sobre a vida."},
 {k:"tf",q:"Defender o Estado limitado é o oposto do fascismo.",a:true,e:"O fascismo quer tudo dentro do Estado. A direita conservadora quer limites ao Estado."},
 {k:"verse"},
 {k:"txt",h:"Limpe sua própria casa",p:"A direita cristã deve **rejeitar** racismo, culto ao líder, violência e desumanização do adversário. Venha de quem vier, inclusive do seu lado."},
 {k:"bug",h:"Toque no trecho errado",parts:["Eu defendo a liberdade,","a família","e que quem pensa diferente seja calado."],w:2,e:"Calar quem discorda é justamente o que se critica nos regimes totalitários."},
 {k:"chat",who:"Mari",c:"#D6336C",q:"Você é de direita? Então você é fascista.",o:[
  {t:"Fascismo é Estado controlando tudo e partido único. Eu defendo o contrário: menos poder para o governo e liberdade para todos falarem, inclusive você. O que eu disse que te pareceu fascista?",v:2,r:"Ah… é que eu associo direita a isso. Nunca pensei na definição.",tip:"Definição clara e uma pergunta que traz a conversa de volta."},
  {t:"E você é comunista!",v:0,r:"Viu? Não dá pra conversar com vocês.",tip:"Trocar rótulo por rótulo só confirma o estereótipo."},
  {t:"Não sou não.",v:1,r:"Fala isso, mas…",tip:"Negar é pouco. Explique o que é fascismo e por que você é o oposto."}]},
 {k:"mentor",t:"Ai dos que ao mal chamam bem (Is 5.20). Chame as coisas pelo nome certo, com calma e coragem."}
 ]},

l1:{conf:"explicar a relação entre fé cristã e política",
 mis:"Ore nesta semana por uma autoridade da sua cidade, de qualquer partido, pelo nome.",
 s:[
 {k:"mentor",t:"Eu sou Neemias. Era copeiro do rei da Pérsia quando soube que os muros de Jerusalém estavam caídos. Chorei, orei (Ne 1.4), planejei e reconstruí. Fé que não vira obra fica pela metade."},
 {k:"txt",tag:"413",h:"As duas cidades",p:"Agostinho escreveu A cidade de Deus quando Roma caiu. O cristão vive em duas cidades: a terrena, que ele serve, e a celestial, onde está sua **esperança final**."},
 {k:"verse"},
 {k:"txt",tag:"1880",h:"Esferas de soberania",p:"Abraham Kuyper, teólogo e primeiro-ministro holandês, ensinou que família, igreja, escola e Estado têm **autoridade própria**, dada por Deus. Nenhuma deve engolir a outra."},
 {k:"match",h:"Ligue a esfera à sua função",pairs:[["Família","criar e educar os filhos"],["Igreja","pregar o evangelho e cuidar da fé"],["Estado","fazer justiça e proteger"],["Mercado","trabalhar e trocar livremente"]]},
 {k:"tf",q:"Se o meu candidato ganhar, o Brasil vai ser salvo.",a:false,e:"Nenhum político salva. Nossa esperança está em Cristo (Sl 146.3)."},
 {k:"pick",q:"O que Deus pede, segundo Miqueias 6.8?",o:["Praticar a justiça, amar a misericórdia e andar humildemente com Deus","Ganhar todas as eleições","Fugir da política"],c:0,e:"Justiça e misericórdia andam juntas."},
 {k:"chat",who:"Pedro (da igreja)",c:"#5F3DC4",q:"Crente não devia se meter em política. Política é suja.",o:[
  {t:"Se os cristãos saírem, a política não fica limpa, fica sem sal. José, Daniel e Neemias serviram em governos. Dá para participar sem pôr nossa esperança nos políticos.",v:2,r:"É, Daniel serviu até na Babilônia…",tip:"Exemplos bíblicos e o equilíbrio certo. Ótimo!"},
  {t:"Tem que se meter sim, senão o comunismo ganha.",v:1,r:"Você fala como se tudo dependesse disso.",tip:"Participar é bom, mas o motivo principal é amar o próximo, não o medo."},
  {t:"Você é muito alienado.",v:0,r:"Oxe, eu só disse o que penso.",tip:"Irmão é irmão. Responda com mansidão."}]},
 {k:"mentor",t:"Sirva sua cidade como quem serve a Deus. Mas lembre: o muro mais importante é o do coração."}
 ]},

l2:{conf:"defender a vida, a família e a liberdade religiosa com base na lei",
 mis:"Leia com sua família o artigo 5º, inciso VI, da Constituição e conversem sobre por que a liberdade de crença é importante.",
 s:[
 {k:"txt",h:"Conhecer a lei impressiona",p:"Opinião todo mundo tem. Quem cita a lei e as decisões dos tribunais mostra que estudou e ganha respeito."},
 {k:"txt",tag:"Art. 128",h:"O aborto no Código Penal",p:"No Brasil, o aborto é crime. O Código Penal não pune em dois casos: **risco de vida para a gestante** e **gravidez por estupro**. Em 2012, o STF acrescentou a anencefalia (ADPF 54)."},
 {k:"txt",h:"Argumento sem versículo",p:"A embriologia mostra que, na concepção, surge um **novo organismo humano** com DNA próprio. A pergunta é ética: todo ser humano tem direito à vida, ou só os que já nasceram?"},
 {k:"verse"},
 {k:"txt",h:"Coerência pró-vida",p:"Quem defende o bebê deve defender também a mãe: apoio a gestantes, adoção, creches e combate à violência contra a mulher."},
 {k:"pick",q:"O que o STF decidiu em 2018 sobre educação domiciliar?",o:["Que não é proibida pela Constituição, mas precisa de uma lei","Que é crime","Que é obrigatória"],c:0,e:"RE 888.815. O tema segue no Congresso."},
 {k:"match",h:"Ligue o artigo ao que ele diz",pairs:[["Art. 226","a família é a base da sociedade"],["Art. 205","a educação é dever do Estado e da família"],["Art. 5º, VI","a crença e o culto são protegidos"]]},
 {k:"tf",q:"A liberdade religiosa inclui pregar o que a Bíblia ensina sobre família, sem incitar ódio contra pessoas.",a:true,e:"Liberdade que só vale para quem concorda com você não é liberdade."},
 {k:"chat",who:"Ju",c:"#E64980",q:"Proibir o aborto é impor a sua religião aos outros.",o:[
  {t:"Não preciso da Bíblia para isso. A ciência diz que na concepção surge um novo ser humano, e não matar inocentes é uma regra de todas as culturas. E eu defendo junto apoio real para a mãe.",v:2,r:"Hm, você não falou de religião em nenhum momento.",tip:"Ciência, ética e compaixão. Argumento público perfeito."},
  {t:"Deus disse que é errado e pronto.",v:1,r:"Mas eu não acredito no seu Deus.",tip:"É verdade, mas em debate público use também argumentos que todos possam aceitar."},
  {t:"Quem aborta é assassina.",v:0,r:"Você não sabe o que essas mulheres passam.",tip:"Condenar pessoas em vez de defender a vida afasta quem precisa ouvir."}]},
 {k:"mentor",t:"Abra a boca pelos que não podem falar (Pv 31.8). Com a lei na mão e compaixão no coração."}
 ]},

l3:{conf:"explicar inflação, impostos e trade-offs para qualquer pessoa",
 mis:"Pergunte a um adulto da sua casa como eram os preços antes do Plano Real, em 1994. Anote uma história que ele contar.",
 s:[
 {k:"txt",h:"Não existe almoço grátis",p:"Tudo tem custo. Se o governo dá algo “de graça”, alguém paga: com impostos, com dívida ou com inflação."},
 {k:"big",n:"2.477%",p:"foi a inflação do Brasil em 1993. Os preços mudavam quase todo dia no supermercado."},
 {k:"txt",tag:"1994",h:"O Plano Real",p:"A nova moeda e o controle dos gastos acabaram com a hiperinflação. Quem mais ganhou foram os **pobres**, que não tinham como proteger o salário."},
 {k:"txt",h:"O que é inflação",p:"Quando o governo cria dinheiro demais, cada nota vale menos. É como um **imposto escondido**, que pesa mais para quem ganha pouco."},
 {k:"txt",tag:"1850",h:"Bastiat",p:"O francês ensinou a ver **o que se vê e o que não se vê**: o emprego criado por um gasto do governo aparece; os empregos que o imposto impediu, não."},
 {k:"pick",q:"Se o salário mínimo dobrar por lei amanhã, o que pode acontecer?",o:["Alguns ganham mais, mas outros perdem o emprego ou vão para a informalidade","Todo mundo fica mais rico sem efeito nenhum","Os preços caem"],c:0,e:"É um trade-off: toda escolha tem ganhos e perdas."},
 {k:"tf",q:"Imprimir mais dinheiro é uma forma segura de acabar com a pobreza.",a:false,e:"Gera inflação, que corrói justamente o salário dos mais pobres."},
 {k:"verse"},
 {k:"chat",who:"Enzo",c:"#F76707",q:"Era só o governo taxar os ricos e dar dinheiro pra todo mundo. Resolvia.",o:[
  {t:"Os ricos podem levar o dinheiro para outros países, e a conta acaba nos impostos sobre consumo, que pesam no pobre. O que tira gente da pobreza de forma duradoura é emprego, e emprego vem de empresa investindo.",v:2,r:"Nunca tinha pensado que o rico pode simplesmente ir embora.",tip:"Você mostrou o efeito que não se vê. Bastiat ficaria orgulhoso."},
  {t:"Isso é roubo!",v:1,r:"Imposto é roubo? Então quem paga a escola?",tip:"Imposto tem função. A discussão é quanto e como."},
  {t:"Você nunca trabalhou na vida, por isso pensa assim.",v:0,r:"E você trabalhou?",tip:"Ataque pessoal de novo. Volte para o argumento."}]},
 {k:"mentor",t:"Economia é cuidar bem dos recursos, como José no Egito. Explique com exemplos do dia a dia."}
 ]},

l4:{conf:"construir cultura em vez de só dar opinião",
 mis:"Escolha um projeto concreto para fazer neste mês: um vídeo, um texto, um grupo de estudo ou um serviço na sua cidade. Escreva o primeiro passo hoje.",
 s:[
 {k:"txt",h:"Rio abaixo",p:"A política está **rio abaixo da cultura**. O que as pessoas assistem, escutam e leem hoje vira lei amanhã. Quem quer mudar a política precisa subir o rio."},
 {k:"txt",tag:"1807",h:"William Wilberforce",p:"Deputado britânico e cristão. Lutou cerca de 20 anos, perdeu várias votações e não desistiu, até o Parlamento proibir o tráfico de escravos em 1807. A escravidão foi abolida no Império Britânico em 1833."},
 {k:"txt",h:"Ele não lutou só no Parlamento",p:"Wilberforce e seus amigos criaram escolas, sociedades e campanhas, e até mudaram os costumes. **Mudaram a cultura, e a lei veio depois.**"},
 {k:"verse"},
 {k:"order",h:"Como Neemias reconstruiu",items:["Chorou e orou pelo problema","Fez um plano","Reuniu pessoas","Trabalhou com uma mão e vigiou com a outra","Terminou a obra em 52 dias"],e:"Neemias 1 a 6: oração, plano, gente e persistência."},
 {k:"pick",q:"Qual destas ações constrói cultura?",o:["Começar um grupo de estudo de livros","Xingar adversários nos comentários","Só reclamar da mídia"],c:0,e:"Construir é criar coisas boas, verdadeiras e belas (Fp 4.8)."},
 {k:"tf",q:"Para fazer diferença, você precisa ser famoso ou ter um cargo político.",a:false,e:"Grandes mudanças começaram com grupos pequenos e fiéis."},
 {k:"chat",who:"Bruno",c:"#1098AD",q:"Não adianta nada. A mídia, as escolas e as artes estão todas contra a gente.",o:[
  {t:"Wilberforce também começou perdendo. Em vez de reclamar, vamos fazer algo bom: um podcast, um grupo de estudo, um projeto social. Cultura se vence criando coisa melhor.",v:2,r:"Bora? Eu edito vídeo, você escreve o roteiro.",tip:"Você trocou reclamação por projeto. Isso é liderança."},
  {t:"Verdade, está tudo perdido.",v:0,r:"Então nem vou tentar.",tip:"O desânimo é o primeiro muro a derrubar."},
  {t:"Temos que boicotar tudo.",v:1,r:"E colocar o quê no lugar?",tip:"Boicote sozinho não constrói. Falta criar a alternativa."}]},
 {k:"mentor",t:"Vós sois o sal da terra e a luz do mundo. Escolha seu muro e comece a construir hoje."}
 ]}

 {k:"big",n:"513 + 81",p:"deputados federais e senadores formam o Congresso Nacional. Deputados representam o povo; senadores, os estados (3 por estado)."},
 {k:"order",h:"Do mais local ao nacional",items:["Município: prefeito e vereadores","Estado: governador e deputados estaduais","União: presidente, deputados federais e senadores"],e:"As três esferas têm Executivo e Legislativo. O Judiciário é estadual ou federal."},
 {k:"txt",h:"Freios e contrapesos",p:"O presidente pode **vetar** uma lei; o Congresso pode **derrubar o veto**; o STF pode **anular** uma lei contrária à Constituição; o Senado julga o presidente no **impeachment**."},
 {k:"tf",q:"O Ministério Público é um quarto Poder.",a:false,e:"O MP é uma instituição independente que acusa crimes e defende a lei, mas não é um Poder."},
 {k:"pick",q:"Quem você deve procurar para reclamar de um buraco na rua do seu bairro?",o:["A prefeitura e os vereadores","O STF","O presidente da República"],c:0,e:"Rua é assunto do município. Conhecer a esfera certa resolve mais rápido."},
 {k:"chat",who:"Vini",c:"#1C7ED6",q:"Pra que votar em vereador? Quem manda mesmo é o presidente.",o:[
  {t:"O vereador vota as leis da sua cidade e fiscaliza o prefeito: escola, saúde do bairro, transporte. Muita coisa do seu dia a dia passa por ele, não pelo presidente.",v:2,r:"Nossa, nem sabia que ele fiscalizava o prefeito.",tip:"Isso! Cada esfera cuida de uma parte da vida."},
  {t:"É verdade, vereador não serve pra nada.",v:0,r:"Então nem vou votar.",tip:"Falso. O vereador faz as leis municipais e fiscaliza o prefeito."},
  {t:"Ah, tem que votar porque é obrigatório.",v:1,r:"Só por isso?",tip:"É obrigatório, mas o melhor motivo é o que ele faz pela cidade."}]},
 {k:"mentor",t:"No Egito, cada coisa tinha o seu lugar e o seu responsável. Saber quem faz o quê é o primeiro passo para cobrar."}
 ]},

q2:{conf:"explicar como uma lei nasce",
 mis:"Entre no site da Câmara dos Deputados, procure um projeto de lei sobre um tema que te interessa e veja em que fase ele está.",
 s:[
 {k:"txt",h:"Toda lei tem uma história",p:"Uma lei não aparece do nada. Ela passa por várias etapas, e em cada uma delas o cidadão pode acompanhar e pressionar."},
 {k:"order",h:"O caminho de um projeto de lei",items:["Alguém apresenta o projeto","As comissões analisam","O plenário vota","A outra Casa do Congresso vota","O presidente sanciona ou veta"],e:"Se houver veto, o Congresso pode derrubá-lo por maioria absoluta."},
 {k:"txt",h:"Você também pode propor",p:"Na **iniciativa popular**, assinaturas de 1% do eleitorado nacional, de pelo menos cinco estados, apresentam um projeto à Câmara. Assim nasceu a Lei da Ficha Limpa."},
 {k:"match",h:"Ligue o instrumento ao que ele é",pairs:[["Projeto de lei","proposta de uma lei comum"],["Medida provisória","ato do presidente com força de lei, que o Congresso precisa aprovar"],["PEC","proposta de emenda à Constituição"],["Veto","recusa do presidente a uma lei aprovada"]]},
 {k:"big",n:"3/5",p:"dos votos, em dois turnos, na Câmara e no Senado: é o que uma PEC precisa para mudar a Constituição."},
 {k:"txt",h:"O que não pode mudar",p:"As **cláusulas pétreas** (art. 60, § 4º) não podem ser abolidas nem por emenda: a federação, o voto direto, secreto, universal e periódico, a separação dos Poderes e os direitos e garantias individuais."},
 {k:"tf",q:"Uma medida provisória vira lei para sempre assim que o presidente a assina.",a:false,e:"Ela vale de imediato, mas perde efeito se o Congresso não a aprovar no prazo."},
 {k:"verse"},
 {k:"chat",who:"Luana",c:"#D6336C",q:"Não adianta nada a gente acompanhar. Eles votam o que querem.",o:[
  {t:"Deputado depende de voto e presta atenção na pressão do eleitor. Dá para acompanhar no site da Câmara, mandar mensagem e cobrar. A Ficha Limpa nasceu de assinaturas do povo.",v:2,r:"Sério que dá pra ver em que fase está cada projeto?",tip:"Você mostrou um caminho concreto e um exemplo real."},
  {t:"É verdade, é tudo comprado.",v:0,r:"Então tanto faz.",tip:"O cinismo é o que mais ajuda os maus políticos."},
  {t:"Tem que fazer manifestação.",v:1,r:"Todo dia?",tip:"Pode ajudar, mas acompanhar e cobrar no dia a dia funciona mais."}]},
 {k:"mentor",t:"Quem conhece o caminho da lei sabe a hora certa de falar. Acompanhe, cobre e ore."}
 ]},

q3:{conf:"dizer quem governa o Brasil hoje",
 mis:"Ore nesta semana pelo presidente, pelos presidentes da Câmara e do Senado e pelo governador do seu estado, tendo você votado neles ou não.",
 s:[
 {k:"txt",tag:"2026",h:"A eleição presidencial",p:"No 1º turno (4 de outubro), Flávio Bolsonaro (PL) ficou à frente, com 47,03% dos votos válidos, contra 45,16% de Lula (PT)."},
 {k:"big",n:"51,79%",p:"foi o resultado de Lula no 2º turno, em 25 de outubro de 2026, contra 48,21% de Flávio Bolsonaro."},
 {k:"tf",q:"Quem vence o 1º turno sempre vence a eleição.",a:false,e:"Em 2026, Flávio venceu o 1º turno e Lula virou no 2º."},
 {k:"txt",h:"Quem é quem",p:"O presidente escolhe os **ministros**, que comandam áreas como Fazenda, Saúde e Educação. A **Casa Civil** coordena o governo. Os ministros podem ser trocados a qualquer momento."},
 {k:"pick",q:"Qual ministério coordena o trabalho dos outros?",o:["Casa Civil","Ministério da Cultura","Itamaraty"],c:0,e:"A Casa Civil é o centro da coordenação do governo."},
 {k:"txt",h:"O Congresso também governa",p:"Os presidentes da Câmara e do Senado decidem **o que vai ser votado e quando**. Por isso uma eleição de deputados e senadores pesa tanto quanto a de presidente."},
 {k:"verse"},
 {k:"txt",h:"Orar por quem governa",p:"Paulo pediu oração pelos governantes quando o imperador era Nero. Orar não é concordar: é pedir a Deus que **dê sabedoria e justiça** a quem manda."},
 {k:"chat",who:"Davi",c:"#2F9E44",q:"Perdemos a eleição. Agora não tem mais o que fazer até 2030.",o:[
  {t:"Tem muito a fazer: fiscalizar o governo, apoiar bons deputados e senadores, participar na cidade e orar pelas autoridades. Democracia não acaba no dia da eleição.",v:2,r:"É, o Congresso vota todo dia, né?",tip:"Ótimo: oposição responsável e fé, ao mesmo tempo."},
  {t:"Foi fraude, com certeza.",v:0,r:"Você tem alguma prova?",tip:"Acusar sem prova tira a sua credibilidade."},
  {t:"Vou parar de ligar pra política.",v:1,r:"Aí é que eles fazem o que querem.",tip:"Desanimar é compreensível, mas sumir não ajuda ninguém."}]},
 {k:"mentor",t:"Eu servi a um faraó que não conhecia o meu Deus, e fui fiel. Sirva seu país com honestidade, com quem estiver no governo."}
 ]},

q4:{conf:"explicar como funciona o STF e o debate sobre ativismo",
 mis:"Escolha um ministro do STF na aba Tempo > Supremo e conte para alguém três fatos sobre ele.",
 s:[
 {k:"txt",h:"O guardião da Constituição",p:"O Supremo Tribunal Federal tem **11 ministros**. Sua função principal é julgar se as leis e os atos do governo estão de acordo com a Constituição."},
 {k:"order",h:"Como alguém vira ministro do STF",items:["O presidente indica","A CCJ do Senado faz a sabatina","O plenário do Senado vota","Com 41 votos ou mais, o presidente nomeia"],e:"Ministro fica até os 75 anos, quando se aposenta obrigatoriamente."},
 {k:"big",n:"42 × 34",p:"Em 29 de abril de 2026, o Senado rejeitou Jorge Messias para o STF: a primeira rejeição de um indicado desde 1894."},
 {k:"tf",q:"Os ministros do STF são eleitos pelo voto popular.",a:false,e:"São indicados pelo presidente e aprovados pelo Senado."},
 {k:"txt",h:"O debate sobre ativismo",p:"Críticos dizem que o STF às vezes **decide temas que caberiam ao Congresso**, como se escrevesse leis. Defensores dizem que a Corte age quando o Congresso se omite."},
 {k:"txt",h:"Autocontenção",p:"A posição conservadora é a da **autocontenção judicial**: o juiz interpreta a lei, não a escreve. Mudanças grandes devem vir de quem foi eleito."},
 {k:"verse"},
 {k:"pick",q:"Qual a forma certa de discordar de uma decisão do STF?",o:["Criticar os argumentos e apoiar mudanças pela via legal","Ameaçar os ministros","Desobedecer a decisão"],c:0,e:"Crítica firme, sempre dentro da lei. Ameaça é crime."},
 {k:"chat",who:"Gabi",c:"#AE3EC9",q:"Criticar o STF é atacar a democracia.",o:[
  {t:"Criticar argumentos de uma decisão é parte da democracia, como criticar o presidente ou o Congresso. O que ataca a democracia é ameaçar pessoas ou desobedecer a lei. Eu faço só a primeira coisa.",v:2,r:"Faz sentido. Crítica não é ameaça.",tip:"Você separou crítica legítima de ataque. Perfeito."},
  {t:"Tem que fechar o STF.",v:0,r:"Isso sim é atacar a democracia.",tip:"Defender instituições com limites é diferente de querer destruí-las."},
  {t:"Eu nem ligo pro STF.",v:1,r:"Mas ele decide muita coisa da sua vida.",tip:"Vale a pena acompanhar: ele decide temas como vida, família e liberdade."}]},
 {k:"mentor",t:"Não torcerás a justiça (Dt 16.19). Cobre justiça de todos os Poderes, com firmeza e dentro da lei."}
 ]},

k1:{conf:"explicar o que é a Constituição de 1988",
 mis:"Leia em voz alta o preâmbulo da Constituição para alguém da sua casa e mostre a frase “sob a proteção de Deus”.",
 s:[
 {k:"mentor",t:"Eu sou Moisés. Tirei Israel da escravidão e recebi a Lei no Sinai (Êx 20). Um povo que conhece as suas leis não é facilmente enganado. Vamos abrir a Constituição?"},
 {k:"txt",tag:"1988",h:"A Constituição Cidadã",p:"Promulgada em **5 de outubro de 1988**, depois do regime militar. Ulysses Guimarães, presidente da Assembleia Constituinte, a chamou de “Constituição Cidadã”."},
 {k:"quote",t:"Nós, representantes do povo brasileiro, reunidos em Assembleia Nacional Constituinte […] promulgamos, sob a proteção de Deus, a seguinte Constituição.",by:"Preâmbulo da Constituição de 1988"},
 {k:"verse"},
 {k:"list",h:"Os fundamentos da República (art. 1º)",items:["Soberania","Cidadania","Dignidade da pessoa humana","Valores sociais do trabalho e da livre iniciativa","Pluralismo político"]},
 {k:"tf",q:"A livre iniciativa é um dos fundamentos da República na Constituição.",a:true,e:"Está no art. 1º, ao lado do valor social do trabalho."},
 {k:"txt",h:"Uma Constituição longa",p:"Ela tem mais de 250 artigos e já recebeu mais de 130 emendas. Por ser tão detalhada, muita coisa que em outros países é lei comum aqui está na Constituição."},
 {k:"pick",q:"Por que o cristão deveria conhecer a Constituição?",o:["Para saber seus direitos e cobrar quem governa","Porque ela substitui a Bíblia","Porque é proibido não conhecer"],c:0,e:"A Bíblia é a autoridade da fé. A Constituição é a regra do jogo do país."},
 {k:"chat",who:"Kauã",c:"#F76707",q:"Constituição é coisa de advogado. Pra que eu vou ler isso?",o:[
  {t:"Porque ela diz o que o governo pode e não pode fazer com você. Seus direitos à vida, à liberdade de crença e à propriedade estão lá. Quem não conhece os próprios direitos não sabe quando eles são desrespeitados.",v:2,r:"Pensando assim, é tipo o manual do país.",tip:"Ótima imagem: o manual que protege você."},
  {t:"Porque tem que ler e pronto.",v:1,r:"Isso não me convenceu.",tip:"Mostre o que ele ganha conhecendo: direitos e defesa."},
  {t:"Você é muito preguiçoso.",v:0,r:"Valeu pela parte que me toca.",tip:"Crítica pessoal não desperta interesse em ninguém."}]},
 {k:"mentor",t:"Ensina estas palavras a teus filhos (Dt 6.7). Conheça a lei do seu país para servir melhor ao seu povo."}
 ]},

k2:{conf:"citar seus direitos do art. 5º e como defendê-los",
 mis:"Escolha dois incisos do art. 5º da Constituição, leia o texto original e explique-os para um amigo com suas palavras.",
 s:[
 {k:"verse"},
 {k:"list",h:"Os cinco direitos da cabeça do art. 5º",items:["Vida","Liberdade","Igualdade","Segurança","Propriedade"]},
 {k:"txt",tag:"1689",h:"De onde veio essa ideia",p:"O filósofo inglês John Locke defendia que **vida, liberdade e propriedade** são direitos que vêm antes do governo. O governo existe para protegê-los, não para concedê-los."},
 {k:"txt",h:"Direitos contra o próprio Estado",p:"O art. 5º protege você também **do governo**: ninguém pode ser preso sem ordem judicial ou flagrante, sua casa é protegida e sua crença é livre."},
 {k:"match",h:"Ligue a ferramenta ao que ela protege",pairs:[["Habeas corpus","contra prisão ilegal"],["Mandado de segurança","contra abuso de autoridade a um direito claro"],["Habeas data","acesso aos seus dados em órgãos públicos"]]},
 {k:"tf",q:"Pelo art. 5º, II, ninguém é obrigado a fazer algo senão em virtude de lei.",a:true,e:"Esse é o princípio da legalidade: quem manda é a lei, não a vontade de uma autoridade."},
 {k:"pick",q:"Qual inciso protege a liberdade de crença e de culto?",o:["Art. 5º, VI","Art. 226","Art. 128"],c:0,e:"É a base da liberdade religiosa no Brasil."},
 {k:"txt",h:"Direitos trazem deveres",p:"A mesma liberdade que protege a sua fé protege a crença dos outros. Defender direitos **só para o seu grupo** não é defender direitos."},
 {k:"chat",who:"Fê",c:"#0CA678",q:"Esse negócio de direitos humanos só serve para defender bandido.",o:[
  {t:"Os direitos do art. 5º protegem você: o direito à vida, de não ser preso sem motivo, de ter a sua igreja aberta. Se valessem só para quem a gente gosta, amanhã poderiam não valer para nós.",v:2,r:"É, nunca pensei que isso também me protege.",tip:"Você mostrou que o direito de todos protege cada um."},
  {t:"É verdade, tinha que acabar com isso.",v:0,r:"E quando a polícia errar com você?",tip:"Sem garantias, qualquer um pode ser vítima do abuso."},
  {t:"Depende do caso.",v:1,r:"Que caso?",tip:"Seja claro: os direitos fundamentais valem para todos."}]},
 {k:"mentor",t:"No Sinai, a lei valia para o israelita e para o estrangeiro (Êx 12.49). Direito bom é o que protege a todos."}
 ]},

k3:{conf:"citar as leis que todo cidadão deve conhecer",
 mis:"Faça um pedido pela Lei de Acesso à Informação à prefeitura da sua cidade, por exemplo, sobre os gastos da escola do seu bairro.",
 s:[
 {k:"txt",h:"Leis que protegem o cidadão",p:"Algumas leis dão a qualquer pessoa o poder de **fiscalizar**, **se proteger** e **cobrar**. Conhecê-las vale mais que mil reclamações."},
 {k:"match",h:"Ligue a lei ao ano e ao que faz",pairs:[["Responsabilidade Fiscal (2000)","limita os gastos e a dívida dos governos"],["Ficha Limpa (2010)","barra candidatos condenados"],["Acesso à Informação (2011)","qualquer pessoa pode pedir dados públicos"],["Marco Civil da Internet (2014)","direitos e deveres na internet"]]},
 {k:"txt",tag:"2010",h:"A Ficha Limpa",p:"Nasceu de **iniciativa popular**, com mais de 1,6 milhão de assinaturas. Torna inelegível por 8 anos quem foi condenado por órgão colegiado por crimes como corrupção."},
 {k:"big",n:"20 dias",p:"é o prazo para o governo responder a um pedido pela Lei de Acesso à Informação, prorrogável por mais 10. Você não precisa explicar o motivo."},
 {k:"tf",q:"Para pedir uma informação pública, você precisa explicar por que quer saber.",a:false,e:"A LAI não exige justificativa. A informação pública é sua."},
 {k:"txt",h:"Outras que vale conhecer",p:"O **ECA** (1990) protege crianças e adolescentes. O **Código de Defesa do Consumidor** (1990) protege você nas compras. A **LRF** impede que governos gastem o que não têm."},
 {k:"verse"},
 {k:"pick",q:"Você quer saber quanto a prefeitura gastou com merenda. O que usar?",o:["Lei de Acesso à Informação","Marco Civil da Internet","ECA"],c:0,e:"Peça pelo portal da transparência ou pelo serviço de informação ao cidadão."},
 {k:"chat",who:"Rô",c:"#E8590C",q:"Fiscalizar governo é coisa de jornalista. Eu não tenho como.",o:[
  {t:"Tem sim: pela Lei de Acesso à Informação, qualquer pessoa pode pedir dados públicos, e o governo tem 20 dias para responder. Bora pedir os gastos da escola do bairro?",v:2,r:"Sério? Bora fazer isso juntos!",tip:"Você deu a ferramenta e chamou para a ação."},
  {t:"É, deixa os jornalistas.",v:0,r:"Mas eles não cobrem a minha cidade…",tip:"Por isso a lei existe: para qualquer cidadão fiscalizar."},
  {t:"Precisa de advogado pra isso.",v:1,r:"Ah, então não dá.",tip:"Não precisa: o pedido é simples e gratuito."}]},
 {k:"mentor",t:"Quando os justos se multiplicam, o povo se alegra (Pv 29.2). Use a lei para proteger o bem comum."}
 ]},

k4:{conf:"explicar como funcionam as eleições e o voto",
 mis:"Pesquise em quem você votaria para deputado federal, se fosse votar hoje, e por quê. Veja como ele votou em três projetos importantes.",
 s:[
 {k:"txt",h:"Um país, três níveis",p:"O Brasil é uma **federação**: a União, 26 estados, o Distrito Federal e milhares de municípios. Cada um tem governo e responsabilidades próprios."},
 {k:"big",n:"5.570",p:"municípios no Brasil. Cada um elege prefeito e vereadores."},
 {k:"match",h:"Ligue o cargo ao tipo de eleição",pairs:[["Presidente, governador e prefeito","majoritária, com 2º turno quando preciso"],["Senador","majoritária, sem 2º turno"],["Deputado e vereador","proporcional"]]},
 {k:"txt",h:"O voto proporcional",p:"Para deputado e vereador, os votos vão primeiro para o **partido ou federação**. Por isso, seu voto pode ajudar a eleger outro candidato da mesma lista. Escolha o partido também com cuidado."},
 {k:"tf",q:"Votar em branco ou anular ajuda o candidato que está em segundo.",a:false,e:"Brancos e nulos não entram nos votos válidos. Só tiram sua voz da escolha."},
 {k:"txt",h:"Quem pode votar",p:"O voto é **obrigatório** dos 18 aos 70 anos e **facultativo** aos 16 e 17 anos e depois dos 70."},
 {k:"verse"},
 {k:"order",h:"Como escolher um candidato",items:["Veja o caráter e a ficha","Leia as propostas","Veja como ele votou antes","Escolha também o partido"],e:"Na igreja primitiva, escolhiam homens de boa reputação (At 6.3)."},
 {k:"chat",who:"Mel",c:"#C2255C",q:"Vou votar no deputado que meu pastor indicou. Mais fácil.",o:[
  {t:"Ouvir conselho é bom, mas o voto é seu diante de Deus. Pesquisa a ficha, as propostas e como ele votou antes. Se for bom mesmo, você vota com convicção.",v:2,r:"Tá, vou dar uma olhada no histórico dele.",tip:"Você valorizou o conselho sem abrir mão da responsabilidade."},
  {t:"Pastor não devia falar de política.",v:1,r:"Ué, por que não?",tip:"O ponto é outro: cada um deve pesquisar e votar com consciência."},
  {t:"Isso é coisa de gado.",v:0,r:"Que ofensa…",tip:"Ofender não ajuda ninguém a votar melhor."}]},
 {k:"mentor",t:"O voto é uma mordomia que Deus te confia. Escolha com oração e informação."}
 ]},

r1:{conf:"contar a história do Brasil de 1500 a 1889",
 mis:"Pergunte aos mais velhos da sua família de onde vieram seus antepassados e monte uma linha do tempo simples.",
 s:[
 {k:"mentor",t:"Eu sou Débora. Julgava o povo debaixo de uma palmeira (Jz 4.5) e, depois da vitória, cantei a história de Israel (Jz 5). Quem conhece a própria história sabe para onde ir. Vamos contar a do Brasil?"},
 {k:"order",h:"Coloque em ordem",items:["Chegada de Cabral (1500)","Chegada dos jesuítas (1549)","Vinda da família real (1808)","Independência (1822)","Lei Áurea (1888)"],e:"Quase quatro séculos em cinco datas."},
 {k:"txt",h:"Fé e missão",p:"Os jesuítas, como Nóbrega e Anchieta, fundaram vilas e escolas e aprenderam línguas indígenas. Houve evangelização sincera e também abusos da colonização."},
 {k:"txt",h:"A grande ferida",p:"Milhões de africanos foram trazidos à força como escravos. O Brasil foi o **último país das Américas** a abolir a escravidão. Contar isso com honestidade é parte do amor à pátria."},
 {k:"txt",tag:"1822",h:"Independência e Império",p:"Em 7 de setembro, D. Pedro I proclamou a Independência. D. Pedro II reinou por quase 50 anos, com estabilidade e liberdade de imprensa raras na América Latina."},
 {k:"match",h:"Ligue a lei ao que ela fez",pairs:[["Eusébio de Queirós (1850)","proibiu o tráfico de escravos"],["Ventre Livre (1871)","libertou os filhos de escravas nascidos a partir dali"],["Áurea (1888)","aboliu a escravidão"]]},
 {k:"txt",tag:"1855",h:"Os evangélicos chegam",p:"O missionário escocês Robert Kalley chegou ao Rio em 1855 e fundou a Igreja Evangélica Fluminense em 1858, a primeira igreja evangélica de língua portuguesa no país."},
 {k:"verse"},
 {k:"chat",who:"Ana",c:"#7048E8",q:"O Brasil não tem nada para se orgulhar. Só escravidão e exploração.",o:[
  {t:"A escravidão foi um mal enorme e deve ser lembrada. Mas também temos o povo que lutou pela abolição, como Joaquim Nabuco e André Rebouças, a fé que chegou aqui e muita coisa bonita. Dá para lamentar o mal e honrar o bem.",v:2,r:"Eu não conhecia o André Rebouças.",tip:"Honestidade sobre o mal e gratidão pelo bem. Isso é patriotismo maduro."},
  {t:"Escravidão teve em todo lugar, não foi tão ruim.",v:0,r:"Como assim, não foi tão ruim?",tip:"Diminuir um mal desse tamanho é injusto e falso."},
  {t:"É, tem razão.",v:1,r:"Viu? Nem você defende.",tip:"Há muito a lamentar, mas também muito a honrar."}]},
 {k:"mentor",t:"Cante a história do seu povo com verdade, com as dores e as vitórias."}
 ]},

r2:{conf:"contar a história da República Velha e da Era Vargas",
 mis:"Descubra o nome de uma rua ou praça da sua cidade que homenageia alguém desta época e pesquise quem foi.",
 s:[
 {k:"txt",tag:"1889",h:"A República nasce de um golpe",p:"Em 15 de novembro de 1889, o marechal Deodoro da Fonseca derrubou o Império com o apoio de militares e fazendeiros. O povo, em grande parte, **assistiu sem entender**."},
 {k:"txt",h:"Café com leite",p:"Na República Velha, os presidentes se revezavam entre **São Paulo (café)** e **Minas Gerais (leite)**. O voto era aberto, e os coronéis controlavam os eleitores."},
 {k:"tf",q:"Na República Velha, o voto era secreto e as eleições eram limpas.",a:false,e:"O voto era aberto e havia o “voto de cabresto” controlado pelos coronéis."},

const mkOfTrack=t=>MKEYS.find(k=>MENTORS[k].t===t.id);
const trackOfMk=k=>TRACKS.find(t=>t.id===MENTORS[k].t);
function storyDone(id){return!!(S.story[id]&&S.story[id].done)}
function perfect(id){return(S.lessons[id]?.best||0)>=1}
function misDone(id){return!!(S.missions[id]&&S.missions[id].done)}
function lessonPts(id){return(storyDone(id)?1:0)+(passed(id)?1:0)+(perfect(id)?1:0)+(misDone(id)?1:0)}
function mPts(k){const t=trackOfMk(k);if(!t)return 0;return t.mods.reduce((a,id)=>a+lessonPts(id),0)}
function mStage(k){const p=mPts(k);let s=0;MSTAGE.forEach((v,i)=>{if(p>=v)s=i});return s}
function mVars(k){const M=MENTORS[k];return`--mc1:${M.c1};--mc2:${M.c2};--macc:${M.acc}`}
const art=(k,o)=>mArt(k,mStage(k),o);

function nextLessonAfter(id){const seq=TRACKS.flatMap(t=>t.mods),i=seq.indexOf(id),n=seq[i+1];return n&&trackUnlocked(trackOf(n))?n:null}

let DU=null;const DQT=15;
function duelPool(f){return TRACKS.filter(t=>f==="Tudo"||f==="Nível "+t.n).flatMap(t=>t.mods.flatMap(id=>MODS[id].quiz.map(q=>Object.assign({},q,{les:id}))))}
function viewDuelo(){
 if(DU&&DU.phase!=="setup")return renderDuel();
 const c=(DU&&DU.cfg)||{p:[S.name||"",""],f:"Tudo",n:5};DU={phase:"setup",cfg:c};
 app.innerHTML=`<a class="back" href="#debate">${IC.back} Debate</a>
 <section class="hero"><span class="eyebrow"><span class="rub">¶</span> 2 jogadores · 1 celular</span><h1>Duelo relâmpago</h1><p class="lead">Os dois respondem à mesma pergunta, um de cada vez, sem ver a resposta do outro. Acerto vale 100 pontos, e quem responde rápido ganha até 50 de bônus.</p></section>
 <div class="card stack"><label for="dp1" style="font-weight:600">Jogador 1</label><input type="text" id="dp1" maxlength="18" placeholder="Nome do jogador 1" value="${esc(c.p[0])}">
 <label for="dp2" style="font-weight:600">Jogador 2</label><input type="text" id="dp2" maxlength="18" placeholder="Nome do jogador 2" value="${esc(c.p[1])}">
 <span class="small" style="font-weight:600">Tema</span><div class="chips" role="group" aria-label="Tema">${["Tudo",...TRACKS.map(t=>"Nível "+t.n)].map(k=>`<button class="chip" aria-pressed="${c.f===k}" data-df="${k}">${k}</button>`).join("")}</div>
 <span class="small" style="font-weight:600">Perguntas</span><div class="chips" role="group" aria-label="Número de perguntas">${[5,7,10].map(n=>`<button class="chip" aria-pressed="${c.n===n}" data-dn="${n}">${n}</button>`).join("")}</div>
 <button class="btn pri block" id="dgo">Começar duelo</button></div>
 <p class="small muted">Duelos jogados: <b>${S.duels||0}</b>. Cada duelo vale 10 XP para quem é dono do celular, até 3 por dia.</p>`;
 const keep=()=>{c.p=[$("#dp1").value.trim(),$("#dp2").value.trim()]};
 app.querySelectorAll("[data-df]").forEach(b=>b.onclick=()=>{keep();c.f=b.dataset.df;viewDuelo()});
 app.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{keep();c.n=+b.dataset.dn;viewDuelo()});
 $("#dgo").onclick=()=>{keep();c.p=[c.p[0]||"Jogador 1",c.p[1]||"Jogador 2"];if(c.p[0]===c.p[1])c.p[1]+=" (2)";startDuel(c)};
}
function startDuel(c,first){const qs=shuf(duelPool(c.f)).slice(0,c.n).map(q=>Object.assign(q,{ord:shuf(q.o.map((_,i)=>i))}));DU={phase:"ready",cfg:c,qs,r:0,turn:0,first:first||0,score:[0,0],round:[]};renderDuel();window.scrollTo(0,0)}
function duelWho(){const o=DU.r%2===0?[DU.first,1-DU.first]:[1-DU.first,DU.first];return o[DU.turn]}
function stopDuelTimer(){if(DU&&DU.iv){clearInterval(DU.iv);DU.iv=null}}
function renderDuel(){
 stopDuelTimer();const c=DU.cfg,P=c.p,q=DU.qs[DU.r],sc=`<div class="card dscore"><div><b>${DU.score[0]}</b><span>${esc(P[0])}</span></div><span class="vs" style="width:44px;height:44px;font-size:.95rem">VS</span><div><b>${DU.score[1]}</b><span>${esc(P[1])}</span></div></div>`;
 const head=`<a class="back" href="#debate" id="dleave">${IC.back} Sair do duelo</a>`;
 if(DU.phase==="ready"){const w=duelWho();
  app.innerHTML=`${head}${sc}<div class="card dturn"><span class="eyebrow">Pergunta ${DU.r+1} de ${DU.qs.length}</span><h2>Vez de ${esc(P[w])}</h2><p class="muted">Passe o celular para ${esc(P[w])}. ${DU.turn===0?"O outro jogador não pode olhar!":"Sem espiar a resposta anterior!"}</p><button class="btn pri" id="dready">Estou pronto, mostrar pergunta</button></div>`;
  $("#dready").onclick=()=>{DU.phase="q";DU.t0=0;renderDuel();window.scrollTo(0,0)};
 }else if(DU.phase==="q"){const w=duelWho();
  app.innerHTML=`${head}<div class="card stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(P[w])} · pergunta ${DU.r+1} de ${DU.qs.length}</span><b id="dsec" style="font-variant-numeric:tabular-nums">${DQT}s</b></div><div class="dtimer" aria-hidden="true"><i id="dbar"></i></div>
  <h3 style="font-size:1.12rem">${esc(q.q)}</h3><div class="stack" style="gap:8px">${q.ord.map(j=>`<button class="opt" data-dq="${j}">${esc(q.o[j])}</button>`).join("")}</div></div>`;
  DU.t0=performance.now();
  const tick=()=>{const left=Math.max(0,DQT-(performance.now()-DU.t0)/1000),b=$("#dbar"),s=$("#dsec");if(b)b.style.transform=`scaleX(${left/DQT})`;if(s)s.textContent=Math.ceil(left)+"s";if(left<=0)duelAnswer(null)};
  DU.iv=setInterval(tick,100);tick();
  app.querySelectorAll("[data-dq]").forEach(b=>b.onclick=()=>duelAnswer(+b.dataset.dq));
 }else if(DU.phase==="reveal"){const R=DU.round[DU.r];
  app.innerHTML=`${head}${sc}<div class="card stack"><span class="eyebrow">Resposta certa</span><h3 style="font-size:1.08rem">${esc(q.q)}</h3><div class="explain"><b>${esc(q.o[q.c])}</b><br>${esc(q.e)}</div>
  <div class="dans">${[0,1].map(p=>{const a=R[p],ok=a&&a.pick===q.c;return`<div class="${ok?"ok":"no"}"><b>${esc(P[p])}</b><span class="small">${a&&a.pick!=null?esc(q.o[a.pick]):"Tempo esgotado"}</span><p style="font-weight:800;margin-top:4px">+${a?a.pts:0}</p></div>`}).join("")}</div>
  <button class="btn pri block" id="dnext">${DU.r+1<DU.qs.length?"Próxima pergunta":"Ver resultado"}</button></div>`;
  $("#dnext").onclick=()=>{if(DU.r+1<DU.qs.length){DU.r++;DU.turn=0;DU.phase="ready"}else DU.phase="final";renderDuel();window.scrollTo(0,0)};
 }else if(DU.phase==="final"){
  if(!DU.paid){DU.paid=1;S.duels=(S.duels||0)+1;const k=today();S.duelDay[k]=(S.duelDay[k]||0)+1;if(S.duelDay[k]<=3)gain(10,"duelo jogado");else save()}
  const[a,b]=DU.score,win=a===b?null:a>b?0:1;
  app.innerHTML=`${head}<div class="card dturn"><span class="eyebrow">Fim do duelo</span><h2>${win==null?"Empate!":esc(P[win])+" venceu!"}</h2>${sc}<p class="muted">${win==null?"Ninguém sai perdendo: os dois treinaram.":`${esc(P[1-win])}, a revanche está a um toque.`}</p>
  <div class="row" style="justify-content:center"><button class="btn pri" id="drev">Revanche</button><button class="btn" id="dnew">Novo duelo</button></div></div>`;
  $("#drev").onclick=()=>startDuel(DU.cfg,1-DU.first);$("#dnew").onclick=()=>{DU={phase:"setup",cfg:DU.cfg};viewDuelo()};
 }
 const lv=$("#dleave");if(lv)lv.onclick=e=>{e.preventDefault();stopDuelTimer();DU={phase:"setup",cfg:DU.cfg};location.hash="#debate"};
}
function duelAnswer(pick){
 if(!DU||DU.phase!=="q")return;stopDuelTimer();if(location.hash!=="#duelo")return;const q=DU.qs[DU.r],w=duelWho(),left=Math.max(0,DQT-(performance.now()-DU.t0)/1000);
 const pts=pick===q.c?100+Math.round(50*left/DQT):0;(DU.round[DU.r]=DU.round[DU.r]||[])[w]={pick,pts};DU.score[w]+=pts;
 if(DU.turn===0){DU.turn=1;DU.phase="ready"}else DU.phase="reveal";renderDuel();window.scrollTo(0,0);
}

function stKey(e){

 if(e.key==="Escape"){e.preventDefault();closeStory();return}
 if(e.key==="Tab"){const f=[...document.querySelectorAll("#story button:not([disabled]),#story a[href],#story input")].filter(x=>x.offsetParent!==null);if(!f.length)return;const i=f.indexOf(document.activeElement);
  if(i===-1||(e.shiftKey&&i===0)||(!e.shiftKey&&i===f.length-1)){e.preventDefault();(e.shiftKey?f[i===-1?f.length-1:f.length-1]:f[0]).focus()}return}

}

const BK={"Gn":"Gênesis","Êx":"Êxodo","Dt":"Deuteronômio","Jó":"Jó","Sl":"Salmo","Is":"Isaías","Jr":"Jeremias","Ez":"Ezequiel","Dn":"Daniel","Mt":"Mateus","Mc":"Marcos","Lc":"Lucas","Jo":"João","At":"Atos","Rm":"Romanos","Co":"Coríntios","Gl":"Gálatas","Ef":"Efésios","Fp":"Filipenses","Cl":"Colossenses","Tm":"Timóteo","Tt":"Tito","Hb":"Hebreus","Tg":"Tiago","Pe":"Pedro","Ap":"Apocalipse"};

function ttsPrep(t){

 return String(t).replace(/\*\*|(^|\s)_|_(?=\W|$)/g,"$1")
  .replace(/(^|[\s(“"])([123]) (Co|Tm|Pe|Jo) (\d+)\.(\d+)(?:-(\d+))?/g,(m,p,n,b,c,v,w)=>`${p}${["","Primeira","Segunda","Terceira"][n]} ${BK[b]} ${vs(c,v,w)}`)
  .replace(/(^|[\s(“"])(Gn|Êx|Dt|Jó|Sl|Is|Jr|Ez|Dn|Mt|Mc|Lc|Jo|At|Rm|Gl|Ef|Fp|Cl|Tt|Hb|Tg|Ap) (\d+)\.(\d+)(?:-(\d+))?/g,(m,p,b,c,v,w)=>`${p}${BK[b]} ${vs(c,v,w)}`)
  .replace(/séc\. I-II/g,"séculos um e dois").replace(/séc(?:ulo|\.) (XIX|XX|XXI|II|I)\b/g,(m,r)=>"século "+ROM[r])

function bindSlide(s){

  const isP=s.k==="prova",qq=isP?ST.m.quiz[s.qi]:s,A=isP?ST.prova.ans[s.qi]:ST.ans[ST.i],right=s.k==="tf"?(s.a?1:0):qq.c,st=mStage(ST.mk);

  b.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>{
   if(A.done||(A.pick!=null&&!A.retry))return;const j=+x.dataset.o;A.pick=j;A.ok=j===right;
   if(!isP&&A.ok&&!A.wrongOnce&&once("s"+ST.i))stXP(2,"acerto");

   reveal()});
  const hb=q("#hintB");if(hb)hb.onclick=()=>{const w=qq.o.map((_,j)=>j).filter(j=>j!==right&&!A.elim.includes(j));if(!w.length)return;A.elim.push(w[Math.floor(Math.random()*w.length)]);ST.hint=true;A.hint=true;render()};

 let cur=h;
 if(h.startsWith("m-")){cur="trilha";viewModule(h.slice(2))}
 else if(h==="trilha")viewTrilha();
 else if(h==="tempo")viewTempo();
 else if(h==="cards")viewCards();
 else if(h==="debate")viewDebate();
 else if(h==="duelo"){cur="debate";viewDuelo()}
 else if(h==="livros")viewLivros();
 else if(h==="perfil")viewPerfil();
 else if(!FEAT()&&(h==="album"||h==="mentores"||h.startsWith("mentor-"))){cur="inicio";viewHome()}
 else if(h==="album"){cur="inicio";viewAlbum()}
 else if(h==="mentores"){cur="inicio";viewMentores()}
 else if(h.startsWith("mentor-")){cur="inicio";viewMentor(h.slice(7))}
 else{cur="inicio";viewHome()}
 tabs(cur);hdr();
}
function route(){
 const h=(location.hash||"#inicio").slice(1);
 if(!C||h==="escolher"){if(ST)closeStory(false);document.querySelectorAll(".figmodal").forEach(x=>x.remove());stopDuelTimer();setBrand();viewEscolher();return}
 document.body.classList.remove("gate");
 if(h.startsWith("s-")){
  const id=h.slice(2);if(ST&&ST.id===id)return;if(ST)closeStory(false);
  const from=lastNonStory||"#trilha";renderView(from.slice(1));openStory(id,from);return;
 }
 if(ST)closeStory(false);
 lastNonStory="#"+h;renderView(h);
 if(!/^m-/.test(h))maybeEvo();
}
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{if(location.hash!==lastHash){const was=lastHash;lastHash=location.hash;if(location.hash!=="#debate")DB=null;route();
 if(/^#s-/.test(location.hash))return;
 if(/^#s-/.test(was)&&restoreY!=null&&("#"+(location.hash||"#inicio").slice(1))===lastNonStory){const y=restoreY;restoreY=null;requestAnimationFrame(()=>window.scrollTo(0,y))}else window.scrollTo(0,0)}});
normState();
applyLook();
setBrand();
route();
initDB();initSample();
</script>
