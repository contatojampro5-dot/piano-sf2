q4:{title:"O STF e o debate sobre ativismo",min:10,
 sum:"Como se escolhe um ministro do Supremo, a composição atual e o debate sobre os limites da Corte.",
 verse:{t:"Não torcerás a justiça, não farás acepção de pessoas.",r:"Dt 16.19"},
 body:`<h3>Como se chega ao STF</h3>
<p>O presidente indica um cidadão de 35 a 70 anos, de "notável saber jurídico e reputação ilibada". O indicado passa por sabatina na CCJ do Senado e precisa da aprovação da maioria absoluta dos senadores (41 votos). Os ministros ficam até a aposentadoria compulsória, aos 75 anos.</p>
<p>Em 2026 há uma vaga aberta: Luís Roberto Barroso se aposentou em outubro de 2025, e o Senado <b>rejeitou</b> em abril de 2026 a indicação de Jorge Messias. A presidência da Corte está com Edson Fachin (biênio 2025-2027), com Alexandre de Moraes como vice. A lista completa está no painel Quem é quem.</p>
<h3>O que o STF faz</h3>
<ul>
<li>Julga se leis e atos são constitucionais (ADI, ADC, ADPF).</li>
<li>Julga criminalmente o presidente, parlamentares e ministros (foro privilegiado).</li>
<li>Decide recursos que envolvem a Constituição, com repercussão para todo o país.</li>
</ul>
<h3>O debate: guardião ou legislador?</h3>
<p>Uma das maiores críticas da direita é o <b>ativismo judicial</b>: quando juízes decidem temas que caberiam ao Congresso. Exemplos que costumam ser citados:</p>
<ul>
<li>o <b>inquérito das fake news</b> (2019), aberto pelo próprio tribunal, sem pedido do Ministério Público;</li>
<li>a decisão que deixou de tratar como crime o porte de maconha para uso pessoal (2024);</li>
<li>a ampliação da responsabilidade das redes sociais pelo conteúdo dos usuários, ao julgar o Marco Civil da Internet (2025).</li>
</ul>
<p>Quem defende o STF responde que a Corte só age quando provocada ou quando o Congresso se omite, e que proteger a Constituição às vezes exige contrariar a maioria. Conheça os dois lados. A posição conservadora clássica é a da <b>autocontenção judicial</b>: juiz interpreta a lei, não a escreve; mudanças profundas devem passar pelos representantes eleitos.</p>
<div class="box">Critique decisões com argumentos jurídicos e respeito à instituição. Pedir o fechamento do Supremo ou atacar ministros pessoalmente enfraquece a crítica séria e o próprio Estado de direito que você quer proteger.</div>`,
 pr:{q:"\"Criticar o STF é atacar a democracia.\"",a:"\"Criticar uma decisão não é atacar a instituição. Juristas de vários lados criticam o inquérito das fake news, por exemplo, porque o próprio tribunal investiga, acusa e julga. Na democracia, toda autoridade pode ser criticada com argumentos, inclusive juízes. O que não pode é violência ou desrespeito à lei. Eu quero um STF forte, mas que respeite o espaço do Congresso.\""},
 quiz:[
  {q:"Quem aprova os ministros indicados ao STF?",o:["A Câmara","O Senado, por maioria absoluta","O povo, por plebiscito","O próprio STF"],c:1,e:"Depois de sabatina na CCJ."},
  {q:"Até que idade um ministro do STF pode ficar no cargo?",o:["65 anos","70 anos","75 anos","Sem limite"],c:2,e:"Aposentadoria compulsória aos 75 (EC 88/2015)."},
  {q:"O que é \"ativismo judicial\" na crítica conservadora?",o:["Juízes que fazem protestos","Juízes decidindo temas que caberiam ao Legislativo","Juízes que trabalham muito","Juízes eleitos"],c:1,e:"A alternativa defendida é a autocontenção judicial."},
  {q:"Qual a forma correta de criticar o STF?",o:["Pedir o fechamento da Corte","Ataques pessoais aos ministros","Argumentos jurídicos, com respeito à instituição","Não criticar nunca"],c:2,e:"Crítica séria fortalece o Estado de direito."}
 ]},

k1:{title:"A Constituição de 1988",min:8,
 sum:"Como nasceu a \"Constituição Cidadã\", sua estrutura e os fundamentos da República.",
 verse:{t:"Todo o poder emana do povo, que o exerce por meio de representantes eleitos ou diretamente, nos termos desta Constituição.",r:"Constituição, art. 1º, parágrafo único"},
 body:`<h3>Como nasceu</h3>
<p>Depois de 21 anos de regime militar, uma Assembleia Constituinte trabalhou de 1987 a 1988. A Constituição foi promulgada em <b>5 de outubro de 1988</b>. Ulysses Guimarães, presidente da Constituinte, a chamou de "Constituição Cidadã". É a sétima Constituição do Brasil (1824, 1891, 1934, 1937, 1946, 1967 e 1988).</p>
<p>Ela é longa e detalhada: 245 artigos no texto principal, além do Ato das Disposições Constitucionais Transitórias, e já recebeu mais de 130 emendas.</p>
<h3>O preâmbulo</h3>
<p>O texto começa dizendo que foi promulgado "sob a proteção de Deus". O STF já decidiu que o preâmbulo não tem força de norma, mas ele mostra a tradição do país.</p>
<h3>Os fundamentos (art. 1º)</h3>
<ol><li>a soberania;</li><li>a cidadania;</li><li>a <b>dignidade da pessoa humana</b>;</li><li>os valores sociais do trabalho e da <b>livre iniciativa</b>;</li><li>o pluralismo político.</li></ol>
<h3>Estrutura em grandes blocos</h3>
<ul>
<li><b>Títulos I e II:</b> princípios e direitos fundamentais (o art. 5º está aqui).</li>
<li><b>Títulos III e IV:</b> organização do Estado (União, estados, municípios) e dos Poderes.</li>
<li><b>Título VI:</b> tributação e orçamento.</li>
<li><b>Título VII:</b> ordem econômica, que garante a propriedade privada e a livre concorrência (art. 170).</li>
<li><b>Título VIII:</b> ordem social: saúde, educação, família, comunicação.</li>
</ul>
<div class="box">A Constituição tem pontos que conservadores celebram (dignidade humana, livre iniciativa, propriedade, família como base da sociedade) e pontos que muitos criticam (excesso de detalhes, gastos obrigatórios, poderes amplos ao Judiciário). Conheça o texto antes de opinar.</div>`,
 pr:{q:"\"A Constituição é coisa da esquerda.\"",a:"\"Ela tem de tudo, porque foi feita por uma Constituinte com gente de todos os lados. Logo no art. 1º ela põe como fundamentos a dignidade da pessoa humana e a livre iniciativa. O art. 5º garante propriedade e liberdade religiosa, e o art. 226 diz que a família é a base da sociedade. Muita coisa que a gente defende está escrita lá. Dá pra criticar partes, mas vale conhecer antes.\""},
 quiz:[
  {q:"Quando foi promulgada a Constituição atual?",o:["7 de setembro de 1822","15 de novembro de 1889","5 de outubro de 1988","1º de janeiro de 2000"],c:2,e:"Chamada de \"Constituição Cidadã\" por Ulysses Guimarães."},
  {q:"Qual destes é um fundamento da República (art. 1º)?",o:["O socialismo","A dignidade da pessoa humana","A religião oficial","O voto facultativo"],c:1,e:"Junto com soberania, cidadania, trabalho e livre iniciativa, e pluralismo político."},
  {q:"Quantas Constituições o Brasil já teve?",o:["3","5","7","10"],c:2,e:"1824, 1891, 1934, 1937, 1946, 1967 e 1988."}
 ]},

k2:{title:"Seus direitos: o art. 5º",min:9,
 sum:"Os direitos e garantias que protegem você, inclusive contra o próprio Estado, e as ferramentas para defendê-los.",
 verse:{t:"Todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade.",r:"Constituição, art. 5º"},
 body:`<p>Repare nos cinco direitos do começo do art. 5º: <b>vida, liberdade, igualdade, segurança e propriedade</b>. É quase a lista de John Locke, pai do liberalismo clássico (vida, liberdade e propriedade).</p>
<h3>Incisos que você deve saber de cor</h3>
<ul>
<li><b>II:</b> ninguém é obrigado a fazer ou deixar de fazer algo senão em virtude de lei.</li>
<li><b>IV:</b> é livre a manifestação do pensamento, sendo vedado o anonimato.</li>
<li><b>VI:</b> é inviolável a liberdade de consciência e de crença.</li>
<li><b>VIII:</b> ninguém perde direitos por crença religiosa ou convicção filosófica ou política.</li>
<li><b>IX:</b> é livre a expressão intelectual, artística, científica e de comunicação, independentemente de censura ou licença.</li>
<li><b>XI:</b> a casa é asilo inviolável.</li>
<li><b>XVI:</b> todos podem se reunir pacificamente, sem armas.</li>
<li><b>XXII:</b> é garantido o direito de propriedade.</li>
<li><b>XXXIX:</b> não há crime sem lei anterior que o defina.</li>
<li><b>LIV e LV:</b> devido processo legal, contraditório e ampla defesa.</li>
<li><b>LVII:</b> ninguém será considerado culpado até o trânsito em julgado (presunção de inocência).</li>
</ul>
<h3>As ferramentas (remédios constitucionais)</h3>
<ul>
<li><b>Habeas corpus:</b> contra prisão ou ameaça ilegal à liberdade de locomoção.</li>
<li><b>Mandado de segurança:</b> contra ato ilegal de autoridade que fere direito líquido e certo.</li>
<li><b>Habeas data:</b> para conhecer ou corrigir seus dados em órgãos públicos.</li>
<li><b>Ação popular:</b> qualquer cidadão pode pedir a anulação de ato que lese o patrimônio público, a moralidade ou o meio ambiente.</li>
</ul>
<h3>Direitos valem para todos</h3>
<p>A liberdade de expressão que você exige para si vale também para quem discorda de você. Defender o devido processo legal e a presunção de inocência inclusive para adversários políticos é o que dá autoridade moral para cobrar o mesmo quando o atingido for alguém do seu lado.</p>
<div class="box">Os direitos e garantias individuais são cláusula pétrea: nenhuma emenda constitucional pode aboli-los (art. 60, §4º, IV).</div>`,
 pr:{q:"\"Liberdade de expressão não é absoluta, então o governo pode decidir o que é proibido falar.\"",a:"\"Ela não é absoluta mesmo: calúnia, ameaça e incitação ao crime são punidas, e a Constituição proíbe o anonimato. Mas quem define o limite é a lei, aprovada pelo Congresso, e não a vontade de quem está no poder. O art. 5º, IX, diz que a expressão é livre independentemente de censura. O limite é punir abusos depois, com devido processo, não calar antes.\""},
 quiz:[
  {q:"Quais cinco direitos abrem o art. 5º?",o:["Saúde, educação, moradia, lazer e trabalho","Vida, liberdade, igualdade, segurança e propriedade","Voto, partido, greve, imprensa e religião","Paz, amor, fé, esperança e caridade"],c:1,e:"Quase a lista de Locke."},
  {q:"Qual remédio constitucional protege contra prisão ilegal?",o:["Habeas data","Mandado de injunção","Habeas corpus","Ação popular"],c:2,e:"Habeas corpus: liberdade de locomoção."},
  {q:"Qual inciso garante a presunção de inocência?",o:["II","VI","LVII","XXII"],c:2,e:"Ninguém é culpado até o trânsito em julgado."},
  {q:"Qualquer cidadão pode pedir a anulação de ato que lese o patrimônio público por meio de:",o:["Ação popular","Habeas corpus","Medida provisória","PEC"],c:0,e:"Art. 5º, LXXIII."}
 ]},

k3:{title:"Leis que todo cidadão deve conhecer",min:9,
 sum:"Responsabilidade Fiscal, Ficha Limpa, Acesso à Informação, Marco Civil, ECA e outras.",
 verse:{t:"Quando os justos se multiplicam, o povo se alegra; quando o perverso domina, o povo suspira.",r:"Pv 29.2"},
 body:`<h3>Lei de Responsabilidade Fiscal (LC 101/2000)</h3>
<p>Obriga governos a não gastar mais do que arrecadam, limita gastos com pessoal e dívidas e pune o descumprimento. Aprovada no governo FHC; o PT votou contra na época. Foi a base das "pedaladas fiscais" que levaram ao impeachment de Dilma Rousseff em 2016.</p>
<h3>Lei da Ficha Limpa (LC 135/2010)</h3>
<p>Nasceu de um projeto de iniciativa popular com mais de um milhão de assinaturas. Torna inelegível por 8 anos quem foi condenado por órgão colegiado (tribunal) em crimes como corrupção, lavagem de dinheiro e abuso de poder.</p>
<h3>Lei de Acesso à Informação (Lei 12.527/2011)</h3>
<p>Sua arma de fiscalização. Qualquer pessoa pode pedir informações a órgãos públicos, sem explicar o motivo. O prazo de resposta é de 20 dias, prorrogáveis por mais 10. Dá para descobrir gastos, contratos e salários.</p>
<h3>Marco Civil da Internet (Lei 12.965/2014)</h3>
<p>Define direitos e deveres na internet: neutralidade da rede, privacidade e regras de remoção de conteúdo. Em 2025, o STF ampliou a responsabilidade das plataformas pelo conteúdo dos usuários, decisão criticada por defensores da liberdade de expressão.</p>
<h3>Estatuto da Criança e do Adolescente (Lei 8.069/1990)</h3>
<p>Protege crianças e adolescentes. Conhecido pelas regras sobre medidas socioeducativas para menores que cometem atos infracionais, um tema de debate sobre a redução da maioridade penal.</p>
<h3>Outras que vale conhecer</h3>
<ul>
<li><b>Código de Defesa do Consumidor</b> (Lei 8.078/1990): seus direitos ao comprar.</li>
<li><b>Lei de Diretrizes e Bases da Educação</b> (Lei 9.394/1996): organiza a educação no país.</li>
<li><b>Lei Anticorrupção</b> (Lei 12.846/2013): pune empresas que corrompem agentes públicos.</li>
<li><b>Lei Maria da Penha</b> (Lei 11.340/2006): combate à violência doméstica contra a mulher.</li>
</ul>
<div class="box">Desafio: faça um pedido pela Lei de Acesso à Informação à sua prefeitura (por exemplo, quanto se gastou com merenda escolar no ano passado). Cidadania se aprende praticando.</div>`,
 pr:{q:"\"Lei no Brasil não pega, não adianta nada.\"",a:"\"Algumas não pegam mesmo, mas outras mudaram o país. A Lei de Responsabilidade Fiscal colocou limite em gasto de governo. A Ficha Limpa, que nasceu de assinatura popular, tirou muito candidato condenado da eleição. E a Lei de Acesso à Informação deixa qualquer um de nós perguntar à prefeitura quanto ela gastou com qualquer coisa. Quer testar comigo?\""},
 quiz:[
  {q:"Qual lei obriga governos a não gastar mais do que arrecadam?",o:["Ficha Limpa","Lei de Responsabilidade Fiscal (LC 101/2000)","ECA","Marco Civil"],c:1,e:"Aprovada no governo FHC, em 2000."},
  {q:"A Lei da Ficha Limpa nasceu como:",o:["Medida provisória","Projeto de iniciativa popular","Decisão do STF","Decreto"],c:1,e:"Com mais de um milhão de assinaturas."},
  {q:"Qual o prazo de resposta pela Lei de Acesso à Informação?",o:["1 dia","20 dias, prorrogáveis por mais 10","1 ano","Não há prazo"],c:1,e:"E não é preciso explicar o motivo do pedido."}
 ]},

k4:{title:"Federalismo, eleições e voto",min:8,
 sum:"União, estados e municípios, como funcionam as eleições e por que o voto para deputado importa tanto.",
 verse:{t:"Escolhei dentre vós homens de boa reputação, cheios do Espírito e de sabedoria.",r:"At 6.3"},
 body:`<h3>A federação</h3>
<p>O Brasil é uma federação: União, 26 estados, o Distrito Federal e cerca de 5.570 municípios, cada um com autonomia e competências próprias. Na prática, a União concentra a maior parte da arrecadação, e muitos municípios dependem de repasses federais. Conservadores costumam defender mais autonomia local: quanto mais perto do cidadão, melhor a fiscalização (subsidiariedade).</p>
<h3>Quem vota</h3>
<ul><li><b>Obrigatório:</b> dos 18 aos 70 anos.</li><li><b>Facultativo:</b> de 16 e 17 anos, acima de 70 e para analfabetos.</li></ul>
<h3>Dois sistemas de eleição</h3>
<ul>
<li><b>Majoritário:</b> presidente, governador, prefeito e senador. Vence quem tem mais votos. Para presidente, governador e prefeito de cidades com mais de 200 mil eleitores, há 2º turno se ninguém passar de 50% dos votos válidos.</li>
<li><b>Proporcional:</b> deputados e vereadores. As cadeiras são divididas conforme os votos de cada partido (quociente eleitoral). Por isso o seu voto num candidato pode ajudar a eleger outro do mesmo partido.</li>
</ul>
<h3>Reeleição e mandatos</h3>
<p>Desde 1997 (Emenda Constitucional 16), presidente, governadores e prefeitos podem ser reeleitos uma vez seguida. Mandatos de 4 anos, exceto senadores (8).</p>
<h3>Como escolher bem</h3>
<ol>
<li>Pesquise o histórico: projetos apresentados e votos nominais no site da Câmara e do Senado.</li>
<li>Veja o partido, já que no sistema proporcional ele importa.</li>
<li>Avalie princípios, não só simpatia.</li>
<li>Depois da eleição, acompanhe e cobre.</li>
</ol>`,
 pr:{q:"\"Voto em pessoa, não em partido.\"",a:"\"Faz sentido escolher a pessoa, mas para deputado o partido conta muito. No sistema proporcional, os votos vão primeiro para o partido, que distribui as cadeiras entre os mais votados dele. Então você pode votar num candidato ótimo e ajudar a eleger um outro do mesmo partido que você não aprovaria. Vale olhar os dois.\""},
 quiz:[
  {q:"Para quem o voto é facultativo?",o:["Só para mulheres","Jovens de 16 e 17 anos, maiores de 70 e analfabetos","Servidores públicos","Ninguém"],c:1,e:"Obrigatório dos 18 aos 70."},
  {q:"Deputados e vereadores são eleitos pelo sistema:",o:["Majoritário","Proporcional","Sorteio","Indireto"],c:1,e:"Cadeiras divididas conforme os votos dos partidos."},
  {q:"Desde quando é permitida a reeleição para presidente?",o:["1889","1946","1997","2016"],c:2,e:"Emenda Constitucional 16, de 1997."}
 ]},

r1:{title:"Colônia e Império (1500-1889)",min:10,
 sum:"Descobrimento, missões, escravidão, Independência, os dois imperadores e a abolição.",
 verse:{t:"Bem-aventurada é a nação cujo Deus é o Senhor.",r:"Sl 33.12"},
 body:`<h3>A Colônia (1500-1822)</h3>
<ul>
<li><b>1500:</b> a frota de Pedro Álvares Cabral chega ao Brasil. A primeira missa é celebrada em 26 de abril.</li>
<li><b>Capitanias hereditárias</b> (1534) e depois o Governo-Geral (1549), com Tomé de Sousa e os primeiros jesuítas (Manuel da Nóbrega; depois José de Anchieta, que fundou o colégio que deu origem a São Paulo, em 1554).</li>
<li><b>Ciclos econômicos:</b> pau-brasil, açúcar, ouro (Minas Gerais, século XVIII).</li>
<li><b>Escravidão:</b> o Brasil recebeu cerca de 4,8 milhões de africanos escravizados, o maior número das Américas, e foi o último país do continente a abolir a escravidão.</li>
<li><b>1789:</b> Inconfidência Mineira; Tiradentes é executado em 1792.</li>
<li><b>1808:</b> a família real portuguesa foge de Napoleão e se instala no Rio de Janeiro. Abertura dos portos.</li>
</ul>
<h3>O Império (1822-1889)</h3>
<ul>
<li><b>7 de setembro de 1822:</b> D. Pedro I proclama a Independência.</li>
<li><b>1824:</b> primeira Constituição, outorgada pelo imperador, com o <b>Poder Moderador</b> e o catolicismo como religião oficial.</li>
<li><b>1831-1840:</b> Período Regencial, com revoltas em várias províncias.</li>
<li><b>1840-1889:</b> D. Pedro II governa quase 50 anos; era de relativa estabilidade e parlamentarismo à moda brasileira.</li>
<li><b>1864-1870:</b> Guerra do Paraguai, o maior conflito da América do Sul.</li>
</ul>
<h3>O caminho até a abolição</h3>
<p>Lei Eusébio de Queirós (1850, fim do tráfico), Lei do Ventre Livre (1871), Lei dos Sexagenários (1885) e, enfim, a <b>Lei Áurea</b>, assinada pela princesa Isabel em 13 de maio de 1888. Muitos abolicionistas usavam argumentos cristãos; ao mesmo tempo, muitos senhores de escravos se diziam cristãos. É uma história para contar com honestidade.</p>
<h3>Os evangélicos chegam</h3>
<p>O missionário escocês Robert Kalley chegou em 1855 e fundou a Igreja Evangélica Fluminense (1858). O presbiteriano americano Ashbel Green Simonton chegou em 1859. Logo vieram metodistas e batistas.</p>`,
 pr:{q:"\"O Brasil não tem nada de cristão, foi só exploração.\"",a:"\"Houve muita exploração, principalmente a escravidão, que foi uma tragédia e um pecado. Mas também houve missionários que defendiam os indígenas, como Anchieta, abolicionistas que usavam a Bíblia, e a primeira missa logo na chegada. A história é misturada: tem culpa e tem graça. Contar só um lado, seja qual for, é contar errado.\""},
 quiz:[
  {q:"Quando foi proclamada a Independência do Brasil?",o:["22 de abril de 1500","7 de setembro de 1822","15 de novembro de 1889","13 de maio de 1888"],c:1,e:"Por D. Pedro I."},
  {q:"O que foi o Poder Moderador?",o:["Um partido político","Um quarto poder do imperador, previsto na Constituição de 1824","O Senado","A polícia do Império"],c:1,e:"Permitia ao imperador intervir nos outros poderes."},
  {q:"Qual lei aboliu a escravidão no Brasil?",o:["Lei do Ventre Livre (1871)","Lei Eusébio de Queirós (1850)","Lei Áurea (1888)","Lei dos Sexagenários (1885)"],c:2,e:"Assinada pela princesa Isabel em 13 de maio de 1888."},
  {q:"Quem fundou a primeira igreja evangélica de língua portuguesa no Brasil (1858)?",o:["Martinho Lutero","Robert Kalley","John Wesley","Ashbel Simonton"],c:1,e:"A Igreja Evangélica Fluminense, no Rio de Janeiro."}
 ]},

r2:{title:"República Velha e Era Vargas (1889-1945)",min:10,
 sum:"Proclamação da República, café com leite, Revolução de 1930 e o Estado Novo.",
 verse:{t:"Se o Senhor não edificar a casa, em vão trabalham os que a edificam.",r:"Sl 127.1"},
 body:`<h3>A Proclamação</h3>
<p>Em <b>15 de novembro de 1889</b>, um golpe militar liderado pelo marechal Deodoro da Fonseca derrubou a monarquia, sem participação popular. A Constituição de 1891 separou Igreja e Estado e criou o federalismo e o presidencialismo.</p>
<h3>A República Velha (1889-1930)</h3>
<ul>
<li><b>Política do café com leite:</b> São Paulo (café) e Minas Gerais (leite) se revezavam na Presidência.</li>
<li><b>Coronelismo e voto de cabresto:</b> o voto era aberto, e chefes locais controlavam os eleitores.</li>
<li><b>Revoltas:</b> Canudos (1896-1897), Revolta da Vacina (1904), Revolta da Chibata (1910), tenentismo (anos 1920).</li>
</ul>
<h3>A Era Vargas (1930-1945)</h3>
<ul>
<li><b>Revolução de 1930:</b> Getúlio Vargas chega ao poder e impede a posse do presidente eleito, Júlio Prestes.</li>
<li><b>1932:</b> Revolução Constitucionalista em São Paulo; no mesmo ano, o Código Eleitoral cria o voto secreto e o voto feminino.</li>
<li><b>1934:</b> nova Constituição; Vargas é eleito pelo Congresso.</li>
<li><b>1935:</b> Intentona Comunista.</li>
<li><b>1937-1945:</b> <b>Estado Novo</b>, a ditadura de Vargas: Congresso fechado, censura (DIP), perseguição a opositores de esquerda e de direita.</li>
<li><b>1943:</b> Consolidação das Leis do Trabalho (CLT), com influência da Carta del Lavoro do fascismo italiano (o tamanho dessa influência é debatido por historiadores).</li>
<li><b>1944-1945:</b> a Força Expedicionária Brasileira (FEB) luta na Itália contra o nazifascismo.</li>
</ul>
<h3>O integralismo</h3>
<p>A Ação Integralista Brasileira (1932), de Plínio Salgado, usava o lema "Deus, Pátria e Família", mas era um movimento de inspiração fascista, com uniforme, culto ao chefe e milícia. Tentou um golpe contra Vargas em 1938. É um exemplo de como bons valores podem ser sequestrados por uma ideologia autoritária. A direita conservadora defende Deus, pátria e família <b>com</b> liberdade, Estado limitado e democracia.</p>`,
 pr:{q:"\"Getúlio foi o pai dos pobres, o melhor presidente do Brasil.\"",a:"\"Ele criou direitos trabalhistas que muita gente valoriza, isso é verdade. Mas também foi ditador de 1937 a 1945: fechou o Congresso, censurou a imprensa e perseguiu opositores. A CLT teve influência da lei trabalhista do fascismo italiano. Dá pra reconhecer o que ele fez e ao mesmo tempo dizer que não precisamos de um 'pai' no poder, e sim de instituições livres.\""},
 quiz:[
  {q:"Quem liderou a Proclamação da República em 1889?",o:["D. Pedro II","Marechal Deodoro da Fonseca","Getúlio Vargas","Tiradentes"],c:1,e:"Foi um golpe militar, sem participação popular."},
  {q:"O que foi a \"política do café com leite\"?",o:["Um programa de merenda","O revezamento de SP e MG na Presidência","Um imposto sobre o café","Uma revolta popular"],c:1,e:"Marca da República Velha."},
  {q:"Em que ano as mulheres conquistaram o direito ao voto no Brasil?",o:["1889","1932","1964","1988"],c:1,e:"Pelo Código Eleitoral de 1932, junto com o voto secreto."},
  {q:"O que foi o Estado Novo (1937-1945)?",o:["Uma fase de democracia plena","A ditadura de Getúlio Vargas","O Império","O regime militar"],c:1,e:"Congresso fechado e censura pelo DIP."}
 ]},

r3:{title:"Democracia, regime militar e redemocratização (1945-1988)",min:11,
 sum:"De Dutra a Jango, 1964, o AI-5, a abertura e a Constituinte, contados com honestidade.",
 verse:{t:"A verdade vos libertará.",r:"Jo 8.32"},
 body:`<h3>A República de 1946</h3>
<ul>
<li><b>Dutra</b> (1946-1951) e a Constituição de 1946.</li>
<li><b>Vargas</b> volta eleito (1951-1954), cria a Petrobras (1953) e se suicida em 1954, em meio a uma crise.</li>
<li><b>Juscelino Kubitschek</b> (1956-1961): "50 anos em 5", industrialização e a inauguração de Brasília (1960), com alto custo e inflação.</li>
<li><b>Jânio Quadros</b> renuncia em 1961 após sete meses. O vice, <b>João Goulart (Jango)</b>, assume sob forte desconfiança; o país passa por um curto parlamentarismo (1961-1963).</li>
</ul>
<h3>1964</h3>
<p>Com inflação alta, greves e a Guerra Fria no auge, Jango defendia "reformas de base" e se aproximava de setores da esquerda radical. Muitos temiam uma revolução comunista; em março de 1964, centenas de milhares participaram da <b>Marcha da Família com Deus pela Liberdade</b>. Em 31 de março e 1º de abril, militares, com apoio de boa parte da sociedade, do Congresso e da imprensa, derrubaram Jango.</p>
<h3>O regime militar (1964-1985)</h3>
<ul>
<li>Presidentes: Castelo Branco, Costa e Silva, Médici, Geisel e Figueiredo, eleitos indiretamente.</li>
<li><b>AI-5</b> (13 de dezembro de 1968): fechou o Congresso, suspendeu o habeas corpus para crimes políticos e ampliou a censura.</li>
<li><b>"Milagre econômico"</b> (1968-1973), com grande crescimento, seguido de dívida e inflação.</li>
<li>Grupos de esquerda partiram para a luta armada; o regime respondeu com prisões, tortura e mortes. A Comissão Nacional da Verdade (2014) listou 434 mortos e desaparecidos políticos.</li>
<li><b>Abertura</b> "lenta, gradual e segura" (Geisel) e a <b>Lei da Anistia</b> (1979).</li>
</ul>
<h3>A volta da democracia</h3>
<p>As <b>Diretas Já</b> (1984) levaram milhões às ruas, mas a emenda das eleições diretas foi rejeitada. Tancredo Neves foi eleito pelo Colégio Eleitoral em 1985 e morreu antes da posse; José Sarney assumiu. A Constituinte produziu a Constituição de 1988.</p>
<div class="box">Uma direita séria pode explicar o medo do comunismo em 1964 e, ao mesmo tempo, condenar a censura, a tortura e o fim das liberdades. Coerência: somos contra o poder sem limites, venha de onde vier.</div>`,
 pr:{q:"\"Todo mundo de direita defende a ditadura.\"",a:"\"Não. Eu entendo o contexto de 1964, com Guerra Fria e medo de uma revolução comunista, e muita gente apoiou na época. Mas eu sou contra censura, tortura e Congresso fechado, porque defendo liberdade e Estado limitado. É a mesma razão pela qual sou contra Cuba e Venezuela. Poder sem limite é perigoso de qualquer lado.\""},
 quiz:[
  {q:"Quem inaugurou Brasília em 1960?",o:["Getúlio Vargas","Juscelino Kubitschek","Jânio Quadros","Castelo Branco"],c:1,e:"Com o lema \"50 anos em 5\"."},
  {q:"O que foi o AI-5 (1968)?",o:["Uma lei de anistia","O ato que fechou o Congresso e suspendeu garantias","Uma reforma agrária","A Constituição de 1967"],c:1,e:"O ponto mais duro do regime militar."},
  {q:"O que foram as Diretas Já (1984)?",o:["Uma guerrilha","Um movimento popular por eleições diretas para presidente","Um plano econômico","Um partido"],c:1,e:"A emenda foi rejeitada, mas o movimento acelerou a redemocratização."},
  {q:"Qual a posição coerente de uma direita séria sobre o regime militar?",o:["Defender a tortura","Entender o contexto e condenar a censura e a tortura","Negar que existiu","Dizer que foi de esquerda"],c:1,e:"Contra o poder sem limites, de qualquer lado."}
 ]},

r4:{title:"Nova República: de Sarney a 2026",min:11,
 sum:"Hiperinflação, Plano Real, privatizações, PT no poder, Lava Jato, impeachment e as últimas eleições.",
 verse:{t:"Ele muda os tempos e as horas; ele remove reis e estabelece reis.",r:"Dn 2.21"},
 body:`<ul>
<li><b>José Sarney</b> (1985-1990): Plano Cruzado (1986), Constituição de 1988 e hiperinflação.</li>
<li><b>Fernando Collor</b> (1990-1992): primeiro presidente eleito pelo voto direto desde 1960. Confiscou a poupança e as contas bancárias. Acusado de corrupção, renunciou durante o processo de impeachment, e o Senado o condenou mesmo assim.</li>
<li><b>Itamar Franco</b> (1992-1994): lançou o <b>Plano Real</b> (1994), com Fernando Henrique Cardoso no Ministério da Fazenda.</li>
<li><b>Fernando Henrique Cardoso</b> (1995-2002), PSDB: estabilidade da moeda, privatizações (Vale, telefonia), Lei de Responsabilidade Fiscal e a emenda da reeleição.</li>
<li><b>Luiz Inácio Lula da Silva</b> (2003-2010), PT: Bolsa Família, crescimento com o boom das commodities e o escândalo do <b>Mensalão</b> (2005).</li>
<li><b>Dilma Rousseff</b> (2011-2016), PT: recessão de 2015-2016, a <b>Operação Lava Jato</b> (desde 2014) e o impeachment em 2016, por crimes de responsabilidade fiscal.</li>
<li><b>Michel Temer</b> (2016-2018), MDB: teto de gastos (2016) e reforma trabalhista (2017).</li>
<li><b>Jair Bolsonaro</b> (2019-2022), PSL e depois PL: reforma da Previdência (2019), pandemia de covid-19 e derrota em 2022 por 50,9% a 49,1%.</li>
<li><b>Lula</b> (2023-2026): terceiro mandato. Em 8 de janeiro de 2023, manifestantes invadiram e depredaram as sedes dos Três Poderes.</li>
</ul>
<h3>Lava Jato e seus desdobramentos</h3>
<p>A Lava Jato revelou um enorme esquema de corrupção na Petrobras, com bilhões devolvidos. Lula foi condenado e preso em 2018. Em 2021, o STF anulou as condenações por entender que a vara de Curitiba não era competente e declarou o então juiz Sergio Moro parcial. O tema divide o país até hoje.</p>
<h3>Os anos recentes</h3>
<p>O TSE tornou Bolsonaro inelegível em 2023 por abuso de poder político. Em 2025, o STF o condenou por tentativa de golpe de Estado; seus apoiadores contestam o processo. Em 2026, seu filho Flávio Bolsonaro foi o candidato da direita, venceu o 1º turno, mas perdeu o 2º para Lula (51,79% a 48,21%).</p>
<div class="box">História recente é terreno minado: confira datas e números, separe fatos de opiniões e reconheça os erros do seu lado. Quem faz isso conquista respeito até de quem discorda.</div>`,
 pr:{q:"\"A Lava Jato foi uma farsa.\"",a:"\"Teve erros, e o STF anulou algumas condenações por questões de competência e parcialidade. Mas o esquema de corrupção na Petrobras foi real: empresas confessaram, executivos fizeram delação e bilhões de reais foram devolvidos aos cofres públicos. Dá pra criticar os métodos e ao mesmo tempo reconhecer que a corrupção existiu.\""},
 quiz:[
  {q:"Quem foi o primeiro presidente eleito pelo voto direto após o regime militar?",o:["Sarney","Collor","Itamar","FHC"],c:1,e:"Eleito em 1989; deixou o cargo em 1992."},
  {q:"Em qual governo foi lançado o Plano Real (1994)?",o:["Sarney","Collor","Itamar Franco","Lula"],c:2,e:"Com FHC como ministro da Fazenda."},
  {q:"Qual foi a base jurídica do impeachment de Dilma (2016)?",o:["Corrupção pessoal comprovada","Crimes de responsabilidade fiscal (\"pedaladas\")","Traição à pátria","Fraude eleitoral"],c:1,e:"Ligados à Lei de Responsabilidade Fiscal."},
  {q:"Qual foi o resultado do 2º turno de 2026?",o:["Flávio 52% x Lula 48%","Lula 51,79% x Flávio 48,21%","Empate","Não houve 2º turno"],c:1,e:"Lula reeleito, depois de ficar em 2º no 1º turno."}
 ]},

w1:{title:"As vertentes da direita",min:10,
 sum:"Conservadores, liberais, libertários, democratas-cristãos, populistas: o que cada um defende.",
 verse:{t:"Examinai tudo. Retende o bem.",r:"1 Ts 5.21"},
 body:`<p>"Direita" é uma família grande, com primos que brigam. Conhecer as vertentes evita confusão e ajuda você a entender onde se encaixa.</p>
<h3>Conservadorismo</h3>
<p>De Burke, Kirk e Scruton. Valoriza tradição, religião, família, comunidade e mudança prudente. Desconfia de projetos abstratos de engenharia social.</p>
<h3>Liberalismo clássico</h3>
<p>De Locke, Adam Smith e Tocqueville. Liberdade individual, propriedade, Estado de direito, livre mercado. No Brasil, "liberal" costuma significar isso; nos EUA, a palavra virou sinônimo de esquerda.</p>
<h3>Libertarianismo</h3>
<p>De Mises, Rothbard e Nozick. Estado mínimo ou, no caso dos anarcocapitalistas, nenhum Estado. Costuma ser liberal também nos costumes (drogas, por exemplo), o que gera atrito com conservadores. Javier Milei, presidente da Argentina desde 2023, se apresenta como libertário.</p>
<h3>Democracia cristã</h3>
<p>Nasceu da doutrina social cristã. Konrad Adenauer (Alemanha), Alcide De Gasperi (Itália) e Robert Schuman (França) reconstruíram a Europa no pós-guerra e fundaram a integração europeia. Ludwig Erhard criou a "economia social de mercado", base do milagre econômico alemão.</p>
<h3>Fusionismo</h3>
<p>Nos EUA, William F. Buckley Jr. (revista <i>National Review</i>, 1955) e Frank Meyer uniram conservadores e liberais contra o comunismo. Deu origem à coalizão de Ronald Reagan.</p>
<h3>Nacional-conservadorismo e populismo de direita</h3>
<p>Desde os anos 2010: Donald Trump (EUA), Viktor Orbán (Hungria), Giorgia Meloni (Itália). Ênfase em soberania nacional, controle da imigração, crítica às elites globais e defesa de valores tradicionais. Os críticos, inclusive à direita, apontam riscos de personalismo e de enfraquecer instituições.</p>
<h3>O que fica de fora</h3>
<div class="box r">Racismo, antissemitismo, culto ao líder e violência política não são "uma vertente da direita", são uma traição aos princípios que a direita cristã defende: dignidade de cada pessoa, Estado de direito e liberdade. Rejeite sem medo, venha de quem vier.</div>`,
 pr:{q:"\"Liberal e conservador é tudo a mesma coisa.\"",a:"\"Eles andam juntos muitas vezes, mas não são iguais. O liberal foca na liberdade individual e no mercado; o conservador, na tradição, na família e na religião. Um libertário pode defender liberar as drogas; um conservador, não. O que une os dois é desconfiar do Estado grande. Saber essa diferença ajuda a construir alianças sem confusão.\""},
 quiz:[
  {q:"Quem criou a \"economia social de mercado\" na Alemanha pós-guerra?",o:["Karl Marx","Ludwig Erhard","Adolf Hitler","Keynes"],c:1,e:"Ministro de Adenauer, base do milagre alemão."},
  {q:"O fusionismo americano uniu:",o:["Comunistas e fascistas","Conservadores e liberais contra o comunismo","Democratas e republicanos","Igreja e Estado"],c:1,e:"Buckley e a National Review, 1955."},
  {q:"Qual vertente costuma ser liberal também nos costumes?",o:["Conservadorismo","Democracia cristã","Libertarianismo","Integralismo"],c:2,e:"O que gera atrito com conservadores."}
 ]},

w2:{title:"A grande virada: Reagan, Thatcher e João Paulo II",min:10,
 sum:"Como três líderes e a Escola de Chicago ajudaram a vencer a Guerra Fria e mudar a economia mundial.",
 verse:{t:"Para a liberdade foi que Cristo nos libertou.",r:"Gl 5.1"},
 body:`<h3>A Escola de Chicago</h3>
<p>Milton Friedman (<i>Capitalismo e liberdade</i>, 1962; Nobel de 1976) defendeu moeda estável, livre mercado e menos Estado. Popularizou ideias como o voucher escolar, que dá aos pais o poder de escolher a escola dos filhos.</p>
<h3>Margaret Thatcher (Reino Unido, 1979-1990)</h3>
<p>Filha de um quitandeiro metodista, enfrentou uma economia estagnada e sindicatos que paralisavam o país. Privatizou estatais, derrotou a longa greve dos mineiros (1984-1985), reduziu a inflação e venceu a Guerra das Malvinas (1982). Ganhou três eleições seguidas.</p>
<h3>Ronald Reagan (EUA, 1981-1989)</h3>
<p>Cortou impostos, desregulamentou a economia e endureceu contra a União Soviética, que chamou de "império do mal" (1983). Em Berlim, em 1987, desafiou: <b>"Senhor Gorbachev, derrube este muro!"</b>. Dois anos depois, o muro caiu.</p>
<blockquote>"Na crise atual, o governo não é a solução para o nosso problema; o governo é o problema."<cite>Ronald Reagan, discurso de posse (1981)</cite></blockquote>
<h3>João Paulo II e a Polônia</h3>
<p>O polonês Karol Wojtyła foi eleito papa em 1978 ("Não tenham medo!", disse na missa de início do pontificado) e visitou a Polônia comunista em 1979, diante de milhões. No ano seguinte nasceu o sindicato independente <b>Solidariedade</b>, de Lech Wałęsa, que ajudou a derrubar o comunismo no Leste Europeu. A fé foi uma força de libertação.</p>
<h3>Um caso polêmico: o Chile</h3>
<p>Economistas ligados a Chicago assessoraram a ditadura de Augusto Pinochet (1973-1990), que teve crescimento econômico, mas violou gravemente os direitos humanos, com milhares de mortos e desaparecidos. A lição: liberdade econômica não justifica tirania política. A direita democrática quer as duas liberdades juntas.</p>`,
 pr:{q:"\"Thatcher e Reagan só beneficiaram os ricos.\"",a:"\"Eles tiveram críticas justas, como o desemprego em algumas regiões. Mas pegaram países com inflação de dois dígitos e economias travadas, e deixaram com inflação baixa e crescimento. Milhões de britânicos viraram donos da própria casa pela venda das moradias públicas. E Reagan ajudou a acabar com a Guerra Fria sem um tiro entre as potências. Libertar o Leste Europeu beneficiou muito pobre.\""},
 quiz:[
  {q:"Qual livro de Milton Friedman (1962) é um clássico do liberalismo?",o:["O capital","Capitalismo e liberdade","A riqueza das nações","1984"],c:1,e:"Nobel de Economia em 1976."},
  {q:"Qual frase Reagan disse em Berlim, em 1987?",o:["\"Eu sou um berlinense\"","\"Senhor Gorbachev, derrube este muro!\"","\"Paz e amor\"","\"O Estado sou eu\""],c:1,e:"O muro caiu em 1989."},
  {q:"Que sindicato polonês, inspirado pela fé, ajudou a derrubar o comunismo?",o:["CUT","Solidariedade","Força Sindical","Comintern"],c:1,e:"Liderado por Lech Wałęsa, a partir de 1980."},
  {q:"Qual a lição do caso chileno sob Pinochet?",o:["Que ditaduras são boas para a economia","Que liberdade econômica não justifica tirania política","Que Chicago era comunista","Nenhuma"],c:1,e:"A direita democrática quer as duas liberdades."}
 ]},

w3:{title:"Pensadores que você precisa conhecer",min:11,
 sum:"Um mapa dos grandes nomes da direita no mundo e no Brasil, do século XVIII aos dias de hoje.",
 verse:{t:"O que anda com os sábios será sábio.",r:"Pv 13.20"},
 body:`<h3>Os clássicos</h3>
<ul>
<li><b>Edmund Burke</b> (1729-1797): tradição, prudência e os pequenos pelotões.</li>
<li><b>Alexis de Tocqueville</b> (1805-1859): democracia, associações e o "despotismo suave" do Estado protetor.</li>
<li><b>G. K. Chesterton</b> (1874-1936): a cerca, a democracia dos mortos e o bom humor da fé.</li>
<li><b>José Ortega y Gasset</b> (1883-1955): <i>A rebelião das massas</i> (1930), o "homem-massa" que exige direitos sem assumir deveres.</li>
</ul>
<h3>Economia e liberdade</h3>
<ul>
<li><b>Ludwig von Mises</b> e <b>F. A. Hayek</b>: Escola Austríaca, cálculo econômico e conhecimento disperso.</li>
<li><b>Milton Friedman</b>: moeda, liberdade e escolha escolar.</li>
<li><b>Thomas Sowell</b> (1930-): economia, raça e cultura com dados; um dos maiores intelectuais vivos.</li>
</ul>
<h3>Filosofia política</h3>
<ul>
<li><b>Russell Kirk</b>: a tradição conservadora e as "coisas permanentes".</li>
<li><b>Michael Oakeshott</b>: "Ser conservador é preferir o familiar ao desconhecido, o testado ao não testado, o fato ao mistério, o real ao possível" ("Ser conservador", 1956).</li>
<li><b>Eric Voegelin</b>: <i>A nova ciência da política</i> (1952), as ideologias modernas como tentativas de criar o paraíso na terra.</li>
<li><b>Roger Scruton</b> (1944-2020): beleza, lar, tradição e crítica à Nova Esquerda.</li>
</ul>
<h3>Vozes contemporâneas</h3>
<ul>
<li><b>Theodore Dalrymple</b>: médico de prisão que descreve a cultura da "subclasse" em <i>A vida na sarjeta</i> (2001).</li>
<li><b>Jordan Peterson</b>: psicólogo canadense, responsabilidade pessoal (<i>12 regras para a vida</i>, 2018).</li>
<li><b>Douglas Murray</b>: crítica à política identitária e à crise da Europa (<i>A estranha morte da Europa</i>, 2017).</li>
</ul>
<h3>No Brasil</h3>
<ul>
<li><b>Roberto Campos</b> (1917-2001): economista e diplomata liberal, autor de <i>A lanterna na popa</i> (1994).</li>
<li><b>José Guilherme Merquior</b> (1941-1991): diplomata e pensador liberal de enorme erudição.</li>
<li><b>Gustavo Corção</b> (1896-1978): escritor católico conservador.</li>
<li><b>Mário Ferreira dos Santos</b> (1907-1968): filósofo autodidata, autor de uma vasta obra.</li>
<li><b>Olavo de Carvalho</b> (1947-2022): o mais influente da nova direita brasileira; tem uma lição só dele, a seguir.</li>
</ul>`,
 pr:{q:"\"A direita não tem intelectuais, só tem gritaria.\"",a:"\"Tem muito intelectual, a gente é que conhece pouco. Burke, Tocqueville, Hayek, que ganhou o Nobel, Thomas Sowell, Roger Scruton, Ortega y Gasset. No Brasil, Roberto Campos e Merquior. A gritaria existe dos dois lados. Quer montar um grupo de leitura comigo e começar pelo Sowell?\""},
 quiz:[
  {q:"Quem escreveu A rebelião das massas (1930)?",o:["Ortega y Gasset","Marx","Sartre","Freire"],c:0,e:"Sobre o \"homem-massa\"."},
  {q:"\"Ser conservador é preferir o familiar ao desconhecido...\" é de:",o:["Michael Oakeshott","Karl Marx","Rousseau","Gramsci"],c:0,e:"Do ensaio \"Ser conservador\" (1956)."},
  {q:"Qual economista e diplomata brasileiro escreveu A lanterna na popa?",o:["Celso Furtado","Roberto Campos","Darcy Ribeiro","Paulo Freire"],c:1,e:"Lançado em 1994."}
 ]},

w4:{title:"Olavo de Carvalho e o \"teatro das tesouras\"",min:12,
 sum:"Quem foi Olavo, o que ele acertou, onde errou e uma leitura crítica da tese do teatro das tesouras.",
 verse:{t:"O simples dá crédito a toda palavra, mas o prudente atenta para os seus passos.",r:"Pv 14.15"},
 body:`<h3>Quem foi</h3>
<p>Olavo de Carvalho (Campinas, 1947 - Virgínia, EUA, 2022) foi jornalista, escritor e professor de filosofia autodidata. Nos anos 1970 e 1980 estudou e ensinou astrologia e esoterismo, de que depois se afastou. Tornou-se conhecido com <i>A nova era e a revolução cultural</i> (1994), <i>O jardim das aflições</i> (1995) e <i>O imbecil coletivo</i> (1996). A coletânea <i>O mínimo que você precisa saber para não ser um idiota</i> (2013) virou best-seller. A partir de 2009, seu Curso Online de Filosofia formou milhares de alunos.</p>
<h3>O que ele trouxe de bom</h3>
<ul>
<li>Apresentou ao público brasileiro Gramsci e a estratégia cultural da esquerda, numa época em que quase ninguém falava disso fora da academia.</li>
<li>Incentivou o estudo sério: ler os clássicos, aprender línguas, buscar a alta cultura.</li>
<li>Ajudou a romper a hegemonia de esquerda no debate público e inspirou uma geração de autores, editoras e jornalistas.</li>
</ul>
<h3>As críticas</h3>
<ul>
<li>Linguagem agressiva e cheia de palavrões, que afastou muitos e banalizou o ataque pessoal.</li>
<li>Afirmações sem comprovação, como as que fez sobre vacinas e sobre a pandemia de covid-19.</li>
<li>Influência direta no governo Bolsonaro (indicou ministros como Ricardo Vélez Rodríguez e Ernesto Araújo) e brigas com aliados.</li>
<li>Até conservadores o criticam por tratar adversários como inimigos e por algumas teses difíceis de verificar.</li>
</ul>
<h3>O "teatro das tesouras"</h3>
<p><b>A tese:</b> Olavo dizia que PT e PSDB, que disputaram todos os segundos turnos (ou a vitória no primeiro) de 1994 a 2014, eram como as duas lâminas de uma tesoura: pareciam opostos, mas cortavam na mesma direção, à esquerda. Ambos vinham da oposição ao regime militar, se diziam de centro-esquerda (o PSDB é social-democrata, e FHC foi sociólogo marxista na juventude) e, juntos, deixavam fora do jogo uma direita de verdade.</p>
<p><b>O que tem de observação real:</b> por 20 anos não houve um candidato competitivo de direita conservadora na eleição presidencial, e as duas forças principais vinham do mesmo campo ideológico mais amplo.</p>
<p><b>O que é discutível:</b> a ideia de uma combinação deliberada. PT e PSDB tiveram rivalidade real e feroz: o PT se opôs ao Plano Real e votou contra a Lei de Responsabilidade Fiscal, combateu as privatizações e acusou o PSDB por anos; o PSDB fez oposição dura ao PT e apoiou o impeachment de Dilma.</p>
<div class="box">Use a tese como <b>hipótese a examinar</b>, não como dogma: separe o que é fato observável (a ausência de uma direita competitiva entre 1994 e 2014) do que é suposição (um acordo secreto). Esse cuidado vale para qualquer autor, inclusive os que você admira. Leia Olavo com o mesmo espírito crítico que ele pedia para ler os outros.</div>`,

function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return dkey(new Date())}
function addDays(k,n){const[y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n))}
function gain(n,why,quiet){S.xp+=n;const k=today();S.days[k]=(S.days[k]||0)+n;save();if(!quiet)toast("+"+n+" XP · "+why);hdr()}
function streak(){let k=today(),c=0;if(!S.days[k])k=addDays(k,-1);while(S.days[k]){c++;k=addDays(k,-1)}return c}

function passed(id){return(S.lessons[id]?.best||0)>=PASS}
function trackUnlocked(t){if(S.unlockAll||t.n===1||t.first)return true;const prev=TRACKS[t.n-2];return prev.mods.filter(passed).length>=3}
function dueCards(){const k=today();return CARDS.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=k)}
function newCards(){return CARDS.filter(c=>!S.cards[c.id])}
function newToday(){return Object.values(S.cards).filter(c=>c.added===today()).length}

  SYNC={on:true,ref,timer:null,status:"conta"};

 }catch(e){SYNC.on=false;SYNC.status="local"}
}

function nextModule(){for(const t of TRACKS){if(!trackUnlocked(t))continue;for(const m of t.mods)if(!passed(m))return m}return null}

function trailState(){
 const seq=[];TRACKS.forEach(t=>t.mods.forEach((id,i)=>seq.push({id,t,i})));
 const cur=nextModule();
 const curIdx=cur?seq.findIndex(s=>s.id===cur):seq.length;
 const done=seq.filter(s=>passed(s.id)).length;
 const curT=cur?seq[curIdx].t:TRACKS[TRACKS.length-1];
 return{seq,cur,curIdx,done,total:seq.length,curT,pct:Math.round(done/seq.length*100)};
}

const TSIZE={compacta:{d:50,c:62,row:96,gap:70},normal:{d:58,c:72,row:108,gap:80},grande:{d:68,c:84,row:124,gap:92}};
function drawTrail(T){
 const el=$("#trail");if(!el)return;
 const Z=TSIZE[S.look.trail]||TSIZE.normal,fs=S.look.font||1;
 el.style.setProperty("--disc",Z.d+"px");el.style.setProperty("--disc-c",Z.c+"px");
 const W=el.clientWidth||360,cx=W/2,amp=Math.min(118,W*.27),ROW=Z.row*Math.max(1,fs),GAP=Z.gap*Math.max(1,fs);
 // mede a altura real do cartão de nível (muda com o tamanho da letra)
 el.innerHTML=`<div class="banner glass" style="visibility:hidden;position:absolute;top:0"><span class="eyebrow">Nível</span><b>Medida</b><div class="bmeta"><span>texto</span></div></div>`;
 const BAN=Math.ceil(el.firstElementChild.offsetHeight)||84;
 const pts=[],me=(S.name||"Eu").trim().charAt(0).toUpperCase()||"E";
 let y=0,html="";
 const lock='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
 TRACKS.forEach((t,ti)=>{
  const un=trackUnlocked(t),d=t.mods.filter(passed).length;
  html+=`<div class="banner glass ${un?"":"locked"}" style="top:${y}px"><div class="bl"><span class="eyebrow">Nível ${t.n} · ${t.lvl}</span><b>${esc(t.name)}</b><div class="bmeta"><span>${esc(t.desc)}</span></div></div><span class="bst ${d===4?"full":""}">${un?d+"/4":lock}</span></div>`;
  y+=BAN+GAP;
  t.mods.forEach((id,i)=>{
   const k=ti*4+i,x=cx+amp*Math.sin(k*.95),cy=y;pts.push([x,cy]);
   const m=MODS[id],best=S.lessons[id]?.best;
   const st=passed(id)?"done":k===T.curIdx?"current":un?"open":"locked";
   const off=(st==="current"?Z.c:Z.d)/2+14;
   const side=x<=cx?"r":"l",space=(side==="r"?W-x:x)-off-4;
   const sub=st==="done"?`Aprovada · ${Math.round(best*100)}%`:st==="current"?`Agora · ${m.min} min`:st==="open"?(best!=null?`Tente de novo · ${Math.round(best*100)}%`:`Disponível · ${m.min} min`):"Bloqueada";
   const inner=`<span class="disc">${st==="done"?IC.check:st==="locked"?lock:t.n+"."+(i+1)}</span>${st==="current"?`<span class="here"><i>${esc(me)}</i>Você está aqui</span>`:""}<span class="nlabel ${side}" style="${side==="r"?"left":"right"}:${off}px;max-width:${Math.round(Math.max(96,Math.min(160*fs,space)))}px"><b>${esc(m.title)}</b><span>${sub}</span></span>`;
   html+=st==="locked"?`<span class="node locked" style="left:${x}px;top:${cy}px" aria-label="${esc(m.title)}, bloqueada">${inner}</span>`:`<a class="node ${st}" href="#m-${id}" style="left:${x}px;top:${cy}px" aria-label="${esc(m.title)}, ${sub}">${inner}</a>`;
   y+=ROW;
  });
  y+=GAP-ROW+Z.c/2+10;
 });
 const allDone=T.done===T.total,fy=y+Z.c/2;pts.push([cx,fy]);
 const crown='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></svg>';

 st.setProperty("--accent",c1);st.setProperty("--accent-2",c2);st.setProperty("--accent-soft",hexA(c1,dk?.16:.12));

 CS.queue=[...due,...nw];
}

 app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{CS.filter=b.dataset.k;CS.cur=null;viewCards()});
 const fl=$("#flash");if(fl){const show=()=>{if(!CS.shown){CS.shown=true;viewCards()}};fl.onclick=show;fl.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show()}}}
 app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(+b.dataset.r));

function rate(r){
 const c=CS.cur,k=today();let st=S.cards[c.id];
 if(!st){st={box:0,due:k,added:k};S.cards[c.id]=st}
 if(r===0){st.box=0;st.due=addDays(k,1)}
 else if(r===1){st.due=addDays(k,INTERVALS[Math.min(st.box,5)])}
 else{st.box=Math.min(st.box+1,6);st.due=addDays(k,INTERVALS[Math.min(st.box,5)])}
 st.last=k;

 gain(r===0?1:2,"card revisado");
 CS.cur=CS.queue.shift()||null;CS.shown=false;viewCards();tabs("cards");
}

Conversa:
${tr.slice(0,12000)}`,{modelTier:"default",cache:false});

 {k:"txt",tag:"Erro 2",h:"Arianismo",p:"O Filho seria a primeira criatura. O Concílio de Niceia (325) respondeu: ele é _homoousios_, da mesma substância do Pai. “O Verbo era Deus” (Jo 1.1)."},

 {k:"pick",q:"“A Trindade é como a água: gelo, líquido e vapor.” Qual o problema?",o:["Ensina modalismo: a mesma coisa mudando de forma","Divide Deus em três partes","Nenhum, a comparação é perfeita"],c:0,e:"E a do ovo (casca, clara e gema) divide Deus em partes. Melhor admitir: Deus é maior que qualquer comparação."},

 ]},

d2:{conf:"defender a ressurreição com fatos históricos",
 mis:"Conte para alguém os fatos mínimos e pergunte: “Qual explicação dá conta de todos eles?”",
 s:[
 {k:"txt",h:"Tudo ou nada",p:"Paulo apostou tudo num fato: “se Cristo não ressuscitou, é vã a vossa fé” (1 Co 15.17). Nenhuma outra religião se arrisca assim. Ou seja: dá para investigar."},
 {k:"txt",h:"O credo mais antigo",p:"Em 1 Coríntios 15.3-7, Paulo repete um credo: Cristo morreu, foi sepultado, ressuscitou e apareceu a Pedro, aos Doze, a mais de 500 pessoas de uma vez e a Tiago."},
 {k:"txt",h:"Cedo demais para ser lenda",p:"Muitos estudiosos, inclusive céticos, datam esse credo de **poucos anos** depois da cruz. Lenda precisa de tempo para crescer, e não houve tempo."},
 {k:"list",h:"Os fatos mínimos",p:"Aceitos pela maioria dos historiadores, crentes ou não (Gary Habermas):",items:["Jesus morreu crucificado","Os discípulos creram tê-lo visto ressuscitado","Paulo, o perseguidor, se converteu","Tiago, o irmão cético, se converteu","O túmulo foi encontrado vazio"]},
 {k:"tf",q:"A data de nascimento de Jesus (25 de dezembro) é um dos fatos mínimos.",a:false,e:"Não é. E a data exata do nascimento nem é conhecida."},
 {k:"match",h:"Ligue a teoria ao motivo de ela falhar",pairs:[["Roubaram o corpo","ninguém morre por mentira que inventou"],["Alucinação","não acontece igual em grupo"],["Jesus só desmaiou","soldados romanos sabiam executar"],["Túmulo errado","bastava mostrar o túmulo certo"]]},
 {k:"txt",h:"Um detalhe que ninguém inventaria",p:"As primeiras testemunhas foram **mulheres**, e naquela cultura o testemunho delas tinha pouco peso. Quem inventasse a história escolheria homens respeitados."},
 {k:"pick",q:"Como se chama esse princípio dos historiadores?",o:["Critério do constrangimento","Critério da maioria","Lei do silêncio"],c:0,e:"Detalhes que atrapalham a história tendem a ser verdadeiros."},
 {k:"chat",who:"Bruno",c:"#E8590C",q:"Ressurreição é impossível. Gente morta não volta.",o:[
  {t:"Por causa natural, não volta mesmo. Mas, se Deus existe, ressuscitar alguém não é impossível. Bora olhar os fatos: morte, túmulo vazio, aparições, Paulo e Tiago. Qual explicação fecha todos?",v:2,r:"Hm... a da alucinação não fecha mesmo.",tip:"Você tirou a conversa do “impossível” e levou para a evidência."},
  {t:"Tá na Bíblia, então aconteceu.",v:1,r:"Mas eu não acredito na Bíblia, mano.",tip:"Use fontes que ele aceita: os fatos mínimos que até céticos reconhecem."},
  {t:"Você só não quer acreditar.",v:0,r:"E você só quer acreditar. Empate. 🤷",tip:"Julgar o motivo da pessoa não responde o argumento dela."}]},
 {k:"verse"},
 {k:"mentor",t:"A ressurreição é a pedra angular. Se ela é verdade, todo o resto ganha peso."}
 ]},

d3:{conf:"explicar a diferença entre justificação e santificação",
 mis:"Escreva Romanos 8.1 num papel e deixe num lugar onde você veja todo dia desta semana.",
 s:[
 {k:"txt",h:"Justificação: o veredito",p:"É um termo de tribunal: Deus **declara justo** o pecador. Não porque ele seja bom, mas porque a justiça de Cristo é creditada na conta dele."},
 {k:"txt",h:"A grande troca",p:"“Aquele que não conheceu pecado, ele o fez pecado por nós; para que, nele, fôssemos feitos justiça de Deus” (2 Co 5.21)."},
 {k:"txt",h:"Santificação: o caminho",p:"A justificação acontece de uma vez. A santificação é ficar parecido com Jesus a vida toda. Você se esforça **porque** Deus age em você (Fp 2.12-13)."},
 {k:"tf",q:"Justificação e santificação são a mesma coisa.",a:false,e:"Justificação é o veredito, de uma vez. Santificação é o processo, a vida inteira."},
 {k:"txt",h:"Paulo contra Tiago?",p:"Paulo: somos salvos pela fé, sem obras (Ef 2.8-9). Tiago: a fé sem obras é morta (Tg 2.17). Contradição? Não."},
 {k:"txt",h:"Raiz e fruto",p:"Paulo fala da **raiz**: o que salva. Tiago fala do **fruto**: como se reconhece a fé verdadeira. A árvore viva dá frutos; os frutos não dão vida à árvore."},
 {k:"bug",h:"Toque no trecho errado",parts:["Somos salvos pela graça,","por meio da fé,","e as boas obras pagam o resto."],w:2,e:"Não há resto a pagar. As obras são fruto de quem já foi salvo (Ef 2.10)."},
 {k:"quote",t:"Graça barata é a graça sem discipulado, a graça sem a cruz, a graça sem Jesus Cristo vivo e encarnado.",by:"Dietrich Bonhoeffer, Discipulado (1937)"},
 {k:"txt",h:"De graça, mas não barata",p:"Bonhoeffer foi executado pelos nazistas em 1945. Ele sabia: a graça é de graça, mas custou a vida do Filho de Deus, e chama você a seguir Jesus com tudo."},
 {k:"chat",who:"Mel",c:"#AE3EC9",q:"Então é só aceitar Jesus e depois fazer o que quiser? 😅",o:[
  {t:"Não. A salvação é de graça, mas quem foi salvo passa a amar quem o salvou, e quem ama muda. É tipo casamento: você não trabalha pra ganhar o “sim”, mas depois do “sim” a vida inteira muda.",v:2,r:"Faz sentido. Não é pra ganhar, é porque já ganhou.",tip:"Perfeito: graça verdadeira, não barata."},
  {t:"Você tem que se esforçar muito pra merecer a salvação.",v:0,r:"Então eu nunca vou conseguir...",tip:"Ninguém merece. A salvação é dom (Ef 2.8-9); o esforço vem depois, como fruto."},
  {t:"Na prática é isso mesmo, só não fala pro pastor.",v:0,r:"Kkkk sério?",tip:"Isso é graça barata! A fé verdadeira dá frutos (Tg 2.17)."}]},
 {k:"txt",h:"Segurança",p:"“Agora, pois, já nenhuma condenação há para os que estão em Cristo Jesus” (Rm 8.1). Quem foi aceito pelo único que importa não vive com medo de rejeição."},
 {k:"verse"},
 {k:"mentor",t:"Raiz e fruto. Quando a dúvida bater, lembre da árvore."}
 ]},

d4:{conf:"contar a história da igreja em poucos marcos",
 mis:"Pergunte a alguém mais velho da sua igreja como a fé chegou à família dele. Anote a história.",
 s:[
 {k:"txt",h:"Quem não conhece a própria história...",p:"...é facilmente convencido de que ela é vergonhosa. Estes marcos te dão chão."},
 {k:"txt",tag:"c. 30–33",h:"Tudo começa",p:"Crucificação e ressurreição de Jesus. No Pentecostes, nasce a igreja."},
 {k:"txt",tag:"64",h:"Perseguição",p:"Nero persegue cristãos em Roma. Pedro e Paulo morrem nessa época. Por quase 300 anos, ser cristão podia custar a vida."},
 {k:"quote",t:"Há oitenta e seis anos eu o sirvo, e ele nunca me fez mal algum. Como posso blasfemar contra o meu Rei, que me salvou?",by:"Policarpo de Esmirna, diante da morte (c. 155)"},
 {k:"txt",tag:"313 a 451",h:"Liberdade e concílios",p:"313: o Edito de Milão encerra a perseguição. 325: Niceia, o Filho é Deus. 381: Constantinopla, o Espírito é Deus. 451: Calcedônia, Jesus é plenamente Deus e plenamente homem."},
 {k:"txt",tag:"31 de outubro de 1517",h:"A Reforma",p:"Martinho Lutero publica as 95 teses. Começa a Reforma Protestante."},
 {k:"order",h:"Coloque na ordem em que aconteceu",items:["Martírio de Policarpo","Concílio de Niceia","Lutero publica as 95 teses","Assembleia de Deus chega ao Brasil"],e:"c. 155, 325, 1517 e 1911."},
 {k:"match",h:"Ligue cada Sola ao seu sentido",pairs:[["Sola Scriptura","a Escritura é a autoridade final"],["Sola Gratia","salvação só pela graça"],["Sola Fide","recebida só pela fé"],["Solus Christus","só por meio de Cristo"],["Soli Deo Gloria","tudo para a glória de Deus"]]},
 {k:"txt",tag:"1910 e 1911",h:"E no Brasil?",p:"Em 1910 chega a Congregação Cristã. Em 1911, a Assembleia de Deus nasce em Belém do Pará, com os missionários Daniel Berg e Gunnar Vingren."},
 {k:"chat",who:"Vini",c:"#2F9E44",q:"O cristianismo só cresceu porque o imperador Constantino obrigou todo mundo.",o:[
  {t:"Na real, ele cresceu quase 300 anos debaixo de perseguição antes de Constantino. Os cristãos cuidavam dos doentes, adotavam bebês abandonados e morriam sem negar a fé.",v:2,r:"Não sabia que foi perseguido tanto tempo.",tip:"História bem contada desmonta o mito."},
  {t:"Constantino era um homem de Deus, então tudo bem.",v:1,r:"Mas então a fé foi imposta mesmo?",tip:"O ponto não é defender Constantino: a igreja já estava em todo o Império antes dele."},
  {t:"Isso é mentira de professor ateu.",v:0,r:"Tá, mas é mentira por quê?",tip:"Mostre os fatos em vez de atacar quem falou."}]},
 {k:"verse"},
 {k:"mentor",t:"Você é o próximo capítulo dessa história."}
 ]},

a1:{conf:"conversar sobre o sofrimento com alguém",
 mis:"Pense em alguém que está sofrendo. Mande uma mensagem só para dizer que você se importa, sem argumentos.",
 s:[
 {k:"mentor",t:"Eu sou Lucas, médico e companheiro de Paulo. Antes de escrever, investiguei tudo com cuidado desde o princípio (Lc 1.3). Aqui a gente treina a defesa da fé: com fatos, firmeza e mansidão."},
 {k:"txt",h:"A objeção mais forte",p:"E a mais pessoal. Leve a sério. Mas saiba que existem **dois problemas** diferentes aqui: um lógico e um emocional."},
 {k:"txt",tag:"O problema lógico",h:"“Se Deus é bom, por que o mal?”",p:"“Um Deus bom e todo-poderoso não permitiria o mal. O mal existe. Logo, esse Deus não existe.”"},
 {k:"txt",h:"A resposta de Plantinga",p:"O filósofo Alvin Plantinga mostrou que não há contradição: Deus pode ter boas razões para permitir o mal, como criar seres **realmente livres**. Amor forçado não é amor."},
 {k:"txt",h:"O mal aponta para Deus",p:"Para chamar algo de mal, você precisa de um padrão de bem. Sem Deus, o que chamamos de mal vira só a natureza seguindo seu curso."},
 {k:"quote",t:"...nenhum projeto, nenhum propósito, nenhum mal e nenhum bem, nada além de uma indiferença cega e impiedosa.",by:"Richard Dawkins, ateu, descrevendo um universo sem Deus (O rio que saía do Éden, 1995)"},
 {k:"txt",h:"Deus não ficou de longe",p:"O cristianismo é a única fé em que Deus **entra** no sofrimento. Jesus chorou (Jo 11.35), foi traído, torturado e morto. A cruz prova: não é indiferença."},
 {k:"quote",t:"Deus sussurra em nossos prazeres, fala em nossa consciência, mas grita em nossas dores: elas são o seu megafone para despertar um mundo surdo.",by:"C. S. Lewis, O problema do sofrimento (1940)"},
 {k:"pick",q:"Um amigo acabou de perder alguém. O que fazer primeiro?",o:["Explicar a defesa do livre-arbítrio","Dizer que tudo tem um motivo","Estar presente e chorar junto"],c:2,e:"Os amigos de Jó acertaram nos sete dias de silêncio (Jó 2.13) e erraram quando começaram a explicar."},
 {k:"chat",who:"Lari",c:"#E64980",q:"Se Deus existe, por que deixa criança morrer de câncer?",o:[
  {t:"Essa pergunta também me dói, e eu não sei o porquê de cada caso. Mas a gente sente que é errado porque o mundo não deveria ser assim. E Deus não ficou assistindo: entrou na dor, morreu numa cruz e prometeu acabar com a morte.",v:2,r:"Nunca tinha pensado que Deus também sofreu.",tip:"Honestidade e esperança, sem fórmula pronta."},
  {t:"Deus tem um propósito em tudo, confia.",v:1,r:"Fácil falar quando não é com você.",tip:"Pode até ser verdade, mas soa frio. Comece reconhecendo a dor."},
  {t:"Deve ser por causa do pecado da família.",v:0,r:"Que absurdo. 😡",tip:"Jesus rejeitou essa lógica (Jo 9.2-3). Nunca culpe quem sofre."}]},
 {k:"txt",h:"O fim da história",p:"Nem sempre veremos o porquê nesta vida. Mas a história termina com Deus enxugando “dos olhos toda lágrima” (Ap 21.4)."},
 {k:"verse"},
 {k:"mentor",t:"Com quem sofre: presença primeiro, filosofia depois."}
 ]},

a2:{conf:"mostrar que fé e ciência não são inimigas",
 mis:"Pesquise um cientista cristão desta lição (Mendel, Lemaître ou Pascal) e conte uma curiosidade dele para alguém.",
 s:[
 {k:"txt",h:"A ciência nasceu entre cristãos",p:"Kepler, Galileu, Boyle, Pascal, Newton, Faraday e Maxwell eram crentes. Gregor Mendel, o pai da genética, era monge."},
 {k:"txt",h:"E hoje?",p:"Francis Collins, que liderou o Projeto Genoma Humano, é cristão. E a ideia do Big Bang foi proposta por um padre, Georges Lemaître."},
 {k:"txt",h:"Não é coincidência",p:"Eles criam num Deus racional, então esperavam um universo **ordenado e compreensível**. Por isso valia a pena investigar."},
 {k:"tf",q:"Na Idade Média, os estudiosos achavam que a Terra era plana.",a:false,e:"Eles sabiam que a Terra é esférica. O mito se espalhou no século XIX, em parte por uma biografia romanceada de Colombo (1828)."},
 {k:"txt",h:"E o caso Galileu?",p:"Envolveu política, personalidade e a física da época. Houve erro das autoridades da Igreja, mas Galileu morreu crente e via a natureza como um livro escrito por Deus."},
 {k:"txt",h:"O erro do cientificismo",p:"É a ideia de que “só a ciência produz conhecimento verdadeiro”. Mas nenhum experimento prova essa frase. Ela se derruba sozinha."},
 {k:"pick",q:"Por que “só a ciência produz conhecimento” se derruba sozinha?",o:["Porque nenhum experimento consegue provar essa frase","Porque a ciência sempre erra","Porque todo cientista é religioso"],c:0,e:"É uma afirmação filosófica que nega o valor das afirmações filosóficas."},
 {k:"txt",h:"Como e por quê",p:"Explicar como um motor funciona não elimina o engenheiro que o projetou. A ciência explica **como**; a fé responde **por quê**."},
 {k:"match",h:"Ligue o cientista à contribuição",pairs:[["Gregor Mendel","pai da genética"],["Georges Lemaître","propôs o Big Bang"],["Francis Collins","Projeto Genoma Humano"],["Isaac Newton","lei da gravitação universal"]]},
 {k:"chat",who:"Igor",c:"#1098AD",q:"Eu acredito na ciência, não em religião.",o:[
  {t:"Eu também acredito na ciência! Newton, Pascal e Mendel eram cristãos. Mas “só acredito no que a ciência prova”: isso a ciência consegue provar?",v:2,r:"...É, acho que não dá pra provar isso em laboratório.",tip:"Você mostrou que o conflito é falso e que ele também tem uma crença filosófica."},
  {t:"A ciência muda toda hora, a Bíblia não.",v:1,r:"Mudar com evidência nova é bom, ué.",tip:"A ciência não é inimiga. Mostre que ela nasceu de uma visão cristã do mundo."},
  {t:"Ciência é coisa do diabo.",v:0,r:"Aí fica difícil levar sua fé a sério. 🙄",tip:"Isso confirma o mito do conflito! Deus é o autor da natureza que a ciência estuda (Sl 19.1)."}]},
 {k:"txt",h:"E a idade da Terra?",p:"Cristãos fiéis à Bíblia divergem sobre isso. Conheça os lados, mas não faça disso o centro da conversa com quem ainda nem crê em Deus."},
 {k:"verse"},
 {k:"mentor",t:"Quem estuda a criação está lendo a obra do Criador. Pode estudar sem medo."}
 ]},

a3:{conf:"responder a quem diz que cada um tem sua verdade",
 mis:"Use numa conversa desta semana a pergunta: “O que você quer dizer com isso?”",
 s:[
 {k:"txt",h:"A frase que se derruba sozinha",p:"“Não existe verdade absoluta.” Essa frase é absolutamente verdadeira?"},
 {k:"txt",h:"Serrando o galho",p:"Se for verdade absoluta, ela se contradiz. Se não for, por que aceitá-la? O relativismo serra o galho em que está sentado."},
 {k:"txt",h:"Ninguém vive assim",p:"Quem diz “cada um tem sua verdade” não aceita que o banco tenha “a verdade dele” sobre o saldo da sua conta."},
 {k:"pick",q:"Qual destas frases é questão de GOSTO, e não de fato?",o:["Sorvete de flocos é o melhor","Jesus ressuscitou","A Terra gira em torno do Sol"],c:0,e:"Gosto muda de pessoa para pessoa. Fatos, não: ou aconteceram, ou não."},
 {k:"txt",h:"Tolerância de verdade",p:"Tolerar é **suportar aquilo de que você discorda**. Só se tolera o que se acha errado. Discordo de você e, mesmo assim, te respeito."},
 {k:"tf",q:"Ser tolerante é concordar com todas as opiniões.",a:false,e:"Tolerância é respeitar quem discorda de você, não concordar com tudo."},
 {k:"txt",h:"Toda visão exclui alguém",p:"“Todas as religiões levam a Deus” também exclui: deixa de fora budistas, muçulmanos e cristãos, que discordam dessa frase."},
 {k:"txt",h:"Os cegos e o elefante",p:"Na história, cada cego toca uma parte do elefante. Mas quem conta a história diz ver o elefante inteiro: reivindica a visão completa que nega aos outros."},
 {k:"list",h:"As 2 perguntas de Colombo",p:"Greg Koukl ensina a usar perguntas em vez de discursos:",items:["“O que você quer dizer com isso?”","“Como você chegou a essa conclusão?”"]},
 {k:"chat",who:"Nina",c:"#5C7CFA",q:"Isso é verdade pra você, mas não pra mim.",o:[
  {t:"O que você quer dizer com isso? Gosto de sorvete é pessoal. Mas Jesus ter ressuscitado é fato: ou aconteceu, ou não. Se aconteceu, é verdade pra nós dois. Bora investigar?",v:2,r:"Tá, faz sentido separar gosto de fato.",tip:"Pergunta de Colombo e distinção entre gosto e fato. Mandou bem!"},
  {t:"Ok, cada um com a sua.",v:1,r:"Pois é. 👍",tip:"Paz é bom, mas você abriu mão da verdade. Dá para discordar com respeito."},
  {t:"Você tá errada e pronto.",v:0,r:"Nossa, que arrogante.",tip:"Firmeza sem mansidão vira grosseria. Use perguntas."}]},
 {k:"txt",h:"“Que é a verdade?”",p:"Pilatos perguntou isso com desdém (Jo 18.38). A Verdade estava em pé na frente dele."},
 {k:"verse"},
 {k:"mentor",t:"Perguntas tiram a pressão de você. Ninguém precisa saber tudo para conduzir bem uma conversa."}
 ]},

a4:{conf:"explicar de onde vem o certo e o errado",
 mis:"Agradeça a alguém por uma atitude justa ou bondosa que você viu esta semana e diga por que ela importa.",
 s:[
 {k:"txt",h:"Ateu pode ser bom?",p:"Claro que sim! A Bíblia diz que a lei moral está gravada no coração de todos (Rm 2.15). Essa não é a questão."},
 {k:"txt",h:"A pergunta real",p:"**O que faz o bem ser bem?** Sem Deus, de onde vem a obrigação de ser bom?"},
 {k:"match",h:"Se a moral viesse só de...",pairs:[["Evolução","explicaria o que sentimos, não o que é certo"],["Maioria","a escravidão já teria sido certa"],["Gosto pessoal","“não torture” valeria o mesmo que “não gosto de jiló”"]]},
 {k:"tf",q:"Se a moral fosse decidida pela maioria, os abolicionistas estariam errados enquanto a maioria aceitava a escravidão.",a:true,e:"Exatamente, e ninguém aceita essa conclusão. Logo, a moral não depende da maioria."},
 {k:"txt",h:"Nietzsche entendeu",p:"O ateu Friedrich Nietzsche anunciou que “Deus está morto” (1882) e percebeu: a moral cristã não sobreviveria sem o Deus cristão."},
 {k:"txt",h:"O preço",p:"O século XX, com regimes que rejeitaram Deus e mataram dezenas de milhões, mostrou o que acontece quando se corta a raiz."},
 {k:"txt",h:"De onde vêm os direitos humanos",p:"Dignidade igual para todos não é óbvia na história. Ela vem da convicção bíblica de que somos **imagem de Deus**. Tire o Criador e os direitos viram concessão do Estado."},
 {k:"txt",h:"“Homens sem peito”",p:"C. S. Lewis mostrou que povos do mundo todo compartilham uma lei moral comum. E alertou: tratar valores como meros sentimentos forma gente com razão, mas sem coragem moral."},
 {k:"bug",h:"Toque no trecho errado",parts:["Segundo o argumento moral,","sem Deus,","os ateus são pessoas más."],w:2,e:"O argumento não diz isso. Diz que, sem Deus, falta fundamento para o bem e o mal."},
 {k:"chat",who:"Enzo",c:"#3B5BDB",q:"Eu não preciso de Deus para ser uma pessoa boa.",o:[
  {t:"Concordo, você pode ser boa pessoa sem crer em Deus. Minha pergunta é outra: se tudo é matéria e acaso, o que faz a bondade ser obrigatória? Acho que você sente que o bem é real. Eu também.",v:2,r:"Hm... nunca pensei de onde vem esse “obrigatório”.",tip:"Você separou comportamento de fundamento. Esse é o coração do argumento."},
  {t:"A Bíblia manda ser bom, então é por isso.",v:1,r:"Mas eu não sigo a Bíblia e sou bom do mesmo jeito.",tip:"Ele não aceita a Bíblia como autoridade. Pergunte de onde vem o dever moral."},
  {t:"Sem Deus ninguém é bom de verdade, você só finge.",v:0,r:"Valeu pela consideração. 🙄",tip:"Falso e ofensivo. Muitos ateus são gentis; a questão é o fundamento."}]},
 {k:"verse"},
 {k:"mentor",t:"Investigação completa! Agora você responde às objeções mais fortes, sempre com mansidão."}
 ]},

c1:{conf:"enxergar a cosmovisão por trás de uma música ou série",
 mis:"Escolha uma música ou série de que você gosta e responda as 4 perguntas de cosmovisão sobre ela.",
 s:[
 {k:"mentor",t:"Eu sou Daniel. Fui levado jovem para a Babilônia e decidi ser fiel no meio de outra cultura (Dn 1.8). Cosmovisão é isso: ver a vida toda pelas lentes certas."},
 {k:"txt",h:"Todo mundo usa lentes",p:"Cosmovisão é o conjunto de convicções pelas quais você enxerga tudo. Todo mundo tem uma, inclusive quem diz que não tem."},
 {k:"list",h:"4 perguntas revelam qualquer cosmovisão",items:["Origem: de onde viemos?","Sentido: por que estamos aqui?","Moral: como devemos viver?","Destino: para onde vamos?"]},
 {k:"txt",tag:"Concorrente 1",h:"Naturalismo",p:"Só existe matéria. Origem: acaso. Sentido: nenhum, só o que você inventar. Destino: o nada."},
 {k:"txt",tag:"Concorrente 2",h:"Pós-modernismo",p:"Não há verdade, só narrativas e disputas de poder. Toda afirmação de verdade vira tentativa de dominar."},
 {k:"txt",tag:"Concorrente 3",h:"Consumismo",p:"A vida é prazer, imagem e experiência. O sentido vira o próximo produto ou a próxima curtida."},
 {k:"txt",tag:"Concorrente 4",h:"Ideologias que viram religião",p:"Projetos políticos que prometem salvação pelo Estado ou pela revolução, com seus próprios “pecados”, “santos” e “hereges”."},
 {k:"match",h:"Ligue a cosmovisão à frase dela",pairs:[["Naturalismo","“no fim, só existe matéria”"],["Pós-modernismo","“verdade é só narrativa de poder”"],["Consumismo","“você é o que você tem e posta”"]]},
 {k:"txt",h:"A resposta cristã",p:"**Origem:** Deus nos criou. **Sentido:** amar a Deus e ao próximo. **Moral:** refletir o caráter de Deus. **Destino:** ressurreição e nova criação."},
 {k:"quote",t:"Não há um centímetro quadrado em todo o domínio da existência humana sobre o qual Cristo, que é soberano sobre tudo, não clame: “É meu!”",by:"Abraham Kuyper (1880)"},

c2:{conf:"defender o valor de toda vida humana com graça",
 mis:"Descubra uma iniciativa que apoia gestantes, idosos ou pessoas com deficiência perto de você e veja como ajudar.",

 {k:"txt",h:"Conhecido antes de nascer",p:"“Antes que eu te formasse no ventre materno, eu te conheci” (Jr 1.5). João Batista estremeceu no ventre ao ouvir a saudação de Maria (Lc 1.41)."},
 {k:"txt",h:"O que a ciência mostra",p:"Na concepção surge um novo organismo humano, com DNA próprio, distinto do pai e da mãe. Por volta da 6ª semana já se detecta atividade cardíaca."},
 {k:"txt",h:"A pergunta real",p:"Não é se aquilo é vida humana (é). É se **toda** vida humana tem valor."},
 {k:"match",h:"SLED: diferenças que não mudam o valor",pairs:[["Tamanho","criança é menor que adulto"],["Desenvolvimento","menina de 4 anos e mulher de 20"],["Ambiente","20 cm pelo canal de parto"],["Dependência","quem usa insulina não perde direitos"]]},
 {k:"txt",h:"Cristãos sempre foram assim",p:"Em Roma, era comum abandonar bebês indesejados. A Didaqué (séc. I-II) ordenava: “Não matarás a criança por aborto, nem a matarás depois de nascida”. Cristãos resgatavam esses bebês."},

 {k:"tf",q:"Ser pró-vida é se importar só com o bebê, não com a mãe.",a:false,e:"Pró-vida de verdade cuida dos dois: apoio a gestantes, adoção e ajuda concreta."},
 {k:"chat",who:"Manu",c:"#D9480F",q:"Meu corpo, minhas regras.",o:[
  {t:"Concordo que seu corpo é seu. A questão é se existe outro corpo ali: o bebê tem DNA próprio, coração próprio, às vezes outro sexo. Eu acho que a gente devia cuidar dos dois, da mãe e do filho.",v:2,r:"Nunca tinha visto por esse lado do “outro corpo”.",tip:"Você concordou no que dava, focou na pergunta certa e mostrou cuidado com a mãe."},
  {t:"Isso é assunto de política, não me meto.",v:1,r:"Ué, achei que sua fé falava de vida.",tip:"Ela fala! Dá para conversar sobre isso com argumentos e compaixão."},
  {t:"Quem aborta é assassina e pronto.",v:0,r:"Você nem sabe o que as pessoas passam. 😢",tip:"Fale sempre com graça. Alguém perto de você pode ter passado por isso."}]},
 {k:"txt",h:"Com graça",p:"Para quem já passou por um aborto, a mensagem é Romanos 8.1: “nenhuma condenação há para os que estão em Cristo Jesus”. Há perdão completo."},

 {k:"mentor",t:"Verdade e graça andam juntas. Defenda a vida e abrace as pessoas."}
