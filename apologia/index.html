p3:{title:"Liberdade e mercado: por que funciona",min:10,
 sum:"Adam Smith, Hayek e os números que mostram como a liberdade econômica tirou bilhões da pobreza.",
 verse:{t:"Não furtarás.",r:"Êx 20.15"},
 body:`<p>O oitavo mandamento pressupõe algo: se é errado roubar, então existe aquilo que é <b>seu</b>. A propriedade privada é base da liberdade, porque quem não é dono de nada depende de quem é dono de tudo.</p>
<h3>Adam Smith e a mão invisível</h3>
<p>Em <i>A riqueza das nações</i> (1776), Adam Smith observou que "não é da benevolência do açougueiro, do cervejeiro ou do padeiro que esperamos nosso jantar, mas da atenção que dão ao próprio interesse". Em trocas livres, cada um precisa servir ao outro para ganhar. Sem que ninguém comande, milhões de decisões se coordenam como se houvesse uma <b>mão invisível</b>.</p>
<h3>O problema do conhecimento</h3>
<p>Friedrich Hayek, Prêmio Nobel de Economia em 1974, mostrou em "O uso do conhecimento na sociedade" (1945) que a informação necessária para a economia está <b>espalhada</b> por milhões de pessoas: o padeiro sabe da farinha, o agricultor sabe da chuva. Nenhum planejador central consegue reunir tudo isso. O <b>preço</b> é o sinal que transmite esse conhecimento. Ludwig von Mises já tinha mostrado, em 1920, que sem preços de mercado o socialismo não consegue calcular o que produzir.</p>
<blockquote>"A curiosa tarefa da economia é demonstrar aos homens o quão pouco eles realmente sabem sobre aquilo que imaginam poder planejar."<cite>F. A. Hayek, <i>A arrogância fatal</i> (1988)</cite></blockquote>
<h3>Os resultados falam</h3>
<ul>
<li>Segundo o Banco Mundial, a parcela da população mundial em <b>extrema pobreza</b> caiu de cerca de 38% em 1990 para menos de 9% em 2019, período de abertura econômica de China, Índia e outros países.</li>
<li>Mesmo povo, sistemas diferentes: <b>Coreia do Sul x Coreia do Norte</b>, <b>Alemanha Ocidental x Oriental</b>. De um lado, prosperidade; do outro, escassez e muros para impedir a fuga.</li>
</ul>
<h3>Mercado não é tudo</h3>
<p>Conservadores lembram que o mercado precisa de <b>virtudes</b> que ele não produz sozinho: honestidade, cumprimento de contratos, família estável. Liberdade econômica sem moral vira ganância; moral sem liberdade vira tirania. Por isso a direita cristã defende os dois.</p>`,
 pr:{q:"\"O capitalismo só gera desigualdade e miséria.\"",a:"\"Desigualdade existe, mas olha a miséria: em 1990 quase 4 em cada 10 pessoas do mundo viviam na pobreza extrema; antes da pandemia eram menos de 1 em cada 10, segundo o Banco Mundial. Isso aconteceu justamente quando países pobres abriram a economia. Compara as duas Coreias: mesmo povo, mesma cultura. Qual delas o povo tenta deixar?\""},
 quiz:[
  {q:"Que princípio bíblico pressupõe a propriedade privada?",o:["Não matarás","Não furtarás","Honra teu pai","Não adulterarás"],c:1,e:"Só se pode furtar o que pertence a alguém."},
  {q:"Qual a ideia central de Hayek em \"O uso do conhecimento na sociedade\"?",o:["O governo sabe mais que o mercado","O conhecimento está espalhado e os preços o transmitem; nenhum planejador consegue reuni-lo","Os preços devem ser fixados pelo Estado","O lucro é imoral"],c:1,e:"Conhecimento disperso + sinal de preços = coordenação sem comando central."},
  {q:"Segundo o Banco Mundial, a extrema pobreza mundial de 1990 a 2019:",o:["Aumentou muito","Ficou igual","Caiu de cerca de 38% para menos de 9%","Caiu só na Europa"],c:2,e:"Uma das maiores quedas de pobreza da história, com a abertura econômica de vários países."}
 ]},

p4:{title:"Estado: limites e funções",min:9,
 sum:"Para que serve o governo, por que ele precisa de freios e o princípio da subsidiariedade.",
 verse:{t:"Porque ela é ministro de Deus para teu bem. Mas, se fizeres o mal, teme; porque não é sem motivo que ela traz a espada.",r:"Rm 13.4"},
 body:`<h3>O Estado tem uma função real</h3>
<p>A direita não é contra o Estado. Romanos 13 diz que a autoridade existe para <b>promover o bem e punir o mal</b>: proteger a vida, a propriedade, garantir justiça e segurança. O problema começa quando o Estado quer ser tudo: pai, professor, patrão e salvador.</p>
<h3>Freios ao poder</h3>
<p>Montesquieu, em <i>O espírito das leis</i> (1748), defendeu a <b>separação dos poderes</b> (Executivo, Legislativo e Judiciário), porque "todo homem que tem poder é levado a abusar dele". Os fundadores dos EUA seguiram essa ideia, e a nossa Constituição também.</p>
<p>O Estado de direito significa que <b>todos estão sob a lei</b>, inclusive os governantes. Quando um poder ignora os limites, a liberdade de todos corre risco, não importa de que lado esteja quem abusa.</p>
<h3>Subsidiariedade</h3>
<p>Formulado pelo papa Pio XI na encíclica <i>Quadragesimo Anno</i> (1931), mas aceito por muitos protestantes, o princípio diz: <b>o que a instância menor pode fazer, a maior não deve tomar para si</b>. Primeiro a pessoa, depois a família, a igreja e a comunidade, depois o município, o estado e, por último, a União. O governo federal ajuda quando os de baixo não conseguem, mas não os substitui.</p>
<h3>O custo de um Estado grande</h3>
<ul>
<li>No Brasil, a <b>carga tributária</b> fica em torno de um terço do PIB: de cada 3 reais produzidos, cerca de 1 vai para o governo.</li>
<li>Tudo o que o governo "dá" foi antes tirado de alguém, inclusive dos mais pobres, por impostos embutidos no preço da comida e da roupa.</li>
<li>Quanto mais o Estado decide, menos espaço sobra para família, igreja e livre iniciativa.</li>
</ul>
<blockquote>"O problema do socialismo é que uma hora o dinheiro dos outros acaba."<cite>Margaret Thatcher, entrevista à Thames TV (1976)</cite></blockquote>
<div class="box">Ser a favor de Estado limitado não é ser contra os pobres. É acreditar que famílias, igrejas, empresas e comunidades livres cuidam melhor das pessoas do que uma burocracia distante.</div>`,
 pr:{q:"\"Se não fosse o governo, os pobres estariam abandonados.\"",a:"\"O governo tem um papel, concordo. Mas repara: o dinheiro do governo vem de impostos, e o pobre paga imposto em tudo o que compra. E muito do cuidado com os pobres sempre veio de família, igreja e comunidade, muito antes de existir programa social. Eu defendo que o Estado ajude onde ninguém mais consegue, sem tirar a força de quem está mais perto das pessoas.\""},
 quiz:[
  {q:"Segundo Romanos 13, para que existe a autoridade?",o:["Para controlar toda a vida das pessoas","Para promover o bem e punir o mal","Para substituir a família","Para enriquecer os governantes"],c:1,e:"Uma função real, porém limitada."},
  {q:"Quem defendeu a separação dos poderes em O espírito das leis (1748)?",o:["Rousseau","Montesquieu","Marx","Hobbes"],c:1,e:"Porque todo homem com poder tende a abusar dele."},
  {q:"O princípio da subsidiariedade diz que:",o:["O governo federal deve fazer tudo","O que a instância menor pode fazer, a maior não deve tomar para si","Só a família importa","Impostos devem ser os maiores possíveis"],c:1,e:"Pessoa, família, comunidade, município... a União por último."},
  {q:"A carga tributária brasileira fica em torno de:",o:["5% do PIB","Um terço do PIB","90% do PIB","Zero"],c:1,e:"Cerca de 1 de cada 3 reais produzidos vai para o governo."}
 ]},

h1:{title:"Da Revolução Francesa a Marx",min:10,
 sum:"Rousseau, o Terror, os socialistas utópicos e as ideias centrais de Karl Marx.",
 verse:{t:"Há caminho que ao homem parece direito, mas o seu fim são os caminhos da morte.",r:"Pv 14.12"},
 body:`<div class="box">Neste nível você vai conhecer o outro lado <b>pelas fontes dele</b>. Quem só conhece a caricatura perde o debate para o primeiro universitário que leu os originais.</div>
<h3>Rousseau e a Revolução</h3>
<p>Jean-Jacques Rousseau (<i>O contrato social</i>, 1762) ensinava que o ser humano nasce bom e é corrompido pela sociedade e pela propriedade. A solução seria uma "vontade geral" à qual todos deveriam se submeter; quem resistisse seria "forçado a ser livre". Os jacobinos levaram isso a sério: no Terror (1793-1794), cerca de 17 mil pessoas foram executadas oficialmente, e muitas mais morreram nas prisões e na guerra da Vendeia.</p>
<h3>Os socialistas utópicos</h3>
<p>No início do século XIX, Saint-Simon, Charles Fourier e Robert Owen imaginaram comunidades perfeitas e igualitárias. Algumas foram tentadas, e quase todas fracassaram em poucos anos.</p>
<h3>Karl Marx</h3>
<p>Marx e Friedrich Engels publicaram o <i>Manifesto Comunista</i> em 1848 e, depois, Marx escreveu <i>O capital</i> (1867). As ideias principais:</p>
<ul>
<li><b>Materialismo histórico:</b> a história é movida por fatores econômicos, não por ideias ou por Deus.</li>
<li><b>Luta de classes:</b> "a história de toda sociedade até hoje é a história da luta de classes". Burguesia (donos dos meios de produção) contra proletariado (trabalhadores).</li>
<li><b>Mais-valia:</b> o lucro seria a parte do trabalho do operário que o patrão não paga.</li>
<li><b>Revolução e ditadura do proletariado:</b> os trabalhadores tomariam o poder, aboliriam a propriedade privada e, no fim, o Estado "desapareceria".</li>
<li><b>Religião:</b> "o ópio do povo", uma consolação que impede a revolução.</li>
</ul>
<h3>Na voz deles, e a resposta</h3>
<p>Marx observou problemas reais: jornadas desumanas e trabalho infantil nas fábricas do século XIX. Mas as soluções falharam: as previsões de que o capitalismo empobreceria cada vez mais os operários não se cumpriram, e a teoria da mais-valia ignora o risco, a gestão e o capital de quem empreende. E onde quer que se tentou abolir a propriedade, foi preciso um Estado todo-poderoso para tomá-la à força.</p>
<p>Em 1871, a <b>Comuna de Paris</b>, um governo revolucionário de dois meses, foi saudada por Marx como modelo da ditadura do proletariado.</p>`,
 pr:{q:"\"Marx tinha razão: o patrão rouba o trabalhador.\"",a:"\"Marx viu coisas reais, como a exploração nas fábricas do século XIX. Mas a ideia de que todo lucro é roubo esquece que alguém arriscou o capital, organizou a produção e pode quebrar. E quando os países seguiram Marx e aboliram o patrão, o novo patrão virou o Estado, que pagava pouco e não deixava nem fazer greve. Os trabalhadores viviam melhor de que lado do Muro de Berlim?\""},
 quiz:[
  {q:"Rousseau ensinava que o ser humano:",o:["Nasce pecador","Nasce bom e é corrompido pela sociedade","É apenas matéria","É guiado pela tradição"],c:1,e:"Base de muitas utopias: mude a sociedade e o homem será bom."},
  {q:"Em que ano foi publicado o Manifesto Comunista?",o:["1789","1848","1917","1945"],c:1,e:"Escrito por Marx e Engels."},
  {q:"Para Marx, o motor da história é:",o:["A vontade de Deus","As ideias dos grandes homens","A luta de classes e os fatores econômicos","O acaso"],c:2,e:"Materialismo histórico e luta de classes."},
  {q:"O que é a \"mais-valia\" na teoria marxista?",o:["Um imposto sobre luxo","A parte do trabalho do operário que o patrão não pagaria","O salário mínimo","A inflação"],c:1,e:"Para Marx, a fonte do lucro capitalista."}
 ]},

h2:{title:"Lênin, Stalin e Mao: o comunismo no poder",min:11,
 sum:"O que aconteceu quando as ideias saíram do papel: Rússia, China, Camboja e Cuba.",
 verse:{t:"Pelos seus frutos os conhecereis.",r:"Mt 7.16"},
 body:`<h3>Reforma ou revolução?</h3>
<p>No fim do século XIX, a esquerda se dividiu. Eduard Bernstein propôs chegar ao socialismo por reformas e eleições: daí nasce a <b>social-democracia</b>. Outros, como Lênin, insistiram na revolução violenta. É importante saber diferenciar: um social-democrata europeu não é um comunista leninista.</p>
<h3>Lênin e 1917</h3>
<p>Em <i>O que fazer?</i> (1902), Lênin defendeu um <b>partido de vanguarda</b>: revolucionários profissionais que conduziriam as massas. Em outubro de 1917, os bolcheviques tomaram o poder na Rússia, fecharam a Assembleia Constituinte eleita e criaram a polícia política (Tcheka).</p>
<h3>Stalin</h3>
<ul>
<li><b>Holodomor</b> (1932-1933): a coletivização forçada e o confisco de grãos causaram uma fome que matou de 3,5 a 5 milhões de ucranianos.</li>
<li><b>Gulag:</b> cerca de 18 milhões de pessoas passaram pelos campos de trabalho forçado entre 1930 e 1953, segundo a historiadora Anne Applebaum. Os próprios arquivos soviéticos registram mais de 1,5 milhão de mortes nos campos.</li>
<li><b>Grande Expurgo</b> (1936-1938): centenas de milhares de fuzilados, muitos deles comunistas acusados de traição.</li>
</ul>
<h3>Mao, Pol Pot e Fidel</h3>
<ul>
<li><b>China:</b> o Grande Salto Adiante (1958-1962) provocou a maior fome da história, com estimativas de 15 a 45 milhões de mortos. Depois veio a Revolução Cultural (1966-1976), com perseguição a professores, religiosos e "inimigos de classe".</li>
<li><b>Camboja:</b> o Khmer Vermelho (1975-1979) matou cerca de 1,5 a 2 milhões de pessoas, quase um quarto da população.</li>
<li><b>Cuba</b> (desde 1959): partido único, presos políticos e mais de um milhão de exilados ao longo das décadas.</li>
</ul>
<p>O <i>Livro negro do comunismo</i> (1997), escrito por historiadores franceses, estimou cerca de 100 milhões de mortos no século XX. Alguns historiadores contestam o número total, mas nenhum sério nega que as vítimas se contam em <b>dezenas de milhões</b>.</p>
<h3>Por que sempre acaba assim?</h3>
<p>Hayek explicou em <i>O caminho da servidão</i> (1944): para planejar toda a economia, o Estado precisa controlar tudo, e quem chega ao topo desse poder tende a ser o mais implacável. Não é um "desvio"; é a lógica do sistema.</p>
<blockquote>"A linha que separa o bem e o mal não passa entre Estados, nem entre classes, nem entre partidos, mas atravessa o coração de cada ser humano."<cite>Aleksandr Soljenítsin, <i>Arquipélago Gulag</i> (1973)</cite></blockquote>`,
 pr:{q:"\"O comunismo nunca foi aplicado de verdade. Aquilo não era comunismo.\"",a:"\"Foi tentado em dezenas de países, em continentes e culturas diferentes: Rússia, China, Camboja, Cuba, Coreia do Norte, Leste Europeu. Os líderes se diziam marxistas e seguiam o plano de abolir a propriedade pelo Estado. E sempre deu em partido único, polícia política e fome. Quando um remédio falha em todo paciente, o problema é o remédio, não os pacientes.\""},
 quiz:[
  {q:"Qual a diferença entre social-democracia e comunismo leninista?",o:["Nenhuma","A social-democracia busca mudanças por eleições e reformas; o leninismo, pela revolução e partido único","A social-democracia é de direita","O leninismo defende o livre mercado"],c:1,e:"Saber diferenciar dá credibilidade no debate."},
  {q:"O que foi o Holodomor?",o:["Uma guerra na Polônia","A fome provocada na Ucrânia pela coletivização de Stalin (1932-1933)","Um plano econômico de sucesso","Uma revolução na China"],c:1,e:"Matou de 3,5 a 5 milhões de ucranianos."},
  {q:"O Grande Salto Adiante, de Mao, provocou:",o:["Crescimento econômico recorde","A maior fome da história, com milhões de mortos","A democracia na China","O fim da Guerra Fria"],c:1,e:"Estimativas de 15 a 45 milhões de mortos."},
  {q:"Segundo Hayek, por que a economia planejada tende à tirania?",o:["Por azar","Porque planejar tudo exige controlar tudo, e o poder atrai os mais implacáveis","Porque os mercados atacam o Estado","Não tende"],c:1,e:"O caminho da servidão (1944)."}
 ]},

h3:{title:"Gramsci e a conquista da cultura",min:12,
 sum:"Hegemonia, guerra de posição, Escola de Frankfurt e Paulo Freire: a estratégia cultural da esquerda.",
 verse:{t:"Cuidado que ninguém vos venha a enredar com sua filosofia e vãs sutilezas, conforme a tradição dos homens.",r:"Cl 2.8"},
 body:`<h3>Por que a revolução não veio ao Ocidente?</h3>
<p>Marx previu que a revolução começaria nos países industrializados, como Inglaterra e Alemanha. Ela veio na Rússia, país agrário, e fracassou no Ocidente. Por quê? Um comunista italiano tentou responder.</p>
<h3>Antonio Gramsci</h3>
<p>Fundador do Partido Comunista Italiano (1921), Gramsci foi preso por Mussolini em 1926 e escreveu na prisão os <i>Cadernos do cárcere</i> (1929-1935). Morreu em 1937. A resposta dele: no Ocidente, o poder não está só no Estado, mas na <b>sociedade civil</b>: escolas, igrejas, imprensa, cultura, família. Enquanto as pessoas acreditarem nos valores tradicionais, a revolução não pega.</p>
<ul>
<li><b>Hegemonia:</b> domínio exercido pelo consenso, quando as ideias de um grupo viram o "normal" para todos.</li>
<li><b>Guerra de movimento x guerra de posição:</b> em vez do ataque frontal (como na Rússia), uma longa ocupação de posições na cultura e nas instituições.</li>
<li><b>Intelectual orgânico:</b> professores, jornalistas e artistas ligados ao projeto, que formam a opinião.</li>
<li><b>Senso comum:</b> transformar o que as pessoas consideram óbvio. Quem define o senso comum, define a política.</li>
</ul>
<h3>A Escola de Frankfurt</h3>
<p>Em 1923 foi criado na Alemanha o Instituto de Pesquisa Social, conhecido como <b>Escola de Frankfurt</b> (Horkheimer, Adorno, Marcuse). Eles desenvolveram a <b>teoria crítica</b>: criticar e desmontar as instituições e valores da sociedade ocidental, vistos como formas de dominação. Herbert Marcuse, em "Tolerância repressiva" (1965), chegou a defender a intolerância com ideias da direita. Essas obras inspiraram a Nova Esquerda e o Maio de 1968.</p>
<h3>Paulo Freire</h3>
<p>No Brasil, Paulo Freire escreveu <i>Pedagogia do oprimido</i> em 1968. Para ele, educar é "conscientizar" o aluno sobre a relação entre oprimidos e opressores. Freire foi declarado patrono da educação brasileira por lei em 2012 e influencia até hoje a formação de professores.</p>
<h3>Como responder com precisão</h3>
<div class="box">Use os termos certos: "hegemonia cultural de Gramsci", "teoria crítica da Escola de Frankfurt", "pedagogia de Freire". Expressões genéricas como "marxismo cultural" são contestadas no meio acadêmico e fáceis de ridicularizar. Mostrar que você leu os autores é muito mais forte.</div>
<p>A resposta conservadora também é cultural: se a política nasce da cultura, precisamos de <b>bons professores, artistas, jornalistas e escritores</b> que amem a verdade. Reclamar não basta; é preciso construir.</p>`,
 pr:{q:"\"Gramsci é teoria da conspiração da direita.\"",a:"\"Gramsci existiu, fundou o Partido Comunista Italiano e escreveu os Cadernos do cárcere, que são estudados em qualquer curso de ciências sociais. Ali ele fala de hegemonia, guerra de posição e intelectual orgânico. Não é conspiração; é uma estratégia que ele mesmo descreveu. A discussão honesta é sobre o quanto essas ideias influenciam hoje, e isso dá pra debater com dados.\""},
 quiz:[
  {q:"Onde Gramsci escreveu suas principais ideias?",o:["Na Universidade de Moscou","Nos Cadernos do cárcere, preso pelo regime de Mussolini","Em Paris, em 1968","Nos EUA"],c:1,e:"Cadernos escritos entre 1929 e 1935."},
  {q:"O que Gramsci chamou de \"guerra de posição\"?",o:["Uma batalha militar","A longa ocupação de espaços na cultura e nas instituições","Uma eleição","Uma greve geral"],c:1,e:"Em oposição à \"guerra de movimento\", o ataque frontal."},
  {q:"O que é \"hegemonia\" para Gramsci?",o:["Força militar","Domínio pelo consenso, quando as ideias de um grupo viram o normal","Economia de mercado","Eleição direta"],c:1,e:"Quem define o senso comum define a política."},
  {q:"Quem escreveu \"Tolerância repressiva\" (1965)?",o:["Herbert Marcuse","Paulo Freire","Lênin","Hayek"],c:0,e:"Marcuse, da Escola de Frankfurt, defendia intolerância com ideias da direita."}
 ]},

h4:{title:"Do Muro até hoje",min:10,
 sum:"Queda do comunismo, Foro de São Paulo, a esquerda no Brasil e a política identitária.",
 verse:{t:"A justiça exalta as nações, mas o pecado é o opróbrio dos povos.",r:"Pv 14.34"},
 body:`<h3>O fim de uma era</h3>
<p>Em 9 de novembro de 1989 caiu o Muro de Berlim, construído em 1961 para impedir que os alemães orientais fugissem. Em dezembro de 1991, a União Soviética deixou de existir. Muitos acharam que o socialismo tinha acabado. A esquerda se adaptou.</p>
<h3>A esquerda no Brasil</h3>
<ul>
<li><b>1922:</b> fundação do Partido Comunista do Brasil (PCB).</li>
<li><b>1935:</b> Intentona Comunista, levante armado fracassado.</li>
<li><b>1964-1985:</b> regime militar. Grupos de esquerda partiram para a luta armada (sequestros, assaltos, guerrilha) com apoio de Cuba. O regime respondeu com censura, prisões e tortura. Uma direita séria rejeita as duas coisas: a guerrilha e a tortura.</li>
<li><b>1980:</b> fundação do PT, reunindo sindicalistas, católicos da Teologia da Libertação e intelectuais de esquerda.</li>
<li><b>1990:</b> fundação do <b>Foro de São Paulo</b>, convocado pelo PT e pelo Partido Comunista de Cuba, reunindo partidos e movimentos de esquerda da América Latina.</li>
</ul>
<h3>América Latina</h3>
<p>Na Venezuela, o chavismo (desde 1999) se apresentou como "socialismo do século XXI". O resultado: colapso econômico, hiperinflação e mais de 7 milhões de venezuelanos emigrados, segundo a ONU, um dos maiores êxodos do mundo.</p>
<h3>Da classe para a identidade</h3>
<p>Com o operário enriquecendo no Ocidente, parte da esquerda trocou o foco da <b>classe</b> para a <b>identidade</b>: raça, sexo, orientação sexual. A lógica oprimido x opressor continua, mas aplicada a grupos. Teorias como a interseccionalidade classificam as pessoas pelo grupo, não pelo caráter.</p>
<p>A resposta conservadora e cristã: cada pessoa é <b>imagem de Deus</b> e responde pelos próprios atos. Injustiças reais existem e devem ser combatidas, mas julgar alguém pela cor ou pelo grupo, em qualquer direção, é injusto. Martin Luther King Jr., pastor batista, sonhava com filhos julgados "não pela cor da pele, mas pelo conteúdo do caráter" (1963).</p>
<div class="box">Seja honesto com os fatos recentes: verifique números em fontes primárias (IBGE, Banco Mundial, ONU) e admita quando um governo de direita também errou. Credibilidade é sua arma mais forte.</div>`,
 pr:{q:"\"O Foro de São Paulo é invenção da direita.\"",a:"\"O Foro existe e tem site oficial. Foi fundado em 1990, em São Paulo, a convite do PT e do Partido Comunista de Cuba, e reúne partidos de esquerda da América Latina até hoje. O que dá pra debater é o tamanho da influência dele. Mas que existe, existe; os próprios membros falam dele abertamente.\""},
 quiz:[
  {q:"Quando caiu o Muro de Berlim?",o:["1961","1989","1991","2001"],c:1,e:"9 de novembro de 1989. A URSS acabou em dezembro de 1991."},
  {q:"Quem convocou a fundação do Foro de São Paulo em 1990?",o:["O governo dos EUA","O PT e o Partido Comunista de Cuba","A ONU","Partidos de direita"],c:1,e:"Reúne partidos de esquerda da América Latina."},
  {q:"Qual foi o principal deslocamento de parte da esquerda após a Guerra Fria?",o:["Da identidade para a economia","Da classe social para a identidade de grupos","Do Estado para o mercado","Da cultura para o exército"],c:1,e:"A lógica oprimido x opressor aplicada a grupos."},
  {q:"Sobre o regime militar (1964-1985), a posição coerente de uma direita séria é:",o:["Negar tudo","Rejeitar tanto a luta armada quanto a tortura e a censura","Defender a tortura","Ignorar o assunto"],c:1,e:"Coerência moral dá credibilidade."}
 ]},

s1:{title:"Argumentar sem cair em armadilhas",min:9,
 sum:"As falácias mais comuns, o espantalho ao contrário e como usar dados sem passar vergonha.",
 verse:{t:"A resposta branda desvia o furor, mas a palavra dura suscita a ira.",r:"Pv 15.1"},
 body:`<h3>Falácias que você vai ver (e não deve usar)</h3>
<ul>
<li><b>Espantalho:</b> distorcer a ideia do outro para atacar uma versão fraca. "Você defende mercado, então quer que os pobres morram."</li>
<li><b>Ad hominem:</b> atacar a pessoa em vez do argumento. "Você é rico, então não pode falar de pobreza."</li>
<li><b>Falsa dicotomia:</b> só duas opções quando há outras. "Ou o Estado paga, ou ninguém ajuda."</li>
<li><b>Apelo à emoção:</b> trocar argumento por comoção. Emoção é legítima, mas não substitui razão.</li>
<li><b>Generalização apressada:</b> "Todo professor é comunista." Não é, e você perde credibilidade.</li>
</ul>
<h3>O contrário do espantalho: o "homem de aço"</h3>
<p>Antes de responder, apresente a ideia do outro <b>na melhor versão possível</b>, tão bem que ele diga "é isso mesmo". Depois responda. Isso desarma o oponente e mostra a quem assiste que você é justo. Provérbios 18.13: responder antes de ouvir é estultícia.</p>
<h3>Perguntas valem mais que discursos</h3>
<p>Use as perguntas de Colombo (Greg Koukl): <b>"O que você quer dizer com isso?"</b> e <b>"Como você chegou a essa conclusão?"</b>. Uma terceira, de ouro em política: <b>"Comparado com quê?"</b>. "O mercado é injusto." Comparado com qual sistema real que funcionou melhor?</p>
<h3>Dados: use com cuidado</h3>
<ul>
<li>Cite a fonte (IBGE, Banco Mundial, IPEA, ONU) e o ano.</li>
<li>Prefira fontes que o outro lado também respeita.</li>
<li>Não compartilhe número que você não conferiu. Um dado errado derruba dez certos.</li>
<li>Correlação não é causa. Explique o mecanismo.</li>
</ul>
<blockquote>"Não há soluções. Há apenas escolhas e custos."<cite>Thomas Sowell</cite></blockquote>
<p>Essa frase de Sowell é a pergunta mais poderosa em qualquer debate de política pública: <b>quanto custa, e quem paga?</b></p>`,
 pr:{q:"\"Você é de direita porque é privilegiado.\"",a:"\"Isso é falar de mim, não da ideia. Mesmo que eu fosse privilegiado, o argumento continuaria certo ou errado do mesmo jeito. Vamos ao ponto: você acha que a minha posição sobre impostos está errada por qual motivo? Me explica a melhor versão do seu argumento que eu escuto de verdade.\""},
 quiz:[
  {q:"\"Você defende o mercado, então quer que os pobres morram.\" Que falácia é essa?",o:["Ad hominem","Espantalho","Apelo à autoridade","Nenhuma"],c:1,e:"Distorce a posição para atacar uma versão absurda."},
  {q:"O que é apresentar o \"homem de aço\" do argumento?",o:["Atacar com força","Apresentar a ideia do outro na melhor versão antes de responder","Usar só dados","Interromper o adversário"],c:1,e:"O oposto do espantalho: justiça e credibilidade."},
  {q:"Qual pergunta é especialmente útil em debates de política pública?",o:["\"Você vota em quem?\"","\"Comparado com quê?\"","\"Você é crente?\"","\"Quanto você ganha?\""],c:1,e:"Obriga a comparar com alternativas reais."}
 ]},

s2:{title:"Na escola e na faculdade",min:9,
 sum:"Seus direitos, como agir diante de doutrinação e como ganhar respeito pelo exemplo.",
 verse:{t:"Ninguém despreze a tua mocidade; pelo contrário, torna-te padrão dos fiéis, na palavra, no procedimento, no amor, na fé, na pureza.",r:"1 Tm 4.12"},
 body:`<h3>O que a lei garante</h3>
<ul>
<li><b>Constituição, art. 5º, IV:</b> é livre a manifestação do pensamento.</li>
<li><b>Art. 5º, VI e VIII:</b> liberdade de consciência e de crença; ninguém perde direitos por convicção religiosa, filosófica ou política.</li>
<li><b>Art. 206, II e III:</b> o ensino tem como princípios a liberdade de aprender, ensinar, pesquisar e divulgar o pensamento, e o <b>pluralismo de ideias</b>.</li>
</ul>
<p>Ou seja: o professor tem liberdade para ensinar, e você tem liberdade para aprender e discordar. Pluralismo vale para os dois lados.</p>
<h3>Quando a aula vira palanque</h3>
<ol>
<li><b>Mantenha a calma.</b> Ninguém ganha discussão gritando em sala.</li>
<li><b>Pergunte, não acuse:</b> "Professor, qual a fonte desse dado?", "Como os críticos dessa teoria respondem?", "Podemos ler também um autor do outro lado?".</li>
<li><b>Anote</b> datas e falas se a situação se repetir (abuso de verdade, como humilhar alunos por opinião).</li>
<li><b>Procure os canais certos</b>, com respeito: coordenação, direção, ouvidoria. Leve seus pais.</li>
<li><b>Nunca exponha</b> professor ou colega nas redes por impulso. Isso costuma voltar contra você.</li>
</ol>
<h3>Redações e trabalhos</h3>
<p>Você pode defender sua posição em redações, inclusive no ENEM, desde que respeite os direitos humanos e argumente bem. Use dados, autores e lógica. Um texto conservador bem fundamentado pode tirar nota alta; um panfleto de qualquer lado, não.</p>
<h3>A arma mais forte: excelência</h3>
<p>Seja o aluno mais educado, pontual e estudioso da turma. Daniel foi "dez vezes mais sábio" que os outros na corte da Babilônia (Dn 1.20) sem abrir mão das convicções. Professores e colegas podem discordar das suas ideias, mas vão respeitar seu caráter e sua nota.</p>
<div class="box">Na faculdade, leia os autores que o professor indica, e leia melhor que ele espera. Quem conhece Marx, Gramsci e Freire pelos originais pode fazer perguntas que nenhum panfleto faz.</div>`,
 pr:{q:"A professora diz: \"Todo mundo que é de direita é contra os pobres\".",a:"Levante a mão com calma: \"Professora, posso dar outra visão? Muitos de direita defendem que os pobres saem da pobreza com emprego, educação de qualidade e menos imposto sobre comida. Pode ser que a gente esteja errado, mas a intenção é a mesma: ajudar os pobres. Será que a discussão não é mais sobre qual caminho funciona melhor?\""},
 quiz:[
  {q:"Qual artigo da Constituição traz o pluralismo de ideias como princípio do ensino?",o:["Art. 1º","Art. 206","Art. 300","Não existe"],c:1,e:"Art. 206, incisos II e III."},
  {q:"Diante de um professor que faz palanque, a melhor primeira atitude é:",o:["Gritar e sair da sala","Gravar escondido e postar","Perguntar com calma pela fonte e pelo outro lado","Ficar calado sempre"],c:2,e:"Calma e perguntas inteligentes."},
  {q:"Que personagem bíblico foi excelente nos estudos sem abrir mão das convicções?",o:["Sansão","Daniel","Jonas","Saul"],c:1,e:"Dez vezes mais sábio na corte da Babilônia (Dn 1.20)."}
 ]},

s3:{title:"Nas redes e na família",min:8,
 sum:"Como falar de política sem destruir amizades, relações familiares e o seu testemunho.",
 verse:{t:"Todo homem seja pronto para ouvir, tardio para falar, tardio para se irar.",r:"Tg 1.19"},
 body:`<h3>Nas redes</h3>
<ul>
<li><b>Três perguntas antes de postar:</b> é verdade? É necessário? Edifica (Ef 4.29)?</li>
<li><b>Confira antes de compartilhar.</b> Procure a fonte original, a data e o contexto. Notícia falsa é falso testemunho (Êx 20.16), mesmo que "favoreça o seu lado".</li>
<li><b>Não alimente briga de comentário.</b> Quem quer plateia não quer conversa. Responda uma vez com educação e saia.</li>
<li><b>Cuidado com o algoritmo:</b> ele mostra o que te deixa com raiva, porque raiva prende atenção. Siga também pessoas sérias que pensam diferente.</li>
<li><b>Ironia e meme</b> não convencem ninguém do outro lado; só aplaudem quem já concorda.</li>
</ul>
<h3>Na família</h3>
<p>O almoço de domingo não é um debate de TV. Seus pais, avós e tios são pessoas que você deve honrar (Êx 20.12), mesmo quando discordam de você.</p>
<ul>
<li>Escolha o momento: discussão quente em festa raramente termina bem.</li>
<li>Pergunte por que a pessoa pensa assim. Muitas vezes há uma história de vida por trás.</li>
<li>Concorde onde der: "Também acho que a saúde pública precisa melhorar".</li>
<li>Saiba parar: "A gente pensa diferente, e tá tudo bem. Te amo do mesmo jeito".</li>
</ul>
<h3>Amizade acima da política</h3>
<p>Jesus escolheu como discípulos Mateus, um cobrador de impostos que trabalhava para Roma, e Simão, o zelote, de um grupo que queria expulsar Roma. Os dois andaram juntos porque Cristo era maior que a política deles. Seus amigos de esquerda não são seus inimigos; são pessoas por quem Cristo morreu.</p>
<div class="box">Vença o argumento sem perder a pessoa. Daqui a dez anos, ninguém vai lembrar do comentário que você ganhou, mas vão lembrar de como você tratou as pessoas.</div>`,
 pr:{q:"No grupo da família, o tio manda: \"Esse povo de direita é tudo fascista\".",a:"Responda no particular ou com leveza: \"Tio, te amo, mas não sou fascista não, hein! Fascismo era Mussolini dizendo 'tudo no Estado, nada fora do Estado'. Eu defendo justamente menos Estado e mais liberdade. Depois a gente conversa com calma num café, sem grupo, combinado?\""},
 quiz:[
  {q:"Compartilhar notícia falsa que favorece seu lado é:",o:["Estratégia válida","Falso testemunho, mesmo se favorecer seu lado","Liberdade de expressão sem problema","Obrigação"],c:1,e:"Êx 20.16 vale para todos os lados."},
  {q:"Quais dois discípulos de Jesus vinham de lados políticos opostos?",o:["Pedro e André","Mateus, o cobrador de impostos, e Simão, o zelote","João e Tiago","Judas e Tomé"],c:1,e:"Cristo era maior que a política deles."},
  {q:"Num almoço de família tenso, o melhor é:",o:["Vencer a discussão a qualquer custo","Escolher o momento, perguntar, concordar onde der e saber parar","Nunca mais falar com o parente","Postar a briga nas redes"],c:1,e:"Honrar pai e mãe inclui o tom."}
 ]},

s4:{title:"Rótulos: fascista, extremista, odioso",min:9,
 sum:"O que os rótulos realmente significam, como responder e o que a direita deve rejeitar em suas próprias fileiras.",
 verse:{t:"Ai dos que ao mal chamam bem e ao bem, mal.",r:"Is 5.20"},
 body:`<h3>Por que rótulos funcionam</h3>
<p>Rótulos encerram a conversa antes de ela começar. Se você é "fascista", ninguém precisa ouvir seu argumento. Por isso a primeira resposta é sempre pedir a <b>definição</b>: "O que você quer dizer com fascista?"</p>
<h3>O que foi o fascismo</h3>
<p>O fascismo foi fundado por Benito Mussolini, um ex-socialista, na Itália (1919-1922). Sua fórmula, em discurso de 1925: <b>"Tudo no Estado, nada fora do Estado, nada contra o Estado"</b>. Era nacionalismo extremo, culto ao líder, partido único, violência contra opositores e controle estatal da economia e da cultura. O nazismo alemão, que matou 6 milhões de judeus no Holocausto, também era estatista e totalitário.</p>
<p>Um conservador que defende <b>Estado limitado, família independente do Estado, liberdade religiosa e eleições livres</b> está no polo oposto dessa fórmula.</p>
<h3>Totalitarismo, à esquerda e à direita</h3>
<p>A filósofa Hannah Arendt, judia que fugiu dos nazistas, mostrou em <i>Origens do totalitarismo</i> (1951) que nazismo e stalinismo tinham a mesma estrutura: ideologia total, terror, partido único e destruição da vida privada. O inimigo da liberdade é o <b>poder total</b>, venha de onde vier.</p>
<h3>O que a direita deve rejeitar</h3>
<p>Para ter autoridade contra rótulos falsos, rejeite com clareza o que é errado de verdade, inclusive quando vem de quem se diz de direita:</p>
<ul>
<li><b>racismo e antissemitismo</b>: toda pessoa é imagem de Deus (Gn 1.27; At 17.26);</li>
<li><b>violência política</b> e depredação, de qualquer lado;</li>
<li><b>culto a líder</b> político: "Não confieis em príncipes" (Sl 146.3);</li>
<li><b>desprezo pela lei</b> e pelas instituições quando o resultado não agrada.</li>
</ul>
<div class="box">Responda rótulos com calma e definições, não com outro rótulo. "Comunista!" em resposta a "fascista!" só mostra que ninguém ali está pensando.</div>`,
 pr:{q:"\"Você é de direita? Então você é fascista.\"",a:"\"O que você entende por fascismo? Porque o fascismo do Mussolini era 'tudo no Estado, nada fora do Estado', partido único e perseguição a quem discorda. Eu defendo o oposto: menos poder para o Estado, liberdade de expressão para todos, inclusive para você, e eleições livres. E rejeito racismo e violência venham de onde vierem. Então talvez a palavra não sirva pra mim.\""},
 quiz:[
  {q:"Qual a fórmula de Mussolini (1925) que resume o fascismo?",o:["Liberdade, igualdade, fraternidade","Tudo no Estado, nada fora do Estado, nada contra o Estado","Deus, pátria e família","Trabalhadores do mundo, uni-vos"],c:1,e:"O fascismo era estatista e totalitário."},
  {q:"O que Hannah Arendt mostrou em Origens do totalitarismo (1951)?",o:["Que o nazismo era liberal","Que nazismo e stalinismo tinham a mesma estrutura totalitária","Que só a direita é perigosa","Que o totalitarismo é bom em crises"],c:1,e:"O inimigo da liberdade é o poder total."},
  {q:"Qual a melhor primeira resposta a um rótulo?",o:["Devolver outro rótulo","Pedir a definição","Sair da conversa","Concordar"],c:1,e:"\"O que você quer dizer com isso?\""},
  {q:"Para ter autoridade moral, a direita deve rejeitar:",o:["Só os erros da esquerda","Racismo, violência política, culto a líder e desprezo pela lei, venham de onde vierem","Nada","A democracia"],c:1,e:"Coerência é credibilidade."}
 ]},

l1:{title:"Fé cristã e política",min:9,
 sum:"Duas cidades, esferas de soberania e por que sua esperança não está em nenhum político.",
 verse:{t:"Não confieis em príncipes, nem nos filhos dos homens, em quem não há salvação.",r:"Sl 146.3"},
 body:`<h3>As duas cidades</h3>
<p>Agostinho escreveu <i>A cidade de Deus</i> (413-426) depois do saque de Roma, quando muitos culpavam os cristãos. Ele explicou que existem duas cidades: a <b>cidade dos homens</b>, movida pelo amor de si, e a <b>cidade de Deus</b>, movida pelo amor a Deus. O cristão vive nas duas: é bom cidadão aqui, mas sabe que nenhum império é o Reino de Deus.</p>
<h3>Esferas de soberania</h3>
<p>Abraham Kuyper (1880) ensinou que Deus deu autoridade própria a cada esfera da vida: <b>família, igreja, Estado, escola, trabalho, ciência, arte</b>. Nenhuma deve engolir a outra. O Estado não deve mandar na igreja nem substituir os pais; a igreja não deve virar partido.</p>
<h3>A igreja não é comitê eleitoral</h3>
<ul>
<li>O cristão pode e deve participar da política: votar, debater, candidatar-se, servir.</li>
<li>Mas o púlpito existe para pregar Cristo, não para fazer campanha.</li>
<li>Irmãos podem votar diferente e continuar irmãos.</li>
<li>Critique o pecado dos seus aliados também. Natã confrontou Davi, um rei que era "do lado certo" (2 Sm 12).</li>
</ul>
<h3>Princípios que valem para a urna</h3>
<p>Miqueias 6.8 resume o que Deus pede: "praticar a justiça, amar a misericórdia e andar humildemente com o teu Deus". Isso ajuda a avaliar propostas: protege a vida? Fortalece a família? Respeita a liberdade? Cuida dos pobres com sabedoria? É honesto?</p>
<blockquote>"A liberdade nunca está a mais de uma geração da extinção. Não a passamos aos nossos filhos pela corrente sanguínea; ela precisa ser defendida, protegida e transmitida."<cite>Ronald Reagan (1961)</cite></blockquote>
<div class="box">Nenhum político vai salvar o Brasil. Cristo salva pessoas, e pessoas transformadas transformam famílias, igrejas e cidades. Vote com consciência, mas ponha sua esperança no lugar certo.</div>`,
 pr:{q:"\"Crente não deveria se meter em política.\"",a:"\"Eu entendo a preocupação: igreja não pode virar partido. Mas cristão é cidadão. José governou o Egito, Daniel serviu na Babilônia, Wilberforce acabou com o tráfico de escravos pelo Parlamento. Se os cristãos saem da política, outros decidem por nós sobre escola, família e liberdade religiosa. O segredo é participar sem idolatrar nenhum político.\""},
 quiz:[
  {q:"Em A cidade de Deus, Agostinho ensina que:",o:["O Império Romano era o Reino de Deus","O cristão vive em duas cidades e nenhum império é o Reino de Deus","Cristãos não devem obedecer a leis","A política é tudo"],c:1,e:"Cidadania terrena com esperança celestial."},
  {q:"A ideia de \"esferas de soberania\" é de:",o:["Marx","Abraham Kuyper","Rousseau","Gramsci"],c:1,e:"Família, igreja, Estado e outras esferas com autoridade própria."},
  {q:"Qual texto resume o que Deus pede, útil para avaliar propostas?",o:["Mq 6.8","Gn 50.20","Ap 21.4","Jo 3.16"],c:0,e:"Justiça, misericórdia e humildade diante de Deus."}
 ]},

l2:{title:"Vida, família e liberdade na lei",min:10,
 sum:"O que diz a lei brasileira sobre aborto, educação domiciliar e liberdade religiosa, e como defender cada ponto.",
 verse:{t:"Abre a tua boca a favor do mudo, pelo direito de todos os que se acham desamparados.",r:"Pv 31.8"},
 body:`<h3>Vida</h3>
<p>No Brasil, o aborto é crime (Código Penal, arts. 124 a 127), com exceções no art. 128: risco de vida para a gestante e gravidez resultante de estupro. Em 2012, o STF (ADPF 54) acrescentou o caso de anencefalia. Há pressão constante para ampliar o aborto pelo Judiciário. Argumentos que você já conhece da ciência (organismo humano com DNA próprio desde a concepção) e da ética (SLED) valem aqui.</p>
<p>Coerência pró-vida: apoio a gestantes, adoção, creches, combate à violência contra a mulher. Quem defende a vida no ventre deve defender também a mãe.</p>
<h3>Família e educação</h3>
<ul>
<li>A Constituição chama a família de "base da sociedade" (art. 226) e diz que a educação é dever do Estado <b>e da família</b> (art. 205).</li>
<li><b>Educação domiciliar:</b> em 2018 o STF decidiu (RE 888.815) que ela não é proibida pela Constituição, mas depende de uma lei que a regulamente. O tema segue em discussão no Congresso.</li>
<li>Pais têm o direito de acompanhar o que os filhos aprendem. A Convenção Americana de Direitos Humanos (art. 12) garante aos pais que os filhos recebam educação religiosa e moral de acordo com as convicções deles.</li>
</ul>
<h3>Liberdade religiosa e de expressão</h3>
<p>A Constituição protege a crença e o culto (art. 5º, VI). Isso inclui o direito de pregar o que a Bíblia ensina sobre sexualidade e família, desde que sem incitar violência ou ódio contra pessoas. Liberdade de expressão que só vale para quem concorda com você não é liberdade.</p>
<h3>Como defender sem perder o tom</h3>
<ol>
<li>Fale de princípios universais (dignidade humana, direitos dos pais, liberdade), não só de versículos, quando estiver num debate público.</li>
<li>Conheça a lei e as decisões; isso impressiona mais que opinião.</li>
<li>Mostre compaixão concreta pelas pessoas envolvidas.</li>
</ol>`,
 pr:{q:"\"Querer proibir o aborto é impor sua religião aos outros.\"",a:"\"Na verdade, não preciso da Bíblia pra esse argumento. A embriologia diz que na concepção surge um novo organismo humano. A pergunta é ética: todo ser humano tem direito à vida, ou só os que já nasceram? A proibição de matar inocentes não é religiosa; está em todas as culturas. E eu defendo junto apoio real para as mães, porque não é só ser contra: é cuidar das duas vidas.\""},
 quiz:[
  {q:"Em quais casos o Código Penal (art. 128) não pune o aborto?",o:["Em qualquer caso até 12 semanas","Risco de vida para a gestante e gravidez por estupro","Nunca","Por decisão do médico"],c:1,e:"Em 2012 o STF acrescentou a anencefalia (ADPF 54)."},
  {q:"O que o STF decidiu em 2018 sobre educação domiciliar?",o:["Que é crime","Que não é proibida pela Constituição, mas precisa de lei que a regulamente","Que é obrigatória","Nada"],c:1,e:"RE 888.815: o tema depende do Congresso."},
  {q:"Segundo a Constituição (art. 205), a educação é dever:",o:["Só do Estado","Do Estado e da família","Só da escola","Da igreja"],c:1,e:"A família não é coadjuvante."}
 ]},

l3:{title:"Economia na prática",min:10,
 sum:"Inflação, impostos, salário mínimo e trade-offs: como explicar economia para qualquer pessoa.",
 verse:{t:"Se alguém não quer trabalhar, também não coma.",r:"2 Ts 3.10"},
 body:`<h3>Inflação: o imposto escondido</h3>
<p>Quando o governo gasta mais do que arrecada e cobre a diferença criando dinheiro, cada nota passa a valer menos. Quem mais sofre é o pobre, que não tem como proteger o salário. O Brasil sabe disso: em 1993, a inflação (IPCA) chegou a cerca de <b>2.477% ao ano</b>. Preço no supermercado mudava no mesmo dia. O <b>Plano Real</b> (1994) estabilizou a moeda com responsabilidade fiscal.</p>
<h3>Não existe almoço grátis</h3>
<p>Todo benefício do governo é pago por alguém: hoje, com impostos, ou amanhã, com dívida e inflação. A pergunta de Sowell sempre vale: <b>quanto custa e quem paga?</b></p>
<h3>Boas intenções, efeitos inesperados</h3>
<p>Frédéric Bastiat (<i>O que se vê e o que não se vê</i>, 1850) ensinou a olhar além do efeito imediato:</p>
<ul>
<li><b>Controle de preços:</b> tabelar o preço do aluguel ou da comida parece ajudar, mas reduz a oferta e cria filas e mercado paralelo (a Venezuela é um exemplo).</li>
<li><b>Burocracia:</b> cada licença e taxa a mais dificulta que o pobre abra o próprio negócio e sai da informalidade.</li>
<li><b>Salário mínimo:</b> economistas discordam sobre o tamanho do efeito, mas aumentos muito acima da produtividade tendem a empurrar os menos qualificados para a informalidade. Use esse tema com cuidado e com dados.</li>
</ul>
<h3>O que realmente tira da pobreza</h3>
<ol><li>Trabalho e emprego formal.</li><li>Educação básica de qualidade.</li><li>Família estável.</li><li>Moeda estável e regras claras.</li><li>Liberdade para empreender.</li></ol>
<p>Pesquisas nos EUA mostram que quem termina o ensino médio, trabalha em tempo integral e se casa antes de ter filhos tem chance muito pequena de ficar na pobreza (a chamada "sequência do sucesso"). Valores e economia andam juntos.</p>
<div class="box">Treine explicar com exemplos do dia a dia: a pizza que precisa ser feita antes de ser dividida, o preço do tomate que sobe quando falta tomate, a padaria que fecha por excesso de imposto.</div>`,
 pr:{q:"\"É só o governo imprimir mais dinheiro e dar pra quem precisa.\"",a:"\"Se fosse assim, nenhum país seria pobre! Quando o governo imprime dinheiro sem ter mais produtos na economia, os preços sobem. O Brasil viveu isso: em 1993 a inflação passou de 2.400% num ano. O pobre recebia o salário e corria pro mercado antes que tudo subisse. O que deixa a gente mais rico é produzir mais, não imprimir mais papel.\""},
 quiz:[
  {q:"Por que a inflação é chamada de \"imposto escondido\"?",o:["Porque é cobrada pela Receita","Porque corrói o valor do dinheiro, sobretudo de quem não tem como se proteger","Porque só afeta ricos","Porque é ilegal"],c:1,e:"O pobre é quem mais perde."},
  {q:"Qual plano estabilizou a moeda brasileira em 1994?",o:["Plano Cruzado","Plano Real","Plano Collor","Plano Marshall"],c:1,e:"Depois de anos de hiperinflação."},
  {q:"A lição de Bastiat \"o que se vê e o que não se vê\" ensina a:",o:["Olhar só o efeito imediato","Considerar também os efeitos indiretos e de longo prazo","Ignorar a economia","Confiar em toda promessa"],c:1,e:"Boas intenções podem ter efeitos ruins escondidos."}
 ]},

l4:{title:"Construa cultura, não só opinião",min:9,
 sum:"Se a política nasce da cultura, o seu lugar é fazer coisas boas, verdadeiras e belas.",
 verse:{t:"Vós sois o sal da terra... Vós sois a luz do mundo.",r:"Mt 5.13-14"},
 body:`<h3>A política vem depois</h3>
<p>Gramsci entendeu algo verdadeiro: a política nasce da cultura. O jornalista americano Andrew Breitbart resumiu: <b>"a política está rio abaixo da cultura"</b>. Leis mudam depois que o coração e a imaginação das pessoas mudam. Por isso reclamar da cultura não basta. É preciso <b>fazer cultura</b>.</p>
<h3>Exemplos que mudaram o mundo</h3>
<ul>
<li><b>William Wilberforce</b> passou 20 anos lutando no Parlamento até a abolição do tráfico britânico de escravos (1807), apoiado por cristãos que escreviam, pregavam e boicotavam o açúcar produzido por escravos.</li>
<li><b>J. R. R. Tolkien e C. S. Lewis</b> nunca fizeram panfleto. Escreveram histórias (<i>O Senhor dos Anéis</i>, <i>Nárnia</i>) que formaram a imaginação moral de gerações.</li>
<li><b>Os primeiros cristãos</b> não tinham poder político, mas criaram hospitais, cuidaram de órfãos e transformaram o Império de baixo para cima.</li>
</ul>
<h3>O seu lugar</h3>
<p>Você não precisa ser político para fazer diferença. Precisa ser <b>excelente</b> no que Deus te chamou para fazer:</p>
<ul>
<li>o professor que ensina com verdade e amor;</li>
<li>o músico que toca bem, com beleza (no culto e fora dele);</li>
<li>o empreendedor que gera emprego e paga certo;</li>
<li>o jornalista que apura com honestidade;</li>
<li>o pai e a mãe que formam filhos firmes.</li>
</ul>
<blockquote>"Não há um centímetro quadrado em todo o domínio da existência humana sobre o qual Cristo não clame: 'É meu!'"<cite>Abraham Kuyper (1880)</cite></blockquote>
<h3>Comece pequeno, comece local</h3>
<p>Monte um grupo de leitura com os amigos. Grave vídeos curtos explicando uma ideia com fonte. Sirva na sua cidade. Converse com o vereador. Cultura é feita de milhares de pequenas fidelidades.</p>
<div class="box">Missão final: escolha <b>um projeto</b> para os próximos 3 meses (grupo de leitura, canal, ação social, artigo) e compartilhe com seu líder. Quem só debate é espectador; quem constrói é protagonista.</div>`,
 pr:{q:"\"A direita só sabe reclamar, quem produz cultura é a esquerda.\"",a:"\"Em parte você tem razão, e isso é um desafio pra gente. Mas Tolkien, Lewis, Dostoiévski e Chesterton eram cristãos e conservadores, e escreveram obras que todo mundo ama. Eu acho que a resposta não é reclamar mais, é fazer coisas melhores: música, livros, filmes, escolas e empresas boas. É isso que eu quero fazer.\""},
 quiz:[

POL.CARDS=[
 {id:"c1",cat:"Conceito",f:"Visão restrita x irrestrita (Sowell)",b:"Restrita: o ser humano é limitado; valorize tradição, regras e freios ao poder. Irrestrita: o ser humano pode ser aperfeiçoado por elites esclarecidas com poder."},
 {id:"c2",cat:"Conceito",f:"Pequenos pelotões (Burke)",b:"Família, igreja e comunidades próximas, onde aprendemos a amar e servir a sociedade."},
 {id:"c3",cat:"Conceito",f:"Cerca de Chesterton",b:"Antes de derrubar uma tradição, descubra por que ela existe."},
 {id:"c4",cat:"Conceito",f:"Mão invisível (Adam Smith)",b:"Em trocas livres, cada um serve ao outro para ganhar, e milhões de decisões se coordenam sem comando central."},
 {id:"c5",cat:"Conceito",f:"Conhecimento disperso (Hayek)",b:"A informação econômica está espalhada por milhões de pessoas; os preços a transmitem. Nenhum planejador consegue reuni-la."},
 {id:"c6",cat:"Conceito",f:"Subsidiariedade",b:"O que a instância menor pode fazer, a maior não deve tomar para si. Pessoa, família, comunidade, município... União por último."},
 {id:"c7",cat:"Conceito",f:"Separação dos poderes",b:"Executivo, Legislativo e Judiciário independentes (Montesquieu, 1748), porque todo poder tende ao abuso."},

 {id:"c9",cat:"Conceito",f:"Mais-valia (Marx)",b:"Parte do trabalho do operário que o patrão não pagaria; para Marx, a fonte do lucro."},
 {id:"c10",cat:"Conceito",f:"Hegemonia (Gramsci)",b:"Domínio pelo consenso: quando as ideias de um grupo viram o \"normal\" para todos."},
 {id:"c11",cat:"Conceito",f:"Guerra de posição (Gramsci)",b:"Longa ocupação de espaços na cultura e nas instituições, em vez do ataque frontal (guerra de movimento)."},
 {id:"c12",cat:"Conceito",f:"Intelectual orgânico (Gramsci)",b:"Professor, jornalista ou artista ligado a um projeto político, que forma a opinião das massas."},
 {id:"c13",cat:"Conceito",f:"Teoria crítica (Escola de Frankfurt)",b:"Crítica e desconstrução das instituições e valores ocidentais, vistos como formas de dominação."},
 {id:"c14",cat:"Conceito",f:"Totalitarismo (Arendt)",b:"Ideologia total, terror, partido único e destruição da vida privada. Nazismo e stalinismo tinham a mesma estrutura."},
 {id:"c15",cat:"Conceito",f:"Esferas de soberania (Kuyper)",b:"Família, igreja, Estado, escola, trabalho e arte têm autoridade própria dada por Deus; nenhuma deve engolir a outra."},
 {id:"f1",cat:"Falácia",f:"Espantalho",b:"Distorcer a ideia do outro para atacar uma versão fraca."},

POL.PERSONAS=[
 {id:"caio",name:"Caio",role:"o universitário marxista",color:"#B3261E",
  persona:"estudante de ciências sociais de 21 anos, leu Marx e Gramsci, inteligente e confiante; acha que o capitalismo explora os trabalhadores e que a direita defende os ricos",
  opening:"O capitalismo vive da exploração. O lucro do patrão é trabalho não pago do operário, é a mais-valia. A direita só existe pra defender quem já é rico. Me convence do contrário.",
  obj:[
   {q:"O lucro é trabalho não pago: a mais-valia prova a exploração.",k:["O lucro também remunera risco, capital, gestão e inovação; empresas quebram e o dono perde.","Onde se aboliu o patrão, o Estado virou o patrão único, com salários baixos e sem direito de greve.","Pergunte: \"Comparado com quê? Em qual país socialista o trabalhador vivia melhor?\""]},
   {q:"O capitalismo aumenta a desigualdade e a miséria.",k:["Segundo o Banco Mundial, a extrema pobreza caiu de cerca de 38% (1990) para menos de 9% (2019).","Desigualdade e pobreza são coisas diferentes: o objetivo é que o pobre melhore.","Coreias e Alemanhas: mesmo povo, sistemas diferentes, resultados opostos."]},
   {q:"O comunismo nunca foi aplicado de verdade.",k:["Foi tentado em dezenas de países e culturas, sempre com partido único, polícia política e escassez.","Hayek explica: planejar tudo exige controlar tudo.","Quando o remédio falha em todos os pacientes, o problema é o remédio."]}
  ]},
 {id:"rogerio",name:"Prof. Rogério",role:"o professor freiriano",color:"#6D4C9F",
  persona:"professor de história de 50 anos, admirador de Paulo Freire, educado e experiente em sala de aula; acredita que educar é conscientizar os alunos contra a opressão e que neutralidade não existe",
  opening:"Toda educação é política, meu caro. Não existe neutralidade. Quando eu falo de opressores e oprimidos em sala, estou abrindo os olhos dos alunos. Quem pede neutralidade quer manter tudo como está.",
  obj:[
   {q:"Toda educação é política; neutralidade não existe.",k:["Mesmo que neutralidade total seja difícil, pluralismo é possível e é princípio constitucional (art. 206, III).","Apresentar os dois lados e deixar o aluno decidir é diferente de fazer militância.","Pergunte: \"O senhor indicaria também um autor conservador para comparar?\""]},
   {q:"Falar de opressores e oprimidos é abrir os olhos dos alunos.",k:["Injustiças reais existem e devem ser estudadas.","Dividir tudo em oprimidos e opressores simplifica pessoas complexas e alimenta ressentimento.","Educação também é transmitir conhecimento, ler, escrever e calcular: o Brasil vai mal no PISA."]},
   {q:"Quem pede neutralidade quer manter tudo como está.",k:["É uma generalização: muitos querem justamente mudar a educação para melhorar resultados.","Os pais têm direito de que os filhos recebam educação moral conforme suas convicções.","Resposta com tom respeitoso: discordar do professor não é desrespeitá-lo."]}
  ]},
 {id:"marta",name:"Prof.ª Marta",role:"a professora de filosofia",color:"#00838F",
  persona:"professora de filosofia do ensino médio, 42 anos, culta, irônica e socrática; admira Nietzsche e Foucault, acha que valores absolutos são ingenuidade e que toda verdade é um discurso de poder",
  opening:"Nietzsche já mostrou: Deus está morto, e a moral cristã é moral de escravos. E Foucault ensinou que toda 'verdade' é só um discurso de poder. Por que você ainda se apega a valores absolutos?",
  obj:[
   {q:"Toda verdade é só um discurso de poder (Foucault).",k:["A frase se autorrefuta: se toda verdade é discurso de poder, a de Foucault também é, e não há motivo para aceitá-la.","Poder e verdade não são a mesma coisa: 2 + 2 = 4 não depende de quem manda.","Pergunte com educação: \"Professora, essa afirmação também é só um discurso de poder?\""]},
   {q:"A moral é construção social; não existe certo e errado universal.",k:["Se moral fosse só cultura, a escravidão era certa onde era aceita, e os abolicionistas estavam errados.","C. S. Lewis (A abolição do homem) mostrou que culturas do mundo inteiro compartilham uma lei moral comum.","Variar o costume não prova que não existe verdade moral, assim como divergir em matemática não prova que não existe resposta certa."]},
   {q:"Nietzsche: a moral cristã é moral de escravos, que glorifica a fraqueza.",k:["Nietzsche percebeu algo real: sem Deus, a moral cristã perde o fundamento. Ele foi mais coerente que muitos ateus.","O século XX mostrou aonde leva trocar a moral por vontade de poder: totalitarismos.","Mansidão é força sob controle; mártires, Wilberforce e Bonhoeffer não foram fracos."]}
  ]},
 {id:"andre",name:"Prof. André",role:"o professor de sociologia",color:"#5D4037",
  persona:"professor de sociologia de 38 anos, simpático, leitor de Marx e Bourdieu; ensina que família, religião e gênero são construções sociais, que a meritocracia é um mito e que a direita ignora as desigualdades estruturais",
  opening:"Na sociologia a gente aprende que tudo é construção social: família, religião, gênero. E a meritocracia é um mito, porque quem nasce pobre não tem as mesmas chances. A direita fala de esforço e ignora as estruturas.",
  obj:[
   {q:"A meritocracia é um mito.",k:["Concorde com o que é verdade: os pontos de partida são diferentes (Bourdieu chamou isso de capital cultural).","Mas esforço, estudo e família estável mudam muito o destino; a mobilidade social existe e é medida.","A resposta não é desprezar o esforço, é dar ao pobre escola básica de qualidade. Pergunte: \"O que o senhor diria a um aluno pobre que quer estudar?\""]},
   {q:"A família é só uma construção social.",k:["As formas variam, mas a união de homem e mulher criando filhos aparece em praticamente todas as culturas da história.","Ser moldado pela sociedade não é ser arbitrário: a linguagem também é social e não é inventada à toa.","Em média, crianças criadas com pai e mãe presentes têm melhores indicadores de escola, renda e saúde."]},
   {q:"Religião é o ópio do povo (Marx).",k:["A frase completa (1844) chama a religião de \"suspiro da criatura oprimida\": até Marx reconhecia a dor real por trás dela.","Max Weber (A ética protestante e o espírito do capitalismo, 1905) mostrou o papel da fé no trabalho e no desenvolvimento.","A fé motivou a abolição, hospitais e a luta pelos direitos civis; os regimes que tentaram eliminar a religião foram os mais opressores."]}
  ]},
 {id:"luana",name:"Luana",role:"a militante identitária",color:"#C2185B",
  persona:"jovem de 20 anos, ativista nas redes, sincera e intensa; vê a sociedade pelas lentes de raça, gênero e privilégio, e acha que a direita é preconceituosa",
  opening:"Você só pensa assim porque tem privilégio. Quem não sofre opressão não tem lugar de fala. A direita é estruturalmente preconceituosa, isso é fato.",
  obj:[
   {q:"Você não tem lugar de fala.",k:["Um argumento é verdadeiro ou falso independente de quem o diz; isso é ad hominem.","Experiências pessoais importam e devem ser ouvidas com empatia.","Há pessoas de todas as cores e origens na direita, inclusive negros como Thomas Sowell."]},
   {q:"A direita é estruturalmente preconceituosa.",k:["Peça a definição e exemplos concretos.","A visão cristã diz que toda pessoa é imagem de Deus; racismo é pecado.","Julgar indivíduos pelo grupo, em qualquer direção, é injusto. Martin Luther King Jr.: julgar pelo caráter."]},
   {q:"Quem discorda da pauta identitária é contra minorias.",k:["Discordar de um método não é ser contra pessoas.","É possível querer combater injustiças com outras soluções: educação, emprego, segurança, família.","Mostre respeito pela dor real dela antes de responder."]}
  ]},
 {id:"pedro",name:"Pedro",role:"o social-democrata moderado",color:"#2E7D32",
  persona:"engenheiro de 28 anos, moderado, gosta de dados, admira os países nórdicos; acha que o Brasil precisa de mais Estado de bem-estar e que a direita exagera",
  opening:"Olha, eu não sou comunista. Mas veja a Suécia e a Dinamarca: impostos altos, Estado forte, e são os países mais felizes do mundo. Por que o Brasil não pode seguir esse modelo?",
  obj:[
   {q:"Os países nórdicos provam que Estado grande funciona.",k:["Os nórdicos têm economias de mercado muito livres, com facilidade para abrir empresas e comércio aberto.","Enriqueceram antes de criar o Estado de bem-estar, e já reformaram excessos nos anos 90.","Têm alta confiança social, instituições eficientes e pouca corrupção; copiar o imposto sem isso não funciona."]},
   {q:"O SUS mostra que o Estado faz melhor.",k:["Reconheça o que funciona: vacinação, transplantes, atendimento universal.","Problemas de gestão, filas e desperdício também são reais.","A questão não é \"Estado ou nada\", mas qual combinação entrega mais para o pobre pelo mesmo dinheiro."]},
   {q:"A direita só fala em cortar, sem propor nada.",k:["Proponha: simplificação tributária, educação básica de qualidade, segurança, facilidade para empreender.","Cortar desperdício é proteger quem depende do serviço público.","Concorde onde der: debate com moderado é para construir pontes."]}
  ]},
 {id:"sonia",name:"Tia Sônia",role:"o almoço de domingo",color:"#E65100",
  persona:"tia de 58 anos, carinhosa mas teimosa, assiste muito telejornal; acha que \"esse povo de direita\" é radical e fascista e fala alto na mesa da família",
  opening:"Ai, menino, você agora virou de direita? Esse povo é tudo fascista, radical! Na minha época a gente lutava era por democracia. Não quero ver você metido nisso.",
  obj:[
   {q:"Esse povo de direita é tudo fascista.",k:["Responda com carinho e leveza, sem desrespeitar a tia (Êx 20.12).","Fascismo era Mussolini: \"tudo no Estado\". Você defende menos Estado e mais liberdade.","Concorde com o valor dela: você também defende democracia."]},
   {q:"Você está sendo radical, isso é coisa de internet.",k:["Mostre que você estuda: cite um livro, não um vídeo.","Admita que existe radicalismo na internet, de todos os lados.","Proponha conversar com calma em outro momento."]},
   {q:"Não quero ver você metido em política.",k:["Agradeça a preocupação: ela te ama.","Explique que participar da política com respeito é dever do cidadão.","Termine com afeto: \"A gente pode pensar diferente e continuar família\"."]}
  ]},
 {id:"rafa",name:"Rafa",role:"o isentão",color:"#546E7A",
  persona:"colega de 19 anos, desconfiado de tudo, acha política chata e corrupta; diz que todos os lados são iguais e que não vale a pena se envolver",
  opening:"Cara, sinceramente, política é tudo igual. Direita, esquerda, todo mundo rouba. Prefiro não me meter. Pra que perder tempo com isso?",
  obj:[
   {q:"Todo político é igual, todo mundo rouba.",k:["Há corrupção em todos os lados, concordo, e isso deve ser punido.","Mas ideias são diferentes e têm consequências diferentes: compare Venezuela e Chile, ou as duas Coreias.","Generalizar faz o honesto desistir e deixa espaço para os desonestos."]},
   {q:"Política não muda minha vida.",k:["Imposto no seu lanche, a qualidade da sua escola, a inflação no seu salário: tudo é decisão política.","\"Se você não se interessa por política, será governado por quem se interessa.\"","Mostre um exemplo concreto da vida dele."]},
   {q:"Não quero me meter, dá briga.",k:["Participar não é brigar: é se informar, votar com consciência e conversar com respeito.","Comece pequeno: ler um livro, acompanhar um vereador.","Convide para um grupo de leitura em vez de um debate."]}
  ]}
];

q1:{title:"Os Três Poderes: quem faz o quê",min:9,
 sum:"Executivo, Legislativo e Judiciário, nas três esferas, e como um freia o outro.",
 verse:{t:"São Poderes da União, independentes e harmônicos entre si, o Legislativo, o Executivo e o Judiciário.",r:"Constituição, art. 2º"},
 body:`<h3>Executivo: governa e executa</h3>
<ul><li><b>União:</b> presidente da República, vice e ministros (nomeados livremente pelo presidente, art. 84).</li><li><b>Estados:</b> governador e secretários.</li><li><b>Municípios:</b> prefeito e secretários.</li></ul>
<p>O Executivo administra, executa as leis, cuida do orçamento, comanda a política externa e as Forças Armadas (no caso do presidente). Pode propor leis, editar medidas provisórias e vetar projetos.</p>
<h3>Legislativo: faz leis e fiscaliza</h3>
<ul>
<li><b>Câmara dos Deputados:</b> 513 deputados, eleitos a cada 4 anos pelo sistema proporcional; cada estado tem de 8 a 70, conforme a população.</li>
<li><b>Senado Federal:</b> 81 senadores, 3 por estado, com mandato de 8 anos. A renovação alterna 1/3 e 2/3 a cada eleição.</li>
<li>Nos estados, as <b>Assembleias Legislativas</b> (deputados estaduais); nos municípios, as <b>Câmaras Municipais</b> (vereadores).</li>
</ul>
<p>O Congresso também <b>fiscaliza</b> o Executivo, com ajuda do Tribunal de Contas da União (TCU), abre CPIs, aprova o orçamento e pode julgar o impeachment do presidente.</p>
<h3>Judiciário: aplica a lei aos casos</h3>
<ul>
<li><b>STF</b> (11 ministros): guarda a Constituição.</li>
<li><b>STJ</b> (33 ministros): uniformiza a interpretação das leis federais.</li>
<li><b>Justiças especializadas:</b> Eleitoral (TSE), do Trabalho (TST) e Militar (STM).</li>
<li>Tribunais de Justiça dos estados, tribunais regionais federais e juízes de primeira instância.</li>
</ul>
<h3>Quem não é Poder, mas é essencial</h3>
<p>O <b>Ministério Público</b> (chefiado pelo Procurador-Geral da República) acusa crimes e defende a ordem jurídica. A <b>Defensoria Pública</b> defende quem não pode pagar advogado. A <b>Polícia Federal</b> investiga crimes federais e é ligada ao Ministério da Justiça.</p>
<h3>Freios e contrapesos</h3>
<p>O presidente pode vetar uma lei; o Congresso pode derrubar o veto. O STF pode declarar uma lei inconstitucional; o Congresso pode mudar a Constituição por emenda. O Senado aprova os ministros do STF que o presidente indica. É o sistema de Montesquieu aplicado: ninguém deve mandar sozinho.</p>`,
 pr:{q:"\"Quem manda no Brasil é o presidente, o resto é enfeite.\"",a:"\"Não é bem assim. O presidente não faz lei sozinho: depende do Congresso, que tem 513 deputados e 81 senadores. Se ele vetar, o Congresso pode derrubar o veto. E o STF pode anular uma lei inteira. Por isso a eleição de deputado e senador é tão importante quanto a de presidente, e quase ninguém lembra em quem votou para deputado.\""},

q2:{title:"Como nasce uma lei",min:9,
 sum:"Projeto de lei, comissões, sanção, veto, medida provisória e emenda à Constituição.",
 verse:{t:"Ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de lei.",r:"Constituição, art. 5º, II"},
 body:`<h3>Quem pode propor</h3>
<p>Deputados, senadores, o presidente da República, os tribunais superiores e o Procurador-Geral em casos específicos, e <b>os cidadãos</b>: a iniciativa popular exige assinaturas de 1% do eleitorado nacional, distribuídas em pelo menos 5 estados, com no mínimo 0,3% dos eleitores de cada um (art. 61). A Lei da Ficha Limpa nasceu assim.</p>
<h3>O caminho de um projeto de lei</h3>
<ol>
<li><b>Apresentação</b> na Câmara ou no Senado.</li>
<li><b>Comissões:</b> a Comissão de Constituição e Justiça (CCJ) analisa se o projeto é constitucional; outras comissões analisam o mérito.</li>
<li><b>Plenário:</b> votação. Lei ordinária precisa de maioria simples; lei complementar, de maioria absoluta (257 deputados e 41 senadores).</li>
<li><b>A outra Casa</b> revisa. Se mudar o texto, ele volta.</li>
<li><b>Sanção ou veto:</b> o presidente tem 15 dias úteis. Se ficar em silêncio, a lei é sancionada tacitamente.</li>
<li><b>Veto:</b> o Congresso pode derrubá-lo por maioria absoluta em sessão conjunta.</li>
<li><b>Promulgação e publicação</b> no Diário Oficial.</li>
</ol>
<h3>Medida provisória (MP)</h3>
<p>Em caso de relevância e urgência, o presidente edita uma MP, que já vale como lei na hora (art. 62). O Congresso tem 60 dias, prorrogáveis por mais 60, para aprovar; senão ela perde a validade. Depois de 45 dias, ela tranca a pauta da Casa onde estiver.</p>
<h3>Emenda à Constituição (PEC)</h3>
<p>Precisa ser aprovada em <b>dois turnos em cada Casa, por 3/5 dos votos</b> (308 deputados e 49 senadores). Não passa por sanção do presidente. E há coisas que nenhuma emenda pode abolir: as <b>cláusulas pétreas</b> (art. 60, §4º): a federação, o voto direto, secreto, universal e periódico, a separação dos Poderes e os direitos e garantias individuais.</p>
<div class="box">Quer acompanhar? Todo projeto tem uma página no site da Câmara e do Senado, com o texto, o autor, a tramitação e como cada parlamentar votou.</div>`,
 pr:{q:"\"Não adianta nada participar, as leis são feitas lá em Brasília sem a gente.\"",a:"\"Dá pra participar sim. Todo projeto tem página no site da Câmara, com o voto de cada deputado. Você pode mandar mensagem para o seu deputado, participar das enquetes do site e até assinar projeto de iniciativa popular. A Ficha Limpa nasceu assim, com mais de um milhão de assinaturas. O problema é que a maioria nem lembra em quem votou para deputado.\""},

q3:{title:"Governo: quem é quem hoje",min:8,
 sum:"Presidente, vice, ministérios e as lideranças do Congresso, com o resultado da eleição de 2026.",
 verse:{t:"Antes de tudo, pois, exorto que se use a prática de súplicas, orações, intercessões, ações de graças, em favor de todos os homens, em favor dos reis e de todos os que se acham investidos de autoridade.",r:"1 Tm 2.1-2"},
 body:`<h3>A eleição de 2026</h3>
<p>No 1º turno (4 de outubro de 2026), Flávio Bolsonaro (PL) ficou à frente, com 47,03% dos votos válidos, contra 45,16% de Lula (PT). No 2º turno (25 de outubro), <b>Lula foi reeleito</b> com 51,79%, contra 48,21% de Flávio. Geraldo Alckmin (PSB) segue como vice. O novo mandato começa em <b>1º de janeiro de 2027</b> e vai até 2030.</p>
<p>Seja qual for o seu voto, a postura cristã é a mesma: orar pelas autoridades (1 Tm 2.1-2), respeitar o resultado das urnas, fiscalizar e fazer oposição pelos meios legais, com firmeza e respeito.</p>
<h3>O que fazem os ministérios</h3>
<p>Os ministros são escolhidos livremente pelo presidente e podem ser trocados a qualquer momento. Alguns dos mais importantes:</p>
<ul>
<li><b>Casa Civil:</b> coordena o governo e a relação entre os ministérios.</li>
<li><b>Fazenda:</b> economia, impostos e contas públicas.</li>
<li><b>Planejamento e Orçamento:</b> prepara o orçamento federal.</li>
<li><b>Justiça e Segurança Pública:</b> Polícia Federal, presídios federais e segurança.</li>
<li><b>Relações Exteriores (Itamaraty):</b> diplomacia.</li>
<li><b>Defesa:</b> Forças Armadas.</li>
<li><b>Educação</b> e <b>Saúde:</b> as maiores fatias do orçamento social.</li>
<li><b>Secretaria de Relações Institucionais:</b> negocia com o Congresso.</li>
<li><b>AGU:</b> defende a União na Justiça. <b>CGU:</b> controle interno e combate à corrupção.</li>
</ul>
<div class="box">Os nomes mudam muito: em março de 2026, 14 ministérios trocaram de comando porque os titulares saíram para disputar a eleição, e em janeiro de 2027 começa um novo ministério. Veja quem ocupa cada cargo no painel <b>Quem é quem</b>, na aba História.</div>
<h3>No Congresso</h3>
<p>Os presidentes da Câmara e do Senado decidem o que vai à votação, o que lhes dá enorme poder. São eleitos pelos colegas para mandatos de 2 anos. O presidente do Senado também preside o Congresso Nacional.</p>`,
 pr:{q:"\"Meu candidato perdeu, então esse governo não é meu.\"",a:"\"Eu entendo a frustração, mas o governo eleito governa para todos, inclusive para quem não votou nele. Como cristão, eu oro pelas autoridades, como Paulo mandou, e faço oposição pelo caminho certo: fiscalizando, cobrando meu deputado, votando na próxima eleição e construindo propostas melhores.\""},
