<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Firmes: fé e política para jovens cristãos. Cursos Apologia (defesa da fé) e Contracorrente (formação política), com trilha, stories, cards, debates e livros.">
<meta name="theme-color" content="#0B1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Firmes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Firmes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&display=swap">
<style>
/* Layout: app de coluna única (máx. 760px) sobre um papel de parede colorido; painéis de vidro fosco estilo iOS, barra de abas flutuante e a trilha em curva como peça central. */
:root{
  --bg:#ECEFF8;
  --w1:#8C9DFF; --w2:#FF9DB0; --w3:#FFD58C; --w4:#8FE3EE;
  --grgb:255,255,255; --ga:.56; --gas:.80; --blur:24px; --wdim:.10;
  --glass:rgba(var(--grgb),var(--ga)); --glass-strong:rgba(var(--grgb),var(--gas)); --glass-border:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.65); --glass-shadow:0 10px 34px rgba(30,40,90,.13);
  --hair:rgba(20,26,60,.10); --fill:rgba(20,26,60,.06);
  --ink:#0B1026; --muted:rgba(11,16,38,.58);
  --accent:#2F55F5; --accent-2:#6A4DFF; --on-accent:#FFFFFF; --accent-soft:rgba(47,85,245,.12);
  --rubric:#E0344B; --rubric-soft:rgba(224,52,75,.12);
  --gold:#D99413; --gold-soft:rgba(217,148,19,.15);
  --ok:#1FA256; --ok-2:#34C46F; --ok-soft:rgba(31,162,86,.13);
  --locked:rgba(11,16,38,.30);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-serif:ui-serif,"New York","Literata",Georgia,"Times New Roman",serif;
  --r-lg:24px; --r-md:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060914;
  --grgb:22,27,52; --wdim:.66; --glass-border:rgba(255,255,255,.11);
  --glass-hi:rgba(255,255,255,.07); --glass-shadow:0 10px 34px rgba(0,0,0,.40);
  --hair:rgba(255,255,255,.10); --fill:rgba(255,255,255,.07);
  --ink:#F2F4FF; --muted:rgba(242,244,255,.62);
  --accent:#7E96FF; --accent-2:#A58BFF; --on-accent:#0A0E22; --accent-soft:rgba(126,150,255,.16);
  --rubric:#FF6B7D; --rubric-soft:rgba(255,107,125,.15);
  --gold:#FFC857; --gold-soft:rgba(255,200,87,.15);
  --ok:#3FCB7C; --ok-2:#6BE09D; --ok-soft:rgba(63,203,124,.15);
  --locked:rgba(242,244,255,.30);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060914;
  --grgb:22,27,52; --wdim:.66; --glass-border:rgba(255,255,255,.11);
  --glass-hi:rgba(255,255,255,.07); --glass-shadow:0 10px 34px rgba(0,0,0,.40);
  --hair:rgba(255,255,255,.10); --fill:rgba(255,255,255,.07);
  --ink:#F2F4FF; --muted:rgba(242,244,255,.62);
  --accent:#7E96FF; --accent-2:#A58BFF; --on-accent:#0A0E22; --accent-soft:rgba(126,150,255,.16);
  --rubric:#FF6B7D; --rubric-soft:rgba(255,107,125,.15);
  --gold:#FFC857; --gold-soft:rgba(255,200,87,.15);
  --ok:#3FCB7C; --ok-2:#6BE09D; --ok-soft:rgba(63,203,124,.15);
  --locked:rgba(242,244,255,.30);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.wall{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(55% 45% at 8% 2%,var(--w1) 0%,transparent 70%),
  radial-gradient(50% 40% at 100% 18%,var(--w2) 0%,transparent 70%),
  radial-gradient(55% 45% at 85% 100%,var(--w3) 0%,transparent 70%),
  radial-gradient(50% 45% at 0% 85%,var(--w4) 0%,transparent 70%),var(--bg)}
.wall::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--wdim)}
:root.calm *{animation:none!important;transition:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-ui);text-wrap:balance;line-height:1.15;margin:0;letter-spacing:-.02em}
p{margin:0}
a{color:var(--accent)}

.glass,.card{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
.card{border-radius:var(--r-lg);padding:18px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border-bottom:.5px solid var(--hair)}
.top-in{max-width:760px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:1.06rem;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);letter-spacing:-.01em}
.brand .pil{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--f-serif);font-size:1.05rem;background:linear-gradient(140deg,var(--rubric),#FF8A5B)}
.top .sp{flex:1}
.chip-xp{font-size:.82rem;display:flex;gap:6px;align-items:center;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--fill);padding:6px 11px;border-radius:999px}
.chip-xp b{color:var(--ink);font-weight:600}
.flame{color:#FF7A3D;display:inline-flex}
.iconbtn{background:var(--fill);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;padding:0;color:var(--accent)}
.iconbtn svg{width:18px;height:18px}

main{max-width:760px;margin:0 auto;padding-block:18px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.tabs{position:fixed;z-index:9;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs-in{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:30px;background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);border:1px solid var(--glass-border);box-shadow:0 12px 40px rgba(20,25,60,.22),inset 0 1px 0 var(--glass-hi)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;text-decoration:none;color:var(--muted);font-size:.66rem;font-weight:600;position:relative;border-radius:24px;transition:background .2s,color .2s}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab .dot{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--rubric);color:#fff;font-size:.66rem;font-weight:700;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}

.eyebrow{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.rub{color:var(--rubric)}
.ref{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}

.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.grid2>*{min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:0;background:var(--fill);padding:11px 18px;font-weight:600;text-decoration:none;color:var(--accent);min-height:44px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.red{background:var(--rubric);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

/* Início */
.hero{display:flex;flex-direction:column;gap:8px;padding-block:4px 0}
.hero h1{font-size:clamp(2rem,7.5vw,2.6rem);font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,var(--rubric),#FF8A5B);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:1rem;color:var(--muted);max-width:60ch}
.lvlbox{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.lvlbadge{grid-row:span 2;width:56px;height:56px;border-radius:18px;background:linear-gradient(140deg,#FFD36B,#F29C1F);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.5rem;box-shadow:0 6px 16px rgba(242,156,31,.35)}
.bar{height:8px;border-radius:5px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:5px;transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:0}
.stat b{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:.74rem;color:var(--muted);font-weight:600;line-height:1.3}
.mission{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:.5px solid var(--hair)}
.mission:first-of-type{border-top:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--hair);display:grid;place-items:center;flex:none}
.check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:14px;height:14px}
.mission .grow{flex:1;min-width:0}
.quote{font-family:var(--f-serif);font-size:1.12rem;line-height:1.5;font-style:italic}
.quote-by{margin-top:8px;font-size:.85rem;color:var(--muted)}

/* Mini trilha (Início) */
.mini{display:flex;flex-direction:column;gap:14px}
.mini-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini-g{display:flex;flex-direction:column;gap:7px;min-width:0}
.mini-g span{font-size:.68rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-dots{display:flex;align-items:center;gap:4px}
.mini-dots i{flex:1;height:8px;border-radius:4px;background:var(--fill)}
.mini-dots i.d{background:linear-gradient(90deg,var(--ok),var(--ok-2))}
.mini-dots i.c{height:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 0 3px var(--accent-soft)}

/* Trilha */
.trail-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.th-info{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:flex-start}
.th-info b{font-size:1.12rem;letter-spacing:-.01em}
.th-info .btn{margin-top:8px}
.ring .ring-bg{fill:none;stroke:var(--fill);stroke-width:9}
.ring .ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring text{font-family:var(--f-ui);font-weight:700;font-size:17px;fill:var(--ink)}
.lvlbars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lb{border-radius:var(--r-md);padding:11px 13px;display:flex;flex-direction:column;gap:7px;min-width:0}
.lb-top{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;font-weight:600}
.lb-top span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.lb.on{box-shadow:var(--glass-shadow),inset 0 0 0 2px var(--accent)}
.lb.full .bar i{background:linear-gradient(90deg,var(--ok),var(--ok-2))}
.trail{position:relative;width:100%;margin-top:4px}
.trail svg.road{position:absolute;inset:0;overflow:visible;pointer-events:none}
.road .base{fill:none;stroke:var(--locked);stroke-width:7;stroke-linecap:round;stroke-dasharray:.1 17}
.road .prog{fill:none;stroke:url(#roadGrad);stroke-width:9;stroke-linecap:round}
.banner{position:absolute;left:0;right:0;border-radius:var(--r-lg);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:1}
.banner .bl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.banner b{font-size:1.1rem;letter-spacing:-.015em;line-height:1.2}
.banner .bmeta{font-size:.78rem;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .bmeta span{display:block;overflow:hidden;text-overflow:ellipsis}
.banner .bst{flex:none;min-width:44px;height:30px;padding:0 10px;border-radius:999px;background:var(--fill);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.banner .bst svg{width:15px;height:15px}
.banner .bst.full{background:var(--ok-soft);color:var(--ok)}
.banner.locked b,.banner.locked .eyebrow{opacity:.55}
.trail{--disc:58px;--disc-c:72px}
.node{position:absolute;width:0;height:0;text-decoration:none;color:var(--ink);z-index:2}
.disc{position:absolute;left:calc(var(--disc) / -2);top:calc(var(--disc) / -2);width:var(--disc);height:var(--disc);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--disc) * .27);transition:transform .15s}
.disc svg{width:42%;height:42%}
a.node:active .disc{transform:scale(.94)}
.node.done .disc{background:linear-gradient(145deg,var(--ok-2),var(--ok));color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 70%,#000),0 10px 20px color-mix(in srgb,var(--ok) 30%,transparent)}
.node.current .disc{left:calc(var(--disc-c) / -2);top:calc(var(--disc-c) / -2);width:var(--disc-c);height:var(--disc-c);font-size:calc(var(--disc-c) * .27);background:linear-gradient(145deg,var(--accent-2),var(--accent));color:var(--on-accent);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 65%,#000),0 12px 26px color-mix(in srgb,var(--accent) 40%,transparent)}
.node.current .disc::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--accent);opacity:.5;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.node.open .disc{background:var(--glass-strong);color:var(--accent);border:2px solid var(--accent);box-shadow:0 4px 0 var(--accent-soft),var(--glass-shadow);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.node.locked .disc{background:var(--glass);color:var(--locked);border:1px solid var(--glass-border);box-shadow:0 4px 0 var(--fill);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.nlabel{position:absolute;top:0;transform:translateY(-50%);width:max-content;display:flex;flex-direction:column;gap:1px;padding:6px 10px;border-radius:13px;background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.nlabel.l{text-align:right}
.nlabel b{font-size:.8rem;line-height:1.25;letter-spacing:-.01em}
.nlabel span{font-size:.68rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.node.locked .nlabel{opacity:.7}
.node.done .nlabel span{color:var(--ok)}
.node.current .nlabel span{color:var(--accent)}
.here{position:absolute;left:50%;bottom:calc(var(--disc-c) / 2 + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 10px 4px 4px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:.72rem;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:bob 2.4s ease-in-out infinite}
.here::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.here i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.66rem;background:linear-gradient(135deg,#FF8A5B,var(--rubric));color:#fff}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.finish .disc{left:calc(var(--disc-c) / -2);top:calc(var(--disc-c) / -2);width:var(--disc-c);height:var(--disc-c);border-radius:26%;background:linear-gradient(145deg,#FFD36B,#F29C1F);color:#fff;box-shadow:0 6px 0 #B86E0B,0 12px 26px rgba(242,156,31,.36)}
.finish.locked .disc{background:var(--glass);color:var(--locked);border:1px solid var(--glass-border);box-shadow:0 4px 0 var(--fill)}
.finish .disc::after{display:none}

/* Linha do tempo */
.tl{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:55px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--fill)}
.tl-i{--dot:var(--muted);display:grid;grid-template-columns:44px 1fr;gap:24px;align-items:start;position:relative}
.tl-i::before{content:"";position:absolute;left:50px;top:15px;width:13px;height:13px;border-radius:50%;background:var(--dot);border:3px solid var(--glass-strong);box-sizing:content-box;transform:translateX(-3px)}
.tl-i.esq{--dot:var(--rubric)}.tl-i.dir{--dot:var(--accent)}.tl-i.br{--dot:var(--ok)}.tl-i.marco{--dot:var(--gold)}
.tl-y{font-weight:800;font-size:.86rem;padding-top:12px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tl-c{border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tl-c b{font-size:1rem;letter-spacing:-.01em}
.tl-c p{font-size:.88rem;color:var(--muted);line-height:1.45}
.tl-tag{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dot)}
.tl-i.marco .tl-c{box-shadow:var(--glass-shadow),inset 0 0 0 1.5px var(--gold)}

/* Portão e escolha do curso: boas-vindas no estilo iOS (ícone, título forte, lista de recursos, brilho no fundo) */
body.gate .top,body.gate .tabs{display:none}
.gate-glow{display:none;position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
body.gate .gate-glow{display:block}
.gate-glow i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.45}
.gate-glow i:nth-child(1){background:#5E7BFF;top:-30vmax;left:-25vmax;animation:gDrift1 22s ease-in-out infinite alternate}
.gate-glow i:nth-child(2){background:#FF6B5E;top:-20vmax;right:-30vmax;opacity:.35;animation:gDrift2 26s ease-in-out infinite alternate}
.gate-glow i:nth-child(3){background:#22B8CF;bottom:-35vmax;left:-10vmax;opacity:.32;animation:gDrift1 30s ease-in-out infinite alternate-reverse}
@keyframes gDrift1{to{transform:translate(12vmax,10vmax) scale(1.1)}}
@keyframes gDrift2{to{transform:translate(-14vmax,12vmax) scale(1.08)}}
.gate-wrap{display:flex;flex-direction:column;gap:18px;padding-block:6vh 10px;max-width:520px;margin:0 auto;width:100%}
.g-in>*{animation:gUp .7s cubic-bezier(.2,.8,.2,1) both}
.g-in>*:nth-child(2){animation-delay:.07s}.g-in>*:nth-child(3){animation-delay:.14s}.g-in>*:nth-child(4){animation-delay:.21s}.g-in>*:nth-child(5){animation-delay:.28s}.g-in>*:nth-child(6){animation-delay:.35s}.g-in>*:nth-child(7){animation-delay:.42s}
@keyframes gUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
:root.calm .g-in>*,:root.calm .gate-glow i{animation:none!important}
@media (prefers-reduced-motion:reduce){.g-in>*,.gate-glow i{animation:none!important}}
.g-icon{align-self:center;width:96px;height:96px;border-radius:22.5%;display:grid;place-items:center;background:linear-gradient(150deg,#1E3A8A 0%,#5E5CFF 45%,#FF6B5E 100%);box-shadow:0 18px 40px rgba(60,60,160,.35),inset 0 1px 0 rgba(255,255,255,.35);margin-top:4px}
.g-icon span{font-family:var(--f-serif);font-weight:700;font-size:3.2rem;color:#fff;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.g-title{text-align:center;font-size:clamp(2.8rem,12vw,3.6rem);font-weight:800;letter-spacing:-.045em;line-height:1}
.g-tag{text-align:center;font-size:1.12rem;color:var(--muted);font-weight:500;max-width:30ch;align-self:center;line-height:1.4;margin-top:-6px}
.gv{margin:0;padding:18px 20px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi);text-align:center}
.gv blockquote{margin:0;font-family:var(--f-serif);font-style:italic;font-size:clamp(1.12rem,4.6vw,1.3rem);line-height:1.45;text-wrap:balance}
.gv figcaption{margin-top:10px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.g-feats{list-style:none;margin:4px 0 0;padding:0 4px;display:flex;flex-direction:column;gap:18px}
.g-feats li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center}
.g-fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c) 40%,transparent)}
.g-fi svg{width:23px;height:23px}
.g-feats div{display:flex;flex-direction:column;gap:1px;min-width:0}
.g-feats b{font-size:1rem;letter-spacing:-.01em}
.g-feats div span{font-size:.88rem;color:var(--muted);line-height:1.35}
.g-form{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.g-form label{font-weight:600;font-size:.95rem;padding-left:4px}
.g-form input[type="text"]{min-height:54px;border-radius:16px;font-size:1.06rem;padding:0 18px}
.g-btn{min-height:54px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1.06rem;letter-spacing:-.01em;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .12s}
.g-btn:active{transform:scale(.98)}
.g-link{align-self:center;background:none;border:0;color:var(--accent);font-weight:600;font-size:.95rem;padding:10px}
.g-hi{font-size:.95rem;font-weight:600;color:var(--muted)}
.g-q{font-size:clamp(2.1rem,9vw,2.8rem);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:-10px}
.g-cards{display:flex;flex-direction:column;gap:16px}
.g-card{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-height:220px;padding:22px;border:0;border-radius:28px;text-align:left;color:#fff;background:var(--g);box-shadow:0 18px 40px rgba(20,25,60,.28);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.g-card:active{transform:scale(.975)}
.g-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.28));pointer-events:none}
.g-glyph{position:absolute;right:-6px;top:-26px;font-family:var(--f-serif);font-weight:700;font-size:11rem;line-height:1;color:#fff;opacity:.16;pointer-events:none}
.g-ct,.g-prog{position:relative;z-index:1}
.g-ct{display:flex;flex-direction:column;gap:3px}
.g-brand{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.g-ct b{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.g-sub{font-size:.92rem;opacity:.9;line-height:1.35;max-width:34ch}
.g-prog{display:flex;align-items:center;gap:10px;font-size:.84rem;font-weight:600}
.g-prog .gp{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}
.g-prog .gp i{display:block;height:100%;border-radius:4px;background:#fff}
.g-go{margin-left:auto;flex:none;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.22);font-weight:700;font-size:.84rem;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.g-last{position:relative;z-index:1;align-self:flex-start;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22)}
.brand .bchev{width:14px;height:14px;color:var(--muted);margin-left:-2px}
/* Presidentes */
.pres-list{display:flex;flex-direction:column;gap:8px}
.pres-era{font-size:1rem;margin-top:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pres{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;border-radius:var(--r-md);padding:12px 14px}
.pres>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.pres-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.pres b{font-size:1rem;letter-spacing:-.01em}
.pres-y{font-size:.8rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.pres p{font-size:.88rem;color:var(--muted)}
/* Quem é quem */
.qq{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.qq-n{font-size:1.05rem;letter-spacing:-.01em;line-height:1.35}
.qq-ed{min-height:32px;padding:4px 12px;font-size:.85rem}


/* Supremo */
.stf-bar{display:flex;gap:3px;height:12px}
.stf-bar i{flex:1;border-radius:4px}
.stf-bar i.vg,.stf-leg i.vg{background:repeating-linear-gradient(45deg,var(--fill),var(--fill) 3px,transparent 3px,transparent 6px);border:1px dashed var(--muted)}
.stf-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;font-weight:600;color:var(--muted)}
.stf-leg span{display:inline-flex;align-items:center;gap:6px}
.stf-leg i{width:12px;height:12px;border-radius:4px;display:inline-block}
details.stf{padding:0;overflow:hidden}
details.stf summary{list-style:none;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
details.stf summary::-webkit-details-marker{display:none}
.stf-av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.95rem;letter-spacing:.02em}
.stf-h{display:flex;flex-direction:column;gap:1px;min-width:0}
.stf-h b{font-size:1.05rem;letter-spacing:-.01em}
.stf-h span{font-size:.8rem;color:var(--muted)}
.stf-h em{font-style:normal;font-weight:700;color:var(--accent)}
.stf-chev{font-size:1.6rem;color:var(--muted);transition:transform .2s;line-height:1}
details.stf[open] .stf-chev{transform:rotate(90deg)}
.stf-b{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.stf-b ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.stf-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stf-facts div{background:var(--fill);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.stf-facts span{font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stf-facts b{font-size:.86rem;line-height:1.3}
.stf-vaga{display:flex;flex-direction:column;gap:6px;border:1.5px dashed var(--muted)}
.stf-next{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stf-next div{background:var(--fill);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.stf-next b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.stf-next span{font-size:.8rem;color:var(--muted)}

/* Aparência */
.look{display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;flex-direction:column;gap:8px;padding:13px 0;border-top:.5px solid var(--hair)}
.lrow:first-of-type{border-top:0}
.lhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.lhead .lv{color:var(--muted);font-weight:500;font-size:.88rem;font-variant-numeric:tabular-nums}
.lhead .aa{color:var(--ink);font-weight:700;line-height:1}
.lscale{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
input[type="range"]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.seg.wide{display:flex;width:100%;margin-top:0}
.seg.wide button{flex:1;padding:8px 4px;min-height:36px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid var(--glass-border);padding:0;box-shadow:var(--glass-shadow)}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:3px}
.wall-sw{border-radius:14px}

/* Lição */
.lesson{display:flex;flex-direction:column;gap:16px}
.lesson h1{font-size:clamp(1.8rem,6.5vw,2.3rem);font-weight:800}
.verse{border-radius:var(--r-lg);padding:18px 20px;font-family:var(--f-serif);font-size:1.1rem;font-style:italic;line-height:1.55}
.verse .ref{display:block;font-style:normal;margin-top:8px;font-family:var(--f-ui);color:var(--rubric);font-weight:600}
.prose{font-family:var(--f-serif);font-size:1.06rem;line-height:1.72;display:flex;flex-direction:column;gap:14px;background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--glass-shadow)}
.prose>*{max-width:66ch}
.prose h3{font-family:var(--f-ui);font-size:1.18rem;font-weight:700;margin-top:10px;display:flex;gap:8px;align-items:baseline}
.prose h3::before{content:"¶";color:var(--rubric);font-family:var(--f-serif);font-weight:400}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.prose b{font-weight:700}
.prose .box{font-family:var(--f-ui);font-size:.95rem;line-height:1.55;background:var(--accent-soft);border-radius:var(--r-md);padding:14px 16px}
.prose .box.r{background:var(--rubric-soft)}
.prose blockquote{margin:0;padding:2px 0 2px 16px;border-left:3px solid var(--gold);font-style:italic}
.prose blockquote cite{display:block;font-style:normal;font-family:var(--f-ui);font-size:.82rem;color:var(--muted);margin-top:4px}
#tout.prose{background:none;border:0;box-shadow:none;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.pratica{border-radius:var(--r-lg);overflow:hidden}
.pratica .q{padding:16px 18px;background:var(--rubric-soft);font-weight:600}
.pratica .q small{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--rubric);margin-bottom:4px}
.pratica .a{padding:16px 18px;font-family:var(--f-serif);line-height:1.65}

/* Quiz */
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-md);border:1.5px solid transparent;background:var(--fill);font-weight:500;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--rubric);background:var(--rubric-soft)}
.opt:disabled{cursor:default}
.explain{font-size:.93rem;padding:13px 15px;border-radius:var(--r-md);background:var(--fill)}
.qprog{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.score{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* Cards */
.chips{display:flex;gap:4px;flex-wrap:wrap;padding:4px;border-radius:16px;background:var(--fill);width:fit-content;max-width:100%}
.chip{border:0;background:transparent;border-radius:12px;padding:7px 12px;font-size:.84rem;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--glass-strong);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:28px 22px;cursor:pointer;user-select:none}
.flash .front{font-size:1.35rem;font-weight:700;line-height:1.3;letter-spacing:-.015em}
.flash .back{font-family:var(--f-serif);font-size:1.08rem;line-height:1.6;border-top:.5px solid var(--hair);padding-top:14px}
.lvl-pill{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);align-self:center}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate .btn{flex-direction:column;gap:0;font-size:.92rem;border-radius:var(--r-md);background:var(--glass-strong)}
.rate .btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.rate .btn small{font-weight:500;opacity:.75;font-size:.72rem}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.boxes div{background:var(--fill);border-radius:12px;padding:8px 4px;text-align:center}
.boxes b{display:block;font-weight:700;font-variant-numeric:tabular-nums}
.boxes span{font-size:.66rem;color:var(--muted)}

/* Debate */
.persona{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start;text-align:left;border-radius:var(--r-lg);padding:14px;width:100%;color:var(--ink)}
.persona:active{transform:scale(.98)}
.ava{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.2rem;color:#fff}
.persona h3{font-size:1rem}
.persona p{font-size:.86rem;color:var(--muted)}
.persona>div{min-width:0}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:10px 14px;border-radius:20px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.them{align-self:flex-start;background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-bottom-right-radius:6px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:.82rem;text-align:center}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--glass-border);border-radius:var(--r-md);background:var(--glass-strong);padding:12px 14px;line-height:1.5}
textarea:focus{border-color:var(--accent);outline:none}
.num-in{border:1px solid var(--glass-border);border-radius:var(--r-md);background:var(--glass-strong);padding:11px 14px;min-height:44px;font-size:1.05rem;font-weight:700;text-align:center}
.num-in:focus{border-color:var(--accent);outline:none}
input[type="text"]{width:100%;border:1px solid var(--glass-border);border-radius:14px;background:var(--glass-strong);padding:11px 14px;min-height:44px}
input[type="text"]:focus{border-color:var(--accent);outline:none}
.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scoregrid div{background:var(--fill);border-radius:14px;padding:10px 6px;text-align:center}
.scoregrid b{display:block;font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.scoregrid span{font-size:.72rem;color:var(--muted);font-weight:600}
.keypoints{display:flex;flex-direction:column;gap:8px;padding-left:1.2em;margin:0}
.selfcheck label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:.5px solid var(--hair)}
.selfcheck input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}

/* Livros */
.book{display:grid;grid-template-columns:54px 1fr;gap:14px}
.spine{width:54px;height:78px;border-radius:4px 10px 10px 4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:.7rem;font-weight:600;color:#fff;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.book>div{min-width:0}
.book h3{font-size:1.08rem}
.book details{margin-top:8px}
.book summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
.book ul{margin:8px 0 0;padding-left:1.2em;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--fill);margin-top:10px}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:.8rem;font-weight:600;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* Perfil */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border-radius:var(--r-md);padding:14px 10px;text-align:center}
.badge .seal{width:44px;height:44px;margin:0 auto 8px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:linear-gradient(140deg,#FFD36B,#F29C1F);color:#fff;box-shadow:0 5px 14px rgba(242,156,31,.3)}
.badge.off{opacity:.45}
.badge.off .seal{background:var(--fill);color:var(--muted);box-shadow:none}
.badge b{display:block;font-size:.85rem}
.badge span{font-size:.74rem;color:var(--muted)}
.switch{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 0;border-top:.5px solid var(--hair)}
.switch>div{min-width:0}
input.ios{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;cursor:pointer;transition:background .2s;margin:0;border:1px solid var(--hair)}
input.ios::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
input.ios:checked{background:var(--ok);border-color:var(--ok)}
input.ios:checked::after{transform:translateX(20px)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--glass-shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.back{display:inline-flex;gap:4px;align-items:center;color:var(--accent);text-decoration:none;font-weight:600;font-size:.95rem}
.back svg{width:18px;height:18px}
hr{border:0;border-top:.5px solid var(--hair);margin:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.stats b{font-size:1.25rem}.scoregrid{grid-template-columns:repeat(2,1fr)}}

/* ===== v2: mentores, stories, figurinhas, missões e duelo ===== */
/* Stories: tela cheia imersiva (sempre escura), com a paleta do mestre do nível. */
.mart{display:block;width:100%;height:100%;overflow:visible}
.m-rays{transform-origin:100px 104px;animation:mrot 40s linear infinite}
@keyframes mrot{to{transform:rotate(360deg)}}
html.st-open,html.st-open body{overflow:hidden}

/* Mentores na Início (anéis de stories) */
.ments-wrap{display:flex;flex-direction:column;gap:10px}
.ments-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ments-head h2{font-size:1.12rem}
.ments-head a{font-size:.86rem;font-weight:600;color:var(--accent);text-decoration:none}
.ments{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ment{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);text-decoration:none;min-width:0}
.ment .ring{display:block;width:min(76px,19vw);aspect-ratio:1;border-radius:50%;padding:3px;background:var(--fill);position:relative;transition:transform .15s}
.ment.new .ring{background:conic-gradient(from 200deg,var(--mc1),var(--macc),var(--mc1))}
.ment:active .ring{transform:scale(.94)}
.ment .face{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--mc1) 55%,#fff),var(--mc1) 70%);overflow:hidden;display:grid;place-items:center}
.ment .face .mart{width:100%;height:100%}
.ment.locked .face{filter:grayscale(1);opacity:.55}
.ment .lockb{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;border:2px solid var(--bg)}
.ment .lockb svg{width:12px;height:12px}
.ment .newb{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:.6rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:linear-gradient(135deg,var(--mc1),var(--macc));color:#fff;border:2px solid var(--bg);white-space:nowrap}
.ment b{font-size:.84rem;line-height:1.1}
.ment small{font-size:.68rem;color:var(--muted);font-weight:600;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Missão da vida real (Início) */
.mis-card{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.mis-card .mis-art{width:64px;height:64px;border-radius:18px;background:linear-gradient(150deg,var(--mc1),var(--mc2));display:grid;place-items:center;overflow:hidden}
.mis-card .mis-art .mart{width:100%;height:100%}
.mis-card>div{min-width:0;display:flex;flex-direction:column;gap:8px}
.mis-card textarea{min-height:70px}

/* Álbum (cartão na Início) */
.alb-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;text-decoration:none;color:inherit}
.alb-fan{position:relative;width:86px;height:84px}
.alb-fan span{position:absolute;top:6px;width:52px;height:70px;border-radius:9px;box-shadow:0 6px 14px rgba(0,0,0,.18);border:2px solid #fff}
.alb-fan span:nth-child(1){left:0;transform:rotate(-12deg);background:linear-gradient(150deg,#E8590C,#F59F00)}
.alb-fan span:nth-child(2){left:17px;transform:rotate(-2deg);background:linear-gradient(150deg,#5F3DC4,#9775FA);top:2px}
.alb-fan span:nth-child(3){left:34px;transform:rotate(10deg);background:linear-gradient(150deg,#C2255C,#F06595)}
.alb-card .pill{display:inline-block;margin-top:6px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--rubric);color:#fff}

/* Página do mentor */
.mhero{border-radius:28px;padding:20px;color:#fff;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--mc1) 70%,#fff) 0%,var(--mc1) 40%,var(--mc2) 100%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--glass-shadow);position:relative;overflow:hidden}
.mhero .big{width:min(230px,62vw);aspect-ratio:1}
.mhero h1{font-size:2.1rem;font-weight:800}
.mhero .msp{font-size:.86rem;opacity:.85}
.mhero .stg{margin-top:4px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.18)}
.say{position:relative;align-self:stretch;margin-top:10px;background:#fff;color:#151830;border-radius:18px;padding:12px 14px;font-weight:600;line-height:1.4;text-align:left}
.say::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.evo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.evo>div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.evo .ev-art{width:100%;aspect-ratio:1;border-radius:18px;background:var(--fill);display:grid;place-items:center;overflow:hidden;position:relative}
.evo .ev-art .mart{width:96%;height:96%}
.evo .off .mart{filter:brightness(0);opacity:.22}
:root[data-theme="dark"] .evo .off .mart{filter:brightness(0) invert(1);opacity:.18}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .evo .off .mart{filter:brightness(0) invert(1);opacity:.18}}
.evo .ev-art .q{position:absolute;font-weight:800;font-size:1.3rem;color:var(--muted)}
.evo .cur .ev-art{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent-soft)}
.evo b{font-size:.74rem;line-height:1.2}
.evo span{font-size:.66rem;color:var(--muted);font-weight:600}
.pts-row{display:flex;gap:6px;flex-wrap:wrap}
.pt{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--fill);color:var(--muted)}
.pt.on{background:var(--ok-soft);color:var(--ok)}
.pt svg{width:12px;height:12px}
.mles{display:flex;flex-direction:column;gap:0}
.mles>div{display:flex;flex-direction:column;gap:8px;padding:13px 0;border-top:.5px solid var(--hair)}
.mles>div:first-child{border-top:0}
.mles .row b{flex:1;min-width:0}
.abil{display:flex;flex-direction:column;gap:10px}
.abil>div{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center}
.abil i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:800;background:var(--fill);color:var(--muted)}
.abil .on i{background:linear-gradient(140deg,#FFD36B,#F29C1F);color:#fff}
.abil p{font-size:.86rem;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mtile{border-radius:22px;padding:12px;color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(160deg,var(--mc1),var(--mc2));box-shadow:var(--glass-shadow);text-align:center}
.mtile .art{width:min(140px,36vw);aspect-ratio:1}
.mtile b{font-size:1.05rem}
.mtile span{font-size:.74rem;opacity:.85}
.mtile .bar{width:100%;margin-top:8px;background:rgba(255,255,255,.22)}
.mtile .bar i{background:#fff}
.mtile.locked .art{filter:grayscale(1);opacity:.6}

/* Figurinhas */
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.fig{position:relative;aspect-ratio:3/4.1;border-radius:14px;border:0;padding:0;overflow:hidden;display:flex;flex-direction:column;color:#fff;background:linear-gradient(160deg,var(--f1),var(--f2));box-shadow:0 6px 16px rgba(20,24,60,.18),inset 0 0 0 3px rgba(255,255,255,.85);text-align:center;font-family:var(--f-ui);min-width:0}
.fig .fig-top{display:flex;justify-content:space-between;padding:7px 9px 0;font-size:.58rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.9}
.fig .fig-art{flex:1;display:grid;place-items:center;padding:4px 8px;min-height:0}
.fig .fig-g{font-family:var(--f-serif);font-weight:700;font-size:1.5rem;line-height:1.05;letter-spacing:-.01em;word-break:break-word;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.fig .fig-g.sm{font-size:1.02rem}
.fig .fig-art .mart{width:100%;height:100%}
.fig .fig-name{background:rgba(255,255,255,.94);color:#151830;font-size:.7rem;font-weight:800;line-height:1.15;padding:7px 6px 2px;min-height:2.6em;display:grid;place-items:center}
.fig .fig-y{background:rgba(255,255,255,.94);color:#5A6077;font-size:.6rem;font-weight:700;padding:0 6px 6px}
.fig .fig-name:last-child{padding-bottom:8px}
.fig.shiny{box-shadow:0 6px 18px rgba(20,24,60,.22),inset 0 0 0 3px #F6D27A}
.fig.shiny::after,.fig.legend::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55) 32%,rgba(255,236,170,.25) 40%,transparent 52%);background-size:250% 100%;animation:holo 3.2s ease-in-out infinite;mix-blend-mode:screen}
.fig.legend{box-shadow:0 6px 20px rgba(242,156,31,.35),inset 0 0 0 3px #FFD36B}
@keyframes holo{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.fig.lock{background:var(--fill);color:var(--muted);box-shadow:inset 0 0 0 2px var(--hair);align-items:center;justify-content:center;gap:6px;padding:10px}
.fig.lock .fig-q{font-size:1.6rem;font-weight:800;opacity:.5}
.fig.lock .fig-cond{font-size:.64rem;font-weight:600;line-height:1.25}
.fig.lock .fig-num{position:absolute;top:7px;left:9px;font-size:.58rem;font-weight:800;opacity:.7}
.fig.unseen{outline:3px solid var(--rubric);outline-offset:2px}
.figmodal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-left,0px));background:rgba(8,10,20,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.figmodal .inner{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:320px;width:100%}
.figmodal .fig{width:min(220px,62vw);font-size:1.5rem}
.figmodal .fig .fig-top{font-size:.7rem;padding:10px 12px 0}
.figmodal .fig .fig-g{font-size:2.6rem}
.figmodal .fig .fig-g.sm{font-size:1.7rem}
.figmodal .fig .fig-name{font-size:.95rem}
.figmodal .fig .fig-y{font-size:.78rem}
.figmodal .card{width:100%;background:rgba(var(--grgb),.95)}

/* Duelo */
.duel-hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.vs{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:1.2rem;color:#fff;background:linear-gradient(140deg,var(--rubric),#FF8A5B);box-shadow:0 6px 16px rgba(224,52,75,.3)}
.dscore{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.dscore b{display:block;font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dscore>div{min-width:0}
.dscore>div>span{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dturn{min-height:46vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center}
.dturn h2{font-size:1.8rem}
.dtimer{height:8px;border-radius:5px;background:var(--fill);overflow:hidden}
.dtimer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#F59F00,var(--rubric));transform-origin:left}
.dans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dans>div{border-radius:16px;padding:12px;background:var(--fill)}
.dans .ok{background:var(--ok-soft)}
.dans .no{background:var(--rubric-soft)}
.dans b{display:block}

/* ===== Overlay de stories ===== */
.story{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(4,6,14,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:stIn .25s ease both}
@keyframes stIn{from{opacity:0}to{opacity:1}}
.st-frame{--c1:#333;--c2:#111;--acc:#fff;position:relative;width:100%;height:100%;overflow:hidden;color:#fff;background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 78%);display:flex;flex-direction:column;font-family:var(--f-ui);animation:stZoom .3s cubic-bezier(.2,.8,.2,1) both;outline:none}
@keyframes stZoom{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:600px) and (min-height:560px){.st-frame{height:min(880px,calc(100vh - 40px));width:min(440px,calc((100vh - 40px)*.5625));border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.55)}}
.st-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.st-bg i{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--acc) 0%,transparent 65%);opacity:.22;filter:blur(8px)}
.st-bg i:nth-child(1){top:-18%;left:-22%;animation:blob1 16s ease-in-out infinite alternate}
.st-bg i:nth-child(2){bottom:-24%;right:-26%;width:85%;opacity:.16;animation:blob2 19s ease-in-out infinite alternate}
.st-bg i:nth-child(3){top:38%;left:46%;width:40%;opacity:.12;animation:blob1 13s ease-in-out infinite alternate-reverse}
@keyframes blob1{to{transform:translate(18%,22%) scale(1.15)}}
@keyframes blob2{to{transform:translate(-16%,-18%) scale(1.1)}}
.st-top{position:relative;z-index:2;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent)}
.st-bars{display:flex;gap:3px}
.st-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden;position:relative}
.st-bars i b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
.st-bars i.d b{transform:scaleX(1)}
.st-head{display:flex;align-items:center;gap:10px;padding-bottom:4px}
.st-ava{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c1) 50%,#fff),var(--c1));box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.st-ava .mart{width:100%;height:100%}
.st-who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.st-who b{font-size:.92rem}
.st-who span{font-size:.74rem;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-ic{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;padding:0;flex:none}
.st-ic svg{width:22px;height:22px}
.st-ic[aria-pressed="true"]{background:rgba(255,255,255,.18)}
.st-ic:focus-visible{outline:2px solid #fff;outline-offset:1px}
.st-stage{position:relative;flex:1;min-height:0;z-index:1;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.st-body{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;padding-block:8px 18px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));scrollbar-width:none}
.st-body::-webkit-scrollbar{display:none}
.st-body>.st-c{margin-block:auto;display:flex;flex-direction:column;gap:16px;width:100%}
.st-foot{position:relative;z-index:2;min-height:calc(14px + env(safe-area-inset-bottom,0px));padding:0 max(22px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:8px}
.st-hint{font-size:.78rem;opacity:.7;font-weight:600;display:flex;align-items:center;gap:6px}
.st-pause{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;pointer-events:none}
.st-pause svg{width:26px;height:26px}
.st-xp{position:absolute;right:16px;top:calc(76px + env(safe-area-inset-top,0px));z-index:4;font-weight:800;font-size:.86rem;padding:6px 12px;border-radius:999px;background:#fff;color:#151830;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:xpPop 1.6s ease both;pointer-events:none}
@keyframes xpPop{0%{opacity:0;transform:translateY(8px) scale(.9)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.st-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;border:0;font-weight:700;font-size:1rem;background:#fff;color:#151830;box-shadow:0 8px 24px rgba(0,0,0,.25);width:100%;max-width:360px;text-decoration:none}
.st-btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.st-btn:active{transform:scale(.97)}
.st-btn:disabled{opacity:.5}
.st-row{display:flex;gap:10px;width:100%;max-width:360px}
.st-row .st-btn{flex:1;min-width:0;padding-inline:12px}

/* tipografia dos stories */
.st-tag{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.st-h{font-size:clamp(1.75rem,7.6vw,2.35rem);font-weight:800;line-height:1.08;letter-spacing:-.025em;text-wrap:balance;margin:0}
.st-p{font-size:clamp(1.06rem,4.5vw,1.2rem);line-height:1.5;opacity:.95;margin:0;text-wrap:pretty}
.st-p b,.st-h b{color:var(--acc);font-weight:800}
.st-anim>*{animation:stUp .55s cubic-bezier(.2,.8,.2,1) both}
.st-anim>*:nth-child(2){animation-delay:.08s}.st-anim>*:nth-child(3){animation-delay:.16s}.st-anim>*:nth-child(4){animation-delay:.24s}.st-anim>*:nth-child(5){animation-delay:.32s}
@keyframes stUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.st-big{font-size:clamp(3rem,15vw,4.6rem);font-weight:900;line-height:1;letter-spacing:-.04em;background:linear-gradient(120deg,#fff 30%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.st-big.long{font-size:clamp(2.1rem,10vw,3rem)}
.st-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:li}
.st-list li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.12);font-weight:700;font-size:1.05rem;line-height:1.3;animation:stUp .5s cubic-bezier(.2,.8,.2,1) both}
.st-list li::before{counter-increment:li;content:counter(li);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--c2);font-weight:900;font-size:.9rem}
.st-verse{font-family:var(--f-serif);font-style:italic;font-size:clamp(1.3rem,5.8vw,1.65rem);line-height:1.42;margin:0}
.st-ref{font-weight:800;color:var(--acc);font-size:.95rem;letter-spacing:.02em}
.st-qmark{font-family:var(--f-serif);font-size:5rem;line-height:.6;color:var(--acc);height:2.6rem}
.st-quote{font-family:var(--f-serif);font-size:clamp(1.2rem,5.4vw,1.5rem);line-height:1.42;margin:0}
.st-by{font-size:.9rem;opacity:.8;font-weight:600}
.st-mentor{display:flex;flex-direction:column;align-items:center;gap:6px}
.st-mentor .bub{position:relative;background:#fff;color:#151830;border-radius:22px;padding:16px 18px;font-weight:650;font-size:1.08rem;line-height:1.42;box-shadow:0 14px 34px rgba(0,0,0,.28);align-self:stretch}
.st-mentor .bub::after{content:"";position:absolute;bottom:-8px;left:50%;width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.st-mentor .art{width:min(64vw,250px);aspect-ratio:1}
.st-mentor .nm{font-weight:800;font-size:.9rem;opacity:.85}
.st-cover{display:flex;flex-direction:column;gap:14px}
.st-cover .art{width:min(46vw,190px);aspect-ratio:1;align-self:center}
.st-cover .meta{display:flex;gap:8px;flex-wrap:wrap}
.st-cover .meta span{font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14)}
.st-link{color:#fff;opacity:.85;font-weight:600;font-size:.9rem;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:6px}

/* stickers interativos */
.stk{background:#fff;color:#14172B;border-radius:24px;padding:18px;box-shadow:0 16px 44px rgba(0,0,0,.32);display:flex;flex-direction:column;gap:12px}
.stk-t{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6B7089}
.stk-q{font-size:1.14rem;font-weight:800;line-height:1.3;letter-spacing:-.01em;margin:0}
.so{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:15px;background:#F0F2F8;border:2px solid transparent;font-weight:650;font-size:.98rem;line-height:1.35;color:#14172B}
.so:not(:disabled):active{transform:scale(.985)}
.so.ok{background:#E3F6EA;border-color:#27A05F}
.so.no{background:#FDE8EA;border-color:#E5484D}
.so.dim{opacity:.38;text-decoration:line-through}
.so:disabled{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .so{text-align:center;font-size:1.05rem;padding:16px 10px}
.sfb{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:12px;border-radius:16px;background:#F4F5FA;color:#14172B;text-align:left;font-size:.93rem;line-height:1.45;animation:stUp .35s ease both}
.sfb .av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c1) 45%,#fff),var(--c1))}
.sfb .av .mart{width:100%;height:100%}
