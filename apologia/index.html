function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return dkey(new Date())}
function addDays(k,n){const[y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n))}
function gain(n,why){S.xp+=n;const k=today();S.days[k]=(S.days[k]||0)+n;save();toast("+"+n+" XP · "+why);hdr()}
function streak(){let k=today(),c=0;if(!S.days[k])k=addDays(k,-1);while(S.days[k]){c++;k=addDays(k,-1)}return c}
function level(){let i=0;LEVELS.forEach((l,j)=>{if(S.xp>=l[0])i=j});const cur=LEVELS[i],nx=LEVELS[i+1];return{i,name:cur[1],min:cur[0],next:nx?nx[0]:null,nextName:nx?nx[1]:null}}
function passed(id){return(S.lessons[id]?.best||0)>=0.67}
function trackUnlocked(t){if(S.unlockAll||t.n===1)return true;const prev=TRACKS[t.n-2];return prev.mods.filter(passed).length>=3}
function dueCards(){const k=today();return CARDS.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=k)}
function newCards(){return CARDS.filter(c=>!S.cards[c.id])}
function newToday(){return Object.values(S.cards).filter(c=>c.added===today()).length}
function todayStats(){const k=today();return{lesson:Object.values(S.lessons).some(l=>l.day===k),cards:Object.values(S.cards).filter(c=>c.last===k).length,debate:(S.debDays||{})[k]||0}}

async function initSync(){
 try{
  if(!window.claude||!window.claude.use)return;
  const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const ref=db.doc("data/users/"+id+"/progress");
  const snap=await ref.get();
  if(snap.exists){const r=snap.data().state;if(r&&(r.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(fresh(),r);S.look=Object.assign(defLook(),S.look||{});applyLook();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}route()}}
  SYNC.ref=ref;SYNC.on=true;SYNC.status="conta";
  if(!snap.exists||(snap.data().state?.updatedAt||0)<(S.updatedAt||0))await ref.set({state:S});
  if(location.hash==="#perfil")route();
 }catch(e){SYNC.on=false;SYNC.status="local"}
}
function queueSync(){if(!SYNC.on)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(async()=>{try{await SYNC.ref.set({state:S})}catch(e){SYNC.on=false;SYNC.status="local"}},2500)}

function nextModule(){for(const t of TRACKS){if(!trackUnlocked(t))continue;for(const m of t.mods)if(!passed(m))return m}return null}

function trailState(){
 const seq=[];TRACKS.forEach(t=>t.mods.forEach((id,i)=>seq.push({id,t,i})));
 const cur=nextModule();
 const curIdx=cur?seq.findIndex(s=>s.id===cur):seq.length;
 const done=seq.filter(s=>passed(s.id)).length;
 const curT=cur?seq[curIdx].t:TRACKS[TRACKS.length-1];
 return{seq,cur,curIdx,done,total:seq.length,curT,pct:Math.round(done/seq.length*100)};
}

function drawTrail(T){
 const el=$("#trail");if(!el)return;
 const Z=TSIZE[S.look.trail]||TSIZE.normal,fs=S.look.font||1;
 el.style.setProperty("--disc",Z.d+"px");el.style.setProperty("--disc-c",Z.c+"px");
 const W=el.clientWidth||360,cx=W/2,amp=Math.min(118,W*.27),ROW=Z.row*Math.max(1,fs),GAP=Z.gap*Math.max(1,fs);
 // mede a altura real do cartão de nível (muda com o tamanho da letra)

  y+=BAN+GAP;
  t.mods.forEach((id,i)=>{
   const k=ti*4+i,x=cx+amp*Math.sin(k*.95),cy=y;pts.push([x,cy]);
   const m=MODS[id],best=S.lessons[id]?.best;
   const st=passed(id)?"done":k===T.curIdx?"current":un?"open":"locked";
   const off=(st==="current"?Z.c:Z.d)/2+14;
   const side=x<=cx?"r":"l",space=(side==="r"?W-x:x)-off-4;
   const sub=st==="done"?`Aprovada · ${Math.round(best*100)}%`:st==="current"?`Agora · ${m.min} min`:st==="open"?(best!=null?`Tente de novo · ${Math.round(best*100)}%`:`Disponível · ${m.min} min`):"Bloqueada";
   const inner=`<span class="disc">${st==="done"?IC.check:st==="locked"?lock:t.n+"."+(i+1)}</span>${st==="current"?`<span class="here"><i>${esc(me)}</i>Você está aqui</span>`:""}<span class="nlabel ${side}" style="${side==="r"?"left":"right"}:${off}px;max-width:${Math.round(Math.max(96,Math.min(160*fs,space)))}px"><b>${esc(m.title)}</b><span>${sub}</span></span>`;
   html+=st==="locked"?`<span class="node locked" style="left:${x}px;top:${cy}px" aria-label="${esc(m.title)}, bloqueada">${inner}</span>`:`<a class="node ${st}" href="#m-${id}" style="left:${x}px;top:${cy}px" aria-label="${esc(m.title)}, ${sub}">${inner}</a>`;
   y+=ROW;
  });
  y+=GAP-ROW+Z.c/2+10;
 });
 const allDone=T.done===T.total,fy=y+Z.c/2;pts.push([cx,fy]);
 const crown='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></svg>';
 const foff=Z.c/2+18;
 html+=`<span class="node finish ${allDone?"done current":"locked"}" style="left:${cx}px;top:${fy}px" aria-label="Fim da trilha: Mestre"><span class="disc">${crown}</span><span class="nlabel r" style="left:${foff}px;max-width:${Math.round(Math.max(90,Math.min(150,W-cx-foff-4)))}px"><b>Mestre</b><span>${allDone?"Concluída!":"Fim da trilha"}</span></span></span>`;
 const H=fy+Z.c/2+30;el.style.height=H+"px";
 const pd=p=>{if(!p.length)return"";let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=1;i<p.length;i++){const[a,b]=p[i-1],[c,e]=p[i],h=(e-b)/2;d+=` C${a.toFixed(1)},${(b+h).toFixed(1)} ${c.toFixed(1)},${(e-h).toFixed(1)} ${c.toFixed(1)},${e.toFixed(1)}`}return d};
 const progN=allDone?pts.length:T.curIdx+1;
 el.innerHTML=`<svg class="road" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ok)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient></defs><path class="base" d="${pd(pts)}"/>${progN>1?`<path class="prog" d="${pd(pts.slice(0,progN))}"/>`:""}</svg>`+html;
}

function defLook(){return{glass:45,blur:24,font:1,trail:"normal",theme:"auto",wall:"aurora",accent:"azul",motion:true}}
const WALLS={aurora:["Aurora",["#8C9DFF","#FF9DB0","#FFD58C","#8FE3EE"]],oceano:["Oceano",["#5AA9FF","#4DE0D0","#7C8CFF","#A6F0FF"]],sol:["Pôr do sol",["#FF8A5B","#FF5C8A","#FFC857","#C77DFF"]],floresta:["Floresta",["#4CC38A","#A3E36A","#2FB5A8","#E6D36B"]],grafite:["Sem cor",["transparent","transparent","transparent","transparent"]]};
const ACCENTS={azul:["Azul","#2F55F5","#6A4DFF","#7E96FF","#A58BFF"],roxo:["Roxo","#7B3FF2","#B04DFF","#B08CFF","#D19BFF"],verde:["Verde","#0E9F6E","#0D9488","#4ADE9B","#5EEAD4"],laranja:["Laranja","#E8590C","#F08C00","#FF9F5A","#FFC145"],rosa:["Rosa","#D6336C","#E64980","#FF7EA8","#FF9EC1"]};
const FONTS=[[.88,"P"],[.94,"M"],[1,"Padrão"],[1.08,"G"],[1.16,"GG"]];
const darkMQ=matchMedia("(prefers-color-scheme: dark)");
function isDark(){return S.look.theme==="dark"||(S.look.theme==="auto"&&darkMQ.matches)}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function applyLook(){
 const L=S.look,r=document.documentElement,st=r.style,dk=isDark();
 if(L.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",L.theme);
 const ga=+(0.94-L.glass*0.0085).toFixed(3);
 st.setProperty("--ga",ga);st.setProperty("--gas",Math.min(.97,ga+.24).toFixed(3));
 st.setProperty("--blur",L.blur+"px");
 st.fontSize=(L.font*100)+"%";
 const w=(WALLS[L.wall]||WALLS.aurora)[1];w.forEach((c,i)=>st.setProperty("--w"+(i+1),c));
 const a=ACCENTS[L.accent]||ACCENTS.azul,c1=dk?a[3]:a[1],c2=dk?a[4]:a[2];
 st.setProperty("--accent",c1);st.setProperty("--accent-2",c2);st.setProperty("--accent-soft",hexA(c1,dk?.16:.12));
 r.classList.toggle("calm",!L.motion);
}
darkMQ.addEventListener?.("change",()=>{if(S.look.theme==="auto")applyLook()});

 <div class="lrow"><div class="lhead"><span>Tema</span></div>${seg("lth",[["auto","Automático"],["light","Claro"],["dark","Escuro"]],L.theme)}</div>

let CS={filter:"Todos",queue:[],cur:null,shown:false,free:false};
const CATS=["Todos","Versículo","Argumento","Citação","História","Conceito"];
function buildQueue(){

 CS.queue=[...due,...nw];
}

 const boxes=[0,1,2,3,4,5].map(b=>CARDS.filter(c=>S.cards[c.id]&&Math.min(S.cards[c.id].box,5)===b).length);
 const c=CS.cur;

 app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{CS.filter=b.dataset.k;CS.cur=null;viewCards()});
 const fl=$("#flash");if(fl){const show=()=>{if(!CS.shown){CS.shown=true;viewCards()}};fl.onclick=show;fl.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show()}}}
 app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(+b.dataset.r));
 const fr=$("#free");if(fr)fr.onclick=()=>{CS.free=true;CS.cur=null;viewCards()};
}
function rate(r){
 const c=CS.cur,k=today();let st=S.cards[c.id];
 if(!st){st={box:0,due:k,added:k};S.cards[c.id]=st}
 if(r===0){st.box=0;st.due=addDays(k,1)}
 else if(r===1){st.due=addDays(k,INTERVALS[Math.min(st.box,5)])}
 else{st.box=Math.min(st.box+1,6);st.due=addDays(k,INTERVALS[Math.min(st.box,5)])}
 st.last=k;
 if(r===0&&!CS.free)CS.queue.push(c);
 gain(r===0?1:2,"card revisado");
 CS.cur=CS.queue.shift()||null;CS.shown=false;viewCards();tabs("cards");
}

function renderArena(){

 const modeSw=SAMPLE?`<div class="chips" role="group" aria-label="Modo"><button class="chip" aria-pressed="${DB.mode==="ia"}" data-m="ia">Conversa com IA</button><button class="chip" aria-pressed="${DB.mode==="off"}" data-m="off">Treino offline</button></div>`:"";

  const o=p.obj[DB.oi];
  app.innerHTML=`<a class="back" href="#debate" id="leave">${IC.back} Oponentes</a>${personaHead(p)}${modeSw}
  <div class="card stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">Objeção ${DB.oi+1} de ${p.obj.length}</span></div>
   <p class="quote" style="font-style:normal">"${esc(o.q)}"</p>
   <label for="ans" class="small" style="font-weight:600">Sua resposta (como você falaria)</label>
   <textarea id="ans" placeholder="Escreva aqui. Use uma pergunta, um argumento e um texto bíblico.">${esc(DB.draft)}</textarea>
   ${DB.reveal?`<div class="explain"><b>Pontos-chave de uma boa resposta:</b><ul class="keypoints" style="margin-top:8px">${o.k.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>
   <div class="selfcheck"><p class="small" style="font-weight:700;margin-bottom:4px">Autoavaliação: na sua resposta você...</p>
    ${["Fez pelo menos uma pergunta à pessoa","Usou um argumento lógico ou um fato","Citou a Bíblia ou uma fonte","Foi gentil e sem ironia"].map((t,i)=>`<label><input type="checkbox" id="sc${i}"> ${t}</label>`).join("")}</div>
   <div class="row"><button class="btn pri" id="nextObj">${DB.oi+1<p.obj.length?"Próxima objeção":"Concluir treino"}</button></div>`
   :`<div class="row"><button class="btn pri" id="reveal">Ver resposta-modelo</button></div>`}
  </div>`;
  const ta=$("#ans");ta.oninput=()=>DB.draft=ta.value;
  const rv=$("#reveal");if(rv)rv.onclick=()=>{if(!DB.draft.trim()){toast("Escreva sua resposta antes de ver o modelo.");ta.focus();return}DB.reveal=true;renderArena()};
  const nx=$("#nextObj");if(nx)nx.onclick=()=>{const n=[0,1,2,3].filter(i=>$("#sc"+i).checked).length;if(DB.oi+1<p.obj.length){gain(5+n*2,"objeção respondida");DB.oi++;DB.reveal=false;DB.draft="";renderArena()}else{markDebate(20,"treino concluído");DB=null;viewDebate()}};
 }else{
  app.innerHTML=`<a class="back" href="#debate" id="leave">${IC.back} Oponentes</a>${personaHead(p)}${modeSw}
  <div class="chat" id="chat"><div class="msg sys">Treino com IA. Responda como responderia na vida real. Depois de 2 ou 3 respostas, peça a avaliação.</div><div class="msg them">${esc(p.opening)}</div>${DB.turns.map(t=>`<div class="msg ${t.role==="user"?"me":"them"}">${esc(t.content)}</div>`).join("")}<div class="msg them" id="typing" hidden>...</div></div>
  ${DB.eval?evalHTML(DB.eval):`<div class="stack"><label for="msgin" class="small" style="font-weight:600">Sua resposta</label><textarea id="msgin" placeholder="Responda a ${esc(p.name)}...">${esc(DB.draft)}</textarea>
  <div class="row"><button class="btn pri" id="send">Enviar</button><button class="btn" id="evalb" ${DB.turns.filter(t=>t.role==="user").length?"":"disabled"}>Encerrar e avaliar</button><button class="btn ghost" id="stop" hidden>Parar</button></div></div>`}`;
  const mi=$("#msgin");if(mi){mi.oninput=()=>DB.draft=mi.value;mi.onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMsg()}}}
  const sb=$("#send");if(sb)sb.onclick=sendMsg;
  const eb=$("#evalb");if(eb)eb.onclick=doEval;
  const again=$("#again");if(again)again.onclick=()=>{DB={...DB,turns:[],eval:null,draft:""};renderArena()};
  const oth=$("#other");if(oth)oth.onclick=()=>{DB=null;viewDebate();window.scrollTo(0,0)};
 }
 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{DB.mode=b.dataset.m;renderArena()});
 $("#leave").onclick=e=>{e.preventDefault();DB?.ctl?.abort();DB=null;viewDebate()};
}
function rules(p){return`Você está dentro de "Apologia", um app de treino em defesa da fé cristã para jovens evangélicos brasileiros de 15 a 25 anos. Neste treino, faça o papel de ${p.name}, ${p.persona}.
Regras: fale em português do Brasil, natural, como uma pessoa real conversando; respostas curtas (no máximo 90 palavras); levante objeções honestas e fortes que essa pessoa realmente faria, uma de cada vez; não ceda fácil, mas reconheça com sinceridade quando um argumento for bom; nunca use palavrões nem ofensas; não saia do personagem e não dê dicas ao jovem. Se a pessoa for a amiga ferida, reaja como alguém de luto reagiria: valorize empatia e se feche diante de respostas frias.
Você abriu a conversa dizendo: "${p.opening}"
A seguir vêm as falas do jovem e as suas. Responda à última fala do jovem.`}
async function sendMsg(){
 const d=DB;if(!d||d.busy||!SAMPLE)return;const mi=$("#msgin");const txt=mi.value.trim();if(!txt)return;
 d.turns.push({role:"user",content:txt});d.draft="";d.busy=true;renderArena();
 const ty=$("#typing");ty.hidden=false;ty.textContent="digitando...";$("#send").disabled=true;$("#evalb").disabled=true;$("#stop").hidden=false;
 d.ctl=new AbortController();$("#stop").onclick=()=>d.ctl.abort();
 const input=[{role:"user",content:rules(d.p)},...d.turns.slice(-12)];
 try{
  const{text}=await SAMPLE(input,{modelTier:"quick",cache:false,signal:d.ctl.signal,onText:({text})=>{if(DB===d){const t=$("#typing");if(t)t.textContent=text}}});
  d.turns.push({role:"assistant",content:text});
 }catch(e){if(e.text)d.turns.push({role:"assistant",content:e.text});else{d.turns.pop();d.draft=txt}if(e.code!=="cancelled")toast(errMsg(e.code));if(["not_granted","sampling_disabled","not_declared","capability_disabled"].includes(e.code)){SAMPLE=null;d.mode="off"}}
 finally{d.busy=false;if(DB===d){renderArena();const c=$("#chat");if(c)c.lastElementChild?.scrollIntoView({block:"end"})}}
}
async function doEval(){
 const d=DB;if(!d||d.busy||!SAMPLE)return;d.busy=true;const eb=$("#evalb");eb.disabled=true;eb.textContent="Avaliando...";$("#send").disabled=true;
 const tr=[`${d.p.name}: ${d.p.opening}`,...d.turns.map(t=>(t.role==="user"?"JOVEM: ":d.p.name+": ")+t.content)].join("\n");
 try{
  const r=await SAMPLE.json(`Você é um professor experiente de apologética cristã evangélica avaliando o treino de um jovem brasileiro (15 a 25 anos) num app de estudos. O jovem conversou com ${d.p.name}, ${d.p.persona}.
Avalie SOMENTE as falas marcadas como JOVEM. Seja exigente, justo e encorajador. Critérios (0 a 10): "logica" (argumentos válidos, responde à objeção real), "biblia" (uso correto da Bíblia e de fatos/fontes), "tom" (mansidão, respeito, empatia, 1 Pe 3.15), "clareza" (simples, objetivo, convincente). "nota" é a média ponderada geral.
Responda apenas com JSON neste formato:
{"nota":7,"logica":7,"biblia":6,"tom":9,"clareza":7,"fortes":["...","..."],"melhorar":["...","..."],"modelo":"uma resposta-modelo curta (até 110 palavras) para a objeção principal, no estilo falado"}

Conversa:
${tr.slice(0,12000)}`,{modelTier:"default",cache:false});
  const n=x=>Math.max(0,Math.min(10,Math.round(Number(x)||0)));
  d.eval={nota:n(r.nota),logica:n(r.logica),biblia:n(r.biblia),tom:n(r.tom),clareza:n(r.clareza),fortes:(Array.isArray(r.fortes)?r.fortes:[]).slice(0,4).map(String),melhorar:(Array.isArray(r.melhorar)?r.melhorar:[]).slice(0,4).map(String),modelo:String(r.modelo||"")};
  markDebate(d.eval.nota>=8?30:20,d.eval.nota>=8?"debate excelente":"debate concluído");
 }catch(e){toast(errMsg(e.code))}
 finally{d.busy=false;if(DB===d)renderArena()}
}
function evalHTML(v){return`<div class="card stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">Sua avaliação</span><span class="score" style="font-size:2rem">${v.nota}<span class="muted" style="font-size:1rem">/10</span></span></div>
 <div class="scoregrid"><div><b>${v.logica}</b><span>Lógica</span></div><div><b>${v.biblia}</b><span>Bíblia e fontes</span></div><div><b>${v.tom}</b><span>Tom</span></div><div><b>${v.clareza}</b><span>Clareza</span></div></div>
 ${v.fortes.length?`<div><b>Pontos fortes</b><ul class="keypoints" style="margin-top:6px">${v.fortes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
 ${v.melhorar.length?`<div><b>Para melhorar</b><ul class="keypoints" style="margin-top:6px">${v.melhorar.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
 ${v.modelo?`<div class="explain"><b>Resposta-modelo:</b> ${esc(v.modelo)}</div>`:""}
 <div class="row"><button class="btn pri" id="again">Treinar de novo</button><button class="btn" id="other">Outro oponente</button></div></div>`}

/* ----- Livros ----- */
let BF="Todos";
function viewLivros(){
 const lv=["Todos","Iniciante","Intermediário","Avançado","Mestre"];
 const read=BOOKS.filter(b=>S.books[b.id]==="lido").length;
 app.innerHTML=`<section class="hero"><span class="eyebrow"><span class="rub">¶</span> Biblioteca do defensor</span><h1>Trilha de livros</h1><p class="lead">Dezessete livros em ordem de dificuldade. Comece pelo primeiro de Lewis. Cada livro lido vale 40 XP. Responda às perguntas no grupo de jovens.</p></section>
 <div class="row" style="justify-content:space-between"><div class="chips" role="group" aria-label="Filtrar nível">${lv.map(k=>`<button class="chip" aria-pressed="${BF===k}" data-l="${k}">${k}</button>`).join("")}</div><span class="ref">${read}/${BOOKS.length} lidos</span></div>
 <div class="stack">${BOOKS.filter(b=>BF==="Todos"||b.lvl===BF).map((b,i)=>{const s=S.books[b.id]||"";return`<div class="card book"><div class="spine" style="background:${b.col}">${b.y}</div><div>
  <span class="eyebrow">${b.lvl}</span><h3>${esc(b.t)}</h3><p class="small muted">${esc(b.a)}</p><p style="margin-top:6px">${esc(b.why)}</p>
  <details><summary>Ideias-chave e perguntas</summary><ul>${b.ideas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="small" style="font-weight:700;margin-top:8px">Para discutir</p><ul>${b.q.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
  <div class="seg" role="group" aria-label="Status de leitura">${[["quero","Quero ler"],["lendo","Lendo"],["lido","Lido"]].map(([k,l])=>`<button data-b="${b.id}" data-s="${k}" aria-pressed="${s===k}">${l}</button>`).join("")}</div>
 </div></div>`}).join("")}</div>`;
 app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{BF=b.dataset.l;viewLivros()});
 app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const id=b.dataset.b,s=b.dataset.s,was=S.books[id];S.books[id]=was===s?"":s;
  if(s==="lido"&&was!=="lido"){S.booksXp=S.booksXp||{};if(!S.booksXp[id]){S.booksXp[id]=1;gain(40,"livro lido")}else save()}else save();viewLivros()});
}

/* ----- Perfil ----- */
function badges(){const st=Math.max(streak(),S.bestStreak||0);const t=n=>TRACKS[n].mods.filter(passed).length===4;const rd=BOOKS.filter(b=>S.books[b.id]==="lido").length;const perf=Object.values(S.lessons).filter(l=>l.best===1).length;
 return[["I","Primeiro passo","1 lição aprovada",Object.keys(MODS).some(passed)],["II","Fundamentado","Nível 1 completo",t(0)],["III","Doutrinado","Nível 2 completo",t(1)],["IV","Apologeta","Nível 3 completo",t(2)],["V","Mestre","Nível 4 completo",t(3)],["7","Constante","7 dias seguidos",st>=7],["30","Inabalável","30 dias seguidos",st>=30],["¶","Debatedor","10 debates",S.debates>=10],["L","Leitor","3 livros lidos",rd>=3],["★","Precisão","5 provas perfeitas",perf>=5],["50","Memória","50 cards na caixa 3+",Object.values(S.cards).filter(c=>c.box>=3).length>=50]]}
function viewPerfil(){
 S.bestStreak=Math.max(S.bestStreak||0,streak());
 const L=level();
 app.innerHTML=`<section class="hero"><span class="eyebrow"><span class="rub">¶</span> Seu progresso</span><h1>${S.name?esc(S.name):"Perfil"}</h1><p class="lead">${L.name} · ${S.xp} XP · recorde de ${S.bestStreak} dia${S.bestStreak===1?"":"s"} seguidos</p></section>
 <div class="card stack"><label for="nm" style="font-weight:600">Como quer ser chamado?</label><div class="row"><input type="text" id="nm" value="${esc(S.name)}" maxlength="30" style="flex:1;min-width:0"><button class="btn pri" id="nmb">Salvar</button></div></div>
 <div class="stack"><h2 style="font-size:1.3rem">Medalhas</h2><div class="badges">${badges().map(([s,t,d,ok])=>`<div class="badge glass ${ok?"":"off"}"><div class="seal">${s}</div><b>${t}</b><span>${d}</span></div>`).join("")}</div></div>
 ${lookPanel()}
 <div class="card"><h2 style="font-size:1.2rem;margin-bottom:6px">Ajustes</h2>
  <div class="switch"><div><b>Modo líder</b><p class="small muted">Libera todos os níveis para o líder de jovens conferir o conteúdo.</p></div><input type="checkbox" class="ios" id="ul" ${S.unlockAll?"checked":""} aria-label="Modo líder"></div>
  <div class="switch"><div><b>Onde seu progresso fica salvo</b><p class="small muted">${SYNC.status==="conta"?"Na sua conta Claude: abre igual em qualquer aparelho.":"Neste aparelho e navegador. Limpar os dados do navegador apaga o progresso."}</p></div></div>
  <div class="switch"><div><b>Simulador com IA</b><p class="small muted">${SAMPLE?"Disponível. Usa a sua conta Claude.":"Indisponível aqui. O treino offline continua funcionando."}</p></div></div>
  <div class="switch"><div><b>Recomeçar do zero</b><p class="small muted">Apaga XP, lições, cards e livros.</p></div><button class="btn" id="rs">Recomeçar</button></div>
  <div id="rsc"></div>
 </div>`;
 bindLook();
 $("#nmb").onclick=()=>{S.name=$("#nm").value.trim().slice(0,30);save();toast("Nome salvo");hdr()};
 $("#ul").onchange=e=>{S.unlockAll=e.target.checked;save();toast(S.unlockAll?"Todos os níveis liberados":"Níveis voltam a abrir por progresso")};
 $("#rs").onclick=()=>{$("#rsc").innerHTML=`<div class="explain row" style="justify-content:space-between"><span>Tem certeza? Isso não pode ser desfeito.</span><span class="row"><button class="btn" id="rsn">Cancelar</button><button class="btn red" id="rsy">Apagar tudo</button></span></div>`;
  $("#rsn").onclick=()=>$("#rsc").innerHTML="";$("#rsy").onclick=()=>{const nm=S.name;const lk=S.look;S=fresh();S.name=nm;S.look=lk;save();hdr();toast("Progresso apagado");route()}};
}

/* ================== ROTAS ================== */
function route(){
 const h=(location.hash||"#inicio").slice(1);
 let cur=h;
 if(h.startsWith("m-")){cur="trilha";viewModule(h.slice(2))}
 else if(h==="trilha")viewTrilha();
 else if(h==="cards")viewCards();
 else if(h==="debate")viewDebate();
 else if(h==="livros")viewLivros();
 else if(h==="perfil")viewPerfil();
 else{cur="inicio";viewHome()}
 tabs(cur);hdr();
}
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{if(location.hash!==lastHash){lastHash=location.hash;if(location.hash!=="#debate")DB=null;route();window.scrollTo(0,0)}});
applyLook();
route();
initSync();initSample();
</script>
