f1:{title:"O Evangelho em uma página",min:7,
 sum:"A história completa da Bíblia em quatro atos, e por que ela dá firmeza à sua identidade.",
 verse:{t:"Porque pela graça sois salvos, por meio da fé; e isto não vem de vós; é dom de Deus. Não vem das obras, para que ninguém se glorie.",r:"Ef 2.8-9"},
 body:`<p>Antes de defender a fé, você precisa saber explicá-la. Muita gente que critica o cristianismo nunca ouviu o que ele realmente diz. E muito jovem cristão também não sabe resumir. Vamos resolver isso.</p>
<h3>A grande história em quatro atos</h3>
<ol>
<li><b>Criação.</b> Deus criou tudo, e tudo era bom. O ser humano foi feito à imagem de Deus (Gn 1.27). Por isso cada pessoa tem valor, antes de qualquer conquista.</li>
<li><b>Queda.</b> O ser humano se rebelou contra Deus (Gn 3). Pecado não é só "errar"; é querer ser o próprio deus. Isso quebrou nossa relação com Deus, com os outros e com o mundo. "Todos pecaram" (Rm 3.23).</li>
<li><b>Redenção.</b> Deus não nos abandonou. O Filho se fez homem em Jesus, viveu a vida perfeita que não vivemos, morreu no nosso lugar e ressuscitou ao terceiro dia (1 Co 15.3-4). "Aquele que não conheceu pecado, Deus o fez pecado por nós" (2 Co 5.21).</li>
<li><b>Consumação.</b> Jesus voltará, julgará com justiça e fará novas todas as coisas: sem morte, sem choro, sem dor (Ap 21.4-5).</li>
</ol>
<h3>Graça não é prêmio</h3>
<p>Quase todas as religiões dizem: "Faça o bem e talvez Deus te aceite". O cristianismo diz o contrário: <b>Deus te aceita em Cristo, e por isso você muda.</b> As boas obras são o fruto da salvação, não o preço dela (Ef 2.10).</p>
<blockquote>"O cristianismo, se for falso, não tem importância nenhuma; se for verdadeiro, tem importância infinita. A única coisa que ele não pode ser é moderadamente importante."<cite>C. S. Lewis, "Apologética cristã" (1945), em <i>Deus no banco dos réus</i></cite></blockquote>
<h3>Por que isso te deixa firme</h3>
<p>Se sua identidade depende de aprovação, você vai se calar quando a turma rir da sua fé. Se sua identidade está em Cristo, a aprovação do grupo perde poder sobre você. Firmeza começa aqui: <b>você não precisa vencer a discussão para estar seguro.</b></p>
<div class="box">Memorize os quatro atos: <b>Criação, Queda, Redenção, Consumação.</b> Toda conversa sobre fé cabe em um deles.</div>`,
 pr:{q:"\"Me explica rapidinho: o que vocês, crentes, acreditam?\"",a:"\"Em resumo: Deus criou tudo bom e fez a gente para ele. A gente virou as costas, e isso estragou tudo, por dentro e por fora. Jesus, que é Deus, veio, viveu sem pecado, morreu no meu lugar e ressuscitou. Quem confia nele é perdoado, não por merecer, mas por graça. E um dia ele vai consertar o mundo inteiro. Quer que eu te conte por que eu acho que isso é verdade?\""},
 quiz:[
  {q:"Qual é a ordem dos quatro atos da história bíblica?",o:["Queda, Criação, Lei, Juízo","Criação, Queda, Redenção, Consumação","Criação, Lei, Profetas, Igreja","Redenção, Criação, Queda, Céu"],c:1,e:"Criação (tudo bom), Queda (pecado), Redenção (Cristo) e Consumação (tudo novo)."},
  {q:"Segundo Efésios 2.8-10, qual o lugar das boas obras?",o:["Elas compram a salvação","Elas são opcionais e sem importância","Elas são fruto de quem já foi salvo pela graça","Elas valem só para os pastores"],c:2,e:"Somos salvos pela graça, mediante a fé, para as boas obras (v. 10). Obras são resultado, não pagamento."},
  {q:"Por que a doutrina da imagem de Deus (Gn 1.27) importa no dia a dia?",o:["Porque dá valor a toda pessoa antes de qualquer conquista","Porque prova que o ser humano é Deus","Porque só cristãos têm valor","Porque fala apenas da aparência física"],c:0,e:"Todo ser humano carrega a imagem de Deus, por isso tem dignidade: rico ou pobre, nascido ou não nascido, crente ou não."}
 ]},

f2:{title:"Deus existe? Três argumentos",min:10,
 sum:"Cosmológico, ajuste fino e moral: três caminhos racionais que apontam para Deus.",
 verse:{t:"Pois os atributos invisíveis de Deus, assim o seu eterno poder como também a sua própria divindade, claramente se reconhecem, desde o princípio do mundo, sendo percebidos por meio das coisas que foram criadas.",r:"Rm 1.20"},
 body:`<p>Fé cristã não é "pular no escuro". A Bíblia diz que a criação aponta para o Criador. Aqui estão três argumentos que filósofos sérios usam até hoje.</p>
<h3>1. O argumento cosmológico (Kalam)</h3>
<p>Formulado na Idade Média e popularizado hoje pelo filósofo William Lane Craig:</p>
<ol><li>Tudo o que começa a existir tem uma causa.</li><li>O universo começou a existir.</li><li>Logo, o universo tem uma causa.</li></ol>
<p>A premissa 2 é apoiada pela cosmologia: o modelo do Big Bang indica que tempo, espaço e matéria tiveram início. Curiosidade que vale ouro: quem propôs essa ideia, em 1927, foi <b>Georges Lemaître</b>, físico e padre católico.</p>
<p>Se o tempo, o espaço e a matéria começaram, a causa precisa estar <b>fora</b> deles: sem tempo (eterna), sem espaço (imaterial), imensamente poderosa e capaz de escolher criar (pessoal). Isso descreve o Deus da Bíblia.</p>
<h3>2. O ajuste fino</h3>
<p>Várias constantes da física, como a força da gravidade e a constante cosmológica, precisam estar numa faixa estreitíssima para a vida existir. Mude um pouco e não haveria estrelas, química ou vida. Há três explicações possíveis: <b>necessidade física, acaso ou design</b>. Não há evidência de que as constantes sejam necessárias, e o acaso exige probabilidades absurdas. O design é a melhor explicação.</p>
<blockquote>"Uma interpretação de bom senso dos fatos sugere que um superintelecto andou mexendo na física, assim como na química e na biologia."<cite>Fred Hoyle, astrônomo, que não era cristão (1981)</cite></blockquote>
<h3>3. O argumento moral</h3>
<ol><li>Se Deus não existe, valores morais objetivos não existem.</li><li>Valores morais objetivos existem.</li><li>Logo, Deus existe.</li></ol>
<p>Todo mundo sabe que torturar uma criança por diversão é errado <b>de verdade</b>, não só "na minha opinião". Mas de onde vem esse "de verdade"? Matéria e acaso não produzem deveres. Uma lei moral exige um Legislador.</p>
<blockquote>"Meu argumento contra Deus era que o universo parecia muito cruel e injusto. Mas de onde eu tinha tirado essa ideia de justo e injusto?"<cite>C. S. Lewis, <i>Cristianismo puro e simples</i>, livro 2</cite></blockquote>
<div class="box r"><b>Cuidado:</b> o argumento moral não diz que ateus são imorais. Muitos ateus são pessoas boas. A questão é outra: sem Deus, o que <b>fundamenta</b> o bem e o mal?</div>`,
 pr:{q:"\"Se tudo precisa de uma causa, quem criou Deus?\"",a:"\"Boa pergunta, mas o argumento não diz que tudo precisa de causa. Diz que tudo o que <b>começa a existir</b> precisa. Deus, por definição, não começou: é eterno. Aliás, você também acredita em algo eterno, ou a matéria, ou um ciclo infinito, ou Deus. A pergunta é qual explica melhor um universo que teve começo. Matéria não pode criar a si mesma antes de existir.\""},
 quiz:[
  {q:"Qual premissa do argumento Kalam é apoiada pela cosmologia do Big Bang?",o:["Tudo o que começa a existir tem uma causa","O universo começou a existir","Deus é pessoal","A moral é objetiva"],c:1,e:"O Big Bang indica um início do universo físico, o que apoia a premissa 2."},
  {q:"Como responder a \"Quem criou Deus?\"",o:["Dizer que é falta de fé perguntar isso","O argumento trata do que começa a existir; Deus é eterno, não começou","Dizer que Deus foi criado por outro deus","Mudar de assunto"],c:1,e:"Só precisa de causa o que começa a existir. Um ser eterno não tem começo."},
  {q:"Quais são as três explicações possíveis para o ajuste fino?",o:["Evolução, sorte e destino","Necessidade, acaso e design","Big Bang, multiverso e caos","Ciência, religião e filosofia"],c:1,e:"Necessidade física, acaso ou design inteligente. O argumento mostra que design é a melhor das três."},
  {q:"O argumento moral afirma que:",o:["Ateus não conseguem ser bons","Sem Deus não há fundamento para valores morais objetivos","A Bíblia é o único livro com moral","A moral muda conforme a cultura"],c:1,e:"Não é sobre o comportamento dos ateus, e sim sobre o fundamento da moral."}
 ]},

f3:{title:"A Bíblia é confiável?",min:10,
 sum:"Manuscritos, arqueologia e formação do cânon: por que a Bíblia que você lê é fiel ao original.",
 verse:{t:"Toda a Escritura é inspirada por Deus e útil para o ensino, para a repreensão, para a correção, para a educação na justiça.",r:"2 Tm 3.16"},
 body:`<p>"A Bíblia foi alterada como um telefone sem fio." Você vai ouvir isso. Veja o que os fatos dizem.</p>
<h3>Mais manuscritos do que qualquer livro antigo</h3>
<p>O Novo Testamento tem <b>mais de 5.800 manuscritos em grego</b>, além de milhares em latim e outras línguas. A obra antiga mais bem documentada depois dele, a <i>Ilíada</i> de Homero, tem cerca de 2 mil. De muitos clássicos, como os escritos de Tácito, restam poucos manuscritos, copiados séculos depois.</p>
<p>O fragmento mais antigo conhecido, o <b>Papiro P52</b> (trecho de João 18), é geralmente datado da primeira metade do século II, poucas décadas depois de o Evangelho ser escrito.</p>
<h3>Não é telefone sem fio</h3>
<p>Telefone sem fio é uma linha só, em que cada pessoa ouve a anterior. Os manuscritos se espalharam em <b>muitos ramos independentes</b> (Egito, Síria, Roma...). Comparando milhares de cópias, os estudiosos reconstroem o texto original com altíssima precisão. A maioria das variantes é ortografia ou ordem de palavras, e <b>nenhuma doutrina central depende de uma variante duvidosa</b>.</p>
<h3>Os Manuscritos do Mar Morto</h3>
<p>Descobertos em 1947, incluíam um rolo completo de Isaías cerca de mil anos mais antigo do que as cópias que tínhamos. O resultado: o texto era praticamente o mesmo. As diferenças eram, na maioria, de grafia.</p>
<h3>A arqueologia confirma detalhes</h3>
<ul>
<li><b>Estela de Tel Dan</b> (1993): cita a "Casa de Davi", contra quem dizia que Davi era lenda.</li>
<li><b>Pedra de Pilatos</b> (1961, Cesareia): inscrição com o nome de Pôncio Pilatos.</li>
<li><b>Ossuário de Caifás</b> (1990): provável caixa de ossos do sumo sacerdote do julgamento de Jesus.</li>
<li><b>Tanque de Siloé</b> (2004): o lugar de João 9, encontrado em Jerusalém.</li>
</ul>
<h3>Quem escolheu os livros?</h3>
<p>A igreja não "inventou" o cânon; ela <b>reconheceu</b> os livros que já eram usados como Escritura. Critérios: ligação com os apóstolos, fidelidade à fé recebida e uso amplo pelas igrejas. Em 367, Atanásio listou exatamente os 27 livros do Novo Testamento que temos hoje.</p>`,
 pr:{q:"\"A Bíblia foi escrita por homens e alterada várias vezes. Não dá pra confiar.\"",a:"\"Foi escrita por homens, sim, e a gente crê que Deus os inspirou. Agora, alterada? Temos mais de 5.800 manuscritos gregos do Novo Testamento, de lugares diferentes. Quando alguém tenta mudar uma cópia, as outras denunciam. Os Manuscritos do Mar Morto mostraram Isaías praticamente igual depois de mil anos de cópias. Qual trecho você acha que foi alterado? A gente pode olhar junto.\""},
 quiz:[
  {q:"Aproximadamente quantos manuscritos gregos do Novo Testamento existem?",o:["Cerca de 50","Cerca de 600","Mais de 5.800","Nenhum, só traduções"],c:2,e:"Mais de 5.800 em grego, muito mais do que qualquer outra obra da Antiguidade."},
  {q:"Por que a comparação com o \"telefone sem fio\" falha?",o:["Porque a Bíblia nunca foi copiada","Porque as cópias se espalharam em vários ramos independentes que podem ser comparados","Porque os monges eram perfeitos","Porque só existe um manuscrito"],c:1,e:"Vários ramos independentes permitem detectar e corrigir erros de cópia."},
  {q:"O que a Estela de Tel Dan (1993) confirmou?",o:["A existência de Pilatos","A \"Casa de Davi\", ou seja, a dinastia do rei Davi","O local do Tanque de Siloé","A data do Êxodo"],c:1,e:"A inscrição menciona a \"Casa de Davi\", forte evidência da existência histórica de Davi."},
  {q:"Em 367, quem listou os 27 livros do Novo Testamento?",o:["Constantino","Martinho Lutero","Atanásio de Alexandria","O apóstolo João"],c:2,e:"Atanásio, em sua carta pascal de 367, lista os 27 livros que reconhecemos hoje."}
 ]},

f4:{title:"Quem foi Jesus de verdade?",min:9,
 sum:"Fontes fora da Bíblia, o que Jesus afirmou sobre si e o famoso trilema de C. S. Lewis.",
 verse:{t:"Respondeu-lhes Jesus: Em verdade, em verdade eu vos digo: antes que Abraão existisse, EU SOU.",r:"Jo 8.58"},
 body:`<h3>Jesus existiu? Até os críticos dizem que sim</h3>
<p>Praticamente nenhum historiador sério nega que Jesus existiu. O estudioso agnóstico Bart Ehrman, crítico do cristianismo, escreveu um livro inteiro (<i>Did Jesus Exist?</i>, 2012) para mostrar que sim, existiu. Algumas fontes não cristãs:</p>
<ul>
<li><b>Tácito</b>, historiador romano (<i>Anais</i> 15.44, c. 116 d.C.): Cristo "sofreu a pena máxima durante o reinado de Tibério, pelas mãos do procurador Pôncio Pilatos".</li>
<li><b>Flávio Josefo</b>, historiador judeu (<i>Antiguidades</i> 20.9.1, c. 93 d.C.): menciona "Tiago, irmão de Jesus, chamado Cristo".</li>
<li><b>Plínio, o Jovem</b>, governador romano (<i>Cartas</i> 10.96, c. 112 d.C.): os cristãos cantavam hinos "a Cristo, como a um deus".</li>
</ul>
<h3>O que Jesus afirmou sobre si</h3>
<ul>
<li>Usou o nome divino: "antes que Abraão existisse, EU SOU" (Jo 8.58; compare Êx 3.14). Os ouvintes entenderam e pegaram pedras.</li>
<li>Perdoou pecados cometidos contra outros, algo que só Deus pode fazer (Mc 2.5-7).</li>
<li>Diante do sumo sacerdote, confirmou ser o Cristo e o Filho do Homem que viria nas nuvens (Mc 14.61-62).</li>
<li>Aceitou adoração: "Senhor meu e Deus meu!" (Jo 20.28).</li>
</ul>
<h3>O trilema de C. S. Lewis</h3>
<p>Muita gente diz: "Jesus foi um grande mestre moral, mas não Deus". Lewis mostrou que essa opção não está disponível. Quem diz o que Jesus disse é <b>mentiroso</b> (sabia que não era Deus), <b>lunático</b> (achava que era, sem ser) ou <b>Senhor</b> (é mesmo quem disse ser).</p>
<blockquote>"Você pode calá-lo como a um louco, pode cuspir nele e matá-lo como a um demônio; ou pode cair a seus pés e chamá-lo de Senhor e Deus. Mas não venhamos com essa bobagem condescendente de que ele foi um grande mestre humano. Ele não nos deixou essa opção."<cite>C. S. Lewis, <i>Cristianismo puro e simples</i>, livro 2, cap. 3</cite></blockquote>
<div class="box">Críticos acrescentam uma quarta opção: <b>lenda</b>. A resposta está no próximo nível: as fontes são próximas demais dos fatos para dar tempo de uma lenda se formar (veja o credo de 1 Co 15).</div>`,
 pr:{q:"\"Jesus foi um cara legal, tipo Gandhi. Mas Filho de Deus já é exagero.\"",a:"\"Concordo que ele foi bom. O problema é que um homem só bom não diria o que ele disse: que perdoa pecados, que existia antes de Abraão, que vai julgar o mundo. Se não fosse verdade, ele seria um mentiroso ou alguém fora da realidade, e nenhum dos dois é 'só um cara legal'. O que você acha dessas coisas que ele disse?\""},
 quiz:[
  {q:"Qual historiador romano registrou que Cristo foi executado sob Pôncio Pilatos?",o:["Heródoto","Tácito","Platão","Júlio César"],c:1,e:"Tácito, nos Anais 15.44, por volta de 116 d.C."},
  {q:"Em Jo 8.58, por que os ouvintes quiseram apedrejar Jesus?",o:["Porque ele quebrou o sábado","Porque usou para si o nome divino \"EU SOU\"","Porque criticou Roma","Porque não pagou impostos"],c:1,e:"\"EU SOU\" remete ao nome de Deus em Êxodo 3.14. Eles entenderam a afirmação de divindade."},
  {q:"Quais são as três opções do trilema de Lewis?",o:["Profeta, rei ou sacerdote","Mentiroso, lunático ou Senhor","Mestre, profeta ou lenda","Homem, anjo ou Deus"],c:1,e:"Quem afirma o que Jesus afirmou é mentiroso, lunático ou o Senhor."}
 ]},

d1:{title:"Trindade sem confusão",min:9,
 sum:"Um só Deus em três Pessoas: o que isso significa e quais erros evitar.",
 verse:{t:"Ide, portanto, fazei discípulos de todas as nações, batizando-os em nome do Pai, e do Filho, e do Espírito Santo.",r:"Mt 28.19"},
 body:`<p>A Trindade não é matemática confusa. É o retrato de quem Deus revelou ser. Repare em Mateus 28.19: "em <b>nome</b>", no singular, e três Pessoas.</p>
<h3>A definição em uma frase</h3>
<p>Há <b>um só Deus</b> (Dt 6.4), que existe eternamente em <b>três Pessoas</b>: Pai, Filho e Espírito Santo. As três são igualmente Deus, igualmente eternas, e não se confundem entre si.</p>
<div class="box">Fórmula para memorizar: <b>um "quê" e três "quem".</b> Um único ser divino (o quê) e três Pessoas (quem).</div>
<h3>Três erros que a igreja já rejeitou</h3>
<ul>
<li><b>Modalismo</b> (Sabélio, séc. III): Deus seria uma pessoa só, usando três "máscaras". Problema: no batismo de Jesus, o Filho está na água, o Espírito desce e o Pai fala do céu, ao mesmo tempo (Mt 3.16-17).</li>
<li><b>Arianismo</b> (Ário, séc. IV): o Filho seria a primeira criatura, não Deus. Rejeitado no Concílio de Niceia (325), que declarou o Filho <i>homoousios</i>, "da mesma substância" do Pai. "No princípio era o Verbo, e o Verbo estava com Deus, e o Verbo era Deus" (Jo 1.1). As Testemunhas de Jeová hoje repetem esse erro antigo.</li>
<li><b>Triteísmo</b>: três deuses separados. A Bíblia é clara: Deus é um só.</li>
</ul>
<h3>Cuidado com as analogias</h3>
<p>"A Trindade é como a água: gelo, líquido e vapor." Isso é modalismo, porque a mesma água muda de forma. "É como um ovo: casca, clara e gema." Isso divide Deus em partes, e cada Pessoa é Deus por inteiro. Melhor admitir: Deus é maior que qualquer comparação, mas a doutrina não é contraditória. Seria contradição dizer "um Deus e três Deuses" ou "uma pessoa e três pessoas". Não é isso que dizemos.</p>
<h3>Por que isso importa</h3>
<p>"Deus é amor" (1 Jo 4.8). Mas amor precisa de alguém para amar. Antes da criação, quem Deus amava? Na Trindade, o Pai, o Filho e o Espírito se amam desde a eternidade. Deus não criou você porque estava sozinho; criou para incluir você num amor que já existia.</p>`,
 pr:{q:"\"Trindade é contraditória. 1 + 1 + 1 = 3, não 1.\"",a:"\"Seria contraditório se a gente dissesse que Deus é um e três <b>no mesmo sentido</b>. Mas dizemos que ele é um em <b>ser</b> e três em <b>pessoas</b>. É como perguntar 'o que' e 'quem': um único ser divino, três quem. Não é soma; é a forma de existir de um ser que é maior do que nós. E faz sentido de 'Deus é amor': amor eterno precisa de relação eterna.\""},
 quiz:[
  {q:"Qual erro diz que Deus é uma pessoa só que aparece em três formas?",o:["Arianismo","Modalismo","Triteísmo","Gnosticismo"],c:1,e:"Modalismo: uma pessoa com três \"modos\" ou máscaras."},
  {q:"O que o Concílio de Niceia (325) afirmou sobre o Filho?",o:["Que é a primeira criatura","Que é homoousios, da mesma substância do Pai","Que é um anjo","Que só se tornou Deus na ressurreição"],c:1,e:"Homoousios: o Filho é plenamente Deus, da mesma substância do Pai, contra Ário."},
  {q:"Por que a analogia da água (gelo, líquido, vapor) é ruim?",o:["Porque ensina modalismo","Porque é científica demais","Porque divide Deus em partes","Porque é bíblica"],c:0,e:"A mesma água em formas diferentes é exatamente o que o modalismo ensina."}
 ]},

d2:{title:"A ressurreição: o fato central",min:11,
 sum:"O credo mais antigo, os fatos mínimos que até céticos aceitam e por que as teorias alternativas falham.",
 verse:{t:"E, se Cristo não ressuscitou, é vã a vossa fé, e ainda permaneceis nos vossos pecados.",r:"1 Co 15.17"},
 body:`<p>Paulo coloca tudo em jogo num único fato: se Jesus não ressuscitou, o cristianismo é falso. Nenhuma outra religião se arrisca assim. Isso significa que a fé cristã pode ser investigada.</p>
<h3>O credo mais antigo</h3>
<p>Em 1 Coríntios 15.3-7, Paulo passa adiante algo que ele "recebeu": Cristo morreu, foi sepultado, ressuscitou e apareceu a Pedro, aos Doze, a mais de quinhentos irmãos de uma vez, a Tiago e a todos os apóstolos. Muitos estudiosos, inclusive céticos, datam esse credo de <b>poucos anos depois da crucificação</b>. Isso é cedo demais para uma lenda.</p>
<h3>Os fatos mínimos</h3>
<p>O historiador Gary Habermas reuniu fatos aceitos pela grande maioria dos estudiosos, crentes ou não:</p>
<ol>
<li>Jesus morreu crucificado.</li>
<li>Os discípulos acreditaram sinceramente ter visto Jesus ressuscitado, e estavam dispostos a sofrer por isso.</li>
<li>Paulo, que perseguia a igreja, se converteu de repente.</li>
<li>Tiago, irmão de Jesus e cético (Jo 7.5), se converteu e virou líder da igreja.</li>
<li>O túmulo foi encontrado vazio (aceito pela maioria, embora não por todos).</li>
</ol>
<h3>As explicações alternativas não fecham</h3>
<ul>
<li><b>Roubaram o corpo:</b> então os discípulos morreram por uma mentira que eles mesmos inventaram. Gente morre por algo que acredita, não por algo que sabe ser falso.</li>
<li><b>Alucinação:</b> alucinações são individuais. Não explicam aparições em grupo, nem o túmulo vazio, nem a conversão de inimigos como Paulo.</li>
<li><b>Jesus só desmaiou:</b> soldados romanos eram especialistas em execução. E um homem meio morto não convenceria ninguém de que venceu a morte.</li>
<li><b>Túmulo errado:</b> bastava as autoridades mostrarem o túmulo certo com o corpo.</li>
</ul>
<h3>Um detalhe que ninguém inventaria</h3>
<p>As primeiras testemunhas foram <b>mulheres</b>. Naquela cultura, o testemunho de mulheres tinha pouco peso. Quem inventasse a história escolheria homens respeitados. Historiadores chamam isso de <b>critério do constrangimento</b>: detalhes que "atrapalham" a história tendem a ser verdadeiros.</p>`,
 pr:{q:"\"Ressurreição é impossível. Gente morta não volta.\"",a:"\"Concordo: por causas naturais, não volta. Ninguém está dizendo que Jesus voltou por causa natural. A questão é: se Deus existe, ressuscitar alguém é impossível? Só é impossível se você já decidiu antes que Deus não existe. Então vamos olhar os fatos que até historiadores céticos aceitam: a morte, o túmulo vazio, as aparições, a conversão de Paulo e de Tiago. Qual explicação dá conta de todos eles?\""},
 quiz:[
  {q:"Por que o credo de 1 Coríntios 15.3-7 é tão importante?",o:["Porque foi escrito por Lutero","Porque é datado de poucos anos após a crucificação, cedo demais para lenda","Porque não fala de ressurreição","Porque é de um historiador romano"],c:1,e:"Muitos estudiosos o datam de poucos anos após os eventos."},
  {q:"Qual destes NÃO é um dos fatos mínimos de Habermas?",o:["Jesus morreu crucificado","Paulo se converteu","Jesus nasceu em 25 de dezembro","Tiago, irmão cético de Jesus, se converteu"],c:2,e:"A data do nascimento não faz parte dos fatos mínimos e nem é conhecida com certeza."},
  {q:"Por que a teoria da alucinação falha?",o:["Porque alucinações são individuais e não explicam aparições em grupo nem o túmulo vazio","Porque ninguém tinha imaginação","Porque os romanos proibiram","Porque a Bíblia não fala de aparições"],c:0,e:"Não existe alucinação coletiva idêntica para 500 pessoas, e o túmulo continuaria cheio."},
  {q:"O que é o \"critério do constrangimento\"?",o:["Detalhes que atrapalham a história tendem a ser verdadeiros","Histórias vergonhosas devem ser apagadas","Só vale o que é aceito por todos","Evitar falar de religião em público"],c:0,e:"Ex.: mulheres como primeiras testemunhas; ninguém inventaria esse detalhe naquela cultura."}
 ]},

d3:{title:"Graça, fé e salvação",min:8,
 sum:"Justificação, santificação e a diferença entre graça verdadeira e graça barata.",
 verse:{t:"Justificados, pois, mediante a fé, temos paz com Deus por meio de nosso Senhor Jesus Cristo.",r:"Rm 5.1"},
 body:`<h3>Justificação: o veredito</h3>
<p>Justificar é um termo de tribunal: Deus <b>declara justo</b> o pecador. Não porque ele seja bom, mas porque a justiça de Cristo é creditada na conta dele (Rm 3.23-26). Na cruz houve uma troca: "Aquele que não conheceu pecado, ele o fez pecado por nós; para que nele fôssemos feitos justiça de Deus" (2 Co 5.21).</p>
<h3>Santificação: o caminho</h3>
<p>A justificação acontece de uma vez. A santificação é o processo de ficar parecido com Cristo ao longo da vida. "Desenvolvei a vossa salvação com temor e tremor, porque Deus é quem efetua em vós tanto o querer como o realizar" (Fp 2.12-13). Você se esforça <b>porque</b> Deus está agindo, não para convencê-lo a agir.</p>
<h3>Fé e obras não brigam</h3>
<p>Paulo diz que somos salvos pela fé, sem obras (Ef 2.8-9). Tiago diz que a fé sem obras é morta (Tg 2.17). Contradição? Não. Paulo fala da <b>raiz</b>: o que salva. Tiago fala do <b>fruto</b>: como se reconhece a fé verdadeira. Uma árvore viva dá frutos; os frutos não dão vida à árvore.</p>
<h3>Graça barata</h3>
<blockquote>"Graça barata é a graça sem discipulado, a graça sem a cruz, a graça sem Jesus Cristo vivo e encarnado."<cite>Dietrich Bonhoeffer, <i>Discipulado</i> (1937)</cite></blockquote>
<p>Bonhoeffer, pastor alemão, foi executado pelos nazistas em 1945. Ele sabia que a graça é de graça, mas não é barata: custou a vida do Filho de Deus, e chama você a seguir Jesus com tudo.</p>
<h3>Segurança</h3>
<p>"Agora, pois, já nenhuma condenação há para os que estão em Cristo Jesus" (Rm 8.1). Nada "poderá nos separar do amor de Deus" (Rm 8.38-39). Um jovem seguro disso não tem medo de rejeição: ele já foi aceito pelo único que importa.</p>`,
 pr:{q:"\"Então é só aceitar Jesus e fazer o que quiser depois?\"",a:"\"Não. A salvação é de graça, mas não é barata. Quem foi salvo de verdade passa a amar quem o salvou, e quem ama muda. As obras não compram o perdão; elas mostram que a fé é real. É como casamento: você não trabalha pra ganhar o 'sim', mas depois do 'sim' sua vida inteira muda.\""},
 quiz:[
  {q:"\"Justificação\" significa:",o:["Deus declarar justo o pecador com base na justiça de Cristo","Arranjar uma desculpa para o pecado","Ficar perfeito nesta vida","Fazer boas obras suficientes"],c:0,e:"É um veredito judicial: a justiça de Cristo é creditada a quem crê."},
  {q:"Como Paulo (Ef 2.8-9) e Tiago (Tg 2.17) se harmonizam?",o:["Não se harmonizam","Paulo fala da raiz que salva (fé); Tiago, do fruto que mostra a fé verdadeira (obras)","Tiago corrige Paulo","Paulo fala só dos judeus"],c:1,e:"Raiz e fruto: a fé salva; as obras provam que a fé é viva."},
  {q:"Quem escreveu sobre a \"graça barata\"?",o:["C. S. Lewis","Dietrich Bonhoeffer","Agostinho","Spurgeon"],c:1,e:"Bonhoeffer, em Discipulado (1937). Ele foi executado pelos nazistas em 1945."}
 ]},

d4:{title:"A história que te trouxe aqui",min:9,
 sum:"De Pentecostes à Reforma e às igrejas do Brasil: os marcos que você precisa saber.",
 verse:{t:"Jesus Cristo, ontem e hoje, é o mesmo e o será para sempre.",r:"Hb 13.8"},
 body:`<p>Quem não conhece a própria história é facilmente convencido de que ela é vergonhosa. Estes marcos te dão chão.</p>
<h3>Linha do tempo essencial</h3>
<ul>
<li><b>c. 30-33</b>: crucificação e ressurreição de Jesus. Pentecostes: nasce a igreja.</li>
<li><b>64</b>: Nero persegue cristãos em Roma. Pedro e Paulo morrem nessa época.</li>
<li><b>c. 155</b>: martírio de Policarpo, discípulo do apóstolo João.</li>
<li><b>313</b>: Edito de Milão: o cristianismo deixa de ser perseguido no Império.</li>
<li><b>325</b>: Concílio de Niceia: o Filho é plenamente Deus.</li>
<li><b>381</b>: Concílio de Constantinopla: completa o Credo Niceno, afirmando a divindade do Espírito Santo.</li>
<li><b>451</b>: Concílio de Calcedônia: Jesus é uma Pessoa com duas naturezas, plenamente Deus e plenamente homem.</li>
<li><b>31 de outubro de 1517</b>: Martinho Lutero publica as 95 teses. Começa a Reforma Protestante.</li>
<li><b>Séc. XVII-XVIII</b>: surgem os batistas; Wesley e o avivamento metodista.</li>
<li><b>1910-1911</b>: chegam ao Brasil a Congregação Cristã (1910) e a Assembleia de Deus (1911, Belém do Pará).</li>
</ul>
<h3>As cinco Solas da Reforma</h3>
<ul>
<li><b>Sola Scriptura</b>: só a Escritura é a autoridade final.</li>
<li><b>Sola Gratia</b>: salvação só pela graça.</li>
<li><b>Sola Fide</b>: recebida só pela fé.</li>
<li><b>Solus Christus</b>: só por meio de Cristo.</li>
<li><b>Soli Deo Gloria</b>: tudo para a glória de Deus.</li>
</ul>
<h3>Coragem que vem de longe</h3>
<p>Quando mandaram Policarpo, já idoso, amaldiçoar Cristo para escapar da morte, ele respondeu:</p>
<blockquote>"Há oitenta e seis anos eu o sirvo, e ele nunca me fez mal algum. Como posso blasfemar contra o meu Rei, que me salvou?"<cite><i>Martírio de Policarpo</i>, séc. II</cite></blockquote>
<p>Você faz parte dessa linhagem. A fé que chegou até você passou por gente que preferiu morrer a negá-la.</p>`,
 pr:{q:"\"O cristianismo só cresceu porque o imperador Constantino impôs.\"",a:"\"Na verdade, ele cresceu quase 300 anos <b>debaixo de perseguição</b> antes de Constantino. Os cristãos eram presos, jogados às feras, e mesmo assim se multiplicavam, porque cuidavam dos doentes, adotavam bebês abandonados e morriam sem negar a fé. Constantino chegou depois que a igreja já estava em todo o Império.\""},
 quiz:[
  {q:"O que o Concílio de Calcedônia (451) definiu?",o:["A lista dos livros da Bíblia","Jesus é uma Pessoa com duas naturezas, divina e humana","O batismo infantil","O fim das perseguições"],c:1,e:"Plenamente Deus e plenamente homem, numa única Pessoa."},
  {q:"Em que data Lutero publicou as 95 teses?",o:["25 de dezembro de 1500","31 de outubro de 1517","7 de setembro de 1822","1º de janeiro de 1600"],c:1,e:"31 de outubro de 1517, hoje lembrado como Dia da Reforma."},
  {q:"Qual Sola afirma que a Escritura é a autoridade final?",o:["Sola Fide","Sola Gratia","Sola Scriptura","Soli Deo Gloria"],c:2,e:"Sola Scriptura: tradição e líderes são submetidos à Bíblia."},
  {q:"Quando a Assembleia de Deus chegou ao Brasil?",o:["1822, no Rio","1911, em Belém do Pará","1950, em São Paulo","1517, na Bahia"],c:1,e:"Em 1911, em Belém do Pará, com os missionários Daniel Berg e Gunnar Vingren."}
 ]},

a1:{title:"Se Deus é bom, por que o mal?",min:11,
 sum:"O problema lógico, o problema emocional e por que a cruz muda a pergunta.",
 verse:{t:"Vós, na verdade, intentastes o mal contra mim; porém Deus o tornou em bem.",r:"Gn 50.20"},
 body:`<p>Esta é a objeção mais forte e mais pessoal contra a fé. Leve-a a sério. Mas saiba que existem <b>dois problemas diferentes</b> aqui.</p>
<h3>O problema lógico</h3>
<p>"Um Deus bom e todo-poderoso não permitiria o mal. O mal existe. Logo, esse Deus não existe." O filósofo Alvin Plantinga (<i>God, Freedom and Evil</i>, 1974) mostrou que não há contradição: Deus pode ter boas razões para permitir o mal, por exemplo, criar seres <b>realmente livres</b>, capazes de amar. Amor forçado não é amor. Hoje, muitos filósofos ateus admitem que a versão lógica do problema foi respondida.</p>
<h3>O mal aponta para Deus</h3>
<p>Para chamar algo de "mal", você precisa de um padrão de bem. Se não há Deus, o que chamamos de mal é só a natureza seguindo seu curso. O ateu Richard Dawkins admitiu isso: num universo sem Deus não há "nenhum mal e nenhum bem, nada além de uma indiferença cega e impiedosa" (<i>O rio que saía do Éden</i>, 1995). A indignação diante do mal faz mais sentido num mundo criado por um Deus bom.</p>
<h3>Deus não ficou de longe</h3>
<p>O cristianismo é a única fé em que Deus <b>entra</b> no sofrimento. Jesus chorou diante do túmulo de Lázaro (Jo 11.35), foi traído, torturado e morto. Qualquer que seja a razão pela qual Deus permite o mal, não é indiferença. A cruz prova isso.</p>
<blockquote>"Deus sussurra em nossos prazeres, fala em nossa consciência, mas grita em nossas dores: elas são o seu megafone para despertar um mundo surdo."<cite>C. S. Lewis, <i>O problema do sofrimento</i> (1940)</cite></blockquote>
<h3>O fim da história</h3>
<p>José foi vendido pelos irmãos, mas Deus transformou aquilo em salvação para muitos (Gn 50.20). Nem sempre veremos o porquê nesta vida. Mas a história termina com Deus enxugando "dos olhos toda lágrima" (Ap 21.4).</p>
<h3>Quando a dor é de verdade</h3>
<div class="box r">Se um amigo está de luto, <b>não comece com argumentos</b>. Os amigos de Jó acertaram nos primeiros sete dias, quando ficaram em silêncio ao lado dele (Jó 2.13), e erraram quando começaram a explicar. "Chorai com os que choram" (Rm 12.15). Presença primeiro, filosofia depois.</div>`,
 pr:{q:"\"Se Deus existe, por que deixa criança morrer de câncer?\"",a:"\"Essa pergunta também me dói. Eu não sei o porquê de cada caso. Mas repara: se não existe Deus, a morte de uma criança não é 'injusta', é só biologia. A gente sente que é errado porque sabe que o mundo não deveria ser assim. A Bíblia concorda: o mundo está quebrado. E Deus não ficou assistindo: ele entrou na dor, morreu numa cruz e prometeu acabar com a morte. Sem Deus, há sofrimento sem esperança. Com ele, há sofrimento com esperança.\""},
 quiz:[
  {q:"Qual a diferença entre o problema lógico e o emocional do mal?",o:["Não há diferença","O lógico alega contradição; o emocional é a dor real de quem sofre","O lógico é para crianças","O emocional só afeta ateus"],c:1,e:"Um pede argumento; o outro pede presença e cuidado."},
  {q:"Qual filósofo é conhecido pela defesa do livre-arbítrio diante do problema lógico do mal?",o:["Nietzsche","Alvin Plantinga","Karl Marx","Sartre"],c:1,e:"Alvin Plantinga, em God, Freedom and Evil (1974)."},
  {q:"Como o mal pode apontar PARA Deus?",o:["Porque Deus cria o mal","Porque chamar algo de mal exige um padrão objetivo de bem","Porque o mal é ilusão","Porque só cristãos sofrem"],c:1,e:"Sem um padrão de bem, \"mal\" vira só preferência ou natureza."},
  {q:"Com um amigo de luto, o que fazer primeiro?",o:["Explicar a defesa do livre-arbítrio","Dizer que tudo tem um motivo","Estar presente e chorar junto","Recomendar um livro de apologética"],c:2,e:"Rm 12.15 e Jó 2.13: presença antes de argumentos."}
 ]},

a2:{title:"Fé e ciência não são inimigas",min:10,
 sum:"Os cristãos que fundaram a ciência, os mitos do conflito e o erro do cientificismo.",
 verse:{t:"Os céus proclamam a glória de Deus, e o firmamento anuncia as obras das suas mãos.",r:"Sl 19.1"},
 body:`<h3>A ciência moderna nasceu entre cristãos</h3>
<p>Kepler, Galileu, Boyle, Pascal, Newton, Faraday e Maxwell eram crentes. <b>Gregor Mendel</b>, pai da genética, era monge. <b>Georges Lemaître</b>, que propôs a teoria do Big Bang, era padre. <b>Francis Collins</b>, que liderou o Projeto Genoma Humano, é cristão e escreveu <i>A linguagem de Deus</i> (2006).</p>
<p>Isso não é coincidência. Eles acreditavam que o universo foi criado por um Deus racional e, por isso, seria <b>ordenado e compreensível</b>. Vale a pena investigá-lo. É a base de toda ciência.</p>
<h3>Mitos que você vai ouvir</h3>
<ul>
<li><b>"Na Idade Média achavam que a Terra era plana."</b> Falso. Os estudiosos medievais sabiam que a Terra é esférica. O mito foi popularizado no século XIX, em parte por uma biografia romanceada de Colombo escrita por Washington Irving (1828).</li>
<li><b>"O caso Galileu prova que a fé odeia a ciência."</b> O caso envolveu política, personalidade e a física da época, que ainda não tinha provas decisivas. Houve erro das autoridades da Igreja, mas Galileu morreu crente e via a ciência como leitura do "livro da natureza" escrito por Deus.</li>
</ul>
<h3>O erro do cientificismo</h3>
<p>Cientificismo é a ideia de que "só a ciência produz conhecimento verdadeiro". Mas essa frase <b>não pode ser provada pela ciência</b>: nenhum experimento a testa. Ela se derruba sozinha. Além disso, a ciência pressupõe coisas que não prova: que a lógica funciona, que a natureza é uniforme, que devemos ser honestos nos dados.</p>
<h3>Ciência responde "como"; a fé responde "por quê"</h3>
<p>Explicar como um motor funciona não elimina o engenheiro que o projetou. Descrever as leis da física não responde por que existem leis, nem por que algo existe em vez de nada.</p>
<div class="box">Sobre a idade da Terra e a leitura de Gênesis 1, cristãos fiéis à Bíblia divergem (criacionismo de Terra jovem, de Terra antiga e outras visões). Conheça os argumentos de cada lado e não faça disso o centro da conversa com quem nem crê em Deus ainda. Comece pelo essencial: Deus criou, e Cristo ressuscitou.</div>`,
 pr:{q:"\"Eu acredito na ciência, não em religião.\"",a:"\"Eu também acredito na ciência! Os caras que fundaram a ciência moderna, Newton, Kepler, Pascal, Mendel, eram cristãos. Eles estudavam a natureza justamente porque criam num Criador racional. Agora, quando você diz 'só acredito no que a ciência prova', isso a ciência consegue provar? Não. É uma crença filosófica, assim como a minha.\""},
 quiz:[
  {q:"Quem propôs a teoria que ficou conhecida como Big Bang?",o:["Stephen Hawking","Georges Lemaître, físico e padre","Charles Darwin","Albert Einstein"],c:1,e:"Lemaître, em 1927 e 1931."},
  {q:"Por que o cientificismo se autorrefuta?",o:["Porque a ciência está sempre errada","Porque a frase \"só a ciência produz conhecimento\" não pode ser provada cientificamente","Porque cientistas são religiosos","Porque a Bíblia proíbe"],c:1,e:"É uma afirmação filosófica que nega o valor de afirmações filosóficas."},
  {q:"Os estudiosos medievais acreditavam que a Terra era plana?",o:["Sim, todos","Não, sabiam que era esférica; o mito surgiu no século XIX","Só os monges","Só até o ano 1000"],c:1,e:"É um mito moderno, popularizado no século XIX."}
 ]},

a3:{title:"\"Cada um tem sua verdade\"?",min:9,
 sum:"Relativismo, tolerância verdadeira e duas perguntas que mudam qualquer conversa.",
 verse:{t:"Respondeu-lhe Jesus: Eu sou o caminho, e a verdade, e a vida; ninguém vem ao Pai senão por mim.",r:"Jo 14.6"},
 body:`<h3>A frase que se derruba sozinha</h3>
<p>"Não existe verdade absoluta." Essa frase é absolutamente verdadeira? Se for, ela mesma é uma verdade absoluta, e se contradiz. Se não for, por que eu deveria aceitá-la? O relativismo <b>serra o galho em que está sentado</b>.</p>
<p>Na prática, ninguém vive como relativista. Quem diz "cada um tem sua verdade" não aceita que o banco tenha "a verdade dele" sobre o saldo de sua conta.</p>
<h3>Tolerância de verdade</h3>
<p>Hoje "tolerância" virou "concordar com tudo". Mas tolerar significa <b>suportar aquilo de que você discorda</b>. Só se tolera o que se considera errado. Tolerância real é: discordo de você, e mesmo assim respeito você e seu direito de falar. Isso é coerente com a fé: Deus ama pessoas que discordam dele.</p>
<h3>Toda visão é exclusiva</h3>
<p>"Cristãos são arrogantes por dizer que Jesus é o único caminho." Mas a frase "todas as religiões levam a Deus" também é exclusiva: exclui quem crê que elas não levam, incluindo budistas, muçulmanos e cristãos. A história dos cegos e do elefante (cada um toca uma parte e acha que conhece o todo) só funciona porque o narrador afirma ver o elefante inteiro. Quem conta a história está reivindicando a visão completa que nega aos outros.</p>
<h3>As duas perguntas de Colombo</h3>
<p>O apologista Greg Koukl (<i>Táticas</i>) ensina a usar perguntas em vez de discursos:</p>
<ol>
<li><b>"O que você quer dizer com isso?"</b> Esclarece o que a pessoa realmente pensa (muitas vezes, nem ela sabe).</li>
<li><b>"Como você chegou a essa conclusão?"</b> Transfere o ônus da prova para quem afirmou.</li>
</ol>
<div class="box">Perguntas tiram a pressão de você. Quem pergunta conduz a conversa sem precisar saber todas as respostas.</div>
<p>Diante de Jesus, Pilatos perguntou com desdém: "Que é a verdade?" (Jo 18.38). A Verdade estava em pé na frente dele.</p>`,
 pr:{q:"\"Isso é verdade pra você, mas não pra mim.\"",a:"\"Hmm, o que você quer dizer com isso? Porque tem coisas que são assim, tipo 'sorvete de flocos é o melhor', isso é gosto. Mas Jesus ter ressuscitado ou não é um fato histórico: ou aconteceu, ou não. Não pode ser verdade pra mim e mentira pra você. Se ele ressuscitou, é verdade pra nós dois. Vale a gente investigar se aconteceu, né?\""},
 quiz:[
  {q:"Por que \"não existe verdade absoluta\" é autorrefutante?",o:["Porque é uma afirmação que se apresenta como verdade absoluta","Porque é muito longa","Porque é científica","Porque é bíblica"],c:0,e:"Ela pretende ser absolutamente verdadeira enquanto nega que isso exista."},
  {q:"Segundo a lição, tolerância verdadeira é:",o:["Concordar com todas as opiniões","Respeitar a pessoa e seu direito de falar mesmo discordando dela","Nunca falar de religião","Aceitar tudo para evitar briga"],c:1,e:"Só se tolera aquilo de que se discorda."},
  {q:"Quais são as duas perguntas de Colombo (Greg Koukl)?",o:["\"Você vai à igreja?\" e \"Você lê a Bíblia?\"","\"O que você quer dizer com isso?\" e \"Como chegou a essa conclusão?\"","\"Você já pecou?\" e \"Quer aceitar Jesus?\"","\"Quem criou Deus?\" e \"Por que o mal?\""],c:1,e:"Esclarecer o significado e pedir as razões."}
 ]},

a4:{title:"Moral sem Deus se sustenta?",min:9,
 sum:"Por que direitos humanos e dignidade têm raiz cristã, e o que acontece quando ela é cortada.",
 verse:{t:"Porquanto, quando, pois, os gentios, que não têm lei, procedem, por natureza, de conformidade com a lei... mostram a norma da lei gravada no seu coração.",r:"Rm 2.14-15"},
 body:`<h3>Duas perguntas diferentes</h3>
<p>"Um ateu pode ser bom?" Claro que sim. A Bíblia diz que a lei moral está gravada no coração de todos (Rm 2.15). Essa é uma pergunta sobre <b>conhecer</b> o bem. A pergunta real é outra: <b>o que faz o bem ser bem?</b> Sem Deus, de onde vem a obrigação moral?</p>
<h3>As opções sem Deus</h3>
<ul>
<li><b>Evolução:</b> explicaria por que sentimos certas coisas, não por que elas são certas. Se a moral é só instinto de sobrevivência, a crueldade que "funciona" seria justificável.</li>
<li><b>Cultura ou maioria:</b> então a escravidão era certa quando a maioria a aceitava, e os abolicionistas estavam errados. Ninguém aceita isso.</li>
<li><b>Preferência pessoal:</b> então "não torture inocentes" vale tanto quanto "não gosto de jiló".</li>
</ul>
<h3>Nietzsche entendeu</h3>
<p>Friedrich Nietzsche, ateu, anunciou que "Deus está morto" (<i>A gaia ciência</i>, 1882) e percebeu que a moral cristã não sobreviveria sem o Deus cristão. Ele não achava que bastava tirar Deus e manter a compaixão. O século XX, com regimes que rejeitaram Deus e mataram dezenas de milhões, mostrou o preço de cortar a raiz.</p>
<h3>De onde vêm os direitos humanos</h3>
<p>A ideia de que todo ser humano tem dignidade igual e inviolável não é óbvia na história. Ela vem da convicção bíblica de que somos criados à <b>imagem de Deus</b>. A Declaração de Independência dos EUA (1776) diz que os homens são "dotados pelo seu Criador" de direitos inalienáveis. Tire o Criador e esses direitos viram concessão do Estado, que pode retirá-los.</p>
<h3>O "Tao" de C. S. Lewis</h3>
<p>Em <i>A abolição do homem</i> (1943), Lewis mostrou que culturas antigas do mundo inteiro (babilônios, chineses, gregos, hebreus, nórdicos) compartilham uma lei moral comum: honrar pais, não matar inocentes, ser justo. Ele alertou que uma educação que trata valores como meros sentimentos forma "homens sem peito": gente que sabe pensar, mas não tem coragem moral.</p>`,
 pr:{q:"\"Eu não preciso de Deus para ser uma pessoa boa.\"",a:"\"Concordo que você pode ser boa pessoa sem crer em Deus. Conheço ateus mais gentis que muito crente. Minha pergunta é outra: se não existe Deus, o que faz a bondade ser obrigatória? Se tudo é matéria e acaso, quem diz que ser bom é melhor do que ser cruel, se a crueldade me beneficiar? Eu acho que você sente que o bem é real. Eu também. Só acho que isso aponta para alguém por trás dele.\""},
 quiz:[
  {q:"Qual é a pergunta central do argumento moral?",o:["Se ateus conseguem ser bons","O que fundamenta o bem e o dever moral","Se religiosos são melhores","Se a moral deve ser lei"],c:1,e:"Não é sobre comportamento, e sim sobre o fundamento."},
  {q:"Se a moral fosse decidida pela maioria, o que se concluiria sobre a escravidão?",o:["Que sempre foi errada","Que era certa enquanto a maioria a aceitava, e os abolicionistas estavam errados","Que nunca existiu","Que é questão de gosto"],c:1,e:"Essa conclusão absurda mostra que a moral não depende da maioria."},
  {q:"Em A abolição do homem, Lewis chamou os produtos de uma educação sem valores objetivos de:",o:["Homens sem cabeça","Homens sem peito","Homens de barro","Homens livres"],c:1,e:"\"Homens sem peito\": razão sem coragem moral."}
 ]},

c1:{title:"Cosmovisão: as lentes que todo mundo usa",min:9,
 sum:"Quatro perguntas que revelam a cosmovisão de qualquer pessoa e as alternativas que disputam sua geração.",
 verse:{t:"E não vos conformeis com este século, mas transformai-vos pela renovação da vossa mente.",r:"Rm 12.2"},
 body:`<p>Cosmovisão é o conjunto de convicções pelas quais você enxerga tudo. Todo mundo tem uma, inclusive quem diz não ter. Ela aparece nas respostas a quatro perguntas:</p>
<ol><li><b>Origem:</b> de onde viemos?</li><li><b>Sentido:</b> por que estamos aqui?</li><li><b>Moral:</b> como devemos viver?</li><li><b>Destino:</b> para onde vamos?</li></ol>
<h3>As concorrentes</h3>
<ul>
<li><b>Naturalismo:</b> só existe matéria. Origem: acaso. Sentido: nenhum, a não ser o que você inventa. Destino: o nada.</li>
<li><b>Pós-modernismo:</b> não há verdade, só narrativas e disputas de poder. Toda afirmação de verdade é vista como tentativa de dominar.</li>
<li><b>Consumismo e hedonismo:</b> a vida é sobre prazer, imagem e experiências. O sentido vira o próximo produto ou a próxima curtida.</li>
<li><b>Ideologias que viram religião:</b> projetos políticos que prometem salvação pelo Estado ou pela revolução, com seus próprios "pecados", "santos" e "hereges". O século XX mostrou aonde as utopias que se colocam no lugar de Deus podem chegar.</li>
</ul>
<h3>A resposta cristã às quatro perguntas</h3>
<p><b>Origem:</b> Deus nos criou à sua imagem. <b>Sentido:</b> conhecer e amar a Deus e ao próximo, e cuidar da criação. <b>Moral:</b> refletir o caráter de Deus revelado nas Escrituras. <b>Destino:</b> ressurreição e nova criação em Cristo.</p>
<blockquote>"Não há um centímetro quadrado em todo o domínio da existência humana sobre o qual Cristo, que é soberano sobre tudo, não clame: 'É meu!'"<cite>Abraham Kuyper, teólogo e primeiro-ministro da Holanda (1880)</cite></blockquote>
<p>Kuyper foi pastor, jornalista, fundador de universidade e chefe de governo. Fé cristã não é assunto só de domingo: ela tem algo a dizer sobre escola, trabalho, arte, ciência e política.</p>
<div class="box">Exercício: pegue a letra de uma música, um filme ou uma série de que você gosta e responda às quatro perguntas a partir dela. Você vai começar a ver as cosmovisões em tudo.</div>
<p>"Cuidado que ninguém vos venha a enredar com sua filosofia e vãs sutilezas, conforme a tradição dos homens" (Cl 2.8).</p>`,
 pr:{q:"\"Eu não tenho cosmovisão nenhuma, só vivo minha vida.\"",a:"\"Todo mundo tem, mesmo sem dar nome. Me diz: você acha que sua vida tem algum propósito, ou é tudo acaso? Acha que existe certo e errado de verdade? O que acontece quando a gente morre? Suas respostas a isso são sua cosmovisão. A minha começa com Deus. A sua começa com o quê?\""},
 quiz:[
  {q:"Quais são as quatro perguntas de cosmovisão?",o:["Quem, quando, onde, quanto","Origem, sentido, moral e destino","Igreja, família, escola e trabalho","Passado, presente, futuro e eternidade"],c:1,e:"De onde viemos, por que estamos aqui, como viver e para onde vamos."},
  {q:"Qual cosmovisão diz que só existe matéria?",o:["Teísmo","Naturalismo","Pós-modernismo","Panteísmo"],c:1,e:"Naturalismo: tudo é matéria, energia e acaso."},
  {q:"A frase do \"centímetro quadrado\" é de quem?",o:["Calvino","Abraham Kuyper","C. S. Lewis","Billy Graham"],c:1,e:"Abraham Kuyper, em 1880, na fundação da Universidade Livre de Amsterdã."}
 ]},

c2:{title:"Vida humana: imagem de Deus",min:9,
 sum:"Dignidade da vida da concepção à morte natural, com argumentos, ciência e compaixão.",
 verse:{t:"Pois tu formaste o meu interior, tu me teceste no seio de minha mãe. Graças te dou, visto que por modo assombrosamente maravilhoso me formaste.",r:"Sl 139.13-14"},
 body:`<h3>O fundamento</h3>
<p>Todo ser humano é criado à imagem de Deus (Gn 1.27). Por isso, tirar a vida de um inocente é grave (Gn 9.6). A Bíblia trata a vida no ventre como pessoa conhecida por Deus: "Antes que eu te formasse no ventre materno, eu te conheci" (Jr 1.5). João Batista "estremeceu" no ventre de Isabel ao ouvir a saudação de Maria (Lc 1.41).</p>
<h3>O que a ciência mostra</h3>
<p>A embriologia ensina que, na concepção, surge um novo organismo humano, com DNA próprio, distinto do pai e da mãe. Por volta da sexta semana de gestação já se detecta atividade cardíaca. A questão não é se aquilo é vida humana (é), mas se <b>toda vida humana tem valor</b>.</p>
<h3>Um argumento simples (SLED)</h3>
<p>As diferenças entre um embrião e você são de quatro tipos, e nenhuma muda o valor de alguém:</p>
<ul>
<li><b>Tamanho:</b> uma criança é menor que um adulto e não vale menos.</li>
<li><b>Nível de desenvolvimento:</b> uma menina de 4 anos é menos desenvolvida que uma mulher de 20.</li>
<li><b>Ambiente:</b> atravessar 20 centímetros pelo canal de parto não muda quem você é.</li>
<li><b>Dependência:</b> quem depende de insulina ou de aparelhos não perde direitos.</li>
</ul>
<h3>Cristãos sempre foram assim</h3>
<p>No Império Romano, era comum abandonar bebês indesejados para morrer. A <i>Didaqué</i>, manual cristão do século I ou II, ordena: "Não matarás a criança por aborto, nem a matarás depois de nascida". Cristãos resgatavam e criavam esses bebês. Depois vieram hospitais, orfanatos e asilos.</p>
<h3>Pró-vida de verdade</h3>
<ul>
<li>É defender o bebê <b>e</b> cuidar da mãe: apoio a gestantes em crise, adoção, ajuda concreta.</li>
<li>É defender o idoso e o doente contra a pressão da eutanásia, e a pessoa com deficiência contra o descarte.</li>
</ul>
<div class="box r">Fale sempre com graça. Alguém perto de você pode já ter passado por um aborto. A mensagem para essa pessoa é Romanos 8.1: "nenhuma condenação há para os que estão em Cristo Jesus". Há perdão completo.</div>`,
 pr:{q:"\"Meu corpo, minhas regras.\"",a:"\"Eu concordo que seu corpo é seu, e ninguém deveria mandar nele. A questão é se existe <b>outro corpo</b> ali. O bebê tem DNA próprio, coração próprio, às vezes outro tipo sanguíneo e outro sexo. Se é outro ser humano, a pergunta deixa de ser só sobre o seu corpo. E eu acho que a gente deveria cuidar dos dois: da mãe e do filho.\""},
 quiz:[
  {q:"O que a embriologia mostra que surge na concepção?",o:["Um aglomerado sem identidade","Um novo organismo humano com DNA próprio","Uma parte do corpo da mãe","Nada mensurável"],c:1,e:"Um novo organismo humano, distinto do pai e da mãe."},
  {q:"No argumento SLED, as letras representam:",o:["Saúde, Lei, Educação, Direito","Tamanho, nível de desenvolvimento, ambiente e dependência (em inglês: Size, Level, Environment, Degree)","Sexo, Local, Estado, Data","Sangue, Lugar, Época, Destino"],c:1,e:"Size, Level of development, Environment, Degree of dependency."},
  {q:"O que a Didaqué (séc. I-II) ensinava?",o:["Nada sobre crianças","Não matarás a criança por aborto, nem depois de nascida","Que o aborto era permitido até certo mês","Que só os pais decidem"],c:1,e:"Os primeiros cristãos se destacavam por proteger crianças."},
  {q:"Como falar com alguém que já passou por um aborto?",o:["Com condenação, para que se arrependa","Evitar a pessoa","Com graça: em Cristo há perdão completo (Rm 8.1)","Dizer que não foi nada"],c:2,e:"Verdade e graça andam juntas."}
 ]},

c3:{title:"Família, corpo e identidade",min:10,
 sum:"O desenho de Deus para a sexualidade, sua identidade em Cristo e como falar com verdade e amor.",
 verse:{t:"E o Verbo se fez carne e habitou entre nós, cheio de graça e de verdade.",r:"Jo 1.14"},
 body:`<h3>O desenho original</h3>
<p>"Criou Deus o homem à sua imagem... homem e mulher os criou" (Gn 1.27). "Por isso, deixa o homem pai e mãe e se une à sua mulher, tornando-se os dois uma só carne" (Gn 2.24). Quando perguntaram a Jesus sobre casamento, ele citou exatamente esses textos (Mt 19.4-6). O casamento entre homem e mulher não é invenção cultural da igreja: é o desenho do Criador.</p>
<h3>Sexualidade é dádiva, não ídolo</h3>
<p>O sexo é bom, criado por Deus, e tem lugar: a aliança do casamento. A cultura transformou o desejo em identidade e em direito absoluto. A Bíblia diz que seu corpo é "santuário do Espírito Santo" e que você foi "comprado por preço" (1 Co 6.18-20). Seu corpo importa para Deus.</p>
<h3>Sua identidade não é o seu desejo</h3>
<p>A cultura diz: "você é o que sente; siga seu coração". A Bíblia diz que o coração é enganoso (Jr 17.9) e que sua identidade mais profunda é dada por Deus: "se alguém está em Cristo, é nova criatura" (2 Co 5.17). Todo cristão luta com desejos que não deve seguir. A luta não define você; Cristo define.</p>
<h3>Família: os "pequenos pelotões"</h3>
<p>O pensador conservador Edmund Burke chamou a família e as comunidades próximas de "pequenos pelotões" da sociedade: é ali que primeiro aprendemos a amar, servir e obedecer. Uma sociedade que enfraquece a família acaba entregando ao Estado funções que ele faz muito pior. Honrar pai e mãe (Êx 20.12) é o primeiro mandamento com promessa.</p>
<h3>Uma luta real: pornografia</h3>
<p>Ela distorce a visão do outro e do sexo e vicia. Saída prática: luz (conte a alguém maduro), prestação de contas, filtros, e lembrar que a graça de Deus é maior que sua queda (1 Jo 1.9).</p>
<h3>Graça E verdade</h3>
<p>Jesus foi "cheio de graça e de verdade" (Jo 1.14). Para a mulher pega em adultério ele disse as duas coisas: "Nem eu tampouco te condeno; vai e não peques mais" (Jo 8.11). Graça sem verdade é bajulação; verdade sem graça é crueldade.</p>
<div class="box">Seja amigo de quem pensa diferente, inclusive de pessoas LGBT. Firmeza nas convicções nunca autoriza desprezo, piada ou humilhação. Você pode discordar profundamente e amar profundamente, como Jesus.</div>`,
 pr:{q:"\"Sua igreja é homofóbica por não aceitar casamento gay.\"",a:"\"Eu entendo por que parece isso, e infelizmente tem cristão que trata mal as pessoas, o que é errado. Mas discordar de alguém não é odiar. Eu creio que Deus desenhou o casamento entre homem e mulher, porque Jesus disse isso em Mateus 19. Ao mesmo tempo, creio que todo ser humano tem dignidade, e eu também tenho desejos que Deus me pede para não seguir. Posso discordar de você e ser seu amigo. Você consegue fazer o mesmo comigo?\""},
 quiz:[
  {q:"Quando perguntado sobre casamento, que textos Jesus citou (Mt 19.4-6)?",o:["Levítico 18","Gênesis 1.27 e 2.24","Cantares","Nenhum"],c:1,e:"Jesus voltou ao desenho da criação: homem e mulher, uma só carne."},
  {q:"Segundo a lição, onde está a identidade mais profunda do cristão?",o:["Nos seus desejos","Na opinião dos amigos","Em Cristo (2 Co 5.17)","Na sua aparência"],c:2,e:"Nova criatura em Cristo; a luta não te define."},
  {q:"Quem chamou a família de \"pequenos pelotões\" da sociedade?",o:["Karl Marx","Edmund Burke","Rousseau","Nietzsche"],c:1,e:"Edmund Burke, em Reflexões sobre a Revolução na França (1790)."},
  {q:"\"Graça sem verdade é ____; verdade sem graça é ____.\"",o:["fraqueza / força","bajulação / crueldade","amor / justiça","fácil / difícil"],c:1,e:"Jesus uniu as duas (Jo 1.14; Jo 8.11)."}
 ]},

c4:{title:"Fé em público: liberdade e coragem",min:10,
 sum:"Seus direitos, seus deveres e como se posicionar na escola, na faculdade e nas redes.",
 verse:{t:"Antes, santificai a Cristo, como Senhor, em vosso coração, estando sempre preparados para responder a todo aquele que vos pedir razão da esperança que há em vós, fazendo-o, todavia, com mansidão e temor.",r:"1 Pe 3.15"},
 body:`<p>A palavra "responder" em 1 Pedro 3.15 é, em grego, <b>apologia</b>: uma defesa racional, como num tribunal. É daí que vem o nome deste app. Repare que Pedro pede duas coisas: <b>preparo</b> e <b>mansidão</b>. Firmeza não é grosseria.</p>
<h3>Seus direitos no Brasil</h3>
<ul>
<li>"É inviolável a liberdade de consciência e de crença, sendo assegurado o livre exercício dos cultos religiosos" (Constituição Federal, art. 5º, VI).</li>
<li>"Ninguém será privado de direitos por motivo de crença religiosa ou de convicção filosófica ou política" (art. 5º, VIII).</li>
<li>A livre manifestação do pensamento também é garantida (art. 5º, IV).</li>
</ul>
<p>Você tem o direito de expressar sua fé com respeito na escola, na faculdade e no trabalho. Conhecer isso tira o medo.</p>
<h3>Autoridade e limite</h3>
<p>O cristão respeita as autoridades (Rm 13.1): professor, diretor, governo. Mas quando uma autoridade manda negar a Cristo, vale Atos 5.29: "Antes, importa obedecer a Deus do que aos homens". Daniel continuou orando com a janela aberta (Dn 6.10), sem desrespeitar o rei, e sem obedecê-lo naquilo.</p>
<h3>Na sala de aula</h3>
<ul>
<li>Seja o aluno mais educado e esforçado da sala. Excelência abre ouvidos.</li>
<li>Discordou? Pergunte com respeito: "Professor, qual a fonte disso?" ou "Como os críticos dessa visão respondem?".</li>
<li>Não tente vencer a discussão e perder a pessoa.</li>
<li>Em trabalhos e redações, você pode argumentar a partir da sua cosmovisão, com fontes e boa lógica.</li>
</ul>
<h3>Nas redes</h3>
<p>Antes de postar ou comentar, três perguntas: <b>É verdade? É necessário? Edifica?</b> (Ef 4.29). Confira antes de compartilhar: espalhar notícia falsa é dar falso testemunho (Êx 20.16). Não entre em briga de comentários com quem só quer plateia. Uma conversa sincera em particular vale mais que cem respostas lacradoras.</p>
<h3>Coragem com exemplos</h3>
<p><b>William Wilberforce</b>, cristão evangélico, dedicou a vida no Parlamento britânico a acabar com o tráfico de escravos (proibido em 1807) e com a própria escravidão no Império Britânico (1833). Fé levada a sério muda nações.</p>
<div class="box">Regra de ouro: <b>convicção firme, tom manso, vida coerente.</b> As pessoas podem discutir seus argumentos, mas têm dificuldade de discutir uma vida transformada.</div>`,
 pr:{q:"O professor diz na frente da turma: \"Religião é coisa de gente sem estudo\".",a:"Levante a mão com calma: \"Professor, posso fazer uma observação? Newton, Pascal, Mendel e Lemaître, que propôs o Big Bang, eram homens de fé e de muito estudo. Hoje há filósofos como Alvin Plantinga e cientistas como Francis Collins que são cristãos. Talvez o mais justo seja dizer que existem pessoas estudadas dos dois lados. O senhor concorda?\" Respeitoso, informado, sem ataque pessoal."},
 quiz:[
  {q:"Qual a palavra grega por trás de \"responder\" em 1 Pe 3.15?",o:["Ágape","Apologia","Kerigma","Logos"],c:1,e:"Apologia: uma defesa racional, como num tribunal."},
  {q:"Qual inciso do art. 5º da Constituição garante a liberdade de consciência e de crença?",o:["Inciso I","Inciso VI","Inciso XX","Não existe"],c:1,e:"Art. 5º, VI. O inciso VIII proíbe privar alguém de direitos por motivo de crença."},
  {q:"Quando uma autoridade manda negar a Cristo, qual texto orienta o cristão?",o:["Rm 13.1, obedecer sempre","At 5.29, importa obedecer a Deus antes que aos homens","Nenhum","Ec 3.1"],c:1,e:"Respeitamos as autoridades, mas não acima de Deus."},
  {q:"Quais as três perguntas antes de postar?",o:["Vai viralizar? Vai lacrar? Vai irritar?","É verdade? É necessário? Edifica?","Quem postou? Quando? Onde?","É curto? É bonito? É engraçado?"],c:1,e:"Baseadas em Ef 4.29 e no mandamento contra o falso testemunho."}
 ]}
};

 {id:"v1",cat:"Versículo",f:"1 Pedro 3.15",b:"\"Santificai a Cristo, como Senhor, em vosso coração, estando sempre preparados para responder a todo aquele que vos pedir razão da esperança que há em vós, fazendo-o com mansidão e temor.\""},
 {id:"v2",cat:"Versículo",f:"Romanos 1.16",b:"\"Não me envergonho do evangelho, porque é o poder de Deus para a salvação de todo aquele que crê.\""},
 {id:"v3",cat:"Versículo",f:"João 14.6",b:"\"Eu sou o caminho, e a verdade, e a vida; ninguém vem ao Pai senão por mim.\""},
 {id:"v4",cat:"Versículo",f:"Efésios 2.8-9",b:"\"Pela graça sois salvos, por meio da fé; e isto não vem de vós; é dom de Deus. Não vem das obras, para que ninguém se glorie.\""},
 {id:"v5",cat:"Versículo",f:"2 Coríntios 5.21",b:"\"Aquele que não conheceu pecado, ele o fez pecado por nós; para que, nele, fôssemos feitos justiça de Deus.\""},
 {id:"v6",cat:"Versículo",f:"Romanos 8.1",b:"\"Agora, pois, já nenhuma condenação há para os que estão em Cristo Jesus.\""},
 {id:"v7",cat:"Versículo",f:"1 Coríntios 15.3-4",b:"\"Cristo morreu pelos nossos pecados, segundo as Escrituras, e foi sepultado e ressuscitou ao terceiro dia, segundo as Escrituras.\""},
 {id:"v8",cat:"Versículo",f:"Romanos 12.2",b:"\"Não vos conformeis com este século, mas transformai-vos pela renovação da vossa mente.\""},
 {id:"v9",cat:"Versículo",f:"Colossenses 2.8",b:"\"Cuidado que ninguém vos venha a enredar com sua filosofia e vãs sutilezas, conforme a tradição dos homens... e não segundo Cristo.\""},
 {id:"v10",cat:"Versículo",f:"Gênesis 1.27",b:"\"Criou Deus, pois, o homem à sua imagem, à imagem de Deus o criou; homem e mulher os criou.\""},
 {id:"v11",cat:"Versículo",f:"Atos 5.29",b:"\"Antes, importa obedecer a Deus do que aos homens.\""},
 {id:"v12",cat:"Versículo",f:"João 1.1",b:"\"No princípio era o Verbo, e o Verbo estava com Deus, e o Verbo era Deus.\""},
 {id:"v13",cat:"Versículo",f:"Romanos 1.20",b:"\"Os atributos invisíveis de Deus, seu eterno poder e divindade, claramente se reconhecem desde a criação do mundo, por meio das coisas criadas.\""},
 {id:"v14",cat:"Versículo",f:"2 Timóteo 3.16",b:"\"Toda a Escritura é inspirada por Deus e útil para o ensino, para a repreensão, para a correção, para a educação na justiça.\""},
 {id:"v15",cat:"Versículo",f:"Hebreus 11.6",b:"\"Sem fé é impossível agradar a Deus, porquanto é necessário que aquele que se aproxima de Deus creia que ele existe e que se torna galardoador dos que o buscam.\""},
 // Argumentos
 {id:"g1",cat:"Argumento",f:"Argumento Kalam (3 passos)",b:"1. Tudo o que começa a existir tem uma causa. 2. O universo começou a existir. 3. Logo, o universo tem uma causa (eterna, imaterial, poderosa e pessoal)."},
 {id:"g2",cat:"Argumento",f:"Argumento moral (3 passos)",b:"1. Se Deus não existe, valores morais objetivos não existem. 2. Valores morais objetivos existem. 3. Logo, Deus existe."},
 {id:"g3",cat:"Argumento",f:"Ajuste fino: as 3 explicações possíveis",b:"Necessidade física, acaso ou design. Não há evidência de necessidade, o acaso é improvável demais: o design é a melhor explicação."},
 {id:"g4",cat:"Argumento",f:"Trilema de Lewis",b:"Quem afirma o que Jesus afirmou é Mentiroso, Lunático ou Senhor. \"Só um bom mestre\" não é opção."},
 {id:"g5",cat:"Argumento",f:"Os 5 fatos mínimos (Habermas)",b:"1. Morte por crucificação. 2. Discípulos creram ver Jesus ressuscitado. 3. Conversão de Paulo. 4. Conversão de Tiago. 5. Túmulo vazio."},
 {id:"g6",cat:"Argumento",f:"Por que o relativismo se autorrefuta?",b:"\"Não existe verdade absoluta\" se apresenta como verdade absoluta. A frase serra o galho em que está sentada."},
 {id:"g7",cat:"Argumento",f:"Por que o cientificismo se autorrefuta?",b:"\"Só a ciência produz conhecimento\" não pode ser provado por nenhum experimento científico. É uma tese filosófica."},
 {id:"g8",cat:"Argumento",f:"Defesa do livre-arbítrio (Plantinga)",b:"Deus pode permitir o mal para criar seres realmente livres, capazes de amar. Não há contradição lógica entre Deus bom e todo-poderoso e a existência do mal."},
 {id:"g9",cat:"Argumento",f:"As 2 perguntas de Colombo (Koukl)",b:"\"O que você quer dizer com isso?\" e \"Como você chegou a essa conclusão?\""},
 {id:"g10",cat:"Argumento",f:"SLED (valor da vida no ventre)",b:"Tamanho, nível de desenvolvimento, ambiente e grau de dependência: nenhuma dessas diferenças muda o valor de um ser humano."},
 // Citações
 {id:"q1",cat:"Citação",f:"Lewis: \"Creio no cristianismo como creio que o sol nasceu...\"",b:"\"...não apenas porque o vejo, mas porque, por meio dele, vejo todas as outras coisas.\" (\"A teologia é poesia?\", 1945)"},
 {id:"q2",cat:"Citação",f:"Lewis: o cristianismo não pode ser...",b:"\"...moderadamente importante.\" Se for falso, não importa; se for verdadeiro, tem importância infinita."},
 {id:"q3",cat:"Citação",f:"Lewis: \"Deus sussurra em nossos prazeres...\"",b:"\"...fala em nossa consciência, mas grita em nossas dores: elas são o seu megafone para despertar um mundo surdo.\" (O problema do sofrimento)"},
 {id:"q4",cat:"Citação",f:"Lewis: o desejo que nada neste mundo satisfaz",b:"\"Se encontro em mim um desejo que nenhuma experiência deste mundo pode satisfazer, a explicação mais provável é que fui feito para outro mundo.\" (Cristianismo puro e simples)"},
 {id:"q5",cat:"Citação",f:"Agostinho: \"Fizeste-nos para ti...\"",b:"\"...e inquieto está o nosso coração enquanto não repousa em ti.\" (Confissões, livro I)"},
 {id:"q6",cat:"Citação",f:"Chesterton: o ideal cristão...",b:"\"...não foi experimentado e achado em falta; foi achado difícil e deixado sem experimentar.\" (O que há de errado com o mundo, 1910)"},
 {id:"q7",cat:"Citação",f:"Kuyper: o centímetro quadrado",b:"\"Não há um centímetro quadrado em todo o domínio da existência humana sobre o qual Cristo, que é soberano sobre tudo, não clame: 'É meu!'\""},
 {id:"q8",cat:"Citação",f:"Policarpo diante da morte",b:"\"Há oitenta e seis anos eu o sirvo, e ele nunca me fez mal algum. Como posso blasfemar contra o meu Rei, que me salvou?\""},
 {id:"q9",cat:"Citação",f:"Bonhoeffer: graça barata",b:"\"Graça barata é a graça sem discipulado, a graça sem a cruz, a graça sem Jesus Cristo vivo e encarnado.\""},
 // Conceitos e história
 {id:"h1",cat:"História",f:"325 d.C.",b:"Concílio de Niceia: o Filho é homoousios, da mesma substância do Pai (contra Ário)."},
 {id:"h2",cat:"História",f:"451 d.C.",b:"Concílio de Calcedônia: Jesus é uma Pessoa com duas naturezas, plenamente Deus e plenamente homem."},
 {id:"h3",cat:"História",f:"31/10/1517",b:"Lutero publica as 95 teses: começa a Reforma Protestante."},
 {id:"h4",cat:"História",f:"367 d.C.",b:"Atanásio lista os 27 livros do Novo Testamento."},
 {id:"h5",cat:"História",f:"1947",b:"Descoberta dos Manuscritos do Mar Morto: Isaías praticamente idêntico, mil anos mais antigo."},
 {id:"h6",cat:"História",f:"Tácito, Anais 15.44",b:"Historiador romano (c. 116 d.C.) registra que Cristo foi executado sob Pôncio Pilatos, no reinado de Tibério."},
 {id:"k1",cat:"Conceito",f:"Trindade em uma frase",b:"Um só Deus, eternamente em três Pessoas: Pai, Filho e Espírito Santo. Um \"quê\" e três \"quem\"."},
 {id:"k2",cat:"Conceito",f:"Justificação",b:"Ato de Deus declarar justo o pecador com base na justiça de Cristo, recebida pela fé (Rm 5.1)."},
 {id:"k3",cat:"Conceito",f:"As 5 Solas",b:"Sola Scriptura, Sola Gratia, Sola Fide, Solus Christus, Soli Deo Gloria."},
 {id:"k4",cat:"Conceito",f:"As 4 perguntas de cosmovisão",b:"Origem, sentido, moral e destino."},
 {id:"k5",cat:"Conceito",f:"Imago Dei",b:"\"Imagem de Deus\" (Gn 1.27): a base da dignidade de todo ser humano."},
 {id:"k6",cat:"Conceito",f:"Apologia",b:"Palavra grega de 1 Pe 3.15: uma defesa racional da fé, feita com mansidão e temor."}
];

FE.PERSONAS=[
 {id:"lucas",name:"Lucas",role:"o cientificista",color:"#2C6E8F",
  persona:"estudante de engenharia de 20 anos, ateu, fã de divulgadores científicos; acha que a ciência substituiu Deus e que fé é crer sem evidência",
  opening:"Cara, sem ofensa, mas a ciência já explica tudo. Deus era só o jeito antigo de explicar o que a gente não entendia. Hoje temos o Big Bang e a evolução. Pra que Deus?",
  obj:[
   {q:"A ciência já explica tudo. Deus é só o \"deus das lacunas\".",k:["A ciência explica COMO a natureza funciona; não explica por que existe algo em vez de nada.","O Big Bang aponta para um início do universo, o que combina com a criação (e foi proposto por um padre, Lemaître).","Os fundadores da ciência eram cristãos e estudavam a natureza porque criam num Criador racional.","Pergunta de volta: \"O que exatamente a ciência explicou que tornou Deus desnecessário?\""]},
   {q:"Fé é acreditar sem evidência.",k:["Na Bíblia, fé é confiança baseada em evidência (Jo 20.30-31; 1 Co 15.6: \"a maioria ainda vive\").","Pergunte: \"De onde você tirou essa definição?\"","Todos confiam em coisas que não verificam pessoalmente, inclusive em cientistas.","Apresente evidências: o início do universo, o ajuste fino, a ressurreição."]},
   {q:"Só acredito no que pode ser provado cientificamente.",k:["Essa frase não pode ser provada cientificamente: ela se autorrefuta.","A lógica, a matemática, a moral e a história não são provadas em laboratório e são conhecimento real.","A própria ciência pressupõe coisas que não prova (uniformidade da natureza, confiabilidade da razão)."]}
  ]},
 {id:"helena",name:"Prof.ª Helena",role:"a relativista",color:"#8A4B9C",
  persona:"professora de sociologia de 45 anos, educada mas firme; acredita que verdade é construção social e que quem afirma possuir a verdade é intolerante",
  opening:"Olha, eu respeito sua fé, mas verdade é uma construção social. Cada cultura tem a sua. Quando você diz que Jesus é o único caminho, você está sendo intolerante com as outras culturas, não acha?",
  obj:[
   {q:"Verdade é construção social. Cada cultura tem a sua.",k:["Essa afirmação vale para todas as culturas? Se sim, é uma verdade universal, o que contradiz a tese.","Culturas têm costumes diferentes, mas fatos (Jesus ressuscitou ou não) não dependem de cultura.","Pergunta: \"A escravidão era errada mesmo nas culturas que a aceitavam?\""]},
   {q:"Dizer que Jesus é o único caminho é intolerante.",k:["Tolerância significa respeitar quem discorda, não concordar com tudo.","Dizer que todas as religiões são iguais também exclui quem discorda (inclusive as próprias religiões).","Jesus não é uma imposição cultural: ele mesmo afirmou isso (Jo 14.6), e o convite é para todos os povos."]},
   {q:"A religião foi usada para colonizar e oprimir.",k:["Houve erros reais e devemos reconhecê-los.","Mas foi a fé cristã que inspirou Wilberforce a combater a escravidão e missionários a criar escolas e hospitais.","O abuso de algo não prova que esse algo é falso."]}
  ]},
 {id:"rafa",name:"Rafa",role:"o cético histórico",color:"#A0522D",
  persona:"jovem de 19 anos que assiste muito vídeo na internet; acha que Jesus é um mito copiado de deuses pagãos e que os Evangelhos foram escritos séculos depois",
  opening:"Mano, já viu que a história de Jesus é cópia de Hórus? Nasceu de virgem, 12 discípulos, morreu e ressuscitou... E os Evangelhos foram escritos séculos depois. Isso é mito.",
  obj:[
   {q:"Jesus é cópia de Hórus/Mitra.",k:["Peça a fonte: os paralelos (virgem, 12 discípulos, 25 de dezembro) não aparecem nas fontes egípcias; vieram de autores modernos e do filme Zeitgeist (2007).","Os historiadores, inclusive céticos como Bart Ehrman, rejeitam a teoria do mito.","Os Evangelhos se situam em lugares, governantes e datas reais (Pilatos, Tibério, Herodes)."]},
   {q:"Os Evangelhos foram escritos séculos depois.",k:["A maioria dos estudiosos data os Evangelhos no século I (Marcos por volta de 65-70 d.C.).","As cartas de Paulo são ainda mais antigas (anos 50), e o credo de 1 Co 15 é de poucos anos depois da cruz.","Para comparar: as biografias mais antigas de Alexandre, o Grande, são de cerca de 400 anos depois dele."]},
   {q:"Jesus nem existiu.",k:["Tácito, Josefo e Plínio, fontes não cristãs, mencionam Jesus ou seus seguidores.","Praticamente nenhum historiador da área nega sua existência.","Pergunta: \"Qual historiador especialista no século I defende isso?\""]}
  ]},
 {id:"bia",name:"Bia",role:"a amiga ferida",color:"#B23A48",
  persona:"amiga de 17 anos que perdeu a mãe para o câncer há um ano; está magoada com Deus, não é agressiva, é sincera e machucada",
  opening:"Eu orei todo dia pela minha mãe. A igreja inteira orou. E ela morreu mesmo assim. Se Deus existe e é bom, por que ele deixou isso acontecer?",
  obj:[
   {q:"Se Deus é bom, por que deixou minha mãe morrer?",k:["Comece com empatia e presença, não com argumento (Rm 12.15; Jó 2.13).","Admita que não sabe o porquê específico; isso é honesto.","Jesus chorou diante da morte (Jo 11.35): Deus não é indiferente à dor.","A esperança cristã é a ressurreição: a morte não tem a última palavra (Ap 21.4)."]},
   {q:"Então orar não adianta nada.",k:["Oração não é uma máquina; é relacionamento com um Pai que vê mais longe que nós.","Até Jesus orou \"passa de mim este cálice\" e se submeteu ao Pai.","Ofereça orar com ela agora e estar junto nos próximos dias."]},
   {q:"Estou com raiva de Deus.",k:["A Bíblia tem salmos inteiros de lamento e queixa (Sl 13, Sl 88): Deus aguenta sua sinceridade.","Raiva de Deus ainda é falar com Deus.","Convide-a a levar essa dor a ele, não para longe dele."]}
  ]},
 {id:"diego",name:"Diego",role:"o militante",color:"#3D7A4A",
  persona:"universitário de 22 anos, ativista, inteligente e provocador; acha que religião causa guerras, que a Bíblia é machista e que cristãos conservadores são intolerantes",

POL.MODS={
p1:{title:"Esquerda e direita: de onde vêm os nomes",min:8,
 sum:"A origem dos termos em 1789 e as duas visões de ser humano que separam os lados até hoje.",
 verse:{t:"O que primeiro começa o seu pleito parece justo; até que vem o outro e o examina.",r:"Pv 18.17"},
 body:`<h3>Uma questão de lugar</h3>
<p>Em 1789, na Assembleia Nacional da Revolução Francesa, os deputados que queriam mudanças radicais sentavam à <b>esquerda</b> do presidente da sessão. Os que defendiam a monarquia, a religião e as instituições tradicionais sentavam à <b>direita</b>. Os nomes pegaram e atravessaram mais de dois séculos.</p>
<h3>Duas visões do ser humano</h3>
<p>O economista Thomas Sowell, em <i>Conflito de visões</i> (1987), mostrou que por trás das brigas políticas existem duas visões diferentes da natureza humana:</p>
<ul>
<li><b>Visão restrita</b> (mais à direita): o ser humano é limitado e falho. Ninguém sabe o suficiente para planejar a sociedade inteira. Por isso valorizamos tradições, regras testadas pelo tempo, mercados e freios ao poder.</li>
<li><b>Visão irrestrita</b> (mais à esquerda): o ser humano pode ser aperfeiçoado, e os males sociais vêm de estruturas injustas. Pessoas esclarecidas com poder suficiente poderiam redesenhar a sociedade.</li>
</ul>
<p>Para o cristão, a visão restrita tem um nome antigo: <b>a doutrina do pecado</b>. Todos pecaram (Rm 3.23), inclusive quem governa. Por isso o poder precisa de limites.</p>
<h3>O que une a direita</h3>
<p>A direita não é um bloco só. Há <b>conservadores</b> (valorizam tradição, família e religião), <b>liberais clássicos</b> (valorizam liberdade individual e mercado) e <b>libertários</b> (querem o mínimo possível de Estado). Eles discordam em muita coisa, mas costumam concordar em:</p>
<ul><li>dignidade e responsabilidade individual;</li><li>família como base da sociedade;</li><li>propriedade privada e livre iniciativa;</li><li>Estado limitado, sob a lei;</li><li>respeito ao que gerações anteriores construíram.</li></ul>
<div class="box">Cuidado com o atalho "direita = bom, esquerda = mau". Há pessoas sinceras dos dois lados. O debate é sobre <b>ideias e resultados</b>, e é isso que você vai treinar aqui.</div>`,
 pr:{q:"\"Direita e esquerda é tudo igual, só muda o nome.\"",a:"\"Na prática, às vezes os políticos se parecem mesmo. Mas as ideias são bem diferentes. Uma pergunta que separa os lados: você acha que o ser humano é limitado e precisa de regras e freios, ou que uma elite bem-intencionada pode redesenhar a sociedade? Dependendo da resposta, você vai defender coisas muito diferentes sobre escola, economia e família.\""},

  {q:"De onde vêm os termos \"esquerda\" e \"direita\" na política?",o:["Do Parlamento inglês no século XVII","Da posição dos deputados na Assembleia da Revolução Francesa, em 1789","Da Guerra Fria","Da Bíblia"],c:1,e:"Em 1789, os radicais sentavam à esquerda e os defensores da tradição, à direita."},
  {q:"Em Conflito de visões, a visão \"restrita\" do ser humano afirma que:",o:["O ser humano pode ser aperfeiçoado pelo Estado","O ser humano é limitado e falho, por isso o poder precisa de freios","Só os ricos são racionais","A tradição deve ser abolida"],c:1,e:"Sowell chama de restrita a visão que reconhece os limites humanos."},
  {q:"Qual destes NÃO é um grupo dentro da direita?",o:["Conservadores","Liberais clássicos","Libertários","Bolcheviques"],c:3,e:"Bolcheviques eram a facção de Lênin, a extrema esquerda revolucionária russa."}

p2:{title:"Conservadorismo: a sabedoria das gerações",min:9,
 sum:"Burke, a cerca de Chesterton e os princípios de quem quer conservar o que funciona.",
 verse:{t:"Não removas os marcos antigos que fizeram teus pais.",r:"Pv 22.28"},
 body:`<h3>Edmund Burke, o pai do conservadorismo</h3>
<p>Em 1790, o político irlandês Edmund Burke escreveu <i>Reflexões sobre a Revolução na França</i>. Enquanto muitos aplaudiam a revolução, ele previu que destruir de uma vez todas as instituições levaria ao caos e à tirania. Pouco depois veio o Terror, com milhares de guilhotinados, e depois a ditadura de Napoleão.</p>
<p>Para Burke, a sociedade é uma parceria "entre os que estão vivos, os que já morreram e os que ainda vão nascer". Não somos donos absolutos do presente; somos herdeiros e guardiões.</p>
<h3>Os "pequenos pelotões"</h3>
<p>Burke dizia que aprendemos a amar a sociedade primeiro nos <b>pequenos pelotões</b>: família, igreja, vizinhança, associações. É ali que nascem o caráter e a responsabilidade. Um Estado que engole essas comunidades deixa o indivíduo sozinho diante do poder.</p>
<h3>A cerca de Chesterton</h3>
<p>G. K. Chesterton (<i>The Thing</i>, 1929) contou a parábola de uma cerca no meio de uma estrada. O reformador diz: "Não vejo para que serve, vamos derrubar". O sábio responde: "Se você não sabe para que serve, não vou deixar derrubar. Vá descobrir; quando souber, conversamos".</p>
<div class="box">Regra prática: <b>antes de derrubar uma tradição, entenda por que ela existe.</b> Isso não é ser contra mudanças; é exigir prudência.</div>
<h3>Conservar não é parar no tempo</h3>
<p>Burke também disse que um Estado sem meios de mudança não tem meios de se conservar. Conservadores reformam aos poucos, corrigindo o que está errado sem destruir o que funciona. O historiador Russell Kirk (<i>A mentalidade conservadora</i>, 1953) listou princípios como: existe uma ordem moral permanente; o costume e a experiência têm valor; a prudência é a virtude do governante; liberdade e propriedade andam juntas.</p>
<blockquote>"Tradição significa dar voto à mais obscura de todas as classes: os nossos antepassados. É a democracia dos mortos."<cite>G. K. Chesterton, <i>Ortodoxia</i> (1908)</cite></blockquote>`,
 pr:{q:"\"Conservador é quem tem medo de mudança e quer voltar ao passado.\"",a:"\"Não é isso. Conservador quer mudar com cuidado. Se uma ponte tem uma rachadura, a gente conserta a rachadura, não implode a ponte. O século XX tá cheio de gente que quis recomeçar a sociedade do zero, e quase sempre deu em tragédia. Eu prefiro reformar o que está errado e proteger o que funciona, como família, liberdade e Estado de direito.\""},
 quiz:[
  {q:"Qual livro de Burke (1790) é considerado marco do conservadorismo?",o:["O contrato social","Reflexões sobre a Revolução na França","O espírito das leis","A riqueza das nações"],c:1,e:"Escrito antes do Terror, previu que a revolução terminaria em tirania."},
  {q:"O que ensina a \"cerca de Chesterton\"?",o:["Toda tradição é sagrada e nunca muda","Antes de derrubar uma tradição, entenda por que ela existe","Cercas são inúteis","O Estado deve decidir o que fica"],c:1,e:"Prudência: descubra a função antes de remover."},
  {q:"Os \"pequenos pelotões\" de Burke são:",o:["Unidades do exército","Família, igreja e comunidades próximas","Partidos políticos","Sindicatos estatais"],c:1,e:"É neles que aprendemos a amar e servir."}
